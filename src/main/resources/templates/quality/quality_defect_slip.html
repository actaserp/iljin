<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>불량전표</h2>
        <a title="북마크" class="bookmark toggle">
          내 메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>품질관리</li>
        <li>불량전표</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <input type="hidden" id="spjangcdHidden" name="spjangcd"/>
          <dl>
            <dt>조회기간(불량일자)<span class="eq">*</span></dt>
            <dd>
              <ul class="date-box">
                <li>
                  <input type="date" id="srchStartDt" name="srchStartDt">
                  <label for="srchStartDt" class="hide">시작일</label>
                </li>
                ~
                <li>
                  <input type="date" id="srchEndDt" name="srchEndDt">
                  <label for="srchEndDt" class="hide">종료일</label>
                </li>
              </ul>
            </dd>
          </dl>
          <dl>
            <dt><label for="cboStoreHouse">창고</label></dt>
            <dd>
              <div class="srch-box">
                <select class="form-control2" id="cboStoreHouse" name="storehouse_id"></select>
              </div>
            </dd>
          </dl>
          <dl>
            <dt><label for="cboState">상태</label></dt>
            <dd>
              <div class="srch-box">
                <select class="form-control2" id="cboState" name="cboState">
                  <option value="">전체</option>
                  <option value="draft">작성중</option>
                  <option value="confirmed">확정</option>
                </select>
              </div>
            </dd>
          </dl>
          <dl>
            <dt><label for="txtKeyword">전표번호/품목명</label></dt>
            <dd>
              <div class="srch-box">
                <input class="form-control2" id="txtKeyword" name="txtKeyword"/>
              </div>
            </dd>
          </dl>
          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>

        <div class="button-wrap">
          <ul>
            <li>
              <a class="btn btn-excell" title="등록" id="btnAddNew">
                <img th:src="@{/images/icon/ico-plus.svg}" alt="등록 아이콘">
                등록
              </a>
            </li>
            <li>
              <a class="btn btn-edit" title="수정" id="btnEdit">
                <img th:src="@{/images/icon/ico-edit.svg}" alt="수정 아이콘">
                수정
              </a>
            </li>
            <li>
              <a class="btn btn-delete" title="삭제" id="btnDelete">
                <img th:src="@{/images/icon/ico-delete.svg}" alt="삭제 아이콘">
                삭제
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="container-fluid">
        <div id="defect-grid" style="height: 730px;"></div>
      </div>
    </section>
  </div>

  <!-- ===================== 불량전표 등록/수정 팝업 템플릿 ===================== -->
  <script type="text/x-tmpl" id="defectTemplate">
    <style>
        .content_wrap.popup { display: flex; flex-direction: column; height: 100%; }
        .table-wrap { flex: 1; overflow-y: auto; padding-right: 5px; }
        .popup-button { flex-shrink: 0; padding: 10px; background: #fff; border-top: 1px solid #ddd; }

        .item-table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 10px; }
        .item-table th { background:#EDEFF5; text-align:center; font-weight:bold; padding:8px; border:1px solid #ccc; }
        .item-table td { padding:6px; text-align:center; border:1px solid #ccc; }
        .item-table input, .item-table select { width:100%; box-sizing:border-box; padding:4px; }
        .item-table td:nth-child(2) { text-align:left; }

        .btn.in_btn { display:inline-flex; justify-content:center; align-items:center; width:30px; height:30px;
            border-radius:4px; padding:0; border:1px solid #B3B3B3; background:#fff; cursor:pointer; line-height:0; }
        .btn.in_btn img { width:12px; height:12px; display:block; }
        .btn.in_btn.plus img { width:10px; height:10px; }
    </style>

    <div class="content_wrap popup" id="div_defect">
        <div class="table-wrap">
            <form id="defectForm">
                <input type="hidden" id="bad_id" name="bad_id">
                <input type="hidden" id="spjangcdHidden" name="spjangcd"/>
                <table class="write-table">
                    <caption>불량전표 헤더</caption>
                    <tbody>
                    <tr>
                        <th style="text-align:center"><label for="DefectNo">전표번호</label></th>
                        <td><input type="text" id="DefectNo" name="DefectNo" readonly placeholder="저장 시 자동채번"></td>
                        <th style="text-align:center"><label for="DefectDate">불량일자*</label></th>
                        <td><input type="date" id="DefectDate" name="DefectDate"></td>
                    </tr>
                    <tr>
                        <th style="text-align:center"><label for="cboHouse">창고*</label></th>
                        <td><select class="form-control2" id="cboHouse" name="house_id"></select></td>
                        <th style="text-align:center"><label for="Process">발생공정</label></th>
                        <td><input type="text" id="Process" name="Process" placeholder="예: 조립, 도장"></td>
                    </tr>
                    <tr>
                        <th style="text-align:center"><label for="Manager">담당자</label></th>
                        <td><input type="text" id="Manager" name="Manager"></td>
                        <th style="text-align:center"><label for="StateName">상태</label></th>
                        <td><input type="text" id="StateName" name="StateName" readonly disabled></td>
                    </tr>
                    <tr>
                        <th style="text-align:center"><label for="Description">비고</label></th>
                        <td colspan="3"><textarea id="Description" name="Description" style="height:60px"></textarea></td>
                    </tr>
                    </tbody>
                </table>

                <table class="item-table">
                    <colgroup>
                        <col style="width:22%">   <!-- 품목 -->
                        <col style="width:12%">   <!-- 규격 -->
                        <col style="width:8%">    <!-- 단위 -->
                        <col style="width:10%">   <!-- 불량수량 -->
                        <col style="width:14%">   <!-- 불량유형 -->
                        <col style="width:14%">   <!-- 불량사유 -->
                        <col style="width:14%">   <!-- 처리방법 -->
                        <col style="width:6%">    <!-- 삭제 -->
                    </colgroup>
                    <thead>
                        <tr>
                            <th>품목</th>
                            <th>규격</th>
                            <th>단위</th>
                            <th>불량수량</th>
                            <th>불량유형</th>
                            <th>불량사유</th>
                            <th>처리방법</th>
                            <th>
                                <a class="btn in_btn plus" id="addItem" title="추가">
                                    <img th:src="@{/images/icon/ico-plus.svg}" alt="추가" />
                                </a>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="item-template-row" style="display:none;">
                            <td>
                                <input type="text" name="txtProductName" placeholder="입력 후 엔터" autocomplete="off" />
                                <input type="hidden" name="Material_id" />
                                <input type="hidden" name="product_code" />
                                <input type="hidden" name="bad_line_id" />
                            </td>
                            <td><input type="text" name="Standard" placeholder="규격" autocomplete="off"/></td>
                            <td><input type="text" name="unit_name" readonly /></td>
                            <td><input type="text" name="bad_qty" placeholder="0" autocomplete="off"/></td>
                            <td>
                                <select name="bad_type"></select>
                            </td>
                            <td><input type="text" name="bad_reason" autocomplete="off"/></td>
                            <td>
                                <select name="disposal"></select>
                            </td>
                            <td>
                                <a class="btn in_btn" title="행 삭제">
                                    <img th:src="@{/images/icon/ico-delete.svg}" alt="삭제" />
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </div>
        <div class="popup-button">
            <button type="button" class="btn-popup y_write_auth" id="btnPopDefectSave">저장(Ctrl + S)</button>
            <button type="button" class="btn-popup" id="modal-close-button">닫기</button>
        </div>
    </div>
  </script>
</th:block>

<th:block layout:fragment="scripts">
  <!-- 품목 검색 팝업 (발주서와 동일) -->
  <th:block th:replace="/common/multiform_material :: multiform_material"></th:block>
  <script type="text/javascript">
   let gUrl = "/api/quality/defect_slip";   // ★ 불량전표 CRUD 엔드포인트 (백엔드 구현 필요)

   class DefectSlipPage {
    constructor() {
     this.grid = null;
     this.$btnAddNew = $('#btnAddNew');
     this.$btnEdit   = $('#btnEdit');
     this.spjangcd   = $('#spjangcdHidden');
     this.viewData   = new wijmo.collections.CollectionView([]);
     this.init();
    }

    init() {
     let _this = this;
     this.grid = new wijmo.grid.FlexGrid('#defect-grid', {
      autoGenerateColumns: false,
      allowSorting: true,
      selectionMode: wijmo.grid.SelectionMode.Row,
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      isReadOnly: true,
      itemsSource: this.viewData,
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
        e.cell.style.textAlign = 'center';
       }
      },
      columns: [
       { binding: 'bad_id',       header: 'bad_id',   width: 120, visible: false },
       { binding: 'defect_no',    header: '전표번호',  width: 160, align: 'center' },
       { binding: 'defect_date',  header: '불량일자',  width: 120, align: 'center' },
       { binding: 'house_name',   header: '창고',      width: 140 },
       { binding: 'process',      header: '발생공정',  width: 120, align: 'center' },
       { binding: 'manager',      header: '담당자',    width: 100, align: 'center' },
       { binding: 'item_count',   header: '품목수',    width: 80,  align: 'right', format: 'n0' },
       { binding: 'total_bad_qty',header: '총불량수량',width: 100, align: 'right', format: 'n0' },
       { binding: 'state_name',   header: '상태',      width: 90,  align: 'center' },
       { binding: 'description',  header: '비고',      width: 220 },
       { binding: 'reg_date',     header: '등록일',    width: 160, align: 'center' }
      ]
     });
     new FlexGridContextMenu(this.grid);
     this.grid.downloadFileName = '불량전표 목록';

     this.grid.hostElement.addEventListener('dblclick', function () {
      if (_this.grid.selectedItems.length === 0) return false;
      _this.$btnEdit.trigger('click');
     });

     let nowDate = CommonUtil.getYYYYMMDD();

     // ===== 등록 =====
     this.$btnAddNew.click(function () {
      _this.showDefectForm({
       mode: 'new',
       DefectDate: nowDate,
       State: 'draft',
       StateName: '작성중',
       spjangcd: _this.spjangcd.val()
      });
     });

     // ===== 수정 =====
     this.$btnEdit.click(function () {
      let items = _this.grid.selectedItems;
      if (items.length !== 1) { Alert.alert('', '하나의 전표만 선택해주세요.'); return; }
      AjaxUtil.getAsyncData(gUrl + '/detail', { id: items[0].bad_id, action: 'detail' }, function (result) {
       if (!result || !result.data) { Alert.alert('오류', '상세 데이터를 불러올 수 없습니다.'); return; }
       result.data.mode = 'edit';
       _this.showDefectForm(result.data);
      });
     });

     // ===== 삭제 =====
     $('#btnDelete').click(function () {
      let items = _this.grid.selectedItems;
      if (items.length === 0) { Alert.alert('', '삭제할 전표를 선택해주세요.'); return; }
      let state = (items[0].state || '').toLowerCase();
      if (state !== 'draft') { Alert.alert('', '작성중(미확정) 전표만 삭제할 수 있습니다.'); return; }
      Alert.confirm('', '삭제하시겠습니까?', function () {
       AjaxUtil.postAsyncData(gUrl + '/delete', { id: items[0].bad_id }, function (res) {
        if (res.success) { Notify.success('삭제되었습니다.'); _this.searchMainData(); }
        else Alert.alert('', res.message || '삭제 실패');
       });
      });
     });

     $('#txtKeyword').keypress(function (e) {
      if (e.keyCode === 13) _this.searchMainData();
     });
    } // init

    // ===================== 등록/수정 팝업 =====================
    showDefectForm(data) {
     let _this = this;
     let content = tmpl('defectTemplate', data);
     let $content = $(content);
     let csrfToken = $("[name=_csrf]").val();
     let title = data.mode === 'new' ? '불량전표 등록' : '불량전표 수정';
     let modalContainer = new PopupDraggable(title);
     modalContainer.open({ width: 1100, height: 620, $content });

     $content.find('#spjangcdHidden').val(data.spjangcd || sessionStorage.getItem('spjangcd') || '');
     AjaxUtil.fillSelectOptions($content.find('#cboHouse'), 'store_house', '', false);

     const isDraft = (data.State || 'draft').toLowerCase() === 'draft';
     let itemIndex = 1;

     // 템플릿 행의 select 옵션 채우는 헬퍼 (불량유형/처리방법)
     function fillRowSelects($row) {
      AjaxUtil.fillSelectOptions($row.find('select[name^="bad_type"]'), 'system_code', 'choose', false, 'defect_type');
      AjaxUtil.fillSelectOptions($row.find('select[name^="disposal"]'), 'system_code', 'choose', false, 'defect_disposal');
     }

     // 품목명 엔터 → 검색 팝업
     function bindProductSearch($row) {
      const $input = $row.find('input[name^="txtProductName"]');
      const $id    = $row.find('input[name^="Material_id"]');
      const $code  = $row.find('input[name^="product_code"]');
      const $std   = $row.find('input[name^="Standard"]');
      const $unit  = $row.find('input[name^="unit_name"]');
      const $qty   = $row.find('input[name^="bad_qty"]');

      function setItem(item) {
       $input.val(item.Name);
       $id.val(item.id);
       $code.val(item.Code);
       if (item.Spec) $std.val(item.Spec);
       $unit.val(item.unit_name || '');
       setTimeout(() => { $qty.focus().select(); }, 10);
      }

      $input.off('keydown').on('keydown', function (e) {
       if (e.key !== 'Enter') return;
       e.preventDefault();
       const keyword = $input.val();
       const spjangcd = sessionStorage.getItem('spjangcd');
       const showPopup = function () {
        const pop = new PopMatComponent();
        pop.material_type = 'product,sangpum';
        pop.show(setItem, keyword);
       };
       if (!keyword) return showPopup();
       $.get('/api/popup/search_material', { keyword, spjangcd }, function (res) {
        if (res.data?.length === 1) setItem(res.data[0]);
        else showPopup();
       });
      });

      // 숫자 포맷
      $qty.off('keyup').on('keyup', function () {
       let cleaned = $(this).val().replace(/[^0-9]/g, '');
       $(this).val(cleaned.replace(/\B(?=(\d{3})+(?!\d))/g, ','));
      });
     }

     // 행 추가
     function addRow(item) {
      const $tbody = $content.find('.item-table tbody');
      const $tpl = $tbody.find('.item-template-row');
      const $row = $tpl.clone().removeClass('item-template-row').show();
      $row.find('input, select').each(function () {
       const n = $(this).attr('name');
       if (n) $(this).attr('name', `${n}_${itemIndex}`);
      });
      $tbody.append($row);
      fillRowSelects($row);
      bindProductSearch($row);
      if (item) {
       $row.find('input[name^="txtProductName"]').val(item.product_name);
       $row.find('input[name^="Material_id"]').val(item.Material_id);
       $row.find('input[name^="product_code"]').val(item.product_code);
       $row.find('input[name^="Standard"]').val(item.Standard);
       $row.find('input[name^="unit_name"]').val(item.unit_name);
       $row.find('input[name^="bad_qty"]').val(item.bad_qty);
       $row.find('select[name^="bad_type"]').val(item.bad_type);
       $row.find('input[name^="bad_reason"]').val(item.bad_reason);
       $row.find('select[name^="disposal"]').val(item.disposal);
       $row.find('input[name^="bad_line_id"]').val(item.bad_line_id);
      }
      if (!isDraft) {
       $row.find('input, select').prop('disabled', true);
       $row.find('a.btn').hide();
      }
      itemIndex++;
      return $row;
     }

     $content.find('#addItem').click(function () { addRow(); });

     // 행 삭제
     $content.on('click', 'a[title="행 삭제"]', function () {
      const $tbody = $(this).closest('tbody');
      const $rows  = $tbody.find('tr:not(.item-template-row)');
      const $target = $(this).closest('tr');
      if ($rows.length <= 1) {
       $target.find('input:not([type=hidden]), select').val('');
       $target.find('input[type=hidden]').val('');
      } else {
       $target.remove();
      }
     });

     // 헤더 바인딩
     FormUtil.BindDataForm(data, $content.find('#defectForm'));
     $content.find('#DefectNo').val(data.defect_no || '');
     $content.find('#StateName').val(data.StateName || (data.State === 'confirmed' ? '확정' : '작성중'));
     $content.find('#bad_id').val(data.id || data.bad_id || '');
     if (data.house_id) $content.find('#cboHouse').val(data.house_id);

     // 라인 렌더링
     if (data.mode === 'edit' && Array.isArray(data.items) && data.items.length) {
      data.items.forEach(it => addRow(it));
     } else {
      addRow(); // 기본 1행
     }

     if (!isDraft) $content.find('#btnPopDefectSave').hide();

     // 저장
     let doSave = function () {
      let form = FormUtil.extractForm($content.find('#defectForm'));
      let houseId = $content.find('#cboHouse').val();

      if (!houseId)            { Alert.alert('', '창고를 선택하세요.'); return; }
      if (!form.DefectDate)    { Alert.alert('', '불량일자를 입력하세요.'); return; }

      let items = [];
      $content.find('.item-table tbody tr:not(.item-template-row)').each(function () {
       const $row = $(this);
       const matId = $row.find('input[name^="Material_id"]').val();
       const qty   = ($row.find('input[name^="bad_qty"]').val() || '').replace(/,/g, '');
       if (!matId || !qty) return; // 필수값 없으면 skip
       items.push({
        bad_line_id:  $row.find('input[name^="bad_line_id"]').val() || null,
        Material_id:  matId,
        product_code: $row.find('input[name^="product_code"]').val(),
        product_name: $row.find('input[name^="txtProductName"]').val(),
        standard:     $row.find('input[name^="Standard"]').val(),
        unit_name:    $row.find('input[name^="unit_name"]').val(),
        bad_qty:      Number(qty),
        bad_type:     $row.find('select[name^="bad_type"]').val(),
        bad_reason:   $row.find('input[name^="bad_reason"]').val(),
        disposal:     $row.find('select[name^="disposal"]').val()
       });
      });

      if (items.length === 0) { Alert.alert('', '불량 품목을 입력하세요.'); return; }

      let payload = {
       bad_id:      $content.find('#bad_id').val() || null,
       defect_no:   form.DefectNo || null,
       defect_date: form.DefectDate,
       house_id:    houseId,
       process:     form.Process || '',
       manager:     form.Manager || '',
       description: form.Description || '',
       spjangcd:    $content.find('#spjangcdHidden').val(),
       items:       items
      };

      Alert.confirm('', '저장하시겠습니까?', function () {
       $.ajax({
        type: 'POST',
        url: gUrl + '/multi_save',
        data: JSON.stringify(payload),
        contentType: 'application/json',
        headers: { 'X-CSRF-TOKEN': csrfToken },
        success: function (res) {
         if (res.success) {
          Notify.success('저장되었습니다.');
          _this.searchMainData();
          modalContainer.close();
         } else Alert.alert('저장 실패', res.message || '서버 오류');
        },
        error: function (xhr) {
         Alert.alert('저장 오류', '서버 오류가 발생했습니다.\n' + xhr.responseText);
        }
       });
      });
     };

     $content.find('#btnPopDefectSave').click(doSave);
     $content.on('keydown', function (e) {
      if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); doSave(); }
     });
    } // showDefectForm

    // ===================== 조회 =====================
    searchMainData() {
     let _this = this;
     let data = {
      start:    $('#srchStartDt').val(),
      end:      $('#srchEndDt').val(),
      house_id: $('#cboStoreHouse').val(),
      state:    $('#cboState').val(),
      keyword:  $('#txtKeyword').val(),
      spjangcd: this.spjangcd.val(),
      action:   'read'
     };
     AjaxUtil.getAsyncData(gUrl + '/read', data, function (result) {
      if (result != null) _this.viewData.sourceCollection = result.data || [];
     });
    }
   }

   let page = null;

   $(document).ready(function (e) {
    const spjangcd = sessionStorage.getItem('spjangcd');
    if (spjangcd) $('#spjangcdHidden').val(spjangcd);

    page = new DefectSlipPage();
    AjaxUtil.fillSelectOptions($('#cboStoreHouse'), 'store_house', '', false);

    // 기본 조회기간: 이번 달 1일 ~ 오늘
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    $('#srchStartDt').val(CommonUtil.formatYYYYMMDD(first));
    $('#srchEndDt').val(CommonUtil.formatYYYYMMDD(now));

    $('#btnSearch').click(function () { page.searchMainData(); });
    $('#cboStoreHouse').change(function () { page.searchMainData(); });
    $('#cboState').change(function () { page.searchMainData(); });
    $('#cboState').change(function () { page.searchMainData(); });

    page.searchMainData();
   });
  </script>
</th:block>
