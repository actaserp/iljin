<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>불량전표</h2>
        <a title="북마크" class="bookmark toggle">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>품질관리</li>
        <li>불량전표</li>
      </ul>
    </div>
    <section class="section">
      <div class="section-top">
        <form id="searchForm" autocomplete="off" style="width:100%;">
          <div class="search-flex-row" style="display:flex; justify-content:space-between; align-items:flex-end; width:100%; gap:16px;">
            <div class="search-wrap">
              <dl>
                <dt>불량일자</dt>
                <dd>
                  <ul class="date-box">
                    <li><input type="date" id="srchStartDt" name="srchStartDt"><label for="srchStartDt" class="hide">시작일</label></li>
                    <li><input type="date" id="srchEndDt" name="srchEndDt"><label for="srchEndDt" class="hide">종료일</label></li>
                  </ul>
                </dd>
              </dl>
              <dl>
                <dt><label for="cboHouse">창고</label></dt>
                <dd><div class="srch-box"><select id="cboHouse" name="cboHouse"></select></div></dd>
              </dl>
              <dl>
                <dt><label for="cboState">상태</label></dt>
                <dd>
                  <div class="srch-box">
                    <select id="cboState" name="cboState">
                      <option value="">전체</option>
                      <option value="draft">작성중</option>
                      <option value="confirmed">확정</option>
                    </select>
                  </div>
                </dd>
              </dl>
              <dl>
                <dt><label for="txtKeyword">전표번호/품목명</label></dt>
                <dd><div class="srch-box"><input id="txtKeyword" name="txtKeyword"/></div></dd>
              </dl>
              <dl>
                <dt>&nbsp;</dt>
                <dd>
                  <li>
                    <a class="btn btn-delete" title="검색" id="btnSearch">
                      <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">검색
                    </a>
                  </li>
                </dd>
              </dl>
            </div>
            <div class="button-wrap" style="white-space:nowrap;">
              <ul>
                <li>
                  <a class="btn y_write_auth" title="불량 등록" id="btnAdd" style="background-color:#03428E; color:white;">
                    불량 등록
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </form>
      </div>
      <div class="container-fluid">
        <div id="defect-grid" style="height: 680px;"></div>
      </div>
    </section>
  </div>

  <!-- 등록/수정 팝업 -->
  <script type="text/x-tmpl" id="defectPopup">
    <div class="content_wrap popup">
      <div class="table-wrap">
        <form id="defectForm">
          <input type="hidden" id="defect_id" name="defect_id">
          <table class="write-table">
            <tbody>
              <tr>
                <th style="text-align:center"><label for="defectNo">전표번호</label></th>
                <td><input class="form-control2" id="defectNo" name="defectNo" readonly placeholder="저장 시 자동채번"></td>
                <th style="text-align:center"><label for="defectDate">불량일자</label></th>
                <td><input class="form-control2" id="defectDate" name="defectDate" type="date"></td>
              </tr>
              <tr>
                <th style="text-align:center"><label for="StoreHouse_id">창고</label></th>
                <td><select id="StoreHouse_id" name="StoreHouse_id"></select></td>
                <th style="text-align:center"><label for="Process">발생공정</label></th>
                <td><input class="form-control2" id="Process" name="Process" placeholder="예: 조립, 도장"></td>
              </tr>
              <tr>
                <th style="text-align:center"><label for="Material_id">품목</label></th>
                <td colspan="3">
                  <input id="Material_id" name="Material_id" type="hidden">
                  <input id="Material_name" name="Material_name" readonly placeholder="품목 조회 버튼으로 선택하세요.">
                  &nbsp;
                  <a class="btn" id="btnMaterial">
                    <img th:src="@{/images/icon/btn-srch.svg}" alt="검색">품목조회
                  </a>
                </td>
              </tr>
              <tr>
                <th style="text-align:center"><label for="BadQty">불량수량</label></th>
                <td><input class="form-control2" id="BadQty" name="BadQty"></td>
                <th style="text-align:center"><label for="BadType">불량유형</label></th>
                <td><select id="BadType" name="BadType"></select></td>
              </tr>
              <tr>
                <th style="text-align:center"><label for="BadReason">불량사유</label></th>
                <td><input class="form-control2" id="BadReason" name="BadReason"></td>
                <th style="text-align:center"><label for="Disposal">처리방법</label></th>
                <td><select id="Disposal" name="Disposal"></select></td>
              </tr>
              <tr>
                <th style="text-align:center"><label for="Manager">담당자</label></th>
                <td><input class="form-control2" id="Manager" name="Manager"></td>
                <th style="text-align:center"><label for="stateName">상태</label></th>
                <td><input class="form-control2" id="stateName" readonly disabled></td>
              </tr>
              <tr>
                <th style="text-align:center"><label for="Description">비고</label></th>
                <td colspan="3"><textarea style="height:70px;" id="Description" name="Description"></textarea></td>
              </tr>
            </tbody>
          </table>
        </form>
      </div>
      <div class="popup-button">
        <button type="button" class="btn-popup y_write_auth" id="btnSave"><span>저장</span></button>
        <button type="button" class="btn-popup y_write_auth" id="btnDelete" style="display:none;"><span>삭제</span></button>
        <button type="button" class="btn-popup" id="modal-close-button"><span>닫기</span></button>
      </div>
    </div>
  </script>
</th:block>

<th:block layout:fragment="scripts">
  <th:block th:replace="/common/popup_material :: popup_material"></th:block>
  <script type="text/javascript">
    class qualityDefectSlip {
      constructor() {
        this.url = '/api/quality/defect_slip';
        this.grid = null;
        this.init();
      }

      init() {
        const _this = this;
        this.grid = new wijmo.grid.FlexGrid('#defect-grid', {
          autoGenerateColumns: false,
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.All,
          isReadOnly: true,
          showMarquee: true,
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.RowHeader) {
              e.cell.textContent = (e.row + 1).toString();
            }
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
          },
          columns: [
            {binding: 'id',            header: 'ID',       width: 60,  align: 'center', visible: false},
            {binding: 'defect_no',     header: '전표번호',  width: 160, align: 'center'},
            {binding: 'defect_date',   header: '불량일자',  width: 100, align: 'center'},
            {binding: 'house_name',    header: '창고',      width: 100, align: 'center'},
            {binding: 'process',       header: '발생공정',  width: 100, align: 'center'},
            {binding: 'material_type', header: '품목유형',  width: 80,  align: 'center'},
            {binding: 'material_code', header: '품목코드',  width: 110, align: 'center'},
            {binding: 'material_name', header: '품목명',    width: '*', align: 'left'},
            {binding: 'unit_name',     header: '단위',      width: 50,  align: 'center'},
            {binding: 'bad_qty',       header: '불량수량',  width: 85,  align: 'right', format: 'n0'},
            {binding: 'bad_type_name', header: '불량유형',  width: 100, align: 'center'},
            {binding: 'bad_reason',    header: '불량사유',  width: 150, align: 'left'},
            {binding: 'disposal_name', header: '처리방법',  width: 100, align: 'center'},
            {binding: 'manager',       header: '담당자',    width: 90,  align: 'center'},
            {binding: 'state_name',    header: '상태',      width: 80,  align: 'center'},
            {binding: 'description',   header: '비고',      width: 150, align: 'left'}
          ],
          itemsSource: new wijmo.collections.CollectionView([]),
          itemFormatter: (panel, row, col, cell) => {
            if (panel.cellType === wijmo.grid.CellType.Cell) {
              const item = panel.rows[row].dataItem;
              const column = panel.columns[col];
              if (column.binding === 'state_name') {
                if (item.state === 'confirmed') cell.style.color = '#1f8f53';
              }
            }
          }
        });
        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = '불량전표';

        this.grid.hostElement.addEventListener('dblclick', (e) => {
          const ht = _this.grid.hitTest(e);
          if (ht.cellType === wijmo.grid.CellType.Cell) {
            const item = _this.grid.rows[ht.row].dataItem;
            window.selectedGridId = item.id;
            _this.showPopup(item);
          }
        });
      }

      searchDataBind() {
        let data = {
          start:    $('#searchForm').find('#srchStartDt').val(),
          end:      $('#searchForm').find('#srchEndDt').val(),
          house_id: $('#searchForm').find('#cboHouse').val(),
          state:    $('#searchForm').find('#cboState').val(),
          keyword:  $('#searchForm').find('#txtKeyword').val(),
          spjangcd: sessionStorage.getItem('spjangcd') || 'ZZ'
        };
        let result = AjaxUtil.getSyncData(this.url + '/read', data);
        if (result && result.data != null) {
          this.grid.itemsSource = new wijmo.collections.CollectionView(result.data);
          if (window.selectedGridId) {
            GridUtil.selectRowById(this.grid, window.selectedGridId, {idField: 'id'});
            window.selectedGridId = null;
          }
        }
      }

      showPopup(data) {
        const _this = this;
        const isEdit = data != null;
        const content = tmpl('defectPopup', {});
        const $content = $(content);
        const modalContainer = new PopupDraggable(isEdit ? '불량전표 수정' : '불량전표 등록');
        modalContainer.open({width: 900, height: 500, $content});

        AjaxUtil.fillSelectOptions($content.find('#StoreHouse_id'), 'store_house', 'choose', '');
        AjaxUtil.fillSelectOptions($content.find('#BadType'), 'system_code', 'choose', false, 'bad_type');
        AjaxUtil.fillSelectOptions($content.find('#Disposal'), 'system_code', 'choose', false, 'bad_disposal');

        $content.find('#defectDate').val(CommonUtil.getYYYYMMDD());
        $content.find('#stateName').val('작성중');

        $content.find('#btnMaterial').click(function () {
          new PopupMaterialPage('single').show(function (item) {
            $content.find('#Material_id').val(item.id);
            $content.find('#Material_name').val(item.Name);
          });
        });

        if (isEdit) {
          $content.find('#defect_id').val(data.id);
          $content.find('#defectNo').val(data.defect_no);
          $content.find('#defectDate').val(data.defect_date);
          $content.find('#StoreHouse_id').val(data.house_id);
          $content.find('#Process').val(data.process);
          $content.find('#Material_id').val(data.material_id);
          $content.find('#Material_name').val(data.material_name);
          $content.find('#BadQty').val(data.bad_qty);
          $content.find('#BadType').val(data.bad_type);
          $content.find('#BadReason').val(data.bad_reason);
          $content.find('#Disposal').val(data.disposal);
          $content.find('#Manager').val(data.manager);
          $content.find('#stateName').val(data.state_name);
          $content.find('#Description').val(data.description);

          if (data.state === 'confirmed') {
            $content.find('input, select, textarea').prop('disabled', true);
            $content.find('#btnSave').hide();
          } else {
            $content.find('#btnDelete').show();
          }
        }

        $content.find('#btnSave').on('click', function () {
          if (!$content.find('#Material_id').val()) { Alert.alert('', '품목을 선택하세요.'); return; }
          if (!$content.find('#StoreHouse_id').val()) { Alert.alert('', '창고를 선택하세요.'); return; }
          if (!$content.find('#BadQty').val()) { Alert.alert('', '불량수량을 입력하세요.'); return; }
          if (!$content.find('#defectDate').val()) { Alert.alert('', '불량일자를 입력하세요.'); return; }

          let sendData = {
            id:          $content.find('#defect_id').val(),
            defect_date: $content.find('#defectDate').val(),
            house_id:    $content.find('#StoreHouse_id').val(),
            process:     $content.find('#Process').val(),
            material_id: $content.find('#Material_id').val(),
            bad_qty:     $content.find('#BadQty').val(),
            bad_type:    $content.find('#BadType').val(),
            bad_reason:  $content.find('#BadReason').val(),
            disposal:    $content.find('#Disposal').val(),
            manager:     $content.find('#Manager').val(),
            description: $content.find('#Description').val(),
            spjangcd:    sessionStorage.getItem('spjangcd') || 'ZZ'
          };

          AjaxUtil.postAsyncData(_this.url + '/save', sendData, function (res) {
            if (res.success) {
              Notify.success('저장되었습니다.');
              modalContainer.close();
              _this.searchDataBind();
            } else {
              Alert.alert('', res.message || '오류가 발생했습니다.');
            }
          });
        });

        $content.find('#btnDelete').on('click', function () {
          Alert.confirm('', '삭제하시겠습니까?', function () {
            AjaxUtil.postAsyncData(_this.url + '/delete',
              {id: $content.find('#defect_id').val()},
              function (res) {
                if (res.success) {
                  Notify.success('삭제되었습니다.');
                  modalContainer.close();
                  _this.searchDataBind();
                } else {
                  Alert.alert('', res.message || '삭제 실패');
                }
              });
          });
        });
      }
    }

    let page = null;

    $(document).ready(function () {
      const now = new Date();
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
      $('#srchStartDt').val(firstDay.toISOString().slice(0, 10));
      $('#srchEndDt').val(CommonUtil.getYYYYMMDD());

      AjaxUtil.fillSelectOptions($('#cboHouse'), 'store_house', 'all');

      page = new qualityDefectSlip();

      $('#btnAdd').on('click',    function () { page.showPopup(null); });
      $('#btnSearch').on('click', function () { page.searchDataBind(); });
      $('#cboHouse').on('change',  function () { page.searchDataBind(); });
      $('#cboState').on('change',  function () { page.searchDataBind(); });
      $('#txtKeyword').on('keypress', function (e) {
        if (e.keyCode === 13) page.searchDataBind();
      });
      $('#searchForm').on('submit', function (e) { e.preventDefault(); page.searchDataBind(); });

      page.searchDataBind();
    });
  </script>
</th:block>
</html>
