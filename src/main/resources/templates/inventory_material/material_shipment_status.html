<html layout:decorate="~{layout_page}">
<head>
  <style>
    .greenText { color: #1f8f53; }
    .redText   { color: #FF0000; }
  </style>
</head>

<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>자재출고현황</h2>
        <a title="북마크" class="bookmark toggle">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>자재 관리</li>
        <li>자재출고현황</li>
      </ul>
    </div>
    <section class="section">
      <div class="section-top">
        <form id="searchForm" autocomplete="off">
          <div class="search-wrap">
            <dl>
              <dt>출고일</dt>
              <dd>
                <ul class="date-box">
                  <li><input type="date" id="srchStartDt" name="srchStartDt"><label for="srchStartDt" class="hide">시작일</label></li>
                  <li><input type="date" id="srchEndDt" name="srchEndDt"><label for="srchEndDt" class="hide">종료일</label></li>
                </ul>
              </dd>
            </dl>
            <dl>
              <dt><label for="cboHouse">창고</label></dt>
              <dd><div class="srch-box"><select id="cboHouse" name="cboHouse"></select></div></dd>
            </dl>
            <dl>
              <dt><label for="cboMatType">품목유형</label></dt>
              <dd><div class="srch-box"><select id="cboMatType" name="cboMatType"></select></div></dd>
            </dl>
            <dl>
              <dt><label for="cboMatGroup">품목그룹</label></dt>
              <dd><div class="srch-box"><select id="cboMatGroup" name="cboMatGroup"></select></div></dd>
            </dl>
            <dl>
              <dt><label for="txtMatName">품명</label></dt>
              <dd><div class="srch-box"><input id="txtMatName" name="txtMatName"/></div></dd>
            </dl>
            <dl>
              <dt>&nbsp;</dt>
              <dd>
                <li>
                  <a class="btn btn-delete" title="검색" id="btnSearch">
                    <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">검색
                  </a>
                </li>
              </dd>
            </dl>
          </div>
        </form>
      </div>
      <div class="container-fluid">
        <div id="shipment-status-grid" style="height: 720px;"></div>
      </div>
    </section>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
    class materialShipmentStatus {
      constructor() {
        this.url = '/api/inventory/material_inout';
        this.grid = null;
        this.init();
      }

      init() {
        this.grid = new EditTable('#shipment-status-grid', {
          readOnly: true,
          rowNumbers: true,
          columns: [
            {key: 'InoutDate',        header: '출고일',    width: 100, align: 'center'},
            {key: 'InoutTime',        header: '시간',      width: 65,  align: 'center'},
            {key: 'inout_type',       header: '출고유형',  width: 90,  align: 'center'},
            {key: 'store_house_name', header: '창고',      width: 90,  align: 'center'},
            {key: 'material_type',    header: '품목유형',  width: 80,  align: 'center'},
            {key: 'material_code',    header: '품목코드',  width: 110, align: 'center'},
            {key: 'material_name',    header: '품목명',    width: '1*', align: 'left'},
            {key: 'unit_name',        header: '단위',      width: 50,  align: 'center'},
            {key: 'OutputQty',        header: '출고수량',  width: 85,  align: 'right', format: 'n0'},
            {key: 'inout_state',      header: '상태',      width: 80,  align: 'center'},
            {key: 'Description',      header: '비고',      width: 150, align: 'left'}
          ]
        });
        this.grid.opts.fileName = '자재출고현황';
      }

      searchDataBind() {
        let data = {
          srchStartDt: $('#searchForm').find('#srchStartDt').val(),
          srchEndDt:   $('#searchForm').find('#srchEndDt').val(),
          house_pk:    $('#searchForm').find('#cboHouse').val(),
          mat_type:    $('#searchForm').find('#cboMatType').val(),
          mat_grp_pk:  $('#searchForm').find('#cboMatGroup').val(),
          keyword:     $('#searchForm').find('#txtMatName').val(),
          spjangcd:    sessionStorage.getItem('spjangcd') || 'ZZ'
        };
        let result = AjaxUtil.getSyncData(this.url + '/read_issue', data);
        if (result && result.data != null) {
          this.grid.setData(result.data);
        }
      }
    }

    let page = null;

    $(document).ready(function () {
      $('#searchForm').find('#srchStartDt').val(CommonUtil.getYYYYMMDD(-30));
      $('#searchForm').find('#srchEndDt').val(CommonUtil.getYYYYMMDD());

      AjaxUtil.fillSelectOptions($('#cboHouse'), 'store_house', 'all');
      // 자재 유형만 세팅
      (function() {
        let opts = AjaxUtil.getSelectDataWithNull('system_code', 'all', 'mat_type');
        // '전체' = 이 화면의 품목유형 전부 (서버가 쉼표로 나눠 거름). 예전엔 기본이 원재료라, 원재료 품목이 없어 저장해도 안 보였음
        let allowed = ['raw_mat', 'sub_mat'];
        let filtered = opts.filter(o => allowed.includes(o.value));
        $('#cboMatType').empty();
        $('#cboMatType').append($('<option>').val(allowed.join(',')).text('전체'));
        filtered.forEach(o => $('#cboMatType').append($('<option>').val(o.value).text(o.text)));
        $('#cboMatType').val(allowed.join(','));
      })();
      AjaxUtil.fillSelectOptions($('#cboMatGroup'), 'material_group', 'all', false, $('#cboMatType').val());

      $('#cboMatType').on('change', function () {
        AjaxUtil.fillSelectOptions($('#cboMatGroup'), 'material_group', 'all', false, $(this).val());
        page.searchDataBind();
      });

      page = new materialShipmentStatus();

      $('#btnSearch').click(function () { page.searchDataBind(); });
      $('#cboHouse').on('change',    function () { page.searchDataBind(); });
      $('#cboMatType').on('change',  function () { page.searchDataBind(); });
      $('#cboMatGroup').on('change', function () { page.searchDataBind(); });
      $('#searchForm').on('submit',  function (e) { e.preventDefault(); page.searchDataBind(); });

      page.searchDataBind();
    });
  </script>
</th:block>
</html>
