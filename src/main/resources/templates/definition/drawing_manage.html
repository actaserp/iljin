<html layout:decorate="~{layout_page}">
<head>
    <style>
        .proj-bar { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #d7dde7; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; flex-wrap: wrap; }
        .proj-bar .fld { display: flex; align-items: center; gap: 8px; }
        .proj-bar label { font-weight: 700; color: #445; font-size: 12.5px; }
        .proj-bar select { border: 1px solid #cfd6e2; border-radius: 5px; font-size: 13px; padding: 0 30px 0 10px; height: 30px; line-height: 28px; min-width: 200px; }

        .row2 { display: flex; gap: 8px; align-items: flex-start; }
        .row2 > .section.left { flex: 0 0 460px; }
        .row2 > .section.right { flex: 1 1 auto; min-width: 0; }

        table.work-table { width: 100%; border-collapse: collapse; }
        table.work-table th, table.work-table td { border: 1px solid #d7dde7; padding: 6px 7px; font-size: 12.5px; text-align: center; }
        table.work-table th { background: #eef2f8; color: #445; font-weight: 700; }
        table.work-table td.l { text-align: left; }

        .unit-row { cursor: pointer; }
        .unit-row.on { background: #eaf1ff; }
        .unit-row.on td { font-weight: 700; }
        .empty-row td { color: #c9cfd8; height: 30px; }
        .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
        .badge.has { background: #e3f3ea; color: #1f8f53; }
        .badge.none { background: #eef0f3; color: #888; }

        .form-grid { display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; align-items: center; }
        .form-grid label { font-weight: 700; color: #445; font-size: 12.5px; }
        .form-grid input, .form-grid textarea { border: 1px solid #cfd6e2; border-radius: 5px; padding: 0 9px; height: 30px; line-height: 28px; font-size: 13px; width: 100%; box-sizing: border-box; font-family: inherit; }
        .form-grid textarea { resize: vertical; min-height: 60px; height: auto; line-height: 1.5; padding: 7px 9px; }
        .form-grid .full { grid-column: 1 / -1; }
        .file-drop { border: 1.5px dashed #b9c4d6; border-radius: 8px; padding: 18px; text-align: center; color: #6f7d92; background: #f8fafd; cursor: pointer; }
        .file-drop.has { border-color: #2b5fc4; background: #eef4ff; color: #2b5fc4; font-weight: 700; }
        .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
        .target-tag { font-size: 12.5px; color: #445; }
        .target-tag b { color: #2b5fc4; }
        .pick-empty { color: #99a2b2; font-size: 12.5px; padding: 30px 10px; text-align: center; }
        .hint { font-size: 11.5px; color: #8a93a3; margin-top: 2px; }
        .hist-title { margin: 18px 0 6px; font-size: 13px; font-weight: 700; color: #445; }
        .link-dl { color: #2b5fc4; cursor: pointer; text-decoration: underline; }
        .btn-mini { font-size: 11px; padding: 2px 7px; border: 1px solid #e0a0a0; background: #fff; color: #c00; cursor: pointer; border-radius: 3px; }

        /* 도면 올리기 — 생산 지시 [도면 일괄] 과 같은 저장소(attach_file 'suju_drawing') */
        .du-rule { background: #f5f8fc; border: 1px solid #dbe4f0; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; color: #2d3748; line-height: 1.6; }
        .du-rule .du-ex { font-family: Consolas, monospace; font-size: 12.5px; color: #1f4e8c; margin: 2px 0 4px; }
        .du-rule .du-ex span { color: #b45309; font-weight: 700; }
        .du-zones { display: flex; gap: 10px; margin-top: 10px; }
        .du-zone { flex: 1; border: 2px dashed #9fb3d1; border-radius: 10px; padding: 16px 10px; text-align: center; cursor: pointer; background: #f8fbff; }
        .du-zone:hover { background: #eef4ff; }
        .du-zone.over { background: #dbe7ff; border-color: #1f4e8c; }
        .du-zone.orig { border-color: #d6b98a; background: #fffcf6; }
        .du-zone.orig:hover { background: #fff4e2; }
        .du-zone.orig.over { background: #ffe9c2; border-color: #b45309; }
        .du-zone .du-zt { font-size: 14px; font-weight: 800; color: #1f2a44; }
        .du-zone .du-zs { font-size: 12px; color: #4a5568; margin-top: 2px; }
        .du-zone .du-zh { font-size: 11.5px; color: #8b95a7; margin-top: 5px; }
        .du-count { margin: 10px 0 6px; font-size: 12.5px; color: #4a5568; }

        .badge { white-space: nowrap; }
        .badge.part { background: #e3f3ea; color: #1f8f53; }
        .badge.unit { background: #e8f0fe; color: #1f4e8c; }
        .badge.whole { background: #fff4d6; color: #9a6400; }
        .badge.miss { background: #fde8e8; color: #b3261e; }
        .badge.old { background: #eef0f3; color: #888; }
        .dh-sum { font-size: 12.5px; color: #445; padding: 4px 2px; line-height: 1.7; }
        .dh-sum b { color: #1f2a44; }
        .hist-title small { font-weight: 400; color: #8a93a3; font-size: 11.5px; margin-left: 6px; }
        tr.old td { color: #8a93a3; background: #fafbfc; }
        tr.old .link-dl { color: #7d8aa3; }
        tr.grp-start td { border-top: 2px solid #c9d3e3; }
        .link-dl { word-break: break-all; }
        .orig-cell { text-align: left !important; line-height: 1.6; }
        .chips { display: flex; flex-wrap: wrap; gap: 4px; }
        .chips span { background: #f1f4f9; border-radius: 4px; padding: 1px 6px; font-size: 11.5px; color: #445; }
        .dh-legend { font-size: 11.5px; color: #8a93a3; margin-top: 6px; line-height: 1.7; }
    </style>
</head>
<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>도면 관리</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>기준정보</li>
                <li>도면 관리</li>
            </ul>
        </div>

        <div class="proj-bar">
            <div class="fld">
                <label for="projSel">프로젝트</label>
                <select id="projSel"></select>
            </div>
            <div class="fld">
                <label for="lineSel">라인</label>
                <select id="lineSel"><option value="">전체</option></select>
            </div>
        </div>

        <div class="row2">
            <!-- 좌: 유니트(공정) 목록 -->
            <section class="section left">
                <div class="section-top"><h3>유니트(공정) 선택</h3></div>
                <div class="container-fluid" style="padding:0;">
                    <table class="work-table">
                        <colgroup>
                            <col style="width:16%"><col style="width:36%"><col style="width:12%"><col style="width:14%"><col style="width:11%"><col style="width:11%">
                        </colgroup>
                        <thead>
                        <tr><th>라인</th><th>공정명</th><th>유니트</th><th>설비타입</th><th>도면</th><th>원본</th></tr>
                        </thead>
                        <tbody id="unitBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- 우: 도면 첨부 / 이력 -->
            <section class="section right">
                <div class="section-top">
                    <h3>도면 올리기 / 이력</h3>
                    <span class="target-tag" id="targetTag">유니트를 선택하세요</span>
                </div>
                <div class="container-fluid">
                    <div id="formArea">
                        <p class="pick-empty">왼쪽에서 유니트(공정)를 선택하면 도면을 올릴 수 있습니다.</p>
                    </div>
                </div>
            </section>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/iljin_drawing.js}"></script>
    <script type="text/javascript">
        /*
         * 도면 관리 — 유니트(공정 = 생산 지시의 품목) 도면을 올리고 이력을 본다.
         *   저장은 생산 지시 [도면 일괄] 과 같은 곳 (attach_file TableName='suju_drawing', DataPk=suju.id).
         *   그래서 여기서 올린 도면이 생산 지시 · 키오스크 · 도면 이력 관리에 그대로 나온다.
         *   도면(PDF·그림)과 원본(DWG·DXF)은 칸을 나눠 올리고, 파일 이름으로 도면번호 · REV · 원본 짝을 정한다
         *   (iljin_drawing.js parse · findOriginals — 키오스크와 같은 규칙).
         */
        var IMG_EXT = ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp'];
        var MAX_BYTES = 200 * 1024 * 1024;   // application.properties max-file-size 와 같이

        var dm = {
            spjangcd: null,
            projNo: '',
            lineName: '',
            units: [],
            selUnit: null,     // 선택된 유니트(suju) 객체
            files: [],         // 선택 유니트에 올라간 파일
            pending: [],       // 올릴 파일
            busy: false,

            /* ---------------- 초기화 ---------------- */
            init: function () {
                this.spjangcd = sessionStorage.getItem('spjangcd');
                this.loadProjects();
                this.renderUnits();   // 빈 그리드라도 채워서 표시
                this.renderForm();    // 우측 폼 처음부터 열어두기

                var _this = this;
                $('#projSel').on('change', function () {
                    _this.projNo = $(this).val();
                    _this.lineName = '';
                    _this.loadUnits(true);
                });
                $('#lineSel').on('change', function () {
                    _this.lineName = $(this).val();
                    _this.selUnit = null;
                    _this.renderUnits();
                    _this.renderForm();
                });
            },

            todayYMD: function () {
                var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
                return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
            },

            esc: function (s) {
                if (s === null || s === undefined) return '';
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            },

            /* ---------------- 프로젝트 목록 ---------------- */
            loadProjects: function () {
                var _this = this;
                AjaxUtil.getAsyncData('/api/transaction/projectRegistration/read',
                    {
                        spjangcd: this.spjangcd,
                        srchStartDt: '2000-01-01',
                        srchEndDt: '2999-12-31',
                        txtDescription: ''
                    },
                    function (result) {
                        var list = (result && result.data) || [];
                        var html = '<option value="">프로젝트 선택</option>';
                        list.forEach(function (p) {
                            var no = _this.esc(p.projno);
                            var nm = _this.esc(p.projnm);
                            html += '<option value="' + no + '">' + no + ' / ' + nm + '</option>';
                        });
                        $('#projSel').html(html);
                    });
            },

            /* ---------------- 유니트(공정) 목록 ---------------- */
            loadUnits: function (rebuildLine) {
                var _this = this;
                this.selUnit = null;

                if (!this.projNo) {
                    this.units = [];
                    if (rebuildLine) $('#lineSel').html('<option value="">전체</option>');
                    this.renderUnits();
                    this.renderForm();
                    return;
                }

                AjaxUtil.getAsyncData('/api/drawing-manage/units',
                    {
                        spjangcd: this.spjangcd,
                        project_no: this.projNo,
                        line_name: ''      // 라인은 화면에서 필터
                    },
                    function (result) {
                        _this.units = (result && result.data) || [];

                        if (rebuildLine) {
                            var lines = [];
                            _this.units.forEach(function (u) {
                                if (u.line_name && lines.indexOf(u.line_name) < 0) lines.push(u.line_name);
                            });
                            var h = '<option value="">전체</option>';
                            lines.forEach(function (l) {
                                h += '<option value="' + _this.esc(l) + '">' + _this.esc(l) + '</option>';
                            });
                            $('#lineSel').html(h);
                        }

                        _this.renderUnits();
                        _this.renderForm();
                    });
            },

            /** 왼쪽 목록의 도면 · 원본 개수 */
            loadCounts: function () {
                // 도면 · 원본 개수는 /units 에 같이 온다 — 올리기 · 삭제 뒤 선택은 그대로 두고 개수만 새로
                var _this = this, proj = this.projNo;
                if (!proj) return;
                AjaxUtil.getAsyncData('/api/drawing-manage/units',
                    {spjangcd: this.spjangcd, project_no: proj, line_name: ''},
                    function (result) {
                        if (proj !== _this.projNo) return;
                        _this.units = (result && result.data) || [];
                        var sel = _this.selUnit;
                        if (sel) _this.selUnit = _this.units.filter(function (u) { return u.suju_id === sel.suju_id; })[0] || sel;
                        _this.renderUnits();
                    });
            },

            filteredUnits: function () {
                var _this = this;
                if (!this.lineName) return this.units;
                return this.units.filter(function (u) { return u.line_name === _this.lineName; });
            },

            renderUnits: function () {
                var _this = this;
                var list = this.filteredUnits();
                var $body = $('#unitBody');

                var html = '';
                list.forEach(function (u) {
                    var on = (_this.selUnit && _this.selUnit.suju_id === u.suju_id) ? ' on' : '';
                    var c = u;   // draw_cnt · orig_cnt 는 /units 에 같이 온다
                    var n = function (v) {
                        return +v ? '<span class="badge has">' + (+v) + '</span>' : '<span class="badge none">0</span>';
                    };
                    html += '<tr class="unit-row' + on + '" data-suju="' + u.suju_id + '">'
                        + '<td>' + _this.esc(u.line_name) + '</td>'
                        + '<td class="l">' + _this.esc(u.proc_name) + '</td>'
                        + '<td>' + _this.esc(u.unit_qty) + '</td>'
                        + '<td>' + _this.esc(u.equip_type) + '</td>'
                        + '<td>' + n(c.draw_cnt) + '</td>'
                        + '<td>' + n(c.orig_cnt) + '</td>'
                        + '</tr>';
                });

                // 데이터가 없더라도 화면이 비지 않도록 빈 행으로 채움 (최소 10행)
                var fillCount = Math.max(10 - list.length, 0);
                for (var i = 0; i < fillCount; i++) {
                    html += '<tr class="empty-row"><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>';
                }

                $body.html(html);
            },

            selectUnit: function (sujuId) {
                var _this = this;
                this.selUnit = this.units.filter(function (u) {
                    return String(u.suju_id) === String(sujuId);
                })[0] || null;
                this.renderUnits();
                this.renderForm();
            },

            /* ---------------- 우측: 올리기 + 이력 ---------------- */
            renderForm: function () {
                var u = this.selUnit;
                this.pending = [];
                this.files = [];

                if (!u) {
                    $('#targetTag').text('좌측에서 유니트를 선택하세요');
                    $('#formArea').html('<p class="pick-empty">왼쪽에서 유니트(공정)를 선택하면 도면을 올릴 수 있습니다.</p>');
                    return;
                }
                $('#targetTag').html('<b>' + this.esc(this.projNo) + '</b> · '
                    + this.esc(u.line_name) + ' · ' + this.esc(u.proc_name));

                $('#formArea').html(
                    '<div class="du-rule">'
                    + '  <b>파일 이름 규칙</b> — 형식과 상관없이 <b>도면번호-REV번호</b> 로 같게, 확장자만 다르게'
                    + '  <div class="du-ex">FD10-01-03-REV11<span>.pdf</span> · FD10-01-03-REV11<span>.png</span> · FD10-01-03-REV11<span>.dwg</span></div>'
                    + '  <div style="color:#718096;font-size:12px;">원본은 유닛 하나(FD10-01-00.dxf)나 공정 전체를 한 파일로 올려도 됩니다 — 도면번호 앞부분으로 짝을 찾습니다.'
                    + '   같은 도면번호는 REV 높은 것이 최신, 나머지는 이력. 이미 올린 파일 이름은 건너뜁니다.</div>'
                    + '</div>'
                    + '<input type="file" id="drawFile" multiple accept=".pdf,.png,.jpg,.jpeg,.gif,.bmp,.webp" style="display:none">'
                    + '<input type="file" id="origFile" multiple accept=".dwg,.dxf" style="display:none">'
                    + '<div class="du-zones">'
                    + '  <div class="du-zone" id="duZoneDraw"><div class="du-zt">도면 올리기</div><div class="du-zs">PDF · PNG · JPG</div>'
                    + '    <div class="du-zh">여기로 끌어다 놓거나 눌러서 선택 (폴더도 됨)</div></div>'
                    + '  <div class="du-zone orig" id="duZoneOrig"><div class="du-zt">원본 올리기</div><div class="du-zs">DWG · DXF</div>'
                    + '    <div class="du-zh">여기로 끌어다 놓거나 눌러서 선택 (폴더도 됨)</div></div>'
                    + '</div>'
                    + '<div id="duPending"></div>'
                    + '<div class="hist-title">도면 이력</div>'
                    + '<div id="histArea"><p class="pick-empty">조회 중...</p></div>'
                );
                this.renderPending();
                this.loadFiles();
            },

            ext: function (name) { return (String(name || '').split('.').pop() || '').toLowerCase(); },
            isCadName: function (name) { var e = this.ext(name); return e === 'dwg' || e === 'dxf'; },
            rank: function (name) { var e = this.ext(name); return e === 'pdf' ? 0 : IMG_EXT.indexOf(e) >= 0 ? 1 : 2; },

            /** 선택 유니트에 올라간 파일 → 이력 표 */
            loadFiles: function () {
                var _this = this, u = this.selUnit;
                if (!u) return;
                AjaxUtil.getAsyncData('/api/drawing-manage/files', {suju_id: u.suju_id}, function (res) {
                    if (!_this.selUnit || _this.selUnit.suju_id !== u.suju_id) return;
                    _this.files = ((res && res.data) || []).map(function (f) {
                        var p = IljinDrawing.parse(f.file_name);
                        return Object.assign({}, f, {suju_id: u.suju_id, _no: p.no, _rev: p.rev, _r: p.rev == null ? -1 : p.rev});
                    });
                    _this.renderPending();
                    _this.drawHistory();
                });
            },

            /* ---------------- 올릴 파일 ---------------- */
            filesFromDrop: function (dt) {
                var items = Array.prototype.map.call(dt.items || [], function (i) { return i.webkitGetAsEntry && i.webkitGetAsEntry(); })
                    .filter(Boolean);
                if (!items.length) return Promise.resolve(Array.prototype.slice.call(dt.files || []));
                var out = [];
                var walk = function (entry) {
                    if (entry.isFile) return new Promise(function (res) { entry.file(function (f) { out.push(f); res(); }, function () { res(); }); });
                    if (!entry.isDirectory) return Promise.resolve();
                    var reader = entry.createReader();
                    var more = function () {
                        return new Promise(function (res) { reader.readEntries(res, function () { res([]); }); }).then(function (batch) {
                            if (!batch.length) return;
                            return batch.reduce(function (p, c) { return p.then(function () { return walk(c); }); }, Promise.resolve()).then(more);
                        });
                    };
                    return more();
                };
                return items.reduce(function (p, en) { return p.then(function () { return walk(en); }); }, Promise.resolve())
                    .then(function () { return out; });
            },

            addFiles: function (list) {
                var _this = this;
                if (!this.selUnit) return;
                var seen = {};
                this.pending.forEach(function (r) { seen[r.file.name.toLowerCase()] = 1; });
                Array.prototype.forEach.call(list || [], function (f) {
                    if (!f || !f.name || f.name.charAt(0) === '.' || seen[f.name.toLowerCase()]) return;
                    seen[f.name.toLowerCase()] = 1;
                    var p = IljinDrawing.parse(f.name);
                    _this.pending.push({file: f, no: p.no, rev: p.rev, big: f.size > MAX_BYTES});
                });
                this.pending.sort(function (a, b) { return a.no.localeCompare(b.no, 'ko', {numeric: true}) || a.file.name.localeCompare(b.file.name); });
                this.renderPending();
            },

            /** 올릴 파일 한 줄의 상태 — 새 도면 / 최신으로 교체 / 이력 / 원본 종류 / 건너뜀 */
            status: function (r) {
                var _this = this;
                var name = r.file.name;
                if (r.big) return {t: '200MB 초과 — 올릴 수 없음', c: '#b3261e', skip: true};
                if (this.files.some(function (f) { return String(f.file_name || '').toLowerCase() === name.toLowerCase(); }))
                    return {t: '이미 있음 — 건너뜀', c: '#718096', skip: true};
                var rv = r.rev == null ? -1 : r.rev;
                if (this.isCadName(name)) {
                    // 원본: 이미 올린 도면 + 이번에 올리는 도면 번호로 종류를 본다
                    var nos = {};
                    this.files.forEach(function (f) { if (!_this.isCadName(f.file_name)) nos[f._no] = 1; });
                    this.pending.forEach(function (x) { if (!x.big && !_this.isCadName(x.file.name)) nos[x.no] = 1; });
                    var k = IljinDrawing.origKind(name, Object.keys(nos));
                    var fx = this.ext(name).toUpperCase();
                    if (k.kind === 'part') return {t: '원본 ' + fx + ' — 이 도면 원본', c: '#1f6f3f'};
                    if (k.kind === 'unit') return {t: '원본 ' + fx + ' — 유닛 원본 (유닛 도면들에서 열림)', c: '#1f4e8c'};
                    if (k.kind === 'whole') return {t: '원본 ' + fx + ' — 전체 원본 (이 공정 도면 전부에서 열림)', c: '#9a6400'};
                    return {t: '원본 ' + fx + ' — 짝 도면 없음 (같은 이름 PDF 를 올리면 연결)', c: '#b45309'};
                }
                var old = -2;
                this.files.forEach(function (f) { if (!_this.isCadName(f.file_name) && f._no === r.no) old = Math.max(old, f._r); });
                var top = old;
                this.pending.forEach(function (x) { if (!x.big && !_this.isCadName(x.file.name) && x.no === r.no) top = Math.max(top, x.rev == null ? -1 : x.rev); });
                if (old === -2) return rv < top ? {t: '이력 (최신은 REV' + top + ')', c: '#718096'} : {t: '새 도면', c: '#1f6f3f'};
                if (rv === old) return {t: '같은 REV' + (old < 0 ? '' : old) + ' — ' + this.ext(name).toUpperCase() + ' 추가', c: '#1f6f3f'};
                if (rv >= top) return {t: '최신으로 교체' + (old >= 0 ? ' (기존 REV' + old + ')' : ''), c: '#1f6f3f'};
                return {t: '이력으로 보관 (최신은 REV' + top + ')', c: '#718096'};
            },

            renderPending: function () {
                var _this = this, rows = this.pending, box = $('#duPending');
                if (!box.length) return;
                if (!rows.length) { box.html(''); return; }
                var go = 0;
                var html = '<div class="du-count">올릴 파일 <b>' + rows.length + '</b>개</div>'
                    + '<table class="work-table"><colgroup><col style="width:42%"><col style="width:12%"><col style="width:38%"><col style="width:8%"></colgroup>'
                    + '<thead><tr><th>파일</th><th>REV</th><th>상태</th><th></th></tr></thead><tbody>';
                rows.forEach(function (r, i) {
                    var st = _this.status(r);
                    if (!st.skip) go++;
                    html += '<tr><td class="l" style="word-break:break-all">' + _this.esc(r.file.name) + '</td>'
                        + '<td>' + (r.rev != null ? r.rev : '-') + '</td>'
                        + '<td class="l" style="color:' + st.c + '">' + _this.esc(st.t) + '</td>'
                        + '<td><button type="button" class="btn-mini" data-pdel="' + i + '">빼기</button></td></tr>';
                });
                html += '</tbody></table>'
                    + '<div class="form-actions">'
                    + '  <a class="btn" id="btnCancel">비우기</a>'
                    + '  <a class="btn primary y_write_auth" id="btnSaveDrawing">' + (go ? '올리기 (' + go + ')' : '올릴 파일 없음') + '</a>'
                    + '</div>';
                box.html(html);
            },

            uploadOne: function (file, sujuId) {
                return new Promise(function (resolve) {
                    var fd = new FormData();
                    fd.append('uploadfile', file);
                    fd.append('tableName', 'suju_drawing');
                    fd.append('others', 'suju_drawing');
                    fd.append('attachName', 'drawing');
                    fd.append('DataPk', sujuId);
                    AjaxUtil.postFileAsyncData('/api/files/upload', fd,
                        function (res) { resolve(!!(res && res.success !== false && res.fileId)); },
                        function () { resolve(false); });
                });
            },

            upload: function () {
                var _this = this, u = this.selUnit;
                if (!u) { Alert.alert('', '좌측에서 유니트(공정)를 먼저 선택하세요.'); return; }
                if (this.busy) return;
                var go = this.pending.filter(function (r) { return !_this.status(r).skip; });
                if (!go.length) { Alert.alert('', '올릴 파일이 없습니다. (이미 올린 파일은 건너뜁니다)'); return; }
                this.busy = true;
                var btn = $('#btnSaveDrawing'), fail = [], next = 0, done = 0;
                // 수백 개라 3개씩 동시에
                var worker = function () {
                    if (next >= go.length) return Promise.resolve();
                    var r = go[next++];
                    return _this.uploadOne(r.file, u.suju_id).then(function (ok) {
                        if (!ok) fail.push(r.file.name);
                        btn.text('올리는 중 ' + (++done) + '/' + go.length);
                        return worker();
                    });
                };
                Promise.all([worker(), worker(), worker()]).then(function () {
                    _this.busy = false;
                    _this.pending = _this.pending.filter(function (r) { return fail.indexOf(r.file.name) >= 0; });
                    Alert.alert('', '도면 ' + (go.length - fail.length) + '개를 올렸습니다.'
                        + (fail.length ? '<br>실패 ' + fail.length + '개: ' + fail.slice(0, 10).map(_this.esc).join(', ')
                            + (fail.length > 10 ? ' 외 ' + (fail.length - 10) + '개' : '') + '<br>[올리기] 를 다시 누르면 실패한 것만 올립니다.' : ''));
                    _this.loadFiles();
                    _this.loadCounts();
                });
            },

            /* ---------------- 이력 (도면 / 원본 + 짝) ---------------- */
            drawHistory: function () {
                var _this = this, files = this.files;
                if (!files.length) {
                    $('#histArea').html('<p class="pick-empty" style="padding:20px 10px">올린 도면이 없습니다.</p>');
                    return;
                }
                var draws = files.filter(function (f) { return !_this.isCadName(f.file_name); });
                var cads = files.filter(function (f) { return _this.isCadName(f.file_name); });

                var groups = {}, order = [];
                draws.forEach(function (f) {
                    if (!groups[f._no]) { groups[f._no] = []; order.push(f._no); }
                    groups[f._no].push(f);
                });
                order.sort(function (a, b) { return a.localeCompare(b, 'ko', {numeric: true}); });
                order.forEach(function (no) {
                    groups[no].sort(function (a, b) { return (b._r - a._r) || (_this.rank(a.file_name) - _this.rank(b.file_name)) || (b.id - a.id); });
                });

                // 도면번호마다 [원본 열기] 가 여는 원본 — 원본 표의 '열리는 도면' 도 여기서
                var origOf = {}, openedBy = {}, kindOf = {};
                order.forEach(function (no) {
                    var os = IljinDrawing.findOriginals(groups[no][0], files);
                    origOf[no] = os;
                    os.forEach(function (o) {
                        (openedBy[o.id] = openedBy[o.id] || []).push(no);
                        if (!kindOf[o.id]) kindOf[o.id] = o.kind;
                    });
                });
                var badge = function (kind) {
                    return kind === 'part' ? '<span class="badge part">이 도면 원본</span>'
                        : kind === 'unit' ? '<span class="badge unit">유닛 원본</span>'
                            : kind === 'whole' ? '<span class="badge whole">전체 원본</span>'
                                : '<span class="badge miss">원본 없음</span>';
                };
                var cnt = function (list, test) { return list.filter(test).length; };
                var noOrig = order.filter(function (no) { return !origOf[no].length; }).length;

                var sum = '<div class="dh-sum">도면 <b>' + order.length + '종</b> (PDF ' + cnt(draws, function (f) { return _this.ext(f.file_name) === 'pdf'; })
                    + ' · 그림 ' + cnt(draws, function (f) { return _this.rank(f.file_name) === 1; }) + ')'
                    + ' &nbsp;|&nbsp; 원본 <b>' + cads.length + '개</b> (DWG ' + cnt(cads, function (f) { return _this.ext(f.file_name) === 'dwg'; })
                    + ' · DXF ' + cnt(cads, function (f) { return _this.ext(f.file_name) === 'dxf'; }) + ')'
                    + (order.length ? ' &nbsp;|&nbsp; ' + (noOrig ? '원본 없는 도면 <b style="color:#b3261e">' + noOrig + '</b>'
                        : '<span style="color:#1f8f53">모든 도면에서 원본을 열 수 있음</span>') : '') + '</div>';

                // 도면 표
                var t1 = '<div class="hist-title">도면 (PDF·그림)<small>파일 이름을 누르면 도면을 봅니다</small></div>'
                    + '<table class="work-table"><colgroup><col style="width:17%"><col style="width:8%"><col style="width:7%">'
                    + '<col style="width:27%"><col style="width:11%"><col style="width:23%"><col style="width:7%"></colgroup>'
                    + '<thead><tr><th>도면번호</th><th>REV</th><th>형식</th><th>파일명</th><th>등록일</th><th>원본 (원본 열기 시)</th><th>삭제</th></tr></thead><tbody>';
                if (!order.length) t1 += '<tr><td colspan="7" class="pick-empty" style="padding:14px">PDF·그림 도면이 없습니다.</td></tr>';
                order.forEach(function (no) {
                    var g = groups[no], top = g[0]._r, os = origOf[no];
                    var origHtml = os.length ? os.map(function (o) {
                        return badge(o.kind) + ' <span class="link-dl" data-orig="' + o.id + '" data-no="' + _this.esc(no) + '">' + _this.esc(o.name) + '</span>';
                    }).join('<br>') : badge('');
                    g.forEach(function (f, i) {
                        var old = f._r !== top;
                        t1 += '<tr class="' + (i === 0 ? 'grp-start' : '') + (old ? ' old' : '') + '">'
                            + (i === 0 ? '<td rowspan="' + g.length + '" class="l"><b>' + _this.esc(no) + '</b></td>' : '')
                            + '<td>' + (f._rev != null ? f._rev : '-') + (old ? ' <span class="badge old">이전</span>' : '') + '</td>'
                            + '<td>' + _this.esc(_this.ext(f.file_name).toUpperCase()) + '</td>'
                            + '<td class="l"><span class="link-dl" data-view="' + f.id + '">' + _this.esc(f.file_name) + '</span></td>'
                            + '<td>' + _this.esc(String(f.created || '').slice(0, 10)) + '</td>'
                            + (i === 0 ? '<td rowspan="' + g.length + '" class="orig-cell">' + origHtml + '</td>' : '')
                            + '<td><button type="button" class="btn-mini" data-del="' + f.id + '">삭제</button></td></tr>';
                    });
                });
                t1 += '</tbody></table>';

                // 원본 표
                cads.sort(function (a, b) { return a._no.localeCompare(b._no, 'ko', {numeric: true}) || (b._r - a._r) || (b.id - a.id); });
                var t2 = '<div class="hist-title">원본 (DWG·DXF)<small>파일 이름을 누르면 PC 의 도면 뷰어로 엽니다</small></div>'
                    + '<table class="work-table"><colgroup><col style="width:27%"><col style="width:7%"><col style="width:7%">'
                    + '<col style="width:13%"><col style="width:28%"><col style="width:11%"><col style="width:7%"></colgroup>'
                    + '<thead><tr><th>원본 파일</th><th>형식</th><th>REV</th><th>종류</th><th>열리는 도면</th><th>등록일</th><th>삭제</th></tr></thead><tbody>';
                if (!cads.length) t2 += '<tr><td colspan="7" class="pick-empty" style="padding:14px">원본(DWG·DXF)이 없습니다.</td></tr>';
                cads.forEach(function (c) {
                    var by = openedBy[c.id] || [];
                    var newer = !by.length && cads.some(function (o) {
                        return o !== c && o._no === c._no && _this.ext(o.file_name) === _this.ext(c.file_name) && o._r > c._r;
                    });
                    var kind = by.length ? badge(kindOf[c.id])
                        : newer ? '<span class="badge old">이전 리비전</span>' : '<span class="badge miss">짝 도면 없음</span>';
                    var chips = by.length
                        ? '<div class="chips">' + by.slice(0, 8).map(function (n) { return '<span>' + _this.esc(n) + '</span>'; }).join('')
                        + (by.length > 8 ? '<span>외 ' + (by.length - 8) + '장</span>' : '') + '</div>'
                        : '<span style="color:#99a2b2">-</span>';
                    t2 += '<tr' + (newer ? ' class="old"' : '') + '>'
                        + '<td class="l"><span class="link-dl" data-orig="' + c.id + '">' + _this.esc(c.file_name) + '</span></td>'
                        + '<td>' + _this.esc(_this.ext(c.file_name).toUpperCase()) + '</td>'
                        + '<td>' + (c._rev != null ? c._rev : '-') + '</td>'
                        + '<td>' + kind + '</td>'
                        + '<td class="l">' + chips + '</td>'
                        + '<td>' + _this.esc(String(c.created || '').slice(0, 10)) + '</td>'
                        + '<td><button type="button" class="btn-mini" data-del="' + c.id + '">삭제</button></td></tr>';
                });
                t2 += '</tbody></table>'
                    + '<div class="dh-legend">이 도면 원본 = 이름이 같은 원본 · 유닛 원본 = 유닛 하나를 묶은 원본 (FD10-01-00) · '
                    + '전체 원본 = 공정(지그) 전체가 한 파일 · 짝 도면 없음 = 어느 도면에서도 열리지 않음 (이름 확인)</div>';

                $('#histArea').html(sum + t1 + t2);
            },

            view: function (id) {
                var u = this.selUnit;
                if (u) IljinDrawing.open({sujuId: u.suju_id, title: u.proc_name || '', projNo: this.projNo, focusId: id});
            },

            openOrig: function (id, no) {
                var _this = this;
                if (no) {   // 도면 표에서 누름 — 유닛 · 전체 원본이면 '안에서 이 장을 찾으세요' 안내
                    var top = this.files.filter(function (x) { return x._no === no && !_this.isCadName(x.file_name); })
                        .sort(function (a, b) { return (b._r - a._r) || (_this.rank(a.file_name) - _this.rank(b.file_name)); })[0];
                    var c = top ? IljinDrawing.findOriginals(top, this.files).filter(function (o) { return o.id === id; })[0] : null;
                    if (c) { IljinDrawing.openOriginals([c], no); return; }
                }
                IljinDrawing.openOriginal(id);
            },

            /* ---------------- 삭제 ---------------- */
            remove: function (id) {
                var _this = this;
                var f = this.files.filter(function (x) { return x.id === id; })[0];
                Alert.confirm('', "'" + (f ? f.file_name : '') + "' 을(를) 삭제하시겠습니까?", function () {
                    AjaxUtil.postJsonData('/api/drawing-manage/delete', {id: id}, function (res) {
                        if (res && res.success) {
                            Notify.success('삭제되었습니다.');
                            _this.loadFiles();
                            _this.loadCounts();
                        } else {
                            Alert.alert('삭제 실패', (res && res.message) || '알 수 없는 오류');
                        }
                    });
                });
            }
        };

        $(document).ready(function () {
            dm.init();

            // 유니트 행 선택
            $(document).on('click', '.unit-row', function () {
                dm.selectUnit($(this).data('suju'));
            });

            // 파일 고르기 · 끌어다 놓기 (도면 칸 / 원본 칸)
            $(document).on('click', '#duZoneDraw', function () { $('#drawFile').click(); });
            $(document).on('click', '#duZoneOrig', function () { $('#origFile').click(); });
            $(document).on('change', '#drawFile, #origFile', function () { dm.addFiles(this.files); this.value = ''; });
            $(document).on('dragover', '.du-zone', function (e) { e.preventDefault(); $(this).addClass('over'); });
            $(document).on('dragleave', '.du-zone', function () { $(this).removeClass('over'); });
            $(document).on('drop', '.du-zone', function (e) {
                e.preventDefault();
                $(this).removeClass('over');
                dm.filesFromDrop(e.originalEvent.dataTransfer).then(function (fs) { dm.addFiles(fs); });
            });
            $(document).on('dragover drop', '#formArea', function (e) { e.preventDefault(); });   // 칸 밖에 놓아도 브라우저가 파일을 열지 않게

            // 버튼
            $(document).on('click', '#btnSaveDrawing', function () { dm.upload(); });
            $(document).on('click', '#btnCancel', function () { dm.pending = []; dm.renderPending(); });
            $(document).on('click', '[data-pdel]', function () { dm.pending.splice(+$(this).attr('data-pdel'), 1); dm.renderPending(); });

            // 이력 — 도면 보기 / 원본 열기 / 삭제
            $(document).on('click', '[data-view]', function () { dm.view(+$(this).attr('data-view')); });
            $(document).on('click', '[data-orig]', function () { dm.openOrig(+$(this).attr('data-orig'), $(this).attr('data-no')); });
            $(document).on('click', '[data-del]', function () { dm.remove(+$(this).attr('data-del')); });
        });
    </script>
</th:block>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
