<html layout:decorate="~{layout_page}">
<head>
    <style>
        .proj-bar { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #d7dde7; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; flex-wrap: wrap; }
        .proj-bar .fld { display: flex; align-items: center; gap: 8px; }
        .proj-bar label { font-weight: 700; color: #445; font-size: 12.5px; }
        .proj-bar select { border: 1px solid #cfd6e2; border-radius: 5px; font-size: 12.5px; padding: 5px 8px; min-width: 200px; }

        .row2 { display: flex; gap: 8px; align-items: flex-start; }
        .row2 > .section.left { flex: 0 0 460px; }
        .row2 > .section.right { flex: 1 1 auto; min-width: 0; }

        table.work-table { width: 100%; border-collapse: collapse; }
        table.work-table th, table.work-table td { border: 1px solid #d7dde7; padding: 6px 7px; font-size: 12.5px; text-align: center; }
        table.work-table th { background: #eef2f8; color: #445; font-weight: 700; }
        table.work-table td.l { text-align: left; }

        .unit-row { cursor: pointer; }
        .unit-row.on { background: #eaf1ff; }
        .unit-row.on td { font-weight: 700; }
        .empty-row td { color: #c9cfd8; height: 30px; }
        .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
        .badge.has { background: #e3f3ea; color: #1f8f53; }
        .badge.none { background: #eef0f3; color: #888; }

        .form-grid { display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; align-items: center; }
        .form-grid label { font-weight: 700; color: #445; font-size: 12.5px; }
        .form-grid input, .form-grid textarea { border: 1px solid #cfd6e2; border-radius: 5px; padding: 7px 9px; font-size: 12.5px; width: 100%; box-sizing: border-box; font-family: inherit; }
        .form-grid textarea { resize: vertical; min-height: 60px; }
        .form-grid .full { grid-column: 1 / -1; }
        .file-drop { border: 1.5px dashed #b9c4d6; border-radius: 8px; padding: 18px; text-align: center; color: #6f7d92; background: #f8fafd; cursor: pointer; }
        .file-drop.has { border-color: #2b5fc4; background: #eef4ff; color: #2b5fc4; font-weight: 700; }
        .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
        .target-tag { font-size: 12.5px; color: #445; }
        .target-tag b { color: #2b5fc4; }
        .pick-empty { color: #99a2b2; font-size: 12.5px; padding: 30px 10px; text-align: center; }
        .hint { font-size: 11.5px; color: #8a93a3; margin-top: 2px; }
        .hist-title { margin: 18px 0 6px; font-size: 13px; font-weight: 700; color: #445; }
        .link-dl { color: #2b5fc4; cursor: pointer; text-decoration: underline; }
        .btn-mini { font-size: 11px; padding: 2px 7px; border: 1px solid #e0a0a0; background: #fff; color: #c00; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>도면 관리</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>기준정보</li>
                <li>도면 관리</li>
            </ul>
        </div>

        <div class="proj-bar">
            <div class="fld">
                <label for="projSel">프로젝트</label>
                <select id="projSel"></select>
            </div>
            <div class="fld">
                <label for="lineSel">라인</label>
                <select id="lineSel"><option value="">전체</option></select>
            </div>
        </div>

        <div class="row2">
            <!-- 좌: 유니트(공정) 목록 -->
            <section class="section left">
                <div class="section-top"><h3>유니트(공정) 선택</h3></div>
                <div class="container-fluid" style="padding:0;">
                    <table class="work-table">
                        <colgroup>
                            <col style="width:18%"><col style="width:38%"><col style="width:14%"><col style="width:14%"><col style="width:16%">
                        </colgroup>
                        <thead>
                        <tr><th>라인</th><th>공정명</th><th>유니트</th><th>설비타입</th><th>최신도면</th></tr>
                        </thead>
                        <tbody id="unitBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- 우: 도면 첨부 / 이력 -->
            <section class="section right">
                <div class="section-top">
                    <h3>도면 첨부 / 등록</h3>
                    <span class="target-tag" id="targetTag">유니트를 선택하세요</span>
                </div>
                <div class="container-fluid">
                    <div id="formArea">
                        <p class="pick-empty">왼쪽에서 유니트(공정)를 선택하면 도면을 첨부할 수 있습니다.</p>
                    </div>
                </div>
            </section>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript">

        var dm = {
            spjangcd: null,
            projNo: '',
            lineName: '',
            units: [],
            selUnit: null,     // 선택된 유니트(suju) 객체

            /* ---------------- 초기화 ---------------- */
            init: function () {
                this.spjangcd = sessionStorage.getItem('spjangcd');
                this.loadProjects();
                this.renderUnits();   // 빈 그리드라도 채워서 표시
                this.renderForm();    // 우측 폼 처음부터 열어두기

                var _this = this;
                $('#projSel').on('change', function () {
                    _this.projNo = $(this).val();
                    _this.lineName = '';
                    _this.loadUnits(true);
                });
                $('#lineSel').on('change', function () {
                    _this.lineName = $(this).val();
                    _this.selUnit = null;
                    _this.renderUnits();
                    _this.renderForm();
                });
            },

            todayYMD: function () {
                var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
                return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
            },

            esc: function (s) {
                if (s === null || s === undefined) return '';
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            },

            /* ---------------- 프로젝트 목록 ---------------- */
            loadProjects: function () {
                var _this = this;
                AjaxUtil.getAsyncData('/api/transaction/projectRegistration/read',
                    {
                        spjangcd: this.spjangcd,
                        srchStartDt: '2000-01-01',
                        srchEndDt: '2999-12-31',
                        txtDescription: ''
                    },
                    function (result) {
                        var list = (result && result.data) || [];
                        var html = '<option value="">프로젝트 선택</option>';
                        list.forEach(function (p) {
                            var no = _this.esc(p.projno);
                            var nm = _this.esc(p.projnm);
                            html += '<option value="' + no + '">' + no + ' / ' + nm + '</option>';
                        });
                        $('#projSel').html(html);
                    });
            },

            /* ---------------- 유니트(공정) 목록 ---------------- */
            loadUnits: function (rebuildLine) {
                var _this = this;
                this.selUnit = null;

                if (!this.projNo) {
                    this.units = [];
                    if (rebuildLine) $('#lineSel').html('<option value="">전체</option>');
                    this.renderUnits();
                    this.renderForm();
                    return;
                }

                AjaxUtil.getAsyncData('/api/drawing-manage/units',
                    {
                        spjangcd: this.spjangcd,
                        project_no: this.projNo,
                        line_name: ''      // 라인은 화면에서 필터
                    },
                    function (result) {
                        _this.units = (result && result.data) || [];

                        if (rebuildLine) {
                            var lines = [];
                            _this.units.forEach(function (u) {
                                if (u.line_name && lines.indexOf(u.line_name) < 0) lines.push(u.line_name);
                            });
                            var h = '<option value="">전체</option>';
                            lines.forEach(function (l) {
                                h += '<option value="' + _this.esc(l) + '">' + _this.esc(l) + '</option>';
                            });
                            $('#lineSel').html(h);
                        }

                        _this.renderUnits();
                        _this.renderForm();
                    });
            },

            filteredUnits: function () {
                var _this = this;
                if (!this.lineName) return this.units;
                return this.units.filter(function (u) { return u.line_name === _this.lineName; });
            },

            renderUnits: function () {
                var _this = this;
                var list = this.filteredUnits();
                var $body = $('#unitBody');

                var html = '';
                list.forEach(function (u) {
                    var on = (_this.selUnit && _this.selUnit.suju_id === u.suju_id) ? ' on' : '';
                    var latest = u.latest_version
                        ? '<span class="badge has">' + _this.esc(u.latest_version) + '</span>'
                        : '<span class="badge none">없음</span>';
                    html += '<tr class="unit-row' + on + '" data-suju="' + u.suju_id + '">'
                        + '<td>' + _this.esc(u.line_name) + '</td>'
                        + '<td class="l">' + _this.esc(u.proc_name) + '</td>'
                        + '<td>' + _this.esc(u.unit_qty) + '</td>'
                        + '<td>' + _this.esc(u.equip_type) + '</td>'
                        + '<td>' + latest + '</td>'
                        + '</tr>';
                });

                // 데이터가 없더라도 화면이 비지 않도록 빈 행으로 채움 (최소 10행)
                var fillCount = Math.max(10 - list.length, 0);
                for (var i = 0; i < fillCount; i++) {
                    html += '<tr class="empty-row"><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>';
                }

                $body.html(html);
            },

            selectUnit: function (sujuId) {
                var _this = this;
                this.selUnit = this.units.filter(function (u) {
                    return String(u.suju_id) === String(sujuId);
                })[0] || null;
                this.renderUnits();
                this.renderForm();
            },

            /* ---------------- 우측 폼 ---------------- */
            renderForm: function () {
                var u = this.selUnit;

                if (!u) {
                    $('#targetTag').text('좌측에서 유니트를 선택하세요');
                } else {
                    $('#targetTag').html('<b>' + this.esc(this.projNo) + '</b> · '
                        + this.esc(u.line_name) + ' · ' + this.esc(u.proc_name));
                }

                var targetText = u
                    ? (this.esc(u.line_name) + ' · <b>' + this.esc(u.proc_name) + '</b>'
                        + ' (유니트 ' + this.esc(u.unit_qty) + ' / ' + this.esc(u.equip_type) + ')')
                    : '<span style="color:#99a2b2;">좌측에서 유니트(공정)를 선택하세요</span>';

                var nextVer = 'v' + (this.nextVersionNum(u ? u.latest_version : null));

                $('#formArea').html(
                    '<div class="form-grid">'
                    + '  <label>대상</label>'
                    + '  <div id="targetInfo">' + targetText + '</div>'
                    + '  <label for="fDrawNo">도면번호</label>'
                    + '  <div><input id="fDrawNo" type="text" placeholder="도면번호"></div>'
                    + '  <label for="fVer">버전</label>'
                    + '  <div><input id="fVer" type="text" value="' + nextVer + '" style="max-width:120px;display:inline-block">'
                    + '    <span class="hint">자동 제안값 (수정 가능)</span></div>'
                    + '  <label for="fDate">등록일</label>'
                    + '  <div><input id="fDate" type="date" value="' + this.todayYMD() + '" style="max-width:170px"></div>'
                    + '  <label class="full">도면 파일</label>'
                    + '  <div class="full">'
                    + '    <div class="file-drop" id="fileDrop">클릭하여 도면 파일 첨부 (PDF, DWG, 이미지)</div>'
                    + '    <input id="fileInput" type="file" style="display:none">'
                    + '  </div>'
                    + '  <label class="full">비고</label>'
                    + '  <div class="full"><textarea id="fMemo" placeholder="변경 사유, 특이사항 등"></textarea></div>'
                    + '</div>'
                    + '<div class="form-actions">'
                    + '  <a class="btn" id="btnCancel">초기화</a>'
                    + '  <a class="btn primary y_write_auth" id="btnSaveDrawing">도면 등록</a>'
                    + '</div>'
                    + '<div class="hist-title">도면 이력</div>'
                    + '<table class="work-table">'
                    + '  <colgroup><col style="width:12%"><col style="width:16%"><col style="width:32%"><col style="width:16%"><col style="width:14%"><col style="width:10%"></colgroup>'
                    + '  <thead><tr><th>버전</th><th>도면번호</th><th>파일명</th><th>등록일</th><th>최신</th><th>삭제</th></tr></thead>'
                    + '  <tbody id="histBody"><tr><td colspan="6" class="pick-empty">' 
                    + (u ? '조회 중...' : '유니트를 선택하면 이력이 표시됩니다.') + '</td></tr></tbody>'
                    + '</table>'
                );

                if (u) this.loadHistory(u.suju_id);
            },

            nextVersionNum: function (latestVersion) {
                var n = parseInt(String(latestVersion || '').replace(/[^0-9]/g, ''), 10);
                return (isNaN(n) ? 0 : n) + 1;
            },

            /* ---------------- 이력 ---------------- */
            loadHistory: function (sujuId) {
                var _this = this;
                AjaxUtil.getAsyncData('/api/drawing-manage/history', {suju_id: sujuId},
                    function (result) {
                        var rows = (result && result.data) || [];
                        if (!rows.length) {
                            $('#histBody').html('<tr><td colspan="6" class="pick-empty">등록된 도면이 없습니다.</td></tr>');
                            return;
                        }
                        var html = '';
                        rows.forEach(function (r) {
                            var fileCell = r.file_data_pk
                                ? '<span class="link-dl" data-file="' + r.file_data_pk + '">' + _this.esc(r.file_name) + '</span>'
                                : _this.esc(r.file_name);
                            html += '<tr>'
                                + '<td>' + _this.esc(r.version) + '</td>'
                                + '<td>' + _this.esc(r.drawing_no) + '</td>'
                                + '<td class="l">' + fileCell + '</td>'
                                + '<td>' + _this.esc(r.reg_date) + '</td>'
                                + '<td>' + (r.latest_yn === 'Y' ? '<span class="badge has">최신</span>' : '') + '</td>'
                                + '<td><button type="button" class="btn-mini" data-del="' + r.id + '">삭제</button></td>'
                                + '</tr>';
                        });
                        $('#histBody').html(html);
                    });
            },

            /* ---------------- 저장 ---------------- */
            save: function () {
                var _this = this;
                var u = this.selUnit;
                if (!u) {
                    Alert.alert('', '좌측에서 유니트(공정)를 먼저 선택하세요.');
                    return;
                }

                var fileInput = document.getElementById('fileInput');
                var hasFile = fileInput && fileInput.files && fileInput.files.length > 0;
                if (!hasFile) {
                    Alert.alert('', '도면 파일을 첨부하세요.');
                    return;
                }

                var version = ($('#fVer').val() || '').trim();
                if (!version) {
                    Alert.alert('', '버전을 입력하세요.');
                    return;
                }

                Alert.confirm('', '도면을 등록하시겠습니까?', function () {

                    // 1) 도면 행 저장 (파일 정보 제외) → id 확보
                    var param = {
                        spjangcd: _this.spjangcd,
                        suju_id: u.suju_id,
                        project_no: _this.projNo,
                        line_name: u.line_name || '',
                        unit_code: u.proc_code || u.proc_name || '',
                        process_name: u.proc_name || '',
                        drawing_no: ($('#fDrawNo').val() || '').trim(),
                        version: version,
                        latest_yn: 'Y',
                        reg_date: $('#fDate').val() || _this.todayYMD(),
                        remark: ($('#fMemo').val() || '').trim()
                    };

                    AjaxUtil.postAsyncData('/api/drawing-manage/save', param, function (res) {
                        if (!res || !res.success) {
                            Alert.alert('저장 실패', (res && res.message) || '알 수 없는 오류');
                            return;
                        }

                        var drawingId = res.data && res.data.id;

                        // 2) 파일 업로드 (기존 첨부 시스템 재사용)
                        var fd = new FormData();
                        fd.append('uploadfile', fileInput.files[0]);
                        fd.append('tableName', 'dwg_drawing');
                        fd.append('others', 'dwg_drawing');   // 다운로드 경로와 일치시켜야 함
                        fd.append('attachName', 'drawing');
                        fd.append('DataPk', drawingId);
                        fd.append('onlyOne', 1);

                        var up = AjaxUtil.postFileSyncData('/api/files/upload', fd);
                        if (!up || !up.success) {
                            Alert.alert('업로드 실패', (up && up.message) || '파일 업로드에 실패했습니다.');
                            return;
                        }

                        // 3) 파일 정보 반영 (2차 저장)
                        param.id = drawingId;
                        param.file_data_pk = up.fileId;
                        param.file_name = up.fileNm;

                        AjaxUtil.postAsyncData('/api/drawing-manage/save', param, function (res2) {
                            if (res2 && res2.success) {
                                Notify.success('도면이 등록되었습니다.');
                                _this.loadUnits(false);
                            } else {
                                Alert.alert('저장 실패', (res2 && res2.message) || '알 수 없는 오류');
                            }
                        });
                    });
                });
            },

            /* ---------------- 삭제 ---------------- */
            remove: function (id) {
                var _this = this;
                Alert.confirm('', '해당 도면을 삭제하시겠습니까?', function () {
                    AjaxUtil.postJsonData('/api/drawing-manage/delete', {id: id}, function (res) {
                        if (res && res.success) {
                            Notify.success('삭제되었습니다.');
                            _this.loadUnits(false);
                        } else {
                            Alert.alert('삭제 실패', (res && res.message) || '알 수 없는 오류');
                        }
                    });
                });
            },

            download: function (fileId) {
                var a = document.createElement('a');
                a.href = '/api/files/download?file_id=' + fileId;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        };

        $(document).ready(function () {
            dm.init();

            // 유니트 행 선택
            $(document).on('click', '.unit-row', function () {
                dm.selectUnit($(this).data('suju'));
            });

            // 파일 선택
            $(document).on('click', '#fileDrop', function () {
                $('#fileInput').click();
            });
            $(document).on('change', '#fileInput', function () {
                var f = this.files && this.files[0];
                if (f) $('#fileDrop').addClass('has').text(f.name);
            });

            // 버튼
            $(document).on('click', '#btnSaveDrawing', function () { dm.save(); });
            $(document).on('click', '#btnCancel', function () {
                dm.selUnit = null;
                dm.renderUnits();
                dm.renderForm();
            });

            // 이력 - 다운로드 / 삭제
            $(document).on('click', '.link-dl', function () { dm.download($(this).data('file')); });
            $(document).on('click', '[data-del]', function () { dm.remove($(this).data('del')); });
        });
    </script>
</th:block>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
