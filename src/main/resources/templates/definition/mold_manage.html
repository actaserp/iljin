<html layout:decorate="~{layout_page}">
<head>
  <style>
    .srch-bar { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #d7dde7; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .srch-bar label { font-weight: 700; color: #445; font-size: 12.5px; }
    .srch-bar input, .srch-bar select { border: 1px solid #cfd6e2; border-radius: 5px; font-size: 12.5px; padding: 5px 8px; }
    .srch-bar input { min-width: 200px; }

    .row2 { display: flex; gap: 8px; align-items: flex-start; }
    .row2 > .section.left { flex: 0 0 520px; }
    .row2 > .section.right { flex: 1 1 auto; min-width: 0; }

    table.work-table { width: 100%; border-collapse: collapse; }
    table.work-table th, table.work-table td { border: 1px solid #d7dde7; padding: 6px 7px; font-size: 12.5px; text-align: center; }
    table.work-table th { background: #eef2f8; color: #445; font-weight: 700; }
    table.work-table td.l { text-align: left; }

    .mold-row { cursor: pointer; }
    .mold-row.on { background: #eaf1ff; }
    .mold-row.on td { font-weight: 700; }
    .empty-row td { color: #c9cfd8; height: 30px; }

    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .badge.using { background: #e3f3ea; color: #1f8f53; }
    .badge.repair { background: #fff3e0; color: #c47f17; }
    .badge.scrap { background: #eef0f3; color: #888; }

    .form-grid { display: grid; grid-template-columns: 100px 1fr 100px 1fr; gap: 10px 12px; align-items: center; }
    .form-grid label { font-weight: 700; color: #445; font-size: 12.5px; }
    .form-grid input, .form-grid textarea, .form-grid select { border: 1px solid #cfd6e2; border-radius: 5px; padding: 7px 9px; font-size: 12.5px; width: 100%; box-sizing: border-box; font-family: inherit; }
    .form-grid textarea { resize: vertical; min-height: 55px; }
    .form-grid .full { grid-column: 2 / -1; }
    .form-grid .fullrow { grid-column: 1 / -1; }

    .file-drop { border: 1.5px dashed #b9c4d6; border-radius: 8px; padding: 14px; text-align: center; color: #6f7d92; background: #f8fafd; cursor: pointer; font-size: 12.5px; }
    .file-drop.has { border-color: #2b5fc4; background: #eef4ff; color: #2b5fc4; font-weight: 700; }
    .cur-file { font-size: 12px; margin-top: 5px; }
    .link-dl { color: #2b5fc4; cursor: pointer; text-decoration: underline; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .pick-empty { color: #99a2b2; font-size: 12.5px; padding: 30px 10px; text-align: center; }
  </style>
</head>
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>금형 관리</h2>
        <a title="북마크" class="bookmark toggle">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>기준정보</li>
        <li>금형 관리</li>
      </ul>
    </div>

    <div class="srch-bar">
      <label for="txtKeyword">검색</label>
      <input type="text" id="txtKeyword" placeholder="금형번호 / 금형명">
      <label for="selStatus">상태</label>
      <select id="selStatus">
        <option value="">전체</option>
        <option value="USING">사용중</option>
        <option value="REPAIR">수리중</option>
        <option value="SCRAP">폐기</option>
      </select>
      <a class="btn" id="btnSearch">검색</a>
    </div>

    <div class="row2">
      <!-- 좌: 금형 목록 -->
      <section class="section left">
        <div class="section-top"><h3>금형 목록</h3></div>
        <div class="container-fluid" style="padding:0;">
          <table class="work-table">
            <colgroup>
              <col style="width:22%"><col style="width:34%"><col style="width:22%"><col style="width:22%">
            </colgroup>
            <thead>
            <tr><th>금형번호</th><th>금형명</th><th>보관위치</th><th>상태</th></tr>
            </thead>
            <tbody id="moldBody"></tbody>
          </table>
        </div>
      </section>

      <!-- 우: 등록/수정 -->
      <section class="section right">
        <div class="section-top">
          <h3>금형 정보</h3>
          <span>
            <a class="btn" id="btnNew">신규등록</a>
            <a class="btn primary y_write_auth" id="btnSave">저장</a>
            <a class="btn y_write_auth" id="btnDel">삭제</a>
          </span>
        </div>
        <div class="container-fluid">
          <form id="moldForm">
            <input type="hidden" id="id">
            <input type="hidden" id="company_id">
            <input type="hidden" id="file_data_pk">

            <div class="form-grid">
              <label for="mold_code">금형번호 *</label>
              <div><input type="text" id="mold_code" placeholder="금형번호"></div>
              <label for="mold_name">금형명</label>
              <div><input type="text" id="mold_name" placeholder="금형명"></div>

              <label for="standard">규격</label>
              <div><input type="text" id="standard"></div>
              <label for="material">재질</label>
              <div><input type="text" id="material"></div>

              <label for="company_name">제작업체</label>
              <div><input type="text" id="company_name" placeholder="클릭하여 선택" readonly></div>
              <label for="make_date">제작일</label>
              <div><input type="date" id="make_date"></div>

              <label for="location">보관위치</label>
              <div><input type="text" id="location"></div>
              <label for="status">상태</label>
              <div>
                <select id="status">
                  <option value="USING">사용중</option>
                  <option value="REPAIR">수리중</option>
                  <option value="SCRAP">폐기</option>
                </select>
              </div>

              <label>첨부파일</label>
              <div class="full">
                <div class="file-drop" id="fileDrop">클릭하여 파일 첨부 (도면 / 사진)</div>
                <input id="fileInput" type="file" style="display:none">
                <div class="cur-file" id="curFile"></div>
              </div>

              <label for="remark">비고</label>
              <div class="full"><textarea id="remark"></textarea></div>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <th:block th:replace="/common/popup_company_purchase :: popup_company_Purchase"></th:block>

  <script type="text/javascript">

    var mm = {
      spjangcd: null,
      list: [],
      selId: null,

      init: function () {
        this.spjangcd = sessionStorage.getItem('spjangcd');
        this.search();
      },

      esc: function (s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      },

      /* ---------- 목록 ---------- */
      search: function () {
        var _this = this;
        AjaxUtil.getAsyncData('/api/mold-manage/read',
                {
                  spjangcd: this.spjangcd,
                  keyword: $('#txtKeyword').val(),
                  status: $('#selStatus').val()
                },
                function (result) {
                  _this.list = (result && result.data) || [];
                  _this.render();
                });
      },

      render: function () {
        var _this = this;
        var $body = $('#moldBody');

        var html = '';
        this.list.forEach(function (m) {
          var on = (String(_this.selId) === String(m.id)) ? ' on' : '';
          var cls = m.status === 'USING' ? 'using' : (m.status === 'REPAIR' ? 'repair' : 'scrap');
          html += '<tr class="mold-row' + on + '" data-id="' + m.id + '">'
                  + '<td>' + _this.esc(m.mold_code) + '</td>'
                  + '<td class="l">' + _this.esc(m.mold_name) + '</td>'
                  + '<td>' + _this.esc(m.location) + '</td>'
                  + '<td><span class="badge ' + cls + '">' + _this.esc(m.status_name) + '</span></td>'
                  + '</tr>';
        });

        // 데이터가 없더라도 화면이 비지 않도록 빈 행으로 채움 (최소 10행)
        var fillCount = Math.max(10 - this.list.length, 0);
        for (var i = 0; i < fillCount; i++) {
          html += '<tr class="empty-row"><td>&nbsp;</td><td></td><td></td><td></td></tr>';
        }

        $body.html(html);
      },

      /* ---------- 선택 / 바인딩 ---------- */
      select: function (id) {
        var _this = this;
        var m = this.list.filter(function (x) { return String(x.id) === String(id); })[0];
        if (!m) return;

        this.selId = m.id;

        $('#id').val(m.id);
        $('#mold_code').val(m.mold_code || '');
        $('#mold_name').val(m.mold_name || '');
        $('#standard').val(m.standard || '');
        $('#material').val(m.material || '');
        $('#company_id').val(m.company_id || '');
        $('#company_name').val(m.company_name || '');
        $('#make_date').val(m.make_date || '');
        $('#location').val(m.location || '');
        $('#status').val(m.status || 'USING');
        $('#remark').val(m.remark || '');
        $('#file_data_pk').val(m.file_data_pk || '');

        this.resetFileBox(m.file_data_pk, m.file_name);
        this.render();
      },

      resetFileBox: function (fileDataPk, fileName) {
        $('#fileInput').val('');
        $('#fileDrop').removeClass('has').text('클릭하여 파일 첨부 (도면 / 사진)');
        if (fileDataPk) {
          $('#curFile').html('현재 파일 : <span class="link-dl" data-file="' + fileDataPk + '">'
                  + this.esc(fileName) + '</span>');
        } else {
          $('#curFile').html('');
        }
      },

      reset: function () {
        this.selId = null;
        $('#moldForm')[0].reset();
        $('#id').val('');
        $('#company_id').val('');
        $('#file_data_pk').val('');
        this.resetFileBox(null, null);
        this.render();
      },

      /* ---------- 저장 ---------- */
      save: function () {
        var _this = this;

        if (!$('#mold_code').val().trim()) {
          Alert.alert('', '금형번호를 입력하세요.');
          return;
        }

        Alert.confirm('', '저장하시겠습니까?', function () {

          var param = {
            id: $('#id').val(),
            spjangcd: _this.spjangcd,
            mold_code: $('#mold_code').val().trim(),
            mold_name: $('#mold_name').val().trim(),
            standard: $('#standard').val().trim(),
            material: $('#material').val().trim(),
            company_id: $('#company_id').val(),
            company_name: $('#company_name').val().trim(),
            make_date: $('#make_date').val(),
            location: $('#location').val().trim(),
            status: $('#status').val(),
            remark: $('#remark').val().trim()
          };

          AjaxUtil.postAsyncData('/api/mold-manage/save', param, function (res) {
            if (!res || !res.success) {
              Alert.alert('저장 실패', (res && res.message) || '알 수 없는 오류');
              return;
            }

            var moldId = res.data && res.data.id;
            var fileInput = document.getElementById('fileInput');
            var hasNewFile = fileInput && fileInput.files && fileInput.files.length > 0;

            if (!hasNewFile) {
              Notify.success('저장되었습니다.');
              _this.search();
              return;
            }

            // 파일 업로드 후 파일정보 반영
            var fd = new FormData();
            fd.append('uploadfile', fileInput.files[0]);
            fd.append('tableName', 'mld_mold');
            fd.append('others', 'mld_mold');   // 다운로드 경로와 일치해야 함
            fd.append('attachName', 'mold');
            fd.append('DataPk', moldId);
            // onlyOne 미사용 : 버전별로 파일을 각각 보존

            var up = AjaxUtil.postFileSyncData('/api/files/upload', fd);
            if (!up || !up.success) {
              Alert.alert('업로드 실패', (up && up.message) || '파일 업로드에 실패했습니다.');
              return;
            }

            param.id = moldId;
            param.file_data_pk = up.fileId;
            param.file_name = up.fileNm;

            AjaxUtil.postAsyncData('/api/mold-manage/save', param, function (res2) {
              if (res2 && res2.success) {
                Notify.success('저장되었습니다.');
                _this.search();
              } else {
                Alert.alert('저장 실패', (res2 && res2.message) || '알 수 없는 오류');
              }
            });
          });
        });
      },

      /* ---------- 삭제 ---------- */
      remove: function () {
        var _this = this;
        var id = $('#id').val();
        if (!id) {
          Alert.alert('', '삭제할 금형을 선택하세요.');
          return;
        }
        Alert.confirm('', '삭제하시겠습니까?', function () {
          AjaxUtil.postJsonData('/api/mold-manage/delete', {id: id}, function (res) {
            if (res && res.success) {
              Notify.success('삭제되었습니다.');
              _this.reset();
              _this.search();
            } else {
              Alert.alert('삭제 실패', (res && res.message) || '알 수 없는 오류');
            }
          });
        });
      },

      download: function (fileId) {
        var a = document.createElement('a');
        a.href = '/api/files/download?file_id=' + fileId;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    };

    $(document).ready(function () {
      mm.init();

      $('#btnSearch').click(function () { mm.search(); });
      $('#txtKeyword').on('keypress', function (e) {
        if (e.keyCode === 13) mm.search();
      });
      $('#selStatus').on('change', function () { mm.search(); });

      $(document).on('click', '.mold-row', function () { mm.select($(this).data('id')); });

      $('#btnNew').click(function () { mm.reset(); });
      $('#btnSave').click(function () { mm.save(); });
      $('#btnDel').click(function () { mm.remove(); });

      // 파일 선택
      $('#fileDrop').click(function () { $('#fileInput').click(); });
      $('#fileInput').on('change', function () {
        var f = this.files && this.files[0];
        if (f) $('#fileDrop').addClass('has').text(f.name);
      });
      $(document).on('click', '.link-dl', function () { mm.download($(this).data('file')); });

      // 제작업체 선택 팝업
      $('#company_name').click(function () {
        var pop = new PopCompComponentPurchase();
        pop.show(function (item) {
          $('#company_name').val(item.compname);
          $('#company_id').val(item.id);
        });
      });
    });
  </script>
</th:block>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
