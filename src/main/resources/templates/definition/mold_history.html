<html layout:decorate="~{layout_page}">
<head>
  <style>
    .srch-bar { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #d7dde7; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .srch-bar label { font-weight: 700; color: #445; font-size: 12.5px; }
    .srch-bar input, .srch-bar select { border: 1px solid #cfd6e2; border-radius: 5px; font-size: 12.5px; padding: 5px 8px; }
    .srch-bar input { min-width: 200px; }

    .row2 { display: flex; gap: 8px; align-items: flex-start; }
    .row2 > .section.left { flex: 0 0 480px; }
    .row2 > .section.right { flex: 1 1 auto; min-width: 0; }

    table.work-table { width: 100%; border-collapse: collapse; }
    table.work-table th, table.work-table td { border: 1px solid #d7dde7; padding: 6px 7px; font-size: 12.5px; text-align: center; }
    table.work-table th { background: #eef2f8; color: #445; font-weight: 700; }
    table.work-table td.l { text-align: left; }

    .mold-row { cursor: pointer; }
    .mold-row.on { background: #eaf1ff; }
    .mold-row.on td { font-weight: 700; }
    .empty-row td { color: #c9cfd8; height: 30px; }

    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .badge.using { background: #e3f3ea; color: #1f8f53; }
    .badge.repair { background: #fff3e0; color: #c47f17; }
    .badge.scrap { background: #eef0f3; color: #888; }
    .badge.latest { background: #2b5fc4; color: #fff; margin-left: 4px; }

    .hist-file { color: #2b5fc4; font-weight: 600; cursor: pointer; text-decoration: underline; }
    .memo-cell { text-align: left; color: #555; }
    .pick-empty { color: #99a2b2; font-size: 12.5px; padding: 34px 10px; text-align: center; }
    .hist-head { font-size: 12.5px; color: #445; }
    .hist-head b { color: #2b5fc4; }
  </style>
</head>
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>금형 이력 관리</h2>
        <a title="북마크" class="bookmark toggle">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>기준정보</li>
        <li>금형 이력 관리</li>
      </ul>
    </div>

    <div class="srch-bar">
      <label for="txtKeyword">검색</label>
      <input type="text" id="txtKeyword" placeholder="금형번호 / 금형명">
      <label for="selStatus">상태</label>
      <select id="selStatus">
        <option value="">전체</option>
        <option value="USING">사용중</option>
        <option value="REPAIR">수리중</option>
        <option value="SCRAP">폐기</option>
      </select>
      <a class="btn" id="btnSearch">검색</a>
    </div>

    <div class="row2">
      <!-- 좌: 금형 목록 -->
      <section class="section left">
        <div class="section-top"><h3>금형 목록</h3></div>
        <div class="container-fluid" style="padding:0;">
          <table class="work-table">
            <colgroup>
              <col style="width:24%"><col style="width:38%"><col style="width:20%"><col style="width:18%">
            </colgroup>
            <thead>
            <tr><th>금형번호</th><th>금형명</th><th>보관위치</th><th>상태</th></tr>
            </thead>
            <tbody id="moldBody"></tbody>
          </table>
        </div>
      </section>

      <!-- 우: 버전 이력 -->
      <section class="section right">
        <div class="section-top">
          <h3>버전 이력</h3>
          <span class="hist-head" id="histHead">금형을 선택하세요</span>
        </div>
        <div class="container-fluid" style="padding:0;">
          <table class="work-table">
            <colgroup>
              <col style="width:16%"><col style="width:52%"><col style="width:32%">
            </colgroup>
            <thead>
            <tr><th>버전</th><th>파일</th><th>등록일</th></tr>
            </thead>
            <tbody id="histBody">
            <tr><td colspan="3" class="pick-empty">왼쪽에서 금형을 선택하면 버전 이력이 표시됩니다.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">

    var mh = {
      spjangcd: null,
      list: [],
      selMold: null,

      init: function () {
        this.spjangcd = sessionStorage.getItem('spjangcd');
        this.search();
      },

      esc: function (s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      },

      /* ---------- 금형 목록 ---------- */
      search: function () {
        var _this = this;
        AjaxUtil.getAsyncData('/api/mold-manage/read',
                {
                  spjangcd: this.spjangcd,
                  keyword: $('#txtKeyword').val(),
                  status: $('#selStatus').val()
                },
                function (result) {
                  _this.list = (result && result.data) || [];
                  _this.selMold = null;
                  _this.render();
                  _this.renderHist();
                });
      },

      render: function () {
        var _this = this;
        var $body = $('#moldBody');

        var html = '';
        this.list.forEach(function (m) {
          var on = (_this.selMold && String(_this.selMold.id) === String(m.id)) ? ' on' : '';
          var cls = m.status === 'USING' ? 'using' : (m.status === 'REPAIR' ? 'repair' : 'scrap');
          html += '<tr class="mold-row' + on + '" data-id="' + m.id + '">'
                  + '<td>' + _this.esc(m.mold_code) + '</td>'
                  + '<td class="l">' + _this.esc(m.mold_name) + '</td>'
                  + '<td>' + _this.esc(m.location) + '</td>'
                  + '<td><span class="badge ' + cls + '">' + _this.esc(m.status_name) + '</span></td>'
                  + '</tr>';
        });

        // 데이터가 없더라도 화면이 비지 않도록 빈 행으로 채움 (최소 10행)
        var fillCount = Math.max(10 - this.list.length, 0);
        for (var i = 0; i < fillCount; i++) {
          html += '<tr class="empty-row"><td>&nbsp;</td><td></td><td></td><td></td></tr>';
        }

        $body.html(html);
      },

      select: function (id) {
        this.selMold = this.list.filter(function (m) {
          return String(m.id) === String(id);
        })[0] || null;
        this.render();
        this.renderHist();
      },

      /* ---------- 버전 이력 ---------- */
      renderHist: function () {
        var _this = this;
        var m = this.selMold;

        var fillEmpty = function (msg) {
          var html = '';
          if (msg) html += '<tr><td colspan="3" class="pick-empty">' + msg + '</td></tr>';
          var start = msg ? 1 : 0;
          for (var i = start; i < 10; i++) {
            html += '<tr class="empty-row"><td>&nbsp;</td><td></td><td></td></tr>';
          }
          $('#histBody').html(html);
        };

        if (!m) {
          $('#histHead').text('좌측에서 금형을 선택하세요');
          fillEmpty('왼쪽에서 금형을 선택하면 버전 이력이 표시됩니다.');
          return;
        }

        $('#histHead').html('<b>' + this.esc(m.mold_code) + '</b> · ' + this.esc(m.mold_name));
        fillEmpty('조회 중...');

        AjaxUtil.getAsyncData('/api/mold-manage/history', {mold_id: m.id},
                function (result) {
                  var rows = (result && result.data) || [];
                  if (!rows.length) {
                    fillEmpty('등록된 이력이 없습니다.');
                    return;
                  }
                  var html = '';
                  rows.forEach(function (r, idx) {
                    var latest = (idx === 0) ? '<span class="badge latest">최신</span>' : '';
                    var fileCell = r.file_data_pk
                            ? '<span class="hist-file" data-file="' + r.file_data_pk + '">'
                              + _this.esc(r.file_name) + '</span>'
                            : (_this.esc(r.file_name) || '-');
                    html += '<tr>'
                            + '<td>v' + _this.esc(r.version) + latest + '</td>'
                            + '<td class="l">' + fileCell + '</td>'
                            + '<td>' + _this.esc(r.reg_date) + '</td>'
                            + '</tr>';
                  });
                  for (var i = rows.length; i < 10; i++) {
                    html += '<tr class="empty-row"><td>&nbsp;</td><td></td><td></td></tr>';
                  }
                  $('#histBody').html(html);
                });
      },

      download: function (fileId) {
        var a = document.createElement('a');
        a.href = '/api/files/download?file_id=' + fileId;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    };

    $(document).ready(function () {
      mh.init();

      $('#btnSearch').click(function () { mh.search(); });
      $('#txtKeyword').on('keypress', function (e) {
        if (e.keyCode === 13) mh.search();
      });
      $('#selStatus').on('change', function () { mh.search(); });

      $(document).on('click', '.mold-row', function () { mh.select($(this).data('id')); });
      $(document).on('click', '.hist-file', function () { mh.download($(this).data('file')); });
    });
  </script>
</th:block>
</html>
