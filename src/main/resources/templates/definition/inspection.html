<!DOCTYPE html>
<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수입검사기준서</title>
    <style>
        .wj-header { text-align: center !important; }

        /* 검사항목 그리드 셀 입력 공통 */
        .insp-input {
            width: 100%;
            padding: 3px 5px;
            border: 1px solid #ccc;
            font-size: 12px;
            box-sizing: border-box;
        }
        .insp-input:focus { outline: none; border-color: #4a90d9; }
        .insp-num { text-align: right; }

        /* 검사항목 번호 셀 */
        .item-seq-cell {
            text-align: center;
            font-weight: bold;
            vertical-align: middle;
            background: #f7f8fa;
        }
        /* 행 삭제 버튼 */
        .btn-row-del {
            font-size: 11px; padding: 2px 6px;
            border: 1px solid #e0a0a0; background: #fff; color: #c00;
            cursor: pointer; border-radius: 2px;
        }
        .btn-row-del:hover { background: #fff0f0; }

        .work-textarea {
            width: 100%; resize: vertical;
            padding: 4px 6px;
            border: 1px solid #ccc;
            font-size: 12px;
            font-family: 'Malgun Gothic', sans-serif;
            line-height: 1.5;
        }
        .work-textarea:focus { outline: none; border-color: #4a90d9; }
    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">

        <!-- 페이지 타이틀 -->
        <div class="page-title-wrap">
            <div class="left">
                <h2>수입검사기준서</h2>
                <a title="북마크" class="bookmark toggle">내메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img src="/images/icon/ico-nav-home.svg" alt="홈아이콘"></li>
                <li>품질관리</li>
                <li>수입검사기준서</li>
            </ul>
        </div>

        <div style="display: flex; gap: 5px">

            <!-- ① 좌측: 목록 그리드 -->
            <section class="section" style="width: 35%;">
                <div class="section-top">
                    <div class="search-wrap">
                        <dl>
                            <dt><label>품목명</label></dt>
                            <dd>
                                <div class="srch-box">
                                    <input type="text" id="txtItemName" name="txtItemName" class="form-control2"/>
                                </div>
                            </dd>
                        </dl>
                        <dl>
                            <dt><span class="eq"></span></dt>
                            <dd>
                                <li>
                                    <a class="btn btn-delete" title="검색" id="btnSearch">
                                        <img src="/images/icon/btn-srch.svg" alt="검색 아이콘">검색
                                    </a>
                                </li>
                            </dd>
                        </dl>
                    </div>
                </div>
                <div class="container-fluid">
                    <div id="theGrid"></div>
                </div>
            </section>

            <!-- ② 우측: 등록/수정 폼 -->
            <section style="width: 65%;">
                <div class="section-top">
                    <div class="search-wrap">
                        <ul>
                            <li>
                                <button type="button" class="btn-excellt btn-default" id="btnNew" name="btnNew"
                                        style="height: 36px; width:115px;">
                                    <i class="fas fa-plus"></i>신규등록
                                </button>
                            </li>
                            <li>
                                <button type="button" class="btn-excellt btn-default y_write_auth" id="btnSave"
                                        style="float:none; height: 36px; width:115px;">
                                    <i class="fas fa-save"></i>저장
                                </button>
                            </li>
                            <li>
                                <button type="button" class="btn-delete btn-danger y_write_auth" id="btnDel"
                                        style="float:none; height: 36px; width:115px;" disabled>
                                    <i class="fas fa-trash"></i>삭제
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="table-wrap" style="overflow-x: auto; max-height: calc(100vh - 200px); overflow-y: auto;">
                    <form id="inspForm">
                        <input type="hidden" id="id" name="id"/>
                        <input type="hidden" id="item_code" name="item_code"/>

                        <!-- 기본 정보 -->
                        <table class="write-table" id="detail_box">
                            <caption style="text-align: left; margin-bottom: 8px;">기준서 정보</caption>
                            <colgroup>
                                <col class="wp15">
                                <col class="wp35">
                                <col class="wp15">
                                <col class="wp35">
                            </colgroup>
                            <tbody>
                            <tr>
                                <th><label for="item_name"><span class="eq">*</span>품목명</label></th>
                                <td>
                                    <input type="text" id="item_name" name="item_name" style="width:100%;"
                                           placeholder="클릭하여 품목 선택" readonly>
                                </td>
                                <th><label for="supplier">협력사</label></th>
                                <td>
                                    <input type="hidden" id="supplier_code" name="supplier_code"/>
                                    <input type="text" id="supplier" name="supplier" style="width:100%;"
                                           placeholder="클릭하여 협력사 선택" readonly>
                                </td>
                            </tr>
                            <tr>
                                <th><label for="drawing_no">도면번호</label></th>
                                <td><input type="text" id="drawing_no" name="drawing_no" style="width:100%;"></td>
                                <th><label for="rev_no">개정번호(Rev)</label></th>
                                <td><input type="text" id="rev_no" name="rev_no" style="width:100%;"></td>
                            </tr>
                            <tr>
                                <th><label for="inspect_type">검사구분</label></th>
                                <td>
                                    <select id="inspect_type" name="inspect_type" style="width:100%;">
                                        <option value="SAMPLING">샘플링검사</option>
                                        <option value="FULL">전수검사</option>
                                    </select>
                                </td>
                                <th><label for="aql">AQL</label></th>
                                <td><input type="text" id="aql" name="aql" style="width:100%;" placeholder="예) 1.0"></td>
                            </tr>
                            <tr>
                                <th><label for="issue_date">제정일자</label></th>
                                <td><input type="date" id="issue_date" name="issue_date" style="width:100%;"></td>
                                <th><label for="rev_date">개정일자</label></th>
                                <td><input type="date" id="rev_date" name="rev_date" style="width:100%;"></td>
                            </tr>
                            </tbody>
                        </table>

                        <!-- 검사 항목 -->
                        <table class="write-table" style="margin-top: 10px;">
                            <caption style="text-align: left; margin-bottom: 8px; display:flex; justify-content:space-between; align-items:center;">
                                <span>검사 항목</span>
                                <button type="button" class="btn-excellt btn-default" id="btnAddItem"
                                        style="height: 28px; width: 90px; font-size: 12px;">
                                    <i class="fas fa-plus"></i> 행 추가
                                </button>
                            </caption>
                            <colgroup>
                                <col style="width: 5%">
                                <col style="width: 17%">
                                <col style="width: 10%">
                                <col style="width: 10%">
                                <col style="width: 10%">
                                <col style="width: 8%">
                                <col style="width: 8%">
                                <col style="width: 15%">
                                <col style="width: 12%">
                                <col style="width: 5%">
                            </colgroup>
                            <thead>
                            <tr>
                                <th style="text-align:center;">No.</th>
                                <th style="text-align:center;">검사항목</th>
                                <th style="text-align:center;">기준값</th>
                                <th style="text-align:center;">규격상한</th>
                                <th style="text-align:center;">규격하한</th>
                                <th style="text-align:center;">단위</th>
                                <th style="text-align:center;">시료수</th>
                                <th style="text-align:center;">검사방법/계측기</th>
                                <th style="text-align:center;">판정기준</th>
                                <th style="text-align:center;">삭제</th>
                            </tr>
                            </thead>
                            <tbody id="inspItemsBody">
                            <!-- JS 렌더링 -->
                            </tbody>
                        </table>

                        <!-- 비고 -->
                        <table class="write-table" style="margin-top: 10px;">
                            <colgroup>
                                <col class="wp15">
                                <col>
                            </colgroup>
                            <tbody>
                            <tr>
                                <th><label for="remarks">비고</label></th>
                                <td>
                                    <textarea id="remarks" name="remarks" rows="3" class="work-textarea"
                                              placeholder="※ 부적합품 발생 시 조치 요령 등"></textarea>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                    </form>
                </div>
            </section>

        </div>
    </div>

    <footer style="margin-top: 24px;">
        <p>Copyrightⓒ 0000 corp. All rights reserved.</p>
    </footer>
</th:block>

<th:block layout:fragment="scripts">
    <th:block th:replace="/common/approve_box :: approve_box"></th:block>
    <th:block th:replace="/common/multiform_material :: multiform_material"></th:block>
    <th:block th:replace="/common/popup_company_purchase :: popup_company_Purchase"></th:block>

    <script type="text/javascript">

        var theGrid;
        var viewdata;
        var itemSeq = 0; // 검사항목 행 번호 시퀀스

        let columns = [
            {binding: 'id',        header: '번호',    width: 60,  align: 'center'},
            {binding: 'item_name', header: '품목명',   width: '*', align: 'left'},
            {binding: 'supplier',  header: '협력사',   width: 140, align: 'center'},
        ];

        document.readyState === 'complete' ? init() : window.onload = init;

        function init() {
            let data2 = [];

            $.ajax({
                url: '/api/incoming-inspection/read',
                type: 'GET',
                data: {
                    item_name: $('#txtItemName').val(),
                    spjangcd: sessionStorage.getItem('spjangcd'),
                },
                async: false,
                success: function(data) { data2 = data.data; },
                error: function(jqXHR, textStatus, errorThrown) {
                    console.error('Error fetching inspection list:', textStatus, errorThrown);
                }
            });

            viewdata = new wijmo.collections.CollectionView(data2);

            theGrid = new wijmo.grid.FlexGrid('#theGrid', {
                autoGenerateColumns: false,
                showMarquee: true,
                columns: columns,
                isReadOnly: true,
                itemsSource: viewdata
            });

            theGrid.hostElement.addEventListener('dblclick', function() {
                let selectedItem = theGrid.selectedItems[0];
                if (!selectedItem) return;
                bindFormData(selectedItem);
                setButtonState();
            });

            theGrid.rowHeaders.columns.splice(0, 1);

            renderInspItems([]); // 빈 행 1개로 시작
            setButtonState();
        }

        /* 폼 데이터 바인딩 */
        function bindFormData(item) {
            $.ajax({
                url: '/api/incoming-inspection/detail',
                type: 'GET',
                data: { id: item.id },
                async: false,
                success: function(result) {
                    var d = result.data;
                    if (!d) return;

                    $('#id').val(d.id);
                    $('#item_code').val(d.item_code || '');
                    $('#item_name').val(d.item_name || '');
                    $('#supplier').val(d.supplier || '');
                    $('#supplier_code').val(d.supplier_code || '');
                    $('#drawing_no').val(d.drawing_no || '');
                    $('#rev_no').val(d.rev_no || '');
                    $('#inspect_type').val(d.inspect_type || 'SAMPLING');
                    $('#aql').val(d.aql || '');
                    $('#issue_date').val(d.issue_date ? d.issue_date.substring(0, 10) : '');
                    $('#rev_date').val(d.rev_date   ? d.rev_date.substring(0, 10)   : '');
                    $('#remarks').val(d.remarks || '');

                    // 검사항목 목록 렌더링
                    renderInspItems(d.items || []);
                },
                error: function() {
                    console.error('상세 조회 실패');
                }
            });
        }

        /* 버튼 상태 */
        function setButtonState() {
            var pk = $('#id').val();
            $('#btnNew').prop('disabled', false);
            $('#btnSave').prop('disabled', false);
            $('#btnDel').prop('disabled', !pk);
        }

        /* 검색 */
        function searchMainData() {
            $.ajax({
                url: '/api/incoming-inspection/read',
                type: 'GET',
                data: {
                    item_name: $('#txtItemName').val(),
                    spjangcd: sessionStorage.getItem('spjangcd'),
                },
                success: function(result) {
                    if (result.success) {
                        viewdata = new wijmo.collections.CollectionView(result.data);
                        theGrid.itemsSource = viewdata;
                        theGrid.refresh();
                    } else {
                        console.log('Error occurred');
                    }
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    console.error('Error fetching inspection list:', textStatus, errorThrown);
                }
            });
            resetForm();
        }

        /* 폼 초기화 */
        function resetForm() {
            $('#inspForm')[0].reset();
            $('#id').val('');
            $('#item_code').val('');
            $('#supplier_code').val('');
            renderInspItems([]);
            setButtonState();
        }

        /* ===== 검사항목 행 처리 ===== */
        function renderInspItems(items) {
            $('#inspItemsBody').empty();
            itemSeq = 0;
            if (!items || items.length === 0) {
                addInspRow();               // 최소 1행
            } else {
                items.forEach(function(it) { addInspRow(it); });
            }
        }

        function addInspRow(it) {
            it = it || {};
            itemSeq++;
            var idx = itemSeq;
            var row =
                '<tr id="insp-row-' + idx + '">' +
                '<td class="item-seq-cell seq-no">' + idx + '</td>' +
                '<td><input type="text"   class="insp-input" data-field="measure_name"        value="' + (it.measure_name || '') + '"></td>' +
                '<td><input type="number" class="insp-input insp-num" data-field="target_value" value="' + (it.target_value != null ? it.target_value : '') + '"></td>' +
                '<td><input type="number" class="insp-input insp-num" data-field="usl"          value="' + (it.usl != null ? it.usl : '') + '"></td>' +
                '<td><input type="number" class="insp-input insp-num" data-field="lsl"          value="' + (it.lsl != null ? it.lsl : '') + '"></td>' +
                '<td><input type="text"   class="insp-input" data-field="unit_name"           value="' + (it.unit_name || '') + '"></td>' +
                '<td><input type="number" class="insp-input insp-num" data-field="sample_size"  value="' + (it.sample_size != null ? it.sample_size : '') + '"></td>' +
                '<td><input type="text"   class="insp-input" data-field="inspect_method"       value="' + (it.inspect_method || '') + '"></td>' +
                '<td><input type="text"   class="insp-input" data-field="judge_criteria"       value="' + (it.judge_criteria || '') + '"></td>' +
                '<td style="text-align:center;"><button type="button" class="btn-row-del" onclick="removeInspRow(this)"><i class="fas fa-times"></i></button></td>' +
                '</tr>';
            $('#inspItemsBody').append(row);
        }

        function removeInspRow(btn) {
            $(btn).closest('tr').remove();
            // No. 재정렬
            $('#inspItemsBody tr').each(function(i) {
                $(this).find('.seq-no').text(i + 1);
            });
        }

        /* 화면의 검사항목 행 → 배열 */
        function collectInspItems() {
            var items = [];
            $('#inspItemsBody tr').each(function() {
                var $tr = $(this);
                var obj = {};
                var hasValue = false;
                $tr.find('.insp-input').each(function() {
                    var field = $(this).data('field');
                    var val = $(this).val();
                    obj[field] = val;
                    if (val !== '' && val != null) hasValue = true;
                });
                if (hasValue) items.push(obj); // 완전 빈 행은 제외
            });
            return items;
        }

        /* 저장 */
        function saveInspection() {
            if (!$('#item_name').val().trim()) {
                Alert.alert('', '품목을 선택해주세요.');
                return false;
            }

            var items = collectInspItems();
            if (items.length === 0) {
                Alert.alert('', '검사항목을 최소 1건 이상 입력해주세요.');
                return false;
            }

            Alert.confirm('', '저장하시겠습니까?', function() {
                var csrfInput = $('body > input[type="hidden"]');
                var csrfName  = csrfInput.attr('name');   // "_csrf"
                var csrfValue = csrfInput.val();

                var formData = new FormData();
                formData.append('id',           $('#id').val());
                formData.append('item_code',    $('#item_code').val());
                formData.append('item_name',    $('#item_name').val());
                formData.append('supplier',     $('#supplier').val());
                formData.append('supplier_code', $('#supplier_code').val());
                formData.append('drawing_no',   $('#drawing_no').val());
                formData.append('rev_no',       $('#rev_no').val());
                formData.append('inspect_type', $('#inspect_type').val());
                formData.append('aql',          $('#aql').val());
                formData.append('issue_date',   $('#issue_date').val());
                formData.append('rev_date',     $('#rev_date').val());
                formData.append('remarks',      $('#remarks').val());
                formData.append('spjangcd',     sessionStorage.getItem('spjangcd'));
                formData.append('items',        JSON.stringify(items)); // 검사항목 배열
                formData.append(csrfName,       csrfValue);

                $.ajax({
                    url: '/api/incoming-inspection/save',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(result) {
                        if (result.success) {
                            Alert.alert('', '저장되었습니다.');
                            searchMainData();
                        } else {
                            Alert.alert('저장 실패', result.message);
                        }
                    },
                    error: function(jqXHR, textStatus, errorThrown) {
                        console.error('저장 오류:', textStatus, errorThrown);
                    }
                });
            });
        }

        /* 삭제 */
        function deleteInspection() {
            var id = $('#id').val();
            Alert.confirm('', '삭제하시겠습니까?', function() {
                AjaxUtil.postAsyncData('/api/incoming-inspection/delete', {id: id}, function(result) {
                    if (result.success) {
                        Alert.alert('', '삭제되었습니다.');
                        searchMainData();
                    } else {
                        Alert.alert('삭제 실패', result.message);
                        console.error('삭제 실패:', result.message);
                    }
                });
            });
        }

        /* 이벤트 바인딩 */
        $(document.body).ready(function() {
            setButtonState();

            $('#btnSearch').click(function() { searchMainData(); });

            $('#txtItemName').on('keypress', function(e) {
                if (e.keyCode === 13) searchMainData();
            });

            $('#btnNew').click(function() { resetForm(); });
            $('#btnSave').click(function() { saveInspection(); });
            $('#btnDel').click(function() { deleteInspection(); });
            $('#btnAddItem').click(function() { addInspRow(); });

            // 품목 선택 팝업 (SPC 화면과 동일 컴포넌트)
            $(document).on('click', '#item_name', function() {
                var pop = new PopMatComponent();
                pop.material_type = 'product,sangpum';
                pop.show(function(item) {
                    $('#item_name').val(item.Name);
                    $('#item_code').val(item.Code);
                });
            });

            // 협력사 선택 팝업 (매입처/협력사만 조회)
            $(document).on('click', '#supplier', function() {
                var pop = new PopCompComponentPurchase();
                pop.show(function(item) {
                    $('#supplier').val(item.compname);
                    $('#supplier_code').val(item.compcode);
                });
            });
        });

    </script>
</th:block>

</html>
