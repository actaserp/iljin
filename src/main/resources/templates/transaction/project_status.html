<html layout:decorate="~{layout_page}">
<head>
</head>
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>프로젝트 현황</h2>
        <a title="북마크" class="bookmark toggle">
          내 메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>프로젝트관리</li>
        <li>프로젝트 현황</li>
      </ul>
    </div>
    <div style="display: flex; gap: 5px">
      <section class="section" style="flex: 1;">
        <div class="section-top">
          <div class="search-wrap">
            <input type="hidden" id="spjangcdHidden">
            <dl>
              <dt>
                <label>
                  연도
                </label>
              </dt>
              <dd>
                <select class="" id="cboYear" name="cboYear">
                </select>
              </dd>
            </dl>
            <dl>
              <dt>
                <label>프로젝트명</label>
              </dt>
              <dd>
                <div class="srch-box">
                  <input type="text" class="form-control2" id="txtProjectName" name="txtProjectName"
                         placeholder="프로젝트명">
                </div>
              </dd>
            </dl>

            <dl>
              <dt><span class="eq"></span></dt>
              <dd>
                <li>
                  <a class="btn btn-delete" title="검색" id="btnSearch">
                    <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                    검색
                  </a>
                </li>
              </dd>
            </dl>
          </div>
          <!--<div class="button-wrap" style="border-top:none; text-align: right; !important;">
            <ul>
              <li>
                <a class="btn btn-excell" title="신규등록" id="Newbtn">
                  <img th:src="@{/images/icon/ico-plus.svg}" alt="등록 아이콘">
                  신규등록
                </a>
              </li>
              <li>
                <a class="btn btn-edit" id="btnSave" title="저장">
                  <img th:src="@{/images/icon/ico-save.svg}" alt="저장 아이콘">
                  저장
                </a>
              </li>
              <li>
                <a class="btn btn-delete" title="삭제" id="btnDelete">
                  <img th:src="@{/images/icon/ico-delete.svg}" alt="엑셀 아이콘">
                  삭제
                </a>
              </li>
            </ul>
          </div>-->
        </div>
        <div class="container-fluid">
          <p id="ProjectStatus"></p>
          <div id="theGrid" style="height: 300px"></div>
        </div>
      </section>

      <div class="tab-wrap" style="flex: 1; min-width: 0">
        <ul class="tab-links">
          <li><a href="#tabs_ExpenseHistory">경비사용내역</a></li>
          <li><a href="#tabs_SalesHistory">매출내역</a></li>
          <li><a href="#tabs_TransactionHistory">입출금내역</a></li>
        </ul>

        <div>
          <!--경비사용내역-->
          <section class="tab-item" id="tabs_ExpenseHistory" style="border-top-left-radius: 0;">
            <div class="container-fluid">
              <p id="ExpenseHistory"></p>
              <div id="ExpenseHistoryGrid" style="height: 300px; "></div>
            </div>
          </section>
          <!-- 매출내역 -->
          <section class="tab-item" id="tabs_SalesHistory" style="border-top-left-radius: 0;">
            <div class="container-fluid">
              <p id="SalesHistory"></p>
              <div id="SalesHistoryGrid" style="height: 300px; "></div>
            </div>
          </section>
          <!--입출금 내역-->
          <section class="tab-item" id="tabs_TransactionHistory" style="border-top-left-radius: 0;">
            <!--<div class="section-top" style="margin-bottom: 5px;">
              <dl>
                <dt>
                  <label>
                    입출금 구분
                  </label>
                </dt>
                <dd>
                  <select class="form-control2" id="io_type" name="io_type" >
                    <option value="0">입금</option>
                    <option value="1">출금</option>
                  </select>
                </dd>
              </dl>
            </div>-->
            <div class="container-fluid">
              <p id="TransactionHistory"></p>
              <div id="TransactionHistoryGrid" style="height: 300px; "></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

</th:block>

<th:block layout:fragment="scripts">
  <th:block th:replace="/common/approve_box :: approve_box"></th:block>
  <th:block th:replace="/common/ax5_uploader :: ax5_uploader"></th:block>
  <th:block th:replace="/common/upload_one_image_box :: upload_one_image_box"></th:block>
  <script type="text/javascript">
    class ProjectStatusPage {
      constructor() {
        this.grid = null;
        this.grid2 = null;
        this.grid3 = null;
        this.grid4 = null;
        this.viewData = [];
        this.spjangcd = $('#spjangcdHidden');
        this.init();
      }//constructor

      init() {
        let _this = this;
        this.grid = new EditTable('#theGrid', {
          readOnly: true,
          columns: [
            {key: 'projno', header: '번호', width: 100, align: 'center'},
            {key: 'projnm', header: '프로젝트명', width: 200},
            {key: 'contdate', header: '계약일자', width: 110, align: 'center'},
            {key: 'suju_totalamt', header: '수주금액', width: 130},
            {key: 'sales_totalamt', header: '매출금액', width: 130},
            {key: 'total_accin', header: '수금액', width: 130, align: 'right'},
            {key: 'invo_totalamt', header: '소요경비', width: 130},
            {key: 'total_accout', header: '지급액', width: 130, align: 'right'},
            // 위즈모 formatItem 으로 계산해 보이던 두 칸 (자료 필드 없음)
            {key: '_paid', header: '수금여부', width: 100, align: 'center', sortable: false,
              format: (v, r) => (r.total_accin || 0) === (r.sales_totalamt || 0) ? 'O' : '',
              render: (v, r) => (r.total_accin || 0) === (r.sales_totalamt || 0) ? '<span style="font-size: 18px; color: green;">&#x2B55;</span>' : ''},
            {key: '_profit', header: '손익액', width: 140, align: 'right', sortable: false,
              format: (v, r) => ((r.sales_totalamt || 0) - (r.invo_totalamt || 0)).toLocaleString()},
          ],
           // 데이터를 설정할 배열
        });
        this.grid.setData(this.viewData);

        this.grid.opts.fileName = '프로젝트 현황';
        this.grid.hostElement.addEventListener('click', function (e) {
          let ht = _this.grid.hitTest(e);
          if (ht.cellType === 'cell' || ht.cellType === 'rowheader') {
            const selectedItem = _this.grid.selectedItems[0];
            if (selectedItem) {
              _this.loadTabData(selectedItem);
            }
          }
        });
        // 엔터키 검색
        $('#txtProjectName').on('keypress', function (e) {
          if (e.keyCode === 13) {
            // 탭 그리드 초기화
            page.grid2.setData([]);
            page.grid3.setData([]);
            page.grid4.setData([]);

            // 필요한 경우, 탭 내 상태도 초기화할 수 있음 (ex: 텍스트 초기화)
            $('#TransactionHistory').empty();
            _this.searchMainData();
          }
        });

        //경비 사용내역
        this.grid2 = new EditTable('#ExpenseHistoryGrid', {
            footerLabel: '합계', footerLabelKey: 'misdate',
          readOnly: true,
          columns: [
            {key: 'misdate', header: '매입일자', width: 120, align: 'center'},
            {key: 'misnum', header: '번호', width: 60, align: 'center'},
            {key: 'misseq', header: '순번', width: 60, align: 'center'},
            {key: 'artnm', header: '계정과목', width: 100, align: 'center'},
            {key: 'itemnm', header: '품목명', width: 130},
            {key: 'spec', header: '규격', width: 250},
            {key: 'qty', header: '수량', width: 60, align: 'center', sum: true},
            {key: 'unitcost', header: '단가', width: 140, sum: true},
            {key: 'supplycost', header: '공급가액', width: 140, sum: true},
            {key: 'taxtotal', header: '세액', width: 140, sum: true},
            {key: 'remark', header: '비고', width: 140},
          ],
           // 데이터를 설정할 배열
        });
        this.grid2.setData(this.viewData);

        this.grid2.opts.fileName = '경비사용내역';



        //매출내역
        this.grid3 = new EditTable('#SalesHistoryGrid', {
            footerLabel: '합계', footerLabelKey: 'misgubun',
          readOnly: true,
          columns: [
            {key: 'misgubun', header: '매출구분', width: 100, align: 'center'},
            {key: 'icerdeptnm', header: '부서', width: 110, align: 'center'},
            {key: 'misdate', header: '일자', width: 110, align: 'center'},
            {key: 'itemnm', header: '품목', width: 140},
            {key: 'spec', header: '규격', width: 250, align: 'center'},
            {key: 'qty', header: '수량', width: 60, align: 'center', sum: true},
            {key: 'unitcost', header: '단가', width: 140, sum: true},
            {key: 'supplycost', header: '공급가액', width: 140, sum: true},
            {key: 'taxtotal', header: '세액', width: 140, sum: true},
            {key: 'remark', header: '비고', width: 140},
          ],
           // 데이터를 설정할 배열
        });
        this.grid3.setData(this.viewData);

        this.grid3.opts.fileName = '매출내역';

        //입출금 내역
        this.grid4 = new EditTable('#TransactionHistoryGrid', {
            footerLabel: '합계', footerLabelKey: 'trdate',
          readOnly: true,
          columns: [
            {key: 'trdate', header: '일자', width: 110},
            {key: 'comp_name', header: '거래처', width: 100},
            {key: 'io_type', header: '입출금 구분', width: 100, align: 'center'},
            {key: 'accin', header: '입금액', width: 130, sum: true},
            {key: 'accout', header: '출금액', width: 130, sum: true},
            {key: 'memo', header: '메모', width: 140},
          ],
           // 데이터를 설정할 배열
        });
        this.grid4.setData(this.viewData);

        this.grid4.opts.fileName = '입출금 내역';

      }//init

      searchMainData() {
        let _this = this;
        let url = '/api/transaction/ProjectStatus'

        let data = {
          'cboYear': $("#cboYear").val(),
          'txtProjectName': $("#txtProjectName").val(),
          spjangcd: this.spjangcd.val()  //사업장 코드
        }
        let fnsuccess = function (result) {
          if (result != null) {
            _this.viewData = result.data;
            _this.grid.setData(_this.viewData);
          }
        };
        AjaxUtil.getAsyncData(url + '/allRead', data, fnsuccess);
      }

      //탭 요청
      loadTabData(selectedItem) {
        let _this = this;
        const projno = selectedItem.projno;
        const url = '/api/transaction/ProjectStatus';
        const data = {
          projno: projno,
          spjangcd: this.spjangcd.val()
        };

        // 1. 경비사용내역
        AjaxUtil.getAsyncData(url + '/ExpenseHistory', data, function (result) {
          if (result != null) {
            _this.grid2.setData(result.data);
          }
        });

        // 2. 매출내역
        AjaxUtil.getAsyncData(url + '/SalesHistory', data, function (result) {
          if (result != null) {
            _this.grid3.setData(result.data);
          }
        });

        // 3. 입출금내역
        AjaxUtil.getAsyncData(url + '/TransactionHistory', data, function (result) {
          if (result != null) {
            _this.grid4.setData(result.data);
          }
        });

        // 탭 자동 전환: 첫 번째 탭 열기
        document.querySelector('.tab-links li:first-child a').click();
      }
    }

    $(document).ready(function (e) {

      const spjangcd = sessionStorage.getItem('spjangcd');
      if (spjangcd) {
        $('#spjangcdHidden').val(spjangcd);  // hidden input이 있어야 함
      }
      AjaxUtil.fillSelectOptions($('#cboYear'), 'data_year', '', false);

      page = new ProjectStatusPage();

      page.searchMainData();

      // 검색
      $('#btnSearch').click(function (e) {
        e.preventDefault();
        // 탭 그리드 초기화
        page.grid2.setData([]);
        page.grid3.setData([]);
        page.grid4.setData([]);

        // 필요한 경우, 탭 내 상태도 초기화할 수 있음 (ex: 텍스트 초기화)
        $('#TransactionHistory').empty();
        page.searchMainData();
      });

      // 값이 사라지면 hidden도 비움
      $('#btnCompanySearch').on('input', function () {
        const val = $(this).val();
        if (val === '') {
          $('#cboCompanyHidden').val('');
        }
      });
      $('#balcltnm').click(function () {
        const poppage = new PopCompComponent();
        const $poppage = $(poppage);
        const searchcallback = function (items) {
          $('#balcltnm').val(items.compname);
          $('#balcltcd').val(items.id);
        };
        poppage.show(searchcallback);
      });

      $('#balcltnm').on('input', function () {
        if ($(this).val().trim() === '') {
          $('#balcltcd').val('');
        }
      });

    })

  </script>
</th:block>
</html>
