<html layout:decorate="~{layout_page}">
<head>
  <style>
      /* ===== 통합 화면 레이아웃 (위: 수주목록 / 아래: 수주상세, 3:7) ===== */
      .ps-wrap {
          display: flex;
          flex-direction: column;     /* 위/아래 배치 */
          gap: 12px;
          align-items: stretch;
          height: calc(100vh - 210px);
          min-height: 600px;
      }
      .ps-left {                       /* 상단: 수주 목록 (비율 3) */
          flex: 3 1 0;
          min-width: 0;
          min-height: 0;
          display: flex;
          flex-direction: column;
      }
      .ps-right {                      /* 하단: 수주 상세 (비율 7) */
          flex: 7 1 0;
          min-width: 0;
          min-height: 0;
          display: flex;
          flex-direction: column;
      }
      .ps-left > .ps-panel,
      .ps-right > .ps-panel {
          flex: 1 1 auto;
          min-height: 0;
          display: flex;
          flex-direction: column;
      }
      /* 하단 패널: 내용이 길면 패널 내부에서 스크롤 */
      .ps-right > .ps-panel {
          overflow-y: auto;
      }
      .ps-panel {
          background: #fff;
          border: 1px solid #d9dde3;
          border-radius: 6px;
          padding: 10px 12px;
      }
      .ps-panel-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 8px;
      }
      .ps-panel-head h3 {
          font-size: 15px;
          font-weight: 700;
          margin: 0;
      }
      .ps-panel-head .mode-badge {
          font-size: 12px;
          padding: 2px 10px;
          border-radius: 10px;
          background: #EDEFF5;
          color: #333;
          margin-left: 8px;
          vertical-align: middle;
      }
      .ps-panel-head .mode-badge.edit {
          background: #1d5d90;
          color: #fff;
      }
      .ps-panel-head ul {
          display: flex;
          gap: 6px;
          margin: 0;
      }
      .ps-guide {
          padding: 30px 0;
          text-align: center;
          color: #888;
          font-size: 14px;
      }
      .ps-search {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          align-items: center;
          margin-bottom: 8px;
      }
      .ps-search dl {
          display: flex;
          align-items: center;
          gap: 4px;
          margin: 0;
      }
      .ps-search dt { font-size: 13px; white-space: nowrap; }

      /* 수주상세 헤더 폼 */
      #sujuForm .write-table { table-layout: fixed; width: 100%; }
      #sujuForm .write-table th {
          width: 70px;
          min-width: 70px;
          text-align: center;
          white-space: nowrap;
          padding: 4px 6px;
          font-size: 13px;
      }
      #sujuForm .write-table td { padding: 4px 6px; }
      #sujuForm .write-table input[type="text"],
      #sujuForm .write-table input[type="date"],
      #sujuForm .write-table select { width: 100%; box-sizing: border-box; }
      #sujuForm input[type="date"] { height: 36px; }
      #sujuForm textarea { height: 50px; width: 100%; box-sizing: border-box; }

      /* ===== 품목 테이블 (기존 수주 화면 스타일 이식) ===== */
      .item-scroll {
          width: 100%;
          overflow-x: auto;
          margin-top: 8px;
      }
      .item-table {
          width: 100%;
          border-collapse: collapse;
          table-layout: fixed;
          margin-top: 0;
      }
      .item-table th {
          background-color: #EDEFF5;
          text-align: center;
          font-weight: bold;
          padding: 0.125rem 0.25rem;   /* 2px 4px */
          border: 1px solid #ccc;
          font-size: 0.8125rem;        /* 13px */
          min-height: 1.75rem;         /* 28px — 고정 대신 최소값만 */
          line-height: 1.2;
      }

      .item-table td {
          padding: 4px;
          text-align: center;
          border: 1px solid #ccc;
      }
      .item-table input {
          width: 100%;
          box-sizing: border-box;
          padding: 4px;
          height: 32px;
      }

      /* select를 input과 동일한 크기·외형으로 (ui.css min-width:140px 및
         .ps-wrap height:30px !important 를 이 스코프에서만 덮어씀) */
      #sujuForm .item-table select {
          width: 100%;
          box-sizing: border-box;
          min-width: 0;
          padding: 4px;
          height: 32px !important;
          line-height: 32px !important;
          border: 1px solid #D5D7DC;
          border-radius: 5px;
          background-color: #fff;
          font-size: 13px;
      }

      /* .ps-wrap input[type] { height:30px !important } 를 item-table 안에서만 32px로 재확정 */
      #sujuForm .item-table input:not([type="hidden"]) {
          height: 32px !important;
          line-height: 32px !important;
      }

      /* 비활성(설비타입 hanger 선택 시) 회색 배경 */
      #sujuForm .item-table select:disabled {
          background-color: #EDEFF5;
          border: 1px solid #D5D7DC !important;
          color: #333333;
      }
      #sujuForm .item-table input[type="date"] {
          min-width: 0;
          width: 100%;
          box-sizing: border-box;
          padding: 4px 2px;
      }

      /* 반응형에서 셀이 display:block으로 깨지지 않도록 이 테이블만 보호 */
      @media (max-width: 1200px) {
          #sujuForm .item-table           { display: table !important; table-layout: fixed !important; }
          #sujuForm .item-table thead     { display: table-header-group !important; }
          #sujuForm .item-table tbody     { display: table-row-group !important; }
          #sujuForm .item-table tr        { display: table-row !important; }
          #sujuForm .item-table th,
          #sujuForm .item-table td        { display: table-cell !important; }
      }
      .item-table td:first-child { text-align: left; }

      .item-table .btn.in_btn, .ps-inbtn {
          display: inline-flex;
          justify-content: center;
          align-items: center;
          width: 24px;
          height: 24px;
          border-radius: 4px;
          padding: 0;
          border: 1px solid #B3B3B3;
          background-color: #fff;
          cursor: pointer;
          line-height: 0;
      }
      .item-table .btn.in_btn img, .ps-inbtn img {
          width: 11px;
          height: 11px;
          display: block;
      }
      .input-with-button {
          display: flex;
          gap: 4px;
          align-items: center;
      }
      .input-with-button input {
          flex: 1;
          min-width: 0;
      }
      .input-with-button .btn.in_btn { flex-shrink: 0; }

      .ps-form-foot {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 8px;
      }
      .ps-form-foot .warn { color: #c0392b; font-size: 13px; }

      .ps-wrap input[type="text"],
      .ps-wrap input[type="date"],
      .ps-wrap input:not([type]),
      .ps-wrap select {
          height: 30px !important;
          line-height: 30px !important;
      }

      #sujuForm .write-table th,
      #sujuForm .write-table td,
      #sujuForm .item-table th,
      #sujuForm .item-table td {
          height: auto !important;
          padding: 2px 6px;
      }
      #sujuForm .write-table th {
          font-size: 13px;
      }
  </style>
</head>

<th:block layout:fragment="scripts">
  <th:block th:replace="/common/multiform_material :: multiform_material"></th:block>
  <th:block th:replace="/common/popup_company :: popup_company"></th:block>
  <th:block th:replace="/sales/popup_suju_company :: popup_suju_company"></th:block>
  <th:block th:replace="/sales/popup_company_new_save :: popup_company_new_save"></th:block>

  <script type="text/javascript">
   /* =========================================================
    *  공통 유틸
    * ========================================================= */
   function toNum(v, d = 0) {
    const n = Number.parseFloat(String(v ?? '').replace(/,/g, ''));
    return Number.isFinite(n) ? n : d;
   }
   function fmtComma(n) {
    const x = toNum(n);
    return x ? x.toLocaleString('ko-KR') : '';
   }

   /* =========================================================
    *  수주 패널 (상단: 목록 / 하단: 상세)
    * ========================================================= */
   class SujuPanel {
    constructor() {
     this.url = '/api/sales/suju';
     this.grid = null;
     this.viewData = new wijmo.collections.CollectionView();
     this.itemIndex = 0;        // 품목 행 인덱스 채번
     this.dirty = false;        // 미저장 변경 여부
     this.suppressDirty = false;
     this.suppressSelection = false;  // 데이터 로드 시 자동 선택 무시
     this.init();
    }

    /* ---------- 초기화 ---------- */
    init() {
     const _this = this;

     this.grid = new wijmo.grid.FlexGrid('#sujuGrid', {
      autoGenerateColumns: false,
      selectionMode: wijmo.grid.SelectionMode.Row,
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      isReadOnly: true,
      showMarquee: true,
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
        e.cell.style.textAlign = 'center';
       }
      },
      columns: [
       {binding: 'projno', header: '프로젝트', width: 100, align: 'center'},
       {binding: 'CompanyName', header: '판매처', width: 150, align: 'left'},
       {binding: 'JumunDate', header: '수주일', width: 100, align: 'center'},
       {binding: 'product_name', header: '제품명', width: '*'},
       {binding: 'TotalPrice', header: '총액', width: 110, align: 'right', format: 'n0'},
       {binding: 'DueDate', header: '납기일', width: 100, align: 'center'},
       {binding: 'StateName', header: '작업상태', width: 80, align: 'center'},
       {binding: 'ShipmentStateName', header: '출하상태', width: 80, align: 'center'},
       {binding: 'SujuTypeName', header: '수주구분', width: 80, align: 'center'}
      ],
      itemsSource: this.viewData
     });
     new FlexGridContextMenu(this.grid);
     this.grid.downloadFileName = '수주목록';

     // ★ 목록 클릭 → 상세 바인딩(수정 모드)
     this.grid.selectionChanged.addHandler((s) => {
      if (_this.suppressSelection) return;
      const item = s.selectedItems[0];
      if (!item) return;

      const doLoad = () => _this.loadDetail(item);
      if (_this.isDirty()) {
       Alert.confirm('', '저장하지 않은 수주 내용이 있습니다. 이동하시겠습니까?',
        doLoad, function () {
        });
      } else {
       doLoad();
      }
     });

     // 검색
     $('#btnSujuSearch').click(() => _this.search());
     $('#sujuSrchProjno').on('change', function () {
      _this.search();
     });

     // 신규 / 저장 / 삭제
     $('#btnSujuNew').click(function (e) {
      e.preventDefault();
      _this.resetForm('new');
     });
     $('#btnSujuSave').click(function (e) {
      e.preventDefault();
      _this.save();
     });
     $('#btnSujuDelete').click(function (e) {
      e.preventDefault();
      _this.remove();
     });

     //엑셀 업로드
     $('#btnExcelNew').click(function (e) {
      e.preventDefault();
      _this.openExcelUpload();
     });

     // 수주구분 콤보
     AjaxUtil.fillSelectOptions($('#cboSujuType'), 'system_code', 'choose', 'plan', 'suju_type');

     this.bindFormEvents();
    }

    /* ---------- 엑셀 업로드 팝업 ---------- */
    openExcelUpload() {
     const _this = this;
     if (_this.excelPopup) { _this.excelPopup.close(); _this.excelPopup = null; }

     const content = tmpl('excelUploadTemplate', {});
     _this.excelPopup = new PopupDraggable('수주 엑셀 업로드');
     _this.excelPopup.open({ width: 560, height: 420, $content: $(content) });

     // 기본 일자
     $('#up_jumun_date').val(CommonUtil.getYYYYMMDD());
     $('#up_due_date').val(CommonUtil.getYYYYMMDD(10));

     // 프로젝트 옵션 복사 (이미 로드된 상단 검색 콤보 재사용)
     const $src = $('#sujuSrchProjno');
     const $tgt = $('#up_projno');
     $src.find('option').each(function () {
      if (!$(this).val()) return; // '전체 프로젝트' 스킵
      $tgt.append(`<option value="${$(this).val()}">${$(this).text()}</option>`);
     });
     // 상단에서 선택된 프로젝트가 있으면 기본값
     if ($('#sujuSrchProjno').val()) $tgt.val($('#sujuSrchProjno').val());

     // 수주처 검색
     $(document).off('click', '#btnUpOrderSearch').on('click', '#btnUpOrderSearch', function () {
      const pop = new PopCompSuJuComponent();
      pop.show(function (items) {
       $('#up_order_id').val(items.id);
       $('#up_order_name').val(items.compname);
      });
     });

     // 업로드 저장
     $(document).off('click', '#btn_excel_save').on('click', '#btn_excel_save', function () {
      _this.uploadExcelSave();
     });
     // 닫기
     $(document).off('click', '#modal-close-button').on('click', '#modal-close-button', function () {
      if (_this.excelPopup) { _this.excelPopup.close(); _this.excelPopup = null; }
     });
    }

    uploadExcelSave() {
     const _this = this;

     const fileInput = document.getElementById('upload_file');
     if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
      Alert.alert('', '엑셀 파일을 선택하세요.'); return;
     }
     if (!$('#up_order_id').val()) {
      Alert.alert('', '수주처를 선택하세요.'); return;
     }
     if (!$('#up_jumun_date').val()) {
      Alert.alert('', '수주일을 입력하세요.'); return;
     }
     if (!$('#up_due_date').val()) {
      Alert.alert('', '납기일을 입력하세요.'); return;
     }

     const formData = new FormData(document.getElementById('excelUploadForm'));
     formData.append('spjangcd', $('#spjangcdHidden').val());

     Alert.confirm('', '업로드한 내용으로 수주를 저장하시겠습니까?', function () {
      const res = AjaxUtil.postFileSyncData(_this.url + '/excel_save', formData);
      if (!res) { Alert.alert('업로드 실패', '서버 응답이 없습니다.'); return; }
      if (!res.success) {
       const msg = res.message || '엑셀 저장에 실패했습니다.';
       $('#upload_message').show().val(msg);
       Alert.alert('업로드 실패', msg);
       return;
      }

      const cnt = (res.data && res.data.savedCount) || 0;
      const formName = (res.data && res.data.formName) || '';
      Notify.success(`${formName ? formName + ' ' : ''}수주 ${cnt}건이 저장되었습니다.`);

      if (res.data && res.data.headId) window.selectedSujuId = res.data.headId;

      if (_this.excelPopup) { _this.excelPopup.close(); _this.excelPopup = null; }
      _this.search();
      _this.resetForm('new');
     });
    }

    /* ---------- 파싱 결과를 품목 테이블에 채움 ---------- */
    fillItemsFromExcel(rows) {
     this.suppressDirty = true;
     // 신규 입력 상태가 아니면 신규로 전환 (헤더 비우고 행만 채움)
     if (!$('#sujuForm').is(':visible')) this.showForm();
     this.clearItemRows();

     const _this = this;
     rows.forEach(it => {
      const $row = _this.addItemRows(1);
      $row.find('input[name^="line_"]').val(it.line || '');
      $row.find('input[name^="txtProductName_"]').val(it.procName || '');
      $row.find('input[name^="setCnt_"]').val(it.jigSet || '');
      $row.find('input[name^="unit_"]').val(it.unitQty || '');
      $row.find('input[name^="pinShiftUnit_"]').val(it.pinShiftUnit || '');
      $row.find('input[name^="equiptype_"]').val(it.equipType || '');
      $row.find('input[name^="legSpec_"]').val(it.legSpec || '');
      $row.find('input[name^="legCnt_"]').val(it.legCnt || '');
      $row.find('input[name^="designCompName_"]').val(it.designCompName || '');
      $row.find('input[name^="drawDate_"]').val(it.drawDate || '');
      $row.find('input[name^="makeCompName_"]').val(it.makeCompName || '');
      $row.find('input[name^="itemRemark_"]').val(it.itemRemark || '');
     });
     this.addItemRows(1); // 추가 입력용 빈 행
     this.dirty = true;   // 검토 후 저장하도록 dirty 처리
     this.suppressDirty = false;
    }

    /* ---------- 프로젝트 목록 로딩 ---------- */
    escapeHtml(str) {
     if (str === null || str === undefined) return '';
     return String(str)
     .replace(/&/g, '&amp;')
     .replace(/"/g, '&quot;')
     .replace(/</g, '&lt;')
     .replace(/>/g, '&gt;');
    }

    loadProjectOptions() {
     const _this = this;
     AjaxUtil.getAsyncData('/api/transaction/projectRegistration/read',
      {
       spjangcd: $('#spjangcdHidden').val(),
       srchStartDt: $("#sujuSrchStartDt").val(),
       srchEndDt: $("#sujuSrchEndDt").val(),
       txtDescription: ''
      },
      function (result) {
       const list = (result && result.data) || [];
       _this.projectList = list;

       const $srch = $('#sujuSrchProjno');
       const $detail = $('#sujuProjSel');
       const srchVal = $srch.val();
       const detailVal = $detail.val();

       $srch.empty().append('<option value="">전체 프로젝트</option>');
       $detail.empty().append('<option value="">프로젝트를 선택하세요</option>');

       list.forEach(function (p) {
        const no = _this.escapeHtml(p.projno);
        const nm = _this.escapeHtml(p.projnm);
        const label = (p.projno ? no + ' / ' : '') + nm;
        $srch.append(`<option value="${no}">${label}</option>`);
        $detail.append(`<option value="${no}" data-projnm="${nm}">${label}</option>`);
       });

       if (srchVal) $srch.val(srchVal);
       if (detailVal) $detail.val(detailVal);
      });
    }

    /* ---------- 조회 ---------- */
    search() {
     const _this = this;
     const data = {
      start: $('#sujuSrchStartDt').val(),
      end: $('#sujuSrchEndDt').val(),
      projno: $('#sujuSrchProjno').val(),   // ★ 프로젝트로 검색
      action: 'read'
     };
     AjaxUtil.getAsyncData(this.url + '/read', data, function (result) {
      if (result != null) {
       _this.suppressSelection = true;
       _this.viewData.sourceCollection = result.data || [];
       _this.suppressSelection = false;
       if (window.selectedSujuId) {
        GridUtil.selectRowById(_this.grid, window.selectedSujuId);
        window.selectedSujuId = null;
       }
      }
     });
    }

    /* ---------- 상세 로드 (수정 모드) ---------- */
    loadDetail(row) {
     const _this = this;
     AjaxUtil.getAsyncData(this.url + '/detail', {id: row.id, action: 'detail'}, function (result) {
      const d = result.data || {};
      // 목록 행의 상태 정보 보강
      d.StateName = row.ShipmentStateName || row.StateName || d.StateName;
      d.State = row.State || d.State;
      d.ShipmentStateName = row.ShipmentStateName || d.ShipmentStateName;
      _this.bindForm(d, row);
     });
    }

    bindForm(d, row) {
     const _this = this;
     this.suppressDirty = true;
     this.showForm();
     this.clearItemRows();

     $('#sujuModeBadge').text('수정 - ' + (d.JumunNumber || row.JumunNumber || '')).addClass('edit');
     $('#sujuId').val(d.id || row.id || '');
     // 수주에 연결된 프로젝트 선택
     $('#sujuProjSel').val(d.projno || row.projno || '');
     $('#sujuProjnm').val(d.projnm || row.projnm || '');
     $('#JumunDate').val(d.JumunDate || '');
     $('#DueDate').val(d.DueDate || '');
     $('#SuJuOrderId').val(d.order_id || d.SuJuOrderId || '');
     $('#SuJuOrderName').val(d.OrderName || d.SuJuOrderName || '');
     $('#cboCompany').val(d.Company_id || '');
     $('#CompanyName').val(d.CompanyName || '');
     $('#DeliveryName').val(d.DeliveryName || '');
     $('#cboSujuType').val(d.SujuType || '');
     $('#SujuDescription').val(d.Description || '');

     // 품목 행 바인딩 (detail 응답의 sujuList 기준)
     const list = d.sujuList || d.items || [];
     if (list.length === 0) {
      this.addItemRows(3);
     } else {
      list.forEach(it => {
       const $row = _this.addItemRows(1);
       $row.find('input[name^="suju_id_"]').val(it.suju_id || it.id || '');
       $row.find('input[name^="product_code_"]').val(it.product_code || '');
       $row.find('input[name^="Material_id_"]').val(it.Material_id || '');
       $row.find('input[name^="txtProductName_"]').val(it.txtProductName || it.product_name || '');
       $row.find('input[name^="setCnt_"]').val(it.setCnt || it.Standard || '');
       $row.find('input[name^="unit_"]').val(it.unit || it.UnitName || '');
       $row.find('input[name^="pinShiftUnit_"]').val(it.pinShiftUnit || '');
       // 라인
       if (it.line || it.lineId) $row.find('select[name^="line_"]').val(it.line || it.lineId);
       // 설비타입 (proc 옵션이 이미 채워진 상태)
       if (it.equiptype) $row.find('select[name^="equiptype_"]').val(it.equiptype);
       // 제작구분
       $row.find('select[name^="makeType_"]').val(it.makeType || '');
       // 설계 업체
       $row.find('input[name^="designCompId_"]').val(it.designCompId || '');
       $row.find('input[name^="designCompName_"]').val(it.designCompName || '');
       // 도면출도일
       $row.find('input[name^="drawDate_"]').val(it.drawDate || '');
       // 제작 업체
       $row.find('input[name^="makeCompId_"]').val(it.makeCompId || '');
       $row.find('input[name^="makeCompName_"]').val(it.makeCompName || '');
       // 비고
       $row.find('input[name^="itemRemark_"]').val(it.itemRemark || '');
      });
      this.addItemRows(1); // 추가 입력용 빈 행
     }

     this.calcTotalSum();
     this.applyEditability(d);
     this.dirty = false;
     this.suppressDirty = false;
    }

    /* ---------- 폼 표시/초기화 ---------- */
    showForm() {
     $('#sujuForm').show();
    }

    // mode: 'new'
    resetForm(mode) {
     this.suppressDirty = true;
     this.showForm();
     $('#sujuForm')[0].reset();
     $('#sujuId').val('');
     // 신규 시 목록에서 선택된 프로젝트가 있으면 기본값으로 연결
     $('#sujuProjSel').val($('#sujuSrchProjno').val() || '');
     $('#sujuProjnm').val('');
     $('#SuJuOrderId').val('');
     $('#cboCompany').val('');
     $('#sujuModeBadge').text('신규').removeClass('edit');
     $('#sujuNotEditable').hide();
     $('#btnSujuSave').show();

     // 기본 일자: 수주일 오늘 / 납기일 +10일
     $('#JumunDate').val(CommonUtil.getYYYYMMDD());
     $('#DueDate').val(CommonUtil.getYYYYMMDD(10));

     this.clearItemRows();
     this.addItemRows(2);
     this.calcTotalSum();
     this.dirty = false;
     this.suppressDirty = false;
    }

    isDirty() {
     return $('#sujuForm').is(':visible') && this.dirty;
    }

    /* ---------- 수정 가능 여부 ---------- */
    canEdit(d) {
     const state = String(d?.StateName ?? '').trim();
     const ship = String(d?.ShipmentStateName ?? '').trim();
     if (ship) return false;
     if (!state) return true;
     return ['수주', '지시', '계획', '부분 지시', '부분 계획'].includes(state);
    }

    applyEditability(d) {
     if (this.canEdit(d)) {
      $('#btnSujuSave').show();
      $('#sujuNotEditable').hide();
     } else {
      $('#btnSujuSave').hide();
      const ship = String(d?.ShipmentStateName ?? '').trim();
      $('#sujuNotEditable')
      .text(ship ? '* 출하가 진행된 건은 수정이 불가합니다.' : '* 계획 또는 출하가 진행된 수주는 수정이 불가합니다.')
      .show();
     }
    }

    /* ---------- 품목 행 관리 ---------- */
    clearItemRows() {
     $('#itemTbody tr').not('.item-template-row').remove();
     this.itemIndex = 0;
    }

    addItemRows(count) {
     const $tbody = $('#itemTbody');
     const $template = $tbody.find('.item-template-row');
     let $last = null;
     for (let i = 0; i < count; i++) {
      const $newRow = $template.clone().removeClass('item-template-row').show();
      const index = this.itemIndex++;
      // input + select 모두 name 인덱싱
      $newRow.find('input, select').each(function () {
       const baseName = $(this).attr('name');
       if (baseName) $(this).attr('name', `${baseName}_${index}`);
      });
      // 라인 콤보
      AjaxUtil.fillSelectOptions($newRow.find('select[name^="line_"]'), 'workcenter', 'choose','58'); // dash 를 가본으로

      // 설비타입: 품목그룹 기본값 기준으로 토글이 채움 (여기서 user_code_id 직접 호출 X)
      this.applyEquipState($newRow);
      $tbody.append($newRow);
      $last = $newRow;
     }
     return $last;
    }


    /* ---------- 품목그룹(proc 고정)에 따라 설비타입 채움 ---------- */
    applyEquipState($row) {
     const group = String($row.find('[name^="MaterialGroupName_"]').val() || 'proc');
     const $equip = $row.find('select[name^="equiptype_"]');
     const cur = $equip.val();   // 기존 선택값 보존

     if (group === 'proc') {
      // proc 하위 설비타입만 채움 (4번째 인자 = 부모코드)
      AjaxUtil.fillSelectOptions($equip, 'user_code_id', '','', 'proc');
      $equip.prop('disabled', false);
      if (cur) $equip.val(cur);
     } else {
      $equip.empty().prop('disabled', true).val('');
     }
    }

    /* ---------- 금액 계산 ---------- */
    calcRow($row, source) {
     if (this._calcLock) return;
     this._calcLock = true;
     try {
      const quantity = toNum($row.find('input[name^="quantity_"]').val());
      const unitPriceRaw = String($row.find('input[name^="unitPrice_"]').val() || '').replace(/,/g, '');
      const unitPrice = toNum(unitPriceRaw);
      const hasUnitPrice = unitPriceRaw !== '' && !isNaN(Number(unitPriceRaw));
      const isVatIncluded = $row.find('input[name^="VatIncluded_"]').is(':checked');

      const isSupplyEdited = $row.data('supplyEdited') === true;
      const isVatEdited = $row.data('vatEdited') === true;
      const shouldAuto = hasUnitPrice && ((source === 'unit') || (!isSupplyEdited && !isVatEdited));

      if (shouldAuto) {
       const lineTotal = Math.floor(quantity * unitPrice);
       let supply, vat;
       if (isVatIncluded) {
        supply = Math.round(lineTotal / 1.1);
        vat = lineTotal - supply;
       } else {
        supply = lineTotal;
        vat = Math.floor(supply * 0.1);
       }
       if (!isSupplyEdited) $row.find('input[name^="supplyAmount_"]').val(fmtComma(supply));
       if (!isVatEdited) $row.find('input[name^="VatAmount_"]').val(fmtComma(vat));
      }

      const s = toNum($row.find('input[name^="supplyAmount_"]').val());
      const v = toNum($row.find('input[name^="VatAmount_"]').val());
      $row.find('input[name^="totalAmount_"]').val(fmtComma(s + v));
      $row.find('input[name^="quantity_"]').val(fmtComma(quantity));
      $row.find('input[name^="unitPrice_"]').val(fmtComma(unitPrice));

      this.calcTotalSum();
     } finally {
      this._calcLock = false;
     }
    }

    calcTotalSum() {
     let sum = 0;
     $('#itemTbody tr:visible').each(function () {
      sum += toNum($(this).find('input[name^="totalAmount_"]').val());
     });
     $('#totalAmountSum').val(sum ? sum.toLocaleString('ko-KR') : '');
    }

    /* ---------- 폼 이벤트 바인딩 (1회) ---------- */
    bindFormEvents() {
     const _this = this;
     const $form = $('#sujuForm');

     // 더티 체크
     $form.on('input change', 'input, select, textarea', function () {
      if (!_this.suppressDirty) _this.dirty = true;
     });

     // 수량/단가 입력 → 자동 계산
     $form.on('input', 'input[name^="quantity_"], input[name^="unitPrice_"]', function () {
      const $row = $(this).closest('tr');
      $row.removeData('supplyEdited');
      $row.removeData('vatEdited');
      _this.calcRow($row, 'unit');
     });
     // 공급가/부가세 직접 입력
     $form.on('input', 'input[name^="supplyAmount_"]', function () {
      const $row = $(this).closest('tr');
      $row.data('supplyEdited', true);
      _this.calcRow($row);
     });
     $form.on('input', 'input[name^="VatAmount_"]', function () {
      const $row = $(this).closest('tr');
      $row.data('vatEdited', true);
      _this.calcRow($row);
     });
     // 부가세 포함 체크
     $form.on('change', 'input[name^="VatIncluded_"]', function () {
      const $row = $(this).closest('tr');
      $(this).val(this.checked ? 'Y' : 'N');
      $row.removeData('supplyEdited');
      $row.removeData('vatEdited');
      _this.calcRow($row, 'unit');
     });

     // 품목그룹 변경 → 설비타입 재구성/토글
     $form.on('change', 'select[name^="MaterialGroupName_"]', function () {
      _this.applyEquipState($(this).closest('tr'));
     });

     // 행 추가
     $('#btnAddItemRow').click(function () {
      _this.addItemRows(3);
     });

     // 설계 업체 검색 (행별)
     $form.on('click', '.btn-design-comp', function () {
      const $row = $(this).closest('tr');
      const pop = new PopCompComponent();
      pop.show(function (items) {
       $row.find('input[name^="designCompId_"]').val(items.id || '');
       $row.find('input[name^="designCompName_"]').val(items.compname || '');
       _this.dirty = true;
      });
     });

     // 제작 업체 검색 (행별)
     $form.on('click', '.btn-make-comp', function () {
      const $row = $(this).closest('tr');
      const pop = new PopCompComponent();
      pop.show(function (items) {
       $row.find('input[name^="makeCompId_"]').val(items.id || '');
       $row.find('input[name^="makeCompName_"]').val(items.compname || '');
       _this.dirty = true;
      });
     });

     // 품목 검색 (엔터)
     $form.on('keydown', 'input[name^="txtProductName_"]', function (e) {
      if (e.key !== 'Enter' && e.keyCode !== 13) return;
      e.preventDefault();

      const $field = $(this);
      const $row = $field.closest('tr');
      const keyword = $field.val().trim();
      const pop = new PopMatComponent();
      pop.material_type = 'product,sangpum';

      const callback = function (item) {
       $row.find('input[name^="Material_id_"]').val(item.id || '');
       $row.find('input[name^="txtProductName_"]').val(item.Name || '');
       $row.find('input[name^="product_code_"]').val(item.Code || '');
       $row.find('input[name^="unit_"]').val(item.unit_name || '');
       $row.find('input[name^="standard_"]').val(item.Spec || '');
       _this.tryShowPrice($row);
      };

      if (!keyword) {
       pop.focusAfterClose = $field[0];
       pop.show(callback);
       return;
      }
      const result = AjaxUtil.getSyncData('/api/popup/search_material',
       {keyword: keyword, spjangcd: sessionStorage.getItem('spjangcd')});
      const rows = result?.data || [];
      if (rows.length === 1) {
       callback(rows[0]);
      } else {
       pop.show(callback);
       setTimeout(() => {
        pop.$keyword.val(keyword);
        pop.$btnMaterialSearch.trigger('click');
       }, 50);
      }
     });

     // 품목명 지우면 연관 필드 초기화
     $form.on('input', 'input[name^="txtProductName_"]', function () {
      const $row = $(this).closest('tr');
      if ($(this).val().trim() === '') {
       $row.find('input[name^="Material_id_"], input[name^="product_code_"], input[name^="unit_"], input[name^="standard_"]').val('');
      }
     });

     // 수주처 검색
     $('#btnOrderSearch').click(function () {
      const pop = new PopCompSuJuComponent();
      pop.show(function (items) {
       $('#SuJuOrderId').val(items.id);
       $('#SuJuOrderName').val(items.compname);
       $('#cboCompany').val(items.id);
       $('#CompanyName').val(items.compname);
       _this.dirty = true;
       setTimeout(() => $('#DeliveryName').focus(), 100);
      });
     });

     // 판매처 검색
     $('#btnCompanySearch').click(function () {
      const pop = new PopCompSuJuComponent();
      pop.show(function (items) {
       $('#cboCompany').val(items.id);
       $('#CompanyName').val(items.compname);
       _this.dirty = true;
      });
     });

     // 거래처 신규등록
     $('#btnPlusCompany').click(function () {
      const popup = new PopCompSaveComponent();
      popup.show({
       onSaved: (saved) => {
        if (saved) {
         $('#SuJuOrderId').val(saved.id);
         $('#SuJuOrderName').val(saved.name);
         $('#cboCompany').val(saved.id);
         $('#CompanyName').val(saved.name);
         _this.dirty = true;
         setTimeout(() => $('#DeliveryName').focus(), 100);
        }
       },
       focusAfterClose: this
      });
     });

     // 키보드 네비게이션 (Enter/방향키) — input + select + date 포함
     const focusOrder = [
      'line_',            // select
      'txtProductName_',  // 공정명 (Enter는 검색)
      'setCnt_', 'unit_', 'pinShiftUnit_',
      'equiptype_',       // select
      'legSpec_', 'legCnt_',
      'makeType_',        // select
      'drawDate_',        // date
      'itemRemark_'
     ];

     $form.on('keydown', '.item-table input, .item-table select', function (e) {
      const key = e.key;
      if (!['Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(key)) return;

      const $input = $(this);
      const name = $input.attr('name') || '';
      const cur = focusOrder.findIndex(p => name.startsWith(p));
      if (cur === -1) return;

      // 품목명 엔터는 검색 동작이므로 네비게이션에서 제외
      if (name.startsWith('txtProductName_') && key === 'Enter') return;

      const tag = this.tagName.toLowerCase();
      const isDate = (this.type === 'date');

      // select: 위/아래는 옵션 선택에 양보 (좌우·Enter만 이동)
      if (tag === 'select' && (key === 'ArrowUp' || key === 'ArrowDown')) return;
      // date: 위/아래는 날짜 증감에 양보
      if (isDate && (key === 'ArrowUp' || key === 'ArrowDown')) return;

      e.preventDefault();
      const $row = $input.closest('tr');
      let $next = null;

      // 다음 칸이 존재하는 셀을 찾는 헬퍼 (input/select 모두 매칭)
      const findCell = ($r, idx) =>
       $r.find(`[name^="${focusOrder[idx]}"]`).filter('input, select').first();

      if ((key === 'Enter' || key === 'ArrowRight') && cur < focusOrder.length - 1) {
       $next = findCell($row, cur + 1);
      } else if (key === 'ArrowLeft' && cur > 0) {
       $next = findCell($row, cur - 1);
      } else if (key === 'ArrowDown' || (key === 'Enter' && cur === focusOrder.length - 1)) {
       let $t = $row.nextAll('tr:visible').first();
       if (!$t.length) {
        _this.addItemRows(3);
        $t = $row.nextAll('tr:visible').first();
       }
       const targetIdx = (key === 'Enter') ? focusOrder.indexOf('txtProductName_') : cur;
       $next = findCell($t, targetIdx);
      } else if (key === 'ArrowUp') {
       $next = findCell($row.prevAll('tr:visible').first(), cur);
      }

      if ($next && $next.length) {
       $next.focus();
       if ($next.is('input')) $next.select();   // select 요소엔 .select() 없음
      }
     });
    }

    /* ---------- 단가 조회 ---------- */
    tryShowPrice($row) {
     const _this = this;
     const mat_pk = $row.find('input[name^="Material_id_"]').val();
     const company_id = $('#cboCompany').val();
     const JumunDate = $('#JumunDate').val();
     if (!(mat_pk && company_id && JumunDate)) return;

     AjaxUtil.getAsyncData(this.url + '/readPriceSuju',
      {mat_pk, company_id, JumunDate},
      function (result) {
       let unitPrice = 0;
       if (result?.data?.length > 0) {
        unitPrice = toNum(result.data[0].UnitPrice);
       }
       $row.find('input[name^="unitPrice_"]').val(fmtComma(unitPrice));
       $row.find('input[name^="originalUnitPrice_"]').val(fmtComma(unitPrice));
       _this.calcRow($row, 'unit');
      });
    }

    /* ---------- 저장 ---------- */
    save() {
     const _this = this;

     // 검증
     if (!$('#sujuProjSel').val()) {
      Alert.alert('', '프로젝트를 선택하세요.');
      return;
     }
     if (!$('#SuJuOrderName').val()) {
      Alert.alert('', '수주처를 선택하세요.');
      return;
     }

     // 행 수집
     const items = [];
     let rowError = null;

     $('#itemTbody tr:visible').each(function (i) {
      const $row = $(this);
      const productName = ($row.find('input[name^="txtProductName_"]').val() || '').trim();
      if (!productName) return;   // 공정명 없는 빈 행 스킵

      const group = String($row.find('[name^="MaterialGroupName_"]').val() || 'proc');
      const equip = $row.find('select[name^="equiptype_"]').val() || '';

      // 라인 + factory_id 추출 (라인 option의 data에 Factory_id가 실려 있어야 함)
      const $line = $row.find('select[name^="line_"]');
      const lineVal = $line.val() || '';
      const $opt = $line.find('option:selected');
      const factoryId = $opt.data('Factory_id') ?? $opt.data('factory_id') ?? null;

      const materialId = $row.find('input[name^="Material_id_"]').val();
      const normMaterialId = (materialId === '' || materialId == null) ? null : Number(materialId);

      items.push({
       suju_id: $row.find('input[name^="suju_id_"]').val() || '',
       Material_id: normMaterialId,
       isNewMaterial: normMaterialId == null,             // 서버 get-or-create 신호
       txtProductName: productName,                        // 공정명
       MaterialGroupName: group,                          // proc 고정
       product_code: $row.find('input[name^="product_code_"]').val() || '',

       line: lineVal,                                     // 라인 코드/값
       lineId: lineVal,                                   // workcenter id
       factoryId: factoryId,                              // 신규 품목 생성용

       setCnt: ($row.find('input[name^="setCnt_"]').val() || '').trim(),         // JIG SET → Standard
       unit: ($row.find('input[name^="unit_"]').val() || '').trim(),             // 유니트 → SujuQty
       pinShiftUnit: ($row.find('input[name^="pinShiftUnit_"]').val() || '').trim(), // PIN SHIFT UNIT
       equiptype: equip,                                  // 설비타입

       makeType: $row.find('select[name^="makeType_"]').val() || '',             // 제작구분
       designCompId: $row.find('input[name^="designCompId_"]').val() || '',      // 설계 업체 id
       designCompName: ($row.find('input[name^="designCompName_"]').val() || '').trim(),
       drawDate: $row.find('input[name^="drawDate_"]').val() || '',              // 도면출도일
       makeCompId: $row.find('input[name^="makeCompId_"]').val() || '',          // 제작 업체 id
       makeCompName: ($row.find('input[name^="makeCompName_"]').val() || '').trim(),
       itemRemark: ($row.find('input[name^="itemRemark_"]').val() || '').trim()  // 비고
      });
     });

     if (rowError) {
      Alert.alert('', rowError);
      return;
     }
     if (items.length === 0) {
      Alert.alert('', '품목을 1건 이상 입력하세요.');
      return;
     }

     Alert.confirm('', '저장하시겠습니까?', function () {
      const payload = {
       id: $('#sujuId').val(),
       projno: $('#sujuProjSel').val(),    // ★ 선택한 프로젝트와 연결
       JumunDate: $('#JumunDate').val(),
       DueDate: $('#DueDate').val(),
       SujuType: $('#cboSujuType').val(),
       spjangcd: $('#spjangcdHidden').val(),
       Description: $('#SujuDescription').val(),
       order_id: $('#SuJuOrderId').val(),
       OrderName: $('#SuJuOrderName').val(),
       items: items
      };

      // ★ 새 화면 전용 엔드포인트 (금액 필드 없는 안전 파싱 버전)
      AjaxUtil.postJsonData(_this.url + '/manual_save_project', payload, function (res) {
       if (res.success) {
        Notify.success('저장되었습니다.');
        _this.dirty = false;
        if (res.data && res.data.id) window.selectedSujuId = res.data.id;
        _this.search();
        _this.resetForm('new');
       } else {
        Alert.alert('저장 실패', res.message || '알 수 없는 오류');
       }
      });
     });
    }

    /* ---------- 삭제 ---------- */
    remove() {
     const _this = this;
     const items = this.grid.selectedItems;
     if (!items.length) {
      Alert.alert('', '삭제할 수주를 선택해주세요.');
      return;
     }
     Alert.confirm('', '삭제하시겠습니까?', function () {
      const it = items[0];
      AjaxUtil.postAsyncData(_this.url + '/delete',
       {id: it.id, State: it.State, ShipmentStateName: it.ShipmentStateName},
       function (res) {
        if (res.success) {
         Notify.success('삭제되었습니다.');
         _this.search();
         _this.resetForm('new');
        } else {
         Alert.alert('', res.message);
        }
       });
     });
    }
   }

   /* =========================================================
    *  품목 행 삭제 (최소 2행 유지)
    * ========================================================= */
   function removeItemRow(el) {
    const $tbody = $(el).closest('tbody');
    const $rows = $tbody.find('tr:not(.item-template-row)');
    const $targetRow = $(el).closest('tr');

    if ($rows.length <= 2) {
     $targetRow.find('input[type="text"]').val('');
     $targetRow.find('input[type="hidden"]').val('');
     $targetRow.find('input[type="checkbox"]').prop('checked', false);
     if (sujuPanel) sujuPanel.calcTotalSum();
     return;
    }
    $targetRow.remove();
    if (sujuPanel) sujuPanel.calcTotalSum();
   }

   /* =========================================================
    *  페이지 초기화
    * ========================================================= */
   let sujuPanel = null;

   $(document).ready(function () {
    const spjangcd = sessionStorage.getItem('spjangcd');
    if (spjangcd) $('#spjangcdHidden').val(spjangcd);

    sujuPanel = new SujuPanel();

    // 검색 기간 기본값
    const now = new Date();
    const oneYearAgo = new Date(now);
    oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
    const oneMonthLater = new Date(now);
    oneMonthLater.setMonth(oneMonthLater.getMonth() + 1);

    $('#sujuSrchStartDt').val(CommonUtil.formatYYYYMMDD(oneYearAgo));
    $('#sujuSrchEndDt').val(CommonUtil.formatYYYYMMDD(oneMonthLater));

    sujuPanel.loadProjectOptions();
    sujuPanel.search();         // 전체 수주 목록 조회
    sujuPanel.resetForm('new'); // 하단에 신규 입력 폼 표시
   });
  </script>
</th:block>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
