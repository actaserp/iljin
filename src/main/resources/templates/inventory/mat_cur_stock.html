<html layout:decorate="~{layout_page}">

<head>
    <style>
        .grid-cell-red {
            background: rgb(248, 210, 203) !important;
        }

    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>재고현황</h2>
                <a title="북마크" class="bookmark toggle">
                    내 메뉴
                </a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>재고관리</li>
                <li>재고현황</li>
            </ul>
        </div>
        <section class="section">
            <div class="section-top">
                <div class="search-wrap">
                    <dl>
                        <dt>
                            <label for="cboMatType">
                                품목유형<span class="eq"></span>
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <select id="cboMatType" name="cboMatType">
                                </select>
                            </div>
                        </dd>
                    </dl>

                    <dl>
                        <dt>
                            <label for="cboMatGrp">
                                품목그룹<span class="eq"></span>
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <select id="cboMatGrp" name="cboMatGrp">
                                </select>
                            </div>
                        </dd>
                    </dl>

                    <dl>
                        <dt>
                            <label for="txtMatName">
                                품목명(코드)<span class="eq"></span>
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <input id="txtMatName" name="txtMatName" />
                            </div>
                        </dd>
                    </dl>

                    <dl>
                        <dt>
                            <label for="cboStoreHouse">
                                창고
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <select id="cboStoreHouse" name="cboStoreHouse">
                                </select>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt>&nbsp;</dt>
                        <dd>
                            <li>
                                <a class="btn btn-delete" title="검색" id="btnSearch">
                                    <!--                                        class 쓰이는 곳 찾고 없으면 클래스명 수정하기-->
                                    <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                                    검색
                                </a>
                            </li>
                        </dd>
                    </dl>
                </div>
            </div>
            <div class="container-fluid">
                <div id="material-stock-grid" style="height: 730px;"></div>
            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="scripts">

    <script type="text/javascript">
        class MaterialStockPage {
            constructor() {
                this.gird = null;
                this.init();
                this.url = '/api/inventory/material_current_stock';
            }

            init() {
                let _this = this;
                this.grid = new EditTable('#material-stock-grid', {
                    frozenColumns: 0, // 열 고정
                     // 위치 칸 편집을 위해 셀 선택 (다중 선택 불가)
                     // 정렬 가능
                    columns: [
                        {key: 'mat_type_name', header: '품목유형', width: 100, align: 'left', readOnly: true},
                        {key: 'mat_grp_name', header: '품목그룹', width: 120, align: 'left', readOnly: true},
                        {key: 'mat_code', header: '품목코드', width: 100, align: 'center', readOnly: true},
                        {key: 'mat_name', header: '품목명', width: 250, align: 'left', readOnly: true},
                        {
                            key: 'stock_price',
                            header: '재고금액',
                            width: 120,
                            align: 'right',
                            format: 'n0',
                            readOnly: true
                        },
                        {key: 'unit_name', header: '단위', width: 70, align: 'center', readOnly: true},
                        {
                            key: 'avail_stock',
                            header: '가용재고',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            readOnly: true,
                            visible: false
                        },
                        {
                            key: 'reserve_stock',
                            header: '예약재고',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            readOnly: true,
                            visible: false
                        },
                        {
                            key: 'cur_stock',
                            header: '총재고',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            readOnly: true, cellClass: r => r.cur_stock < r.safety_stock ? 'et-bad' : ''},
                        {key: 'house_name', header: '창고', width: 120, align: 'center', readOnly: true},
                        // 자재 위치(랙·칸). 칸을 눌러 바로 고친다 — 품목정보의 '창고 내 위치'와 같은 값
                        {key: 'house_loc', header: '위치', width: 110, align: 'center', readOnly: false},
                        {
                            key: 'house_stock',
                            header: '창고재고',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            readOnly: true, cellClass: r => r.house_stock < 0 ? 'et-red' : ''},
                        {key: 'lot_use_yn', header: '로트관리유무', width: 120, align: 'center', readOnly: true},
                        {
                            key: 'lot_count',
                            header: '로트 개수',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            readOnly: true
                        },
                        {
                            key: 'safety_stock',
                            header: '안전재고',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            readOnly: true
                        }
                    ],
                     // 빈 데이터로 초기화
                });
                // 위치 칸을 고치면 바로 저장. 같은 품목의 다른 창고 행에도 같은 값을 보여준다
                this.grid.opts.onEditEnd = (_item, _key, _v, s) => {
                    const e = {row: s.getPageRows().indexOf(_item), col: s.columns.findIndex(c => c.key === _key)};   // 위즈모 cellEditEnded 의 e
                    (() => {
                    if (s.columns[e.col].key !== 'house_loc') return;
                    const item = s.getPageRows()[e.row];
                    if (!item) return;
                    AjaxUtil.postJsonData(this.url + '/save_loc', {id: item.id, loc: item.house_loc || ''},
                        res => {
                            if (res && res.success) {
                                s.getData().forEach(r => { if (r.id === item.id) r.house_loc = item.house_loc; });
                                s.refresh();
                            } else {
                                Alert.alert('', (res && res.message) || '위치를 저장하지 못했습니다.');
                            }
                        });
                    })();
                    s.refreshRow(_item);   // 고친 뒤 계산한 값이 보이게 (위즈모는 편집 끝에 그 행을 다시 그렸음)
                };
                this.grid.opts.fileName = '재고 현황 내역';
            }

            searchDataBind() {
                let _this = this;

                let param = {
                    'action': 'read',
                    'mat_type': $('#cboMatType').val(),
                    'mat_grp_pk': $('#cboMatGrp').val(),
                    'mat_name': $('#txtMatName').val(),
                    'store_house_id': $('#cboStoreHouse').val(),
                    'spjangcd' : sessionStorage.getItem('spjangcd')

                };


                let result = AjaxUtil.getSyncData(this.url + '/read', param);
                if (result != null) {
                    _this.grid.setData(result.data);
                }
            }

        }

        let page = null;

        $(document).ready(function (e) {
            page = new MaterialStockPage();

            AjaxUtil.fillSelectOptions($('#cboMatType'), 'system_code', 'all', null, 'mat_type');
            AjaxUtil.fillSelectOptions($('#cboMatGrp'), 'material_group', 'all', false);

            $('#cboMatType').on('change', function (e) {
                let mat_type = $('#cboMatType').val();
                AjaxUtil.fillSelectOptions($('#cboMatGrp'), 'material_group', 'all', false, mat_type);
            });

            $('#cboMatGrp').change(function () {
                let grp_pk = $('#cboMatGrp').val();

            });

            AjaxUtil.fillSelectOptions($('#cboStoreHouse'), 'store_house', 'all', false);

            // 검색버튼
            $('#btnSearch').click(function (e) {
                page.searchDataBind();

            });

            page.searchDataBind();

        });


    </script>
</th:block>
</html>
