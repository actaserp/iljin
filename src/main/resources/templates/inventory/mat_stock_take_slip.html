<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>실사전표</h2>
        <a title="북마크" class="bookmark toggle">
          내 메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>재고관리</li>
        <li>실사전표</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <input type="hidden" id="spjangcdHidden" name="spjangcd"/>
          <dl>
            <dt><label for="stockTakeDate">실사일자</label></dt>
            <dd>
              <div class="srch-box">
                <input type="date" class="form-control2" id="stockTakeDate" name="stockTakeDate"/>
              </div>
            </dd>
          </dl>
          <dl>
            <dt><label for="cboStoreHouse">창고</label></dt>
            <dd>
              <div class="srch-box">
                <select class="form-control2" id="cboStoreHouse" name="storehouse_id"></select>
              </div>
            </dd>
          </dl>
          <dl>
            <dt><label for="cboManageLevel">관리등급</label></dt>
            <dd>
              <div class="srch-box">
                <select class="form-control2" id="cboManageLevel" name="cboManageLevel"></select>
              </div>
            </dd>
          </dl>
          <dl>
            <dt><label for="cboMaterialType">품목유형</label></dt>
            <dd>
              <div class="srch-box">
                <select class="form-control2" id="cboMaterialType" name="cboMaterialType"></select>
              </div>
            </dd>
          </dl>
          <dl>
            <dt><label for="cboMaterialGroup">품목그룹</label></dt>
            <dd>
              <div class="srch-box">
                <select class="form-control2" id="cboMaterialGroup" name="cboMaterialGroup"></select>
              </div>
            </dd>
          </dl>
          <dl>
            <dt><label for="txtName">품목명</label></dt>
            <dd>
              <div class="srch-box">
                <input class="form-control2" id="txtName" name="txtName"/>
              </div>
            </dd>
          </dl>
          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>

        <div class="button-wrap">
          <ul>
            <li>
              <a class="btn btn-excell" title="등록" id="btnAddNew">
                <img th:src="@{/images/icon/ico-plus.svg}" alt="등록 아이콘">
                등록
              </a>
            </li>
            <li>
              <a class="btn btn-edit" title="수정" id="btnEdit">
                <img th:src="@{/images/icon/ico-edit.svg}" alt="수정 아이콘">
                수정
              </a>
            </li>
            <li>
              <a class="btn btn-delete" title="삭제" id="btnDelete">
                <img th:src="@{/images/icon/ico-delete.svg}" alt="삭제 아이콘">
                삭제
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="container-fluid">
        <div id="stock-take-grid" style="height: 730px;"></div>
      </div>
    </section>
  </div>

  <!-- ===================== 실사전표 등록/수정 팝업 템플릿 ===================== -->
  <script type="text/x-tmpl" id="stockTakeTemplate">
    <style>
        .content_wrap.popup { display: flex; flex-direction: column; height: 100%; }
        .table-wrap { flex: 1; overflow-y: auto; padding-right: 5px; }
        .popup-button { flex-shrink: 0; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
        .with-btn { display:flex; gap:4px; align-items:center; }
        .with-btn input { flex:1; min-width:0; }
    </style>

    <div class="content_wrap popup" id="div_stock_take">
        <div class="table-wrap">
            <form id="stockTakeForm">
                <input type="hidden" id="take_id"  name="take_id">
                <input type="hidden" id="mat_pk"   name="mat_pk">
                <input type="hidden" id="house_pk" name="house_pk">
                <input type="hidden" id="spjangcdHidden" name="spjangcd"/>
                <table class="write-table">
                    <caption>실사전표</caption>
                    <tbody>
                    <tr>
                        <th style="text-align:center"><label for="TakeDate">실사일자*</label></th>
                        <td><input type="date" id="TakeDate" name="TakeDate"></td>
                        <th style="text-align:center"><label for="cboHouse">창고*</label></th>
                        <td><select class="form-control2" id="cboHouse" name="house_id"></select></td>
                    </tr>
                    <tr>
                        <th style="text-align:center"><label for="MatName">품목*</label></th>
                        <td colspan="3">
                            <div class="with-btn">
                                <input type="text" id="MatName" name="MatName" readonly placeholder="검색버튼으로 품목을 선택하세요"/>
                                <a class="btn btn-delete" id="btnMatSearch" title="품목검색">
                                    <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘"> 품목 검색
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th style="text-align:center"><label for="MatCode">품목코드</label></th>
                        <td><input type="text" id="MatCode" name="MatCode" readonly disabled></td>
                        <th style="text-align:center"><label for="UnitName">단위</label></th>
                        <td><input type="text" id="UnitName" name="UnitName" readonly disabled></td>
                    </tr>
                    <tr>
                        <th style="text-align:center"><label for="AccountStock">장부재고</label></th>
                        <td><input type="text" id="AccountStock" name="account_stock" readonly disabled></td>
                        <th style="text-align:center"><label for="RealStock">실사재고*</label></th>
                        <td><input type="number" id="RealStock" name="real_stock"></td>
                    </tr>
                    <tr>
                        <th style="text-align:center"><label for="Gap">차이</label></th>
                        <td><input type="text" id="Gap" name="gap" readonly disabled></td>
                        <th style="text-align:center"><label for="GapDesc">차이설명</label></th>
                        <td><input type="text" id="GapDesc" name="gap_description"></td>
                    </tr>
                    </tbody>
                </table>
            </form>
        </div>
        <div class="popup-button">
            <button type="button" class="btn-popup y_write_auth" id="btnPopStockTakeSave">저장(Ctrl + S)</button>
            <button type="button" class="btn-popup" id="modal-close-button">닫기</button>
        </div>
    </div>
  </script>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
   let gUrl = "/api/inventory/mat_stock_take";

   class StockTakePage {
    constructor() {
     this.grid = null;
     this.$btnAddNew = $('#btnAddNew');
     this.$btnEdit   = $('#btnEdit');
     this.spjangcd   = $('#spjangcdHidden');
     this.viewData   = new wijmo.collections.CollectionView([]);
     this.init();
    }

    init() {
     let _this = this;
     this.grid = new wijmo.grid.FlexGrid('#stock-take-grid', {
      autoGenerateColumns: false,
      allowSorting: true,
      frozenColumns: 5,
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      headersVisibility: wijmo.grid.HeadersVisibility.All,
      itemsSource: this.viewData,
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.RowHeader) {
        e.cell.textContent = (e.row + 1).toString();
       }
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
        e.cell.style.textAlign = 'center';
       }
       if (e.panel.cellType === wijmo.grid.CellType.Cell) {
        const col = s.columns[e.col];
        const item = e.panel.rows[e.row].dataItem;
        if (col.binding === 'last_take_date') {
         e.cell.textContent = item.state === 'taked'
          ? `${item.last_take_date} 확인대기`
          : item.last_take_date || '';
        }
       }
      },
      columns: [
       { binding: 'id',            header: '품목번호', width: 100, align: 'right',  isReadOnly: true },
       { binding: 'mat_type',      header: '품목유형', width: 100, align: 'center', isReadOnly: true },
       { binding: 'mat_grp_name',  header: '품목그룹', width: 150, align: 'center', isReadOnly: true },
       { binding: 'mat_code',      header: '품목코드', width: 100, align: 'center', isReadOnly: true },
       { binding: 'mat_name',      header: '품목명',   width: 200, align: 'left',   isReadOnly: true },
       { binding: 'manage_level',  header: '관리등급', width: 100, align: 'center', isReadOnly: true },
       { binding: 'unit_name',     header: '단위',     width: 100, align: 'center', isReadOnly: true },
       { binding: 'account_stock', header: '장부재고', width: 100, align: 'right',  isReadOnly: true },
       { binding: 'real_stock',    header: '실사재고', width: 100, align: 'right',  isReadOnly: true },
       { binding: 'gap',           header: '차이',     width: 80,  align: 'right',  isReadOnly: true },
       { binding: 'gap_description', header: '차이설명', width: 200, align: 'left', isReadOnly: true },
       { binding: 'last_take_date',header: '최종실사일', width: 200, align: 'center', isReadOnly: true }
      ]
     });
     new FlexGridContextMenu(this.grid);
     this.grid.downloadFileName = '실사전표 목록';

     // 더블클릭 → 수정
     this.grid.hostElement.addEventListener('dblclick', function () {
      if (_this.grid.selectedItems.length === 0) return false;
      _this.$btnEdit.trigger('click');
     });

     // ===== 등록 =====
     this.$btnAddNew.click(function () {
      _this.showStockTakeForm({
       mode: 'new',
       TakeDate: $('#stockTakeDate').val() || CommonUtil.getYYYYMMDD(),
       house_id: $('#cboStoreHouse').val() || '',
       spjangcd: _this.spjangcd.val()
      });
     });

     // ===== 수정 =====
     this.$btnEdit.click(function () {
      let items = _this.grid.selectedItems;
      if (items.length !== 1) {
       Alert.alert('', '하나의 품목만 선택해주세요.');
       return;
      }
      let row = items[0];
      _this.showStockTakeForm({
       mode: 'edit',
       take_id: row.take_id,
       mat_pk: row.id,
       house_pk: row.house_pk,
       house_id: row.house_pk,
       MatName: row.mat_name,
       MatCode: row.mat_code,
       UnitName: row.unit_name,
       account_stock: row.account_stock,
       real_stock: row.real_stock,
       gap: row.gap,
       gap_description: row.gap_description,
       TakeDate: row.take_date || $('#stockTakeDate').val(),
       spjangcd: _this.spjangcd.val()
      });
     });

     // ===== 삭제 =====
     $('#btnDelete').click(function () {
      let items = _this.grid.selectedItems;
      if (items.length === 0) {
       Alert.alert('', '삭제할 품목을 선택해주세요.');
       return;
      }
      let row = items[0];
      if (!row.take_id && !row.last_take_date) {
       Alert.alert('', '실사기록이 없는 품목입니다.');
       return;
      }
      Alert.confirm('', '이 품목의 실사기록을 삭제하시겠습니까?', function () {
       let res = AjaxUtil.postSyncData(gUrl + '/delete', {
        take_id: row.take_id || null,
        house_pk: row.house_pk,
        mat_pk: row.id
       });
       if (res.success) {
        Notify.success('삭제되었습니다.');
        _this.searchMainData();
       } else {
        Alert.alert('', res.message || '삭제 실패');
       }
      });
     });

     $('#txtName').keypress(function (e) {
      if (e.keyCode == 13) _this.searchMainData();
     });
    } // init

    // ===================== 등록/수정 팝업 =====================
    showStockTakeForm(data) {
     let _this = this;
     let content = tmpl('stockTakeTemplate', data);
     let $content = $(content);
     let title = data.mode === 'new' ? '실사전표 등록' : '실사전표 수정';
     let modalContainer = new PopupDraggable(title);
     modalContainer.open({ width: 720, height: 460, $content });

     $content.find('#spjangcdHidden').val(data.spjangcd || sessionStorage.getItem('spjangcd') || '');
     AjaxUtil.fillSelectOptions($content.find('#cboHouse'), 'store_house', '', false);

     // 값 바인딩
     FormUtil.BindDataForm(data, $content.find('#stockTakeForm'));
     if (data.house_id) $content.find('#cboHouse').val(data.house_id);
     $content.find('#take_id').val(data.take_id || '');
     $content.find('#mat_pk').val(data.mat_pk || '');
     $content.find('#house_pk').val(data.house_pk || data.house_id || '');
     $content.find('#TakeDate').val(data.TakeDate || '');
     $content.find('#MatName').val(data.MatName || '');
     $content.find('#MatCode').val(data.MatCode || '');
     $content.find('#UnitName').val(data.UnitName || '');
     $content.find('#AccountStock').val(data.account_stock ?? '');
     $content.find('#RealStock').val(data.real_stock ?? '');
     $content.find('#Gap').val(data.gap ?? '');
     $content.find('#GapDesc').val(data.gap_description || '');

     // 수정 모드: 품목/창고 변경 잠금
     if (data.mode === 'edit') {
      $content.find('#btnMatSearch').hide();
      $content.find('#cboHouse').prop('disabled', true);
     }

     // 차이 자동계산
     function recalcGap() {
      let acc  = Number($content.find('#AccountStock').val() || 0);
      let real = Number($content.find('#RealStock').val() || 0);
      $content.find('#Gap').val(real - acc);
     }
     $content.find('#RealStock').on('input', recalcGap);

     // 품목 검색 (등록 모드)
     $content.find('#btnMatSearch').click(function () {
      const houseId = $content.find('#cboHouse').val();
      if (!houseId) { Alert.alert('', '먼저 창고를 선택하세요.'); return; }

      const pop = new PopMatComponent();
      pop.material_type = 'product,sangpum';   // 필요에 맞게 조정
      pop.show(function (item) {
       $content.find('#mat_pk').val(item.id);
       $content.find('#MatName').val(item.Name);
       $content.find('#MatCode').val(item.Code);
       $content.find('#UnitName').val(item.unit_name || '');
       $content.find('#house_pk').val(houseId);

       // 선택 품목의 장부재고 조회 (★ 백엔드 구현 필요)
       let res = AjaxUtil.getSyncData(gUrl + '/stock', { house_pk: houseId, mat_pk: item.id });
       let acc = Number(res?.data?.account_stock || 0);
       $content.find('#AccountStock').val(acc);
       recalcGap();
      });
     });

     // 저장
     let doSave = function () {
      let houseId = $content.find('#cboHouse').val();

      if (!houseId)                 { Alert.alert('', '창고를 선택하세요.'); return; }
      if (!$content.find('#mat_pk').val()) { Alert.alert('', '품목을 선택하세요.'); return; }
      if (!$content.find('#TakeDate').val()){ Alert.alert('', '실사일자를 입력하세요.'); return; }
      let real = $content.find('#RealStock').val();
      if (real === '' || real == null) { Alert.alert('', '실사재고를 입력하세요.'); return; }

      let acc = Number($content.find('#AccountStock').val() || 0);
      let param = {
       take_id:       $content.find('#take_id').val() || null,
       house_pk:      houseId,
       mat_pk:        $content.find('#mat_pk').val(),
       take_date:     $content.find('#TakeDate').val(),
       account_stock: acc,
       real_stock:    Number(real),
       gap:           Number(real) - acc,
       description:   $content.find('#GapDesc').val(),
       spjangcd:      $content.find('#spjangcdHidden').val()
      };

      Alert.confirm('', '저장하시겠습니까?', function () {
       let res = AjaxUtil.postSyncData(gUrl + '/save', param);
       if (res.data?.id) {
        Notify.success('저장되었습니다.');
        _this.searchMainData();
        modalContainer.close();
       } else {
        Alert.alert('저장 실패', res.message || '서버 오류');
       }
      });
     };

     $content.find('#btnPopStockTakeSave').click(doSave);
     $content.on('keydown', function (e) {
      if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); doSave(); }
     });
    } // showStockTakeForm

    // ===================== 조회 =====================
    searchMainData() {
     let _this = this;
     let data = {
      'take_date':      $('#stockTakeDate').val(),
      'store_house_id': $('#cboStoreHouse').val(),
      'material_type':  $('#cboMaterialType').val(),
      'manage_level':   $('#cboManageLevel').val(),
      'material_group': $('#cboMaterialGroup').val(),
      'material_name':  $('#txtName').val()
     };
     let result = AjaxUtil.getSyncData(gUrl + '/read', data);
     if (result.data) {
      _this.viewData.sourceCollection = result.data;
     }
    }
   }

   let page = null;

   $(document).ready(function (e) {
    const spjangcd = sessionStorage.getItem('spjangcd');
    if (spjangcd) $('#spjangcdHidden').val(spjangcd);

    page = new StockTakePage();
    $('#stockTakeDate').val(CommonUtil.getYYYYMMDD());

    AjaxUtil.fillSelectOptions($('#cboMaterialType'), 'system_code', 'all', false, 'mat_type');
    AjaxUtil.fillSelectOptions($('#cboManageLevel'), 'user_code', 'all', false, 'mat_manage_level');
    AjaxUtil.fillSelectOptions($('#cboMaterialGroup'), 'material_group', 'all', false);
    AjaxUtil.fillSelectOptions($('#cboStoreHouse'), 'store_house', '', false);

    $('#cboMaterialType').on('change', function (e) {
     let mat_type = $('#cboMaterialType').val();
     AjaxUtil.fillSelectOptions($('#cboMaterialGroup'), 'material_group', 'all', false, mat_type);
    });

    $('#btnSearch').click(function (e) {
     page.searchMainData();
    });
    $('#cboStoreHouse').change(function (e) {
     page.searchMainData();
    });
    $('#cboManageLevel').change(function (e) {
     page.searchMainData();
    });
    $('#stockTakeDate').change(function (e) {
     page.searchMainData();
    });

    page.searchMainData();
   });
  </script>
</th:block>

<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
