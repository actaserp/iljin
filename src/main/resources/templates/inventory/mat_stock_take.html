<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>재고조정</h2>
                <a title="북마크" class="bookmark toggle">
                    내 메뉴
                </a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>재고관리</li>
                <li>재고조정</li>
            </ul>
        </div>

        <section class="section">
            <div class="section-top">
                <div class="search-wrap">
                    <dl>
                        <dt>
                            <label for="cboStoreHouse">
                                창고
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <select class="form-control2" id="cboStoreHouse" name="storehouse_id"></select>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt>
                            <label for="cboManageLevel">
                                관리등급
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <select class="form-control2" id="cboManageLevel" name="cboManageLevel" ></select>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt>
                            <label for="cboMaterialType">
                                품목유형
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <select class="form-control2" id="cboMaterialType" name="cboMaterialType"></select>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt>
                            <label for="cboMaterialGroup">
                                품목그룹
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <select class="form-control2" id="cboMaterialGroup" name="cboMaterialGroup" ></select>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt>
                            <label for="txtName">
                                품목명
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <input class="form-control2" id="txtName" name="txtName" />
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt>&nbsp;</dt>
                        <dd>
                            <li>
                                <a class="btn btn-delete" title="검색" id="btnSearch">
                                    <!--                                        class 쓰이는 곳 찾고 없으면 클래스명 수정하기-->
                                    <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                                    검색
                                </a>
                            </li>
                        </dd>
                    </dl>
                </div>
            </div>
            <div class="container-fluid">
                <div id="inventory-adjustment-grid" style="height: 730px;"></div>
            </div>
        </section>
    </div>

</th:block>

<th:block layout:fragment="scripts">

<script type="text/javascript">
    let gUrl = "/api/inventory/mat_stock_take";
    let $content;
    let modalContainer;

    class AdjustmentPage {
        constructor() {
            this.grid = null;
            this.init();
        }

        init() {
            let _this = this;
            this.grid = new EditTable('#inventory-adjustment-grid', {
                frozenColumns: 5,
                readOnly: false,
                rowNumbers: true,
                onEditEnd: (_item, _key, _v, s) => {
                    const e = {row: s.getPageRows().indexOf(_item), col: s.columns.findIndex(c => c.key === _key)};   // 위즈모 cellEditEnded 의 e
                    (() => { // cellEditEnding -> cellEditEnded
                    const column = s.columns[e.col];
                    const item = s.getPageRows()[e.row];

                    if (column.key === 'real_stock') {
                        if (item.real_stock != null && item.account_stock != null) {
                            item.gap = item.real_stock - item.account_stock;
                        }
                    }
                    })();
                    s.refreshRow(_item);   // 고친 뒤 계산한 값이 보이게 (위즈모는 편집 끝에 그 행을 다시 그렸음)
                },
                columns: [
                    { key: 'id', header: '품목번호', width: 100, align: 'right', readOnly: true },
                    { key: 'mat_type', header: '품목유형', width: 100, align: 'center', readOnly: true },
                    { key: 'mat_grp_name', header: '품목그룹', width: 150, align: 'center', readOnly: true },
                    { key: 'mat_code', header: '품목코드', width: 100, align: 'center', readOnly: true },
                    { key: 'mat_name', header: '품목명', width: 200, align: 'left', readOnly: true },
                    { key: 'manage_level', header: '관리등급', width: 100, align: 'center', readOnly: true },
                    { key: 'unit_name', header: '단위', width: 100, align: 'center', readOnly: true },
                    { key: 'account_stock', header: '장부재고', width: 100, align: 'right', readOnly: true },
                    { key: 'real_stock', header: '실사재고', width: 100, align: 'right', readOnly: false, type: 'number', },
                    { key: 'gap', header: '차이', width: 80, align: 'right', readOnly: true },
                    { key: 'gap_description', header: '차이설명', width: 200, align: 'left', readOnly: false },
                    { key: 'button', header: '', width: 80, align: 'center', readOnly: true, type: 'button', buttonText: () => userinfo.can_write() ? '저장' : null, noButtonText: '권한없음', onClick: (item, s) => {   // 위즈모 formatItem 으로 그리던 저장 버튼
                        if (item.gap === undefined) { Alert.alert('', '차이가 입력되어야 합니다.'); return; }
                        const result = AjaxUtil.postSyncData(gUrl + '/save', {house_pk: item.house_pk, mat_pk: item.id, account_stock: item.account_stock, real_stock: item.real_stock, gap: item.gap, description: item.gap_description});
                        if (result.data?.id) { Alert.alert('', '저장했습니다.'); item.last_take_date = result.data.takeTime; s.refreshRow(item); }
                    }},
                    { key: 'last_take_date', header: '최종실사일', width: 200, align: 'center', readOnly: true, format: (v, r) => r.state === 'taked' ? `${v} 확인대기` : (v || '')}
                ]
            });
            this.grid.opts.fileName = '재고 조정 목록';
        }

        searchMainData() {
            let _this = this;
            let data = {
                'store_house_id': $('#cboStoreHouse').val(),
                'material_type': $('#cboMaterialType').val(),
                'manage_level': $('#cboManageLevel').val(),
                'material_group': $('#cboMaterialGroup').val(),
                'material_name': $('#txtName').val(),
            };
            let result = AjaxUtil.getSyncData(gUrl + '/read', data);
            if (result.data) {
                _this.grid.setData(result.data);
            }
        }
    }

    let page = null;

    $(document).ready(function (e) {
        page = new AdjustmentPage();
        AjaxUtil.fillSelectOptions($('#cboMaterialType'), 'system_code', 'all', false, 'mat_type');
        AjaxUtil.fillSelectOptions($('#cboManageLevel'), 'user_code', 'all', false, 'mat_manage_level');
        AjaxUtil.fillSelectOptions($('#cboMaterialGroup'), 'material_group', 'all', false);
        AjaxUtil.fillSelectOptions($('#cboStoreHouse'), 'store_house', '', false);
        $('#cboMaterialType').on('change', function (e) {
            let mat_type = $('#cboMaterialType').val();
            AjaxUtil.fillSelectOptions($('#cboMaterialGroup'), 'material_group', 'all', false, mat_type);
        });
        // 검색
        $('#btnSearch').click(function (e) {
            page.searchMainData();
        });

        $('#cboStoreHouse').change(function (e) {
            page.searchMainData();
        });
        
        $('#cboManageLevel').change(function (e) {
            page.searchMainData();
        });

        $('#txtName').keypress(function (e) {
            if (e.keyCode == 13) 
                page.searchMainData();
        });

        //$('#stock_take_date').change(function (e) {
        //    page.searchMainData();
        //});


        page.searchMainData();

    })
</script>
</th:block>
</html>
