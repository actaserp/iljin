<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일진테크 — 생산 현황판</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html{zoom:0.75;}
        body{background:#161a21;color:#eef2f7;font-family:'Pretendard','Malgun Gothic',sans-serif;
            padding:1.6vw 2vw;min-height:100vh;}
        .wb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.4vw;padding-bottom:1.1vw;border-bottom:2px solid #2c333d;}
        .wb-head h1{font-size:clamp(28px,2.6vw,56px);font-weight:900;letter-spacing:-.5px;}
        .wb-head h1 small{font-size:clamp(14px,1vw,22px);color:#8d97a5;font-weight:600;margin-left:14px;}
        .wb-clock{font-size:clamp(22px,1.8vw,40px);font-weight:800;color:#aeb7c4;font-variant-numeric:tabular-nums;}
        /* KPI */
        .wb-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;margin-bottom:1.4vw;}
        .wk{background:#222a35;border:1px solid #333d4b;border-radius:16px;padding:1.2vw 1.5vw;}
        .wk .l{font-size:clamp(15px,1.1vw,24px);color:#9aa4b2;font-weight:700;margin-bottom:.5vw;}
        .wk .v{font-size:clamp(34px,3.4vw,72px);font-weight:900;line-height:1;letter-spacing:-1px;}
        .wk .v small{font-size:clamp(16px,1.2vw,26px);color:#9aa4b2;font-weight:700;margin-left:6px;}
        .wk.risk .v{color:#e2796f;} .wk.made .v{color:#67c6a3;}
        /* 경보 띠 */
        .wb-alert{display:flex;align-items:center;gap:1vw;background:rgba(226,121,111,.12);border:1px solid rgba(226,121,111,.4);
            border-radius:14px;padding:1vw 1.4vw;margin-bottom:1.4vw;flex-wrap:wrap;}
        .wb-alert .at{font-size:clamp(16px,1.3vw,28px);font-weight:900;color:#e2796f;white-space:nowrap;}
        .wb-alert .ac{font-size:clamp(15px,1.15vw,24px);font-weight:700;background:#2a323d;border-radius:10px;padding:.5vw 1vw;}
        .wb-alert .ac.d{color:#e2796f;} .wb-alert .ac.w{color:#d8b25f;} .wb-alert .ac.o{color:#6fa6d8;}
        .wb-alert.none{background:rgba(92,191,155,.1);border-color:rgba(92,191,155,.35);}
        .wb-alert.none .at{color:#67c6a3;}
        /* 프로젝트 카드 그리드 */
        .wb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(480px,100%),1fr));gap:1.2vw;}
        .pc{background:#222a35;border:1px solid #333d4b;border-radius:18px;padding:1.4vw 1.5vw;display:flex;flex-direction:column;gap:1vw;}
        .pc.risk{border-color:rgba(226,121,111,.6);box-shadow:0 0 0 1px rgba(226,121,111,.3) inset;}
        .pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1vw;}
        .pc-nm{font-size:clamp(24px,2vw,42px);font-weight:900;letter-spacing:-.5px;}
        .pc-due{font-size:clamp(16px,1.2vw,26px);font-weight:800;white-space:nowrap;background:#1a1f27;border:1px solid #333d4b;border-radius:10px;padding:.4vw 1vw;color:#9aa4b2;}
        .pc-due.soon{color:#e2796f;border-color:rgba(226,121,111,.5);}
        /* 단계점 */
        .wb-stages{display:flex;align-items:center;gap:.5vw;}
        .ws{flex:1;text-align:center;}
        .ws .dot{height:clamp(44px,3.2vw,68px);border-radius:12px;display:flex;align-items:center;justify-content:center;
            font-size:clamp(20px,1.6vw,34px);font-weight:800;border:2px solid;}
        .ws .dot.done{background:rgba(92,191,155,.18);border-color:rgba(92,191,155,.5);color:#67c6a3;}
        .ws .dot.cur{background:rgba(216,178,95,.2);border-color:#d8b25f;color:#e6c772;animation:bl 1.3s infinite;}
        .ws .dot.up{background:#1c222b;border-color:#333d4b;color:#5f6772;}
        .ws .nm{font-size:clamp(14px,1vw,22px);color:#9aa4b2;margin-top:.4vw;font-weight:700;}
        .ws .ct{font-size:clamp(13px,.95vw,20px);color:#7e8794;margin-top:2px;font-variant-numeric:tabular-nums;}
        @keyframes bl{0%,100%{opacity:1}50%{opacity:.55}}
        .ws-conn{width:.7vw;height:3px;background:#333d4b;flex:0 0 auto;}
        /* 진척 */
        .pc-prog{display:flex;align-items:baseline;justify-content:space-between;gap:1vw;}
        .pc-prog .big{font-size:clamp(40px,3.6vw,76px);font-weight:900;line-height:1;letter-spacing:-1px;}
        .pc-prog .sub{font-size:clamp(16px,1.2vw,26px);color:#9aa4b2;font-weight:700;text-align:right;}
        .pc-prog .sub b{color:#dde3ea;}
        .pc-track{height:clamp(12px,1vw,20px);background:#39424f;border-radius:999px;overflow:hidden;}
        .pc-track .f{height:100%;border-radius:999px;}
        .pc-foot{display:flex;gap:.6vw;flex-wrap:wrap;align-items:center;min-height:clamp(34px,2.6vw,52px);}
        .tg{font-size:clamp(14px,1.05vw,23px);font-weight:800;padding:.4vw 1vw;border-radius:10px;}
        .tg.danger{background:rgba(226,121,111,.16);color:#e2796f;} .tg.warn{background:rgba(216,178,95,.16);color:#d8b25f;}
        .tg.out{background:rgba(111,166,216,.14);color:#6fa6d8;} .tg.work{background:rgba(212,146,121,.16);color:#d49279;}
        .pc-work{font-size:clamp(15px,1.15vw,25px);color:#d49279;font-weight:700;}
    </style>
</head>
<body>
<div class="wb-head">
    <h1>일진테크 생산 현황판<small>실시간 모니터링 · 보기 전용</small></h1>
    <div class="wb-clock" id="wbClock"></div>
</div>
<div class="wb-kpi" id="wbKpi"></div>
<div id="wbAlert"></div>
<div class="wb-grid" id="wbGrid"></div>

<script>
    const PROJECTS = [
        {name: 'HMC-A23', owner: '현대차', due: '2026-07-20', dsteps: [{n:'1차검도',s:'done'},{n:'2차검도',s:'done'},{n:'3차검도',s:'cur'},{n:'출도',s:'wait'}], ship: false, outd: false, lines: [
                {name: 'MAIN', items: [
                        {code: 'RS01', need: 120, made: 78, parts: {kinds: {PLATE: {t: 259, d: 168}, 기타: {t: 1181, d: 768}}, procs: {레이저커팅: 323, 선반밀링: 295, 와이어컷: 211, 머시닝센터: 119}}, asm: 0, insp: 0, out: true, type: '내작', vendor: '', rcv: false, working: {stage: '가공', machine: 'WC-01', worker: '이종길'}},
                        {code: 'RS02', need: 80, made: 52, parts: {kinds: {기타: {t: 787, d: 512}}, procs: {레이저커팅: 215, 선반밀링: 197, 와이어컷: 140, 머시닝센터: 80}}, asm: 0, insp: 0, out: true, type: '내작', vendor: '', rcv: false, working: null},
                        {code: 'A9-801', need: 60, made: 0, asm: 0, insp: 0, out: true, type: '외작', vendor: '대성정밀', rcv: false, working: null}
                    ]},
                {name: 'SUB1', items: [
                        {code: 'LH-01', need: 40, made: 30, parts: {kinds: {기타: {t: 394, d: 296}}, procs: {레이저커팅: 124, 선반밀링: 113, 와이어컷: 81, 머시닝센터: 46}}, asm: 0, insp: 0, out: true, type: '내작', vendor: '', rcv: false, working: null},
                        {code: 'RH-01', need: 40, made: 18, parts: {kinds: {기타: {t: 394, d: 177}}, procs: {레이저커팅: 75, 선반밀링: 68, 와이어컷: 49, 머시닝센터: 28}}, asm: 0, insp: 0, out: true, type: '내작', vendor: '', rcv: false, working: {stage: '가공', machine: 'LC-02', worker: '채완병'}}
                    ]}
            ]},
        {name: 'KIA-K8', owner: '기아', due: '2026-07-02', dsteps: [{n:'1차검도',s:'done'},{n:'2차검도',s:'done'},{n:'출도',s:'done'}], ship: false, outd: false, lines: [
                {name: 'MAIN', items: [
                        {code: 'K8-RS1', need: 140, made: 140, parts: {kinds: {PLATE: {t: 302, d: 302}, 기타: {t: 1378, d: 1378}}, procs: {레이저커팅: 504, 선반밀링: 504, 와이어컷: 378, 머시닝센터: 214}}, asm: 90, insp: 0, out: true, type: '내작', vendor: '', rcv: false, working: {stage: '조립', machine: '조립1', worker: '우병철'}},
                        {code: 'K8-RS2', need: 100, made: 100, parts: {kinds: {기타: {t: 984, d: 984}}, procs: {레이저커팅: 360, 선반밀링: 360, 와이어컷: 270, 머시닝센터: 153}}, asm: 70, insp: 0, out: true, type: '내작', vendor: '', rcv: false, working: null}
                    ]},
                {name: 'SUB1', items: [
                        {code: 'K8-LH1', need: 60, made: 60, parts: {kinds: {기타: {t: 590, d: 590}}, procs: {레이저커팅: 216, 선반밀링: 216, 와이어컷: 162, 머시닝센터: 92}}, asm: 45, insp: 0, out: true, type: '내작', vendor: '', rcv: false, working: null},
                        {code: 'K8-OUT', need: 40, made: 0, asm: 0, insp: 0, out: true, type: '외작', vendor: '동양지그', rcv: true, working: null}
                    ]}
            ]},
        {name: 'GM-크루즈', owner: 'GM', due: '2026-07-06', dsteps: [{n:'1차검도',s:'cur'},{n:'2차검도',s:'wait'},{n:'출도',s:'wait'}], ship: false, outd: false, lines: [
                {name: 'MAIN', items: [
                        {code: 'GM-01', need: 90, made: 12, parts: {kinds: {기타: {t: 886, d: 118}}, procs: {레이저커팅: 50, 선반밀링: 45, 와이어컷: 32, 머시닝센터: 18}}, asm: 0, insp: 0, out: false, type: '내작', vendor: '', rcv: false, working: null},
                        {code: 'GM-02', need: 50, made: 0, asm: 0, insp: 0, out: false, type: '외작', vendor: '대성정밀', rcv: false, working: null}
                    ]},
                {name: 'SUB1', items: [
                        {code: 'GM-11', need: 40, made: 5, parts: {kinds: {기타: {t: 394, d: 49}}, procs: {레이저커팅: 21, 선반밀링: 19, 와이어컷: 14, 머시닝센터: 8}}, asm: 0, insp: 0, out: false, type: '내작', vendor: '', rcv: false, working: null}
                    ]}
            ]},
        {name: 'KIA-쏘렌토', owner: '기아', due: '2026-08-25', dsteps: [{n:'1차검도',s:'done'},{n:'출도',s:'done'}], ship: false, outd: false, lines: [
                {name: 'MAIN', items: [
                        {code: 'SR-01', need: 80, made: 80, parts: {kinds: {PLATE: {t: 173, d: 173}, 기타: {t: 787, d: 787}}, procs: {레이저커팅: 288, 선반밀링: 288, 와이어컷: 216, 머시닝센터: 122}}, asm: 80, insp: 80, out: true, type: '내작', vendor: '', rcv: false, working: null},
                        {code: 'SR-02', need: 60, made: 60, asm: 60, insp: 60, out: true, type: '외작', vendor: '한길테크', rcv: true, working: null}
                    ]}
            ]},
        {name: 'HMC-팰리세이드', owner: '현대차', due: '2026-07-15', dsteps: [{n:'1차검도',s:'done'},{n:'2차검도',s:'done'},{n:'출도',s:'done'}], ship: false, outd: false, lines: [
                {name: 'MAIN', items: [
                        {code: 'PA-01', need: 100, made: 100, parts: {kinds: {PLATE: {t: 216, d: 216}, 기타: {t: 984, d: 984}}, procs: {레이저커팅: 360, 선반밀링: 360, 와이어컷: 270, 머시닝센터: 153}}, asm: 100, insp: 35, out: true, type: '내작', vendor: '', rcv: false, working: {stage: '검사', machine: '검사1', worker: '유현민'}},
                        {code: 'PA-02', need: 60, made: 60, asm: 60, insp: 20, out: true, type: '외작', vendor: '동양지그', rcv: true, working: null}
                    ]}
            ]}
    ];

    const flat = p => p.lines.reduce((a, l) => a.concat(l.items), []);
    // 외작 제작수량 = 입고완료(rcv) 시 need만큼(공정 통째 입고, 수량재고 없음), 미입고면 0
    const itemMade = x => x.type === '외작' ? (x.rcv ? x.need : 0) : x.made;
    function agg(items) {
        const need = items.reduce((s, x) => s + x.need, 0);
        const made = items.reduce((s, x) => s + itemMade(x), 0);
        const asm = items.reduce((s, x) => s + (x.asm || 0), 0);
        const insp = items.reduce((s, x) => s + (x.insp || 0), 0);
        const inNeed = items.filter(x => x.type === '내작').reduce((s, x) => s + x.need, 0);
        const inMade = items.filter(x => x.type === '내작').reduce((s, x) => s + x.made, 0);
        const outNeed = items.filter(x => x.type === '외작').reduce((s, x) => s + x.need, 0);
        const outMade = items.filter(x => x.type === '외작').reduce((s, x) => s + itemMade(x), 0);
        const outAll = items.filter(x => x.type === '외작').length;
        const outRcv = items.filter(x => x.type === '외작' && x.rcv).length;
        const outWait = items.filter(x => !x.out).length;
        const working = items.filter(x => x.working);
        return {need, made, asm, insp, rem: Math.max(0, need - made), rate: need ? Math.round(made / need * 100) : 0,
            inNeed, inMade, outNeed, outMade, outAll, outRcv, outWait, working, cnt: items.length,
            prog: prodProg(items)};
    }
    // 생산 진척(%) = 제작 달성 (내작 생산 + 외작 입고) / 전체 필요. ※설계·조립·검사는 %에 안 섞음
    function prodProg(items) {
        const need = items.reduce((s, x) => s + x.need, 0);
        const made = items.reduce((s, x) => s + itemMade(x), 0);
        return need ? Math.round(made / need * 100) : 0;
    }
    // 단계별 완료수/대상수.  설계·조립·검사 = 공정(품목) 개수, 제작 = 유니트
    //  조립 공정 = 그 공정 유닛이 모두 조립완료(asm>=need)된 공정 / 검사 = insp>=need
    function stageStats(items) {
        const need = items.reduce((s, x) => s + x.need, 0);
        const cnt = items.length;
        const asmDone = items.filter(x => x.need > 0 && (x.asm || 0) >= x.need).length;
        const inspDone = items.filter(x => x.need > 0 && (x.insp || 0) >= x.need).length;
        return {
            design: {d: items.filter(x => x.out).length, t: cnt, unit: '공정'},
            make: {d: items.reduce((s, x) => s + itemMade(x), 0), t: need, unit: '유니트'},
            asm: {d: asmDone, t: cnt, unit: '공정'},
            insp: {d: inspDone, t: cnt, unit: '공정'}
        };
    }
    // 단계 상태: done(d>=t) / cur(0<d<t) / up(0) — 순차 아님(중간검사 등 독립 진행 허용)
    function stageState(st) { if (st.t > 0 && st.d >= st.t) return 'done'; if (st.d > 0) return 'cur'; return 'up'; }
    // 설계 상태: 검도 스텝 + 출도 종합 (1차검도만 시작돼도 설계 진행중)
    function designState(items, dsteps) {
        const ss = stageStats(items);
        const outDone = ss.design.t > 0 && ss.design.d >= ss.design.t;
        const dz = dsteps || [];
        const dzAllDone = dz.length > 0 && dz.every(x => x.s === 'done');
        const dzStarted = dz.some(x => x.s === 'done' || x.s === 'cur');
        if (outDone && (dz.length === 0 || dzAllDone)) return 'done';
        if (dzStarted || ss.design.d > 0) return 'cur';
        return 'up';
    }
    function isAllDone(p) {
        const ss = stageStats(flat(p));
        return ss.insp.t > 0 && ss.insp.d >= ss.insp.t && ss.asm.d >= ss.asm.t;
    }
    const NEAR = 7;   // 납기 임박 기준(일) — 지연위험·출도지연·외주미입고 공통
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const dday = due => { const d = new Date(due); d.setHours(0, 0, 0, 0); return Math.round((d - today) / 86400000); };
    function risk(p) {
        const items = flat(p), a = agg(items), d = dday(p.due), tags = [];
        const allDone = isAllDone(p);
        const near = d >= 0 && d <= NEAR;
        let danger = false;
        if (!allDone) {
            if (d < 0) { tags.push(['danger', '납기초과']); danger = true; }
            else if (near) { tags.push(['danger', 'D-' + d + ' 지연위험']); danger = true; }
        }
        // 출도지연 = 임박 + 미출도 공정 존재
        if (near && a.outWait > 0) tags.push(['out', 'D-' + d + ' 출도지연 ' + a.outWait + '공정']);
        // 외주 미입고 = 임박 + 미입고 외작 존재 (전체 미입고는 외주현황 섹션에서)
        const outLagNear = (near || d < 0) ? items.filter(x => x.type === '외작' && !x.rcv).length : 0;
        if (outLagNear > 0) tags.push(['warn', '외주 미입고 ' + outLagNear + '(임박)']);
        return {danger, tags, d, prog: a.prog, allDone};
    }
    function score(p) {
        const r = risk(p), a = agg(flat(p));
        let s = (100 - a.prog);
        if (!r.allDone) s += Math.max(0, 100 - r.d);
        r.tags.forEach(t => s += t[0] === 'danger' ? 60 : t[0] === 'warn' ? 25 : 10);
        return s;
    }



    const rateColor = r => r >= 100 ? '#5cbf9b' : '#5f8fc0';
    const fill = (pct, c) => '<div class="f" style="width:' + Math.min(100, pct) + '%;background:' + c + '"></div>';


    const STAGES = ["설계","제작","조립","검사"];
    const $ = s => document.querySelector(s);
    const nf = n => (n||0).toLocaleString();

    function renderKpi(){
        const all = PROJECTS.reduce((a,p)=>a.concat(flat(p)),[]);
        const a = agg(all);
        const riskN = PROJECTS.filter(p=>risk(p).danger).length;
        $('#wbKpi').innerHTML =
            '<div class="wk"><div class="l">총 필요 유니트</div><div class="v">'+nf(a.need)+'<small>개</small></div></div>'
            +'<div class="wk made"><div class="l">생산·입고 완료</div><div class="v">'+nf(a.made)+'<small>개</small></div></div>'
            +'<div class="wk"><div class="l">남은 수량</div><div class="v" style="color:#d8b25f">'+nf(a.rem)+'<small>개</small></div></div>'
            +'<div class="wk risk"><div class="l">지연 위험</div><div class="v">'+riskN+'<small>건</small></div></div>';
    }
    function renderAlert(){
        const items=[];
        PROJECTS.forEach(p=>risk(p).tags.forEach(t=>{
            if(t[0]==='danger') items.push(['d',p.name+' · '+t[1]]);
            else if(t[0]==='warn') items.push(['w',p.name+' · '+t[1]]);
            else items.push(['o',p.name+' · '+t[1]]);
        }));
        if(!items.length){$('#wbAlert').innerHTML='<div class="wb-alert none"><span class="at">✓ 지연 위험·출도 지연 없음</span></div>';return;}
        items.sort((a,b)=>({d:0,w:1,o:2}[a[0]]-{d:0,w:1,o:2}[b[0]]));
        $('#wbAlert').innerHTML='<div class="wb-alert"><span class="at">⚠ 조기경보</span>'
            +items.map(x=>'<span class="ac '+x[0]+'">'+x[1]+'</span>').join('')+'</div>';
    }
    function stageDots(items,dsteps){
        const ss=stageStats(items), keys=['design','make','asm','insp'];
        let h='';
        STAGES.forEach((s,i)=>{
            const st=ss[keys[i]];
            const state=(i===0)?designState(items,dsteps):stageState(st);
            const mk=state==='done'?'●':state==='cur'?'◐':'○';
            h+='<div class="ws"><div class="dot '+state+'">'+mk+'</div><div class="nm">'+s+'</div><div class="ct">'+nf(st.d)+'/'+nf(st.t)+'</div></div>';
            if(i<STAGES.length-1) h+='<div class="ws-conn"></div>';
        });
        return '<div class="wb-stages">'+h+'</div>';
    }
    function render(){
        const list=PROJECTS.map((p,i)=>({p,i,s:score(p)})).filter(o=>!isAllDone(o.p)).sort((a,b)=>b.s-a.s);
        $('#wbGrid').innerHTML=list.map(o=>{
            const p=o.p, a=agg(flat(p)), col=rateColor(a.prog), r=risk(p);
            const d=r.d, soon=d<=7&&!r.allDone;
            const dueTxt=d<0?('납기 '+(-d)+'일 초과'):('D-'+d);
            const tags=r.tags.map(t=>'<span class="tg '+t[0]+'">'+t[1]+'</span>').join('');
            const work=a.working.length?'<div class="pc-work">▶ '+a.working.map(w=>(w.working.stage||'')+'·'+w.working.worker).join(', ')+'</div>':'';
            return '<div class="pc '+(r.danger?'risk':'')+'">'
                +'<div class="pc-top"><span class="pc-nm">'+p.name+'</span><span class="pc-due '+(soon?'soon':'')+'">'+dueTxt+'</span></div>'
                +stageDots(flat(p),p.dsteps)
                +'<div class="pc-prog"><span class="big" style="color:'+col+'">'+a.prog+'<small style="font-size:.4em;color:#9aa4b2">% 생산진척</small></span>'
                +'<span class="sub">생산 <b>'+nf(a.made)+'</b>/'+nf(a.need)+'<br>남음 <b>'+nf(a.rem)+'</b></span></div>'
                +'<div class="pc-track">'+fill(a.prog,col)+'</div>'
                +'<div class="pc-foot">'+tags+work+'</div>'
                +'</div>';
        }).join('') || '<div style="padding:3vw;text-align:center;color:#9aa4b2;font-size:1.4vw">진행 중인 프로젝트가 없습니다</div>';
    }
    function tick(){ $('#wbClock').textContent=new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
    renderKpi(); renderAlert(); render(); tick();
    setInterval(tick,1000);
    setInterval(()=>{renderKpi();renderAlert();render();},30000);
</script>
</body>
</html>
