<html layout:decorate="~{layout_page}">
<head>
    <style>
        #paWrap{background:#1b1f27;color:#f3f6f9;min-height:100vh;padding:1.6vw 1.8vw 4vw;font-family:'Pretendard','Malgun Gothic',sans-serif;font-size:clamp(14px,0.85vw,18px);}
        #paInner{max-width:1500px;margin:0 auto;}
        #paWrap *{box-sizing:border-box;}
        .pa-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:12px;}
        .pa-head h2{font-size:clamp(22px,1.5vw,32px);font-weight:700;margin:0;}
        .pa-head .sub{font-size:12px;color:#aeb7c4;margin-top:3px;}
        .view-only{font-size:11px;color:#7e8794;border:1px solid #2a2f38;border-radius:6px;padding:3px 9px;margin-left:10px;}
        .pa-right{display:flex;align-items:center;gap:16px;}
        .pa-clock{font-size:clamp(20px,1.4vw,32px);font-weight:600;color:#6c9fd1;font-variant-numeric:tabular-nums;}
        .seg{display:flex;gap:6px;}
        .seg button{border:1px solid #404a59;background:#272f3a;color:#aeb7c4;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;}
        .seg button.on{background:#2f4a6b;border-color:#5f8fc0;color:#e6ebf1;}
        @keyframes pablink{0%,100%{opacity:1}50%{opacity:.3}}

        .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
        .kpi{background:#272f3a;border:1px solid #404a59;border-radius:12px;padding:1vw 1.2vw;}
        .kpi .l{font-size:clamp(13px,0.95vw,20px);color:#aeb7c4;}
        .kpi .v{font-size:clamp(24px,1.8vw,36px);font-weight:700;margin-top:3px;}
        .kpi .v small{font-size:13px;color:#aeb7c4;font-weight:600;}
        .kpi.plan .v{color:#f3f6f9;} .kpi.act .v{color:#6c9fd1;} .kpi.rate .v{color:#5cbf9b;} .kpi.risk .v{color:#d4685f;}

        .sec-label{font-size:clamp(14px,1vw,20px);color:#aeb7c4;font-weight:700;margin:2px 0 10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
        .sec-label .legend{font-weight:500;color:#7e8794;font-size:11px;}

        #itemRows{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:22px;}
        .icard{background:#272f3a;border:1px solid #404a59;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:11px;}
        .icard.under{border-color:rgba(248,81,73,.5);}
        .ic-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
        .ic-head .nm{font-size:clamp(17px,1.2vw,24px);font-weight:800;}
        .ic-head .nm small{font-size:12px;color:#aeb7c4;font-weight:600;margin-left:5px;}
        .ic-due{font-size:12px;color:#aeb7c4;font-weight:700;background:#1e242d;border:1px solid #404a59;border-radius:7px;padding:3px 9px;white-space:nowrap;}
        .ic-due.soon{color:#d4685f;border-color:rgba(248,81,73,.4);}
        .ic-mid{display:flex;align-items:baseline;justify-content:space-between;}
        .ic-prog{font-size:clamp(28px,2.1vw,42px);font-weight:800;line-height:1;}
        .ic-prog small{font-size:13px;color:#aeb7c4;font-weight:600;margin-left:3px;}
        .ic-qty{font-size:clamp(13px,1vw,20px);color:#bcc4ce;text-align:right;}
        .ic-qty .m{color:#6c9fd1;font-weight:800;}
        .ic-track{height:10px;background:#39424f;border-radius:999px;overflow:hidden;}
        .ic-track .f{height:100%;border-radius:999px;}
        .ic-foot{display:flex;justify-content:space-between;font-size:12px;color:#aeb7c4;}
        .ic-foot .rem{color:#d3aa55;font-weight:700;}

        table.dt{width:100%;border-collapse:collapse;background:#272f3a;border:1px solid #404a59;border-radius:12px;overflow:hidden;}
        table.dt th,table.dt td{padding:0.7vw 1vw;font-size:clamp(13px,1vw,20px);text-align:center;border-bottom:1px solid #333c48;}
        table.dt th{background:#20262f;color:#aeb7c4;font-weight:700;}
        table.dt td{color:#ccd3dc;} table.dt td.k{font-weight:800;color:#f3f6f9;text-align:left;}
        table.dt tr:last-child td{border-bottom:0;}
        .plan-c{color:#e6ebf1;font-weight:700;} .act-c{color:#6c9fd1;font-weight:700;}
        .bar-cell{width:26%;}
        .mini{height:8px;background:#39424f;border-radius:999px;overflow:hidden;}
        .mini .f{height:100%;border-radius:999px;}
        .rate-c{font-weight:800;} .rate-c.hi{color:#5cbf9b;} .rate-c.mid{color:#d3aa55;} .rate-c.lo{color:#d4685f;}
    </style>
</head>
<th:block layout:fragment="content">
    <div id="paWrap">
        <div id="paInner">
            <div class="pa-head">
                <div>
                    <h2>계획 대비 실적<span class="view-only">읽기 전용 · 모니터링</span></h2>
                    <div class="sub">품목 · 공정별 계획 수량 대비 누적 실적(양품) 및 달성률</div>
                </div>
                <div class="pa-right">
                    <div class="seg" id="seg">
                        <button data-k="all" class="on">전체</button>
                        <button data-k="under">미달만</button>
                    </div>
                    <span class="pa-clock" id="paClock"></span>
                </div>
            </div>

            <div class="kpi-row" id="kpiRow"></div>

            <div class="sec-label">
                <span>유형별 계획 대비 실적</span>
                <span class="legend">달성률 ●100%↑ 초록 ◐80~99% 노랑 ○80%↓ 빨강</span>
            </div>
            <div id="itemRows"></div>

            <!-- 공정에는 계획이 없다. 어느 부품이 어느 공정을 거치는지 모르기 때문이다(SPEC 3-2).
                 작업량만 보여준다. -->
            <div class="sec-label"><span>공정별 작업량</span>
                <span class="legend">계획 없음 — 어느 부품이 어느 공정을 거치는지 알 수 없습니다</span></div>
            <table class="dt">
                <thead><tr><th style="text-align:left">공정</th><th>처리량</th>
                    <th class="bar-cell">비중</th><th>불량</th></tr></thead>
                <tbody id="procBody"></tbody>
            </table>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript" th:inline="none">
        (function () {
            /*
             * 계획 대비 실적
             *
             * ★ '계획' 은 <b>부품표 필요량</b>이다 (BOM 합계, 참값).
             *   '실적' 은 가공 실적인데 <b>공정별 최댓값</b>을 쓴다.
             *   합치면 실물보다 커지고(한 부품이 공정마다 다시 세어진다),
             *   최솟값은 절단만 한 것도 완성으로 안 쳐 지나치게 낮다.
             *   최댓값은 "적어도 이만큼은 존재한다" 는 하한이라 한 방향으로만 틀린다.
             *
             * ★ 공정에는 계획이 없다.
             *   라우팅이 없어 어느 부품이 어느 공정을 거치는지 모른다(SPEC 3-2).
             *   그래서 아래 표는 달성률이 아니라 작업량만 보여준다.
             *
             * ★ 전역 $ 를 덮지 않는다 — AjaxUtil 이 깨진다. el() 을 쓴다.
             */
            /* ★ 즉시실행 함수 안에 둔다.
                 layout_page 에 같은 이름의 전역이 있으면 const 재선언에서
                 스크립트가 통째로 죽고, 그러면 API 호출이 아예 안 나간다. */
            const el = s => document.querySelector(s);
            const nf = n => Number(n || 0).toLocaleString();
            const esc = v => (v == null ? '' : String(v))
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            const API = '/api/production/dash_project';
            // jQuery 가 없거나 요소가 없어도 죽지 않게 한다
            const SPJANGCD = (typeof $ === 'function' && $('#spjangcd').length)
                ? ($('#spjangcd').val() || 'ZZ') : 'ZZ';

            let mode = 'all';                    // all | under
            let DATA = {kinds: [], proc: []};

            const getJSON = (url, param) => new Promise(res =>
                AjaxUtil.getAsyncData(url, param,
                    r => res(r || {success: false, data: null}),
                    () => res({success: false, data: null})));

            async function load() {
                const r = await getJSON(API + '/plan_actual', {spjangcd: SPJANGCD});
                DATA = r.data || {kinds: [], proc: []};
                render();
            }

            const rate = (a, p) => (+p > 0) ? Math.round((+a || 0) / (+p) * 100) : 0;
            // 목업이 준비한 클래스명을 그대로 쓴다 (hi/mid/lo)
            const rateCls = r => r >= 100 ? 'hi' : (r >= 80 ? 'mid' : 'lo');
            const rateColor = r => r >= 100 ? '#5cbf9b' : (r >= 80 ? '#d3aa55' : '#d4685f');

            function render() { renderKpi(); renderKinds(); renderProc(); }

            function renderKpi() {
                const ks = DATA.kinds || [];
                const plan = ks.reduce((s, k) => s + (+k.plan_qty || 0), 0);
                const act = ks.reduce((s, k) => s + (+k.act_qty || 0), 0);
                const under = ks.filter(k => (+k.plan_qty || 0) > 0
                    && rate(k.act_qty, k.plan_qty) < 100).length;

                el('#kpiRow').innerHTML = `
                <div class="kpi plan"><div class="l">계획 (부품표 합계)</div>
                    <div class="v">${nf(plan)}<small> 개</small></div></div>
                <div class="kpi act"><div class="l">실적 (공정 최대 처리량)</div>
                    <div class="v">${nf(act)}<small> 개</small></div></div>
                <div class="kpi rate"><div class="l">달성률</div>
                    <div class="v">${rate(act, plan)}<small> %</small></div></div>
                <div class="kpi risk"><div class="l">미달 유형</div>
                    <div class="v">${under}<small> 종</small></div></div>`;
            }

            function renderKinds() {
                let ks = (DATA.kinds || []).slice();
                if (mode === 'under') {
                    ks = ks.filter(k => (+k.plan_qty || 0) > 0
                        && rate(k.act_qty, k.plan_qty) < 100);
                }
                const box = el('#itemRows');
                if (!ks.length) {
                    box.innerHTML = '<div style="color:#6a7482;padding:20px 0">'
                        + (mode === 'under' ? '미달 유형이 없습니다.' : '데이터가 없습니다.') + '</div>';
                    return;
                }
                box.innerHTML = ks.map(k => {
                    const p = +k.plan_qty || 0, a = +k.act_qty || 0;
                    const r = rate(a, p);
                    return `<div class="icard ${p > 0 && r < 100 ? 'under' : ''}">
                    <div class="ic-head">
                        <span class="nm">${esc(k.kind)}<small>유형</small></span>
                        <span class="ic-due ${p > a ? 'soon' : ''}">${p > a ? '미달' : '달성'}</span>
                    </div>
                    <div class="ic-mid">
                        <span class="ic-prog" style="color:${rateColor(r)}">${p ? r : '-'}<small>%</small></span>
                        <span class="ic-qty"><span class="m">${nf(a)}</span> / ${nf(p)}</span>
                    </div>
                    <div class="ic-track"><div class="f"
                        style="width:${Math.min(100, r)}%;background:${rateColor(r)}"></div></div>
                    <div class="ic-foot"><span>계획 ${nf(p)}</span>
                        <span class="rem">${p > a ? '잔량 ' + nf(p - a) : '완료'}</span></div>
                </div>`;
                }).join('');
            }

            function renderProc() {
                const ps = DATA.proc || [];
                const body = el('#procBody');
                if (!ps.length) {
                    body.innerHTML = '<tr><td colspan="4" style="color:#6a7482;padding:22px 0">'
                        + '실적이 없습니다.</td></tr>';
                    return;
                }
                const max = Math.max(...ps.map(p => +p.qty || 0), 1);
                body.innerHTML = ps.map(p => {
                    const q = +p.qty || 0, n = +p.ng || 0;
                    return `<tr>
                    <td style="text-align:left">${esc(p.operation)}</td>
                    <td class="act-c">${nf(q)}</td>
                    <td class="bar-cell"><div class="mini"><div class="f"
                        style="width:${(q / max * 100).toFixed(1)}%;background:#6c9fd1"></div></div></td>
                    <td class="rate-c ${n ? 'lo' : ''}">${n ? nf(n) : '-'}</td>
                </tr>`;
                }).join('');
            }

            el('#seg').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
                el('#seg').querySelectorAll('[data-k]').forEach(x => x.classList.remove('on'));
                b.classList.add('on');
                mode = b.dataset.k;
                renderKinds();
            });

            function tick() {
                const d = new Date(), p = n => String(n).padStart(2, '0');
                el('#paClock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
            }
            tick();
            setInterval(tick, 1000);

            /* ★ 즉시 호출한다. 이 스크립트는 body 끝에서 실행되므로
         $(document).ready 는 이미 지나 콜백이 안 불릴 수 있다.
         dash_project 도 같은 방식이다. */
            load();
            setInterval(load, 60000);   // 벽걸이 대비 — 사람이 새로고침하지 않는다
        })();
    </script>
</th:block>
</html>
