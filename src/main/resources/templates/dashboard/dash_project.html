<html layout:decorate="~{layout_page}">
<head>
    <style>
        #dashWrap{background:#0d1117;color:#e6edf3;min-height:100vh;padding:24px 28px;font-family:'Pretendard','Malgun Gothic',sans-serif;}
        #dashWrap .dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
        #dashWrap .dash-head h1{font-size:30px;font-weight:800;color:#fff;margin:0;}
        #dashWrap .dash-clock{font-size:22px;font-weight:600;color:#58a6ff;font-variant-numeric:tabular-nums;}
        .working-banner{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px 18px;margin-bottom:18px;}
        .wb-title{font-size:14px;color:#f0b72f;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:8px;}
        .wb-dot{width:9px;height:9px;border-radius:50%;background:#f0b72f;animation:blink 1.1s infinite;}@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
        .wb-list{display:flex;flex-wrap:wrap;gap:10px;} .wb-item{background:#21262d;border-radius:9px;padding:8px 14px;border-left:3px solid #f0b72f;}
        .wb-item .k{font-size:15px;font-weight:800;color:#fff;} .wb-item .w{font-size:13px;color:#c9d1d9;} .wb-empty{color:#8b949e;font-size:14px;}
        .sec-label{font-size:14px;color:#8b949e;font-weight:700;margin:0 0 10px;}
        /* 프로젝트 요약 카드 */
        .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:22px;}
        .proj-card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px 18px;cursor:pointer;transition:.15s;}
        .proj-card:hover{border-color:#58a6ff;transform:translateY(-2px);} .proj-card.active{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.3);}
        .pc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
        .pc-name{font-size:20px;font-weight:700;color:#fff;} .pc-jigs{font-size:12px;color:#58a6ff;font-weight:600;background:rgba(88,166,255,.12);padding:3px 10px;border-radius:20px;white-space:nowrap;}
        .jg{margin-top:10px;} .jg .gl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:#8b949e;} .jg .gl b{font-weight:700;}
        .gtrack{height:9px;background:#21262d;border-radius:6px;overflow:hidden;} .gfill{height:100%;border-radius:6px;}
        .gfill.out{background:linear-gradient(90deg,#1f6feb,#58a6ff);} .gfill.fin{background:linear-gradient(90deg,#238636,#3fb950);}
        .pc-stats{display:flex;gap:16px;margin-top:13px;font-size:13px;color:#c9d1d9;} .pc-stats b{color:#fff;font-size:15px;}
        .pc-working{margin-left:auto;color:#f0b72f;font-weight:700;font-size:12px;}
        /* 지그 아코디언 */
        .jig-wrap{margin-bottom:18px;}
        .jig-block{background:#161b22;border:1px solid #30363d;border-radius:14px;margin-bottom:12px;overflow:hidden;}
        .jig-head{display:flex;align-items:center;gap:18px;padding:15px 20px;cursor:pointer;} .jig-head:hover{background:#1b212a;} .jig-block.open .jig-head{border-bottom:1px solid #30363d;}
        .jig-name{font-size:19px;font-weight:700;color:#fff;min-width:220px;} .jig-name .jn-no{font-size:12px;color:#58a6ff;font-weight:600;background:rgba(88,166,255,.12);padding:2px 9px;border-radius:14px;margin-left:8px;}
        .jig-gauges{flex:1;display:flex;gap:22px;max-width:500px;} .jig-stat{font-size:13px;color:#c9d1d9;white-space:nowrap;} .jig-stat b{color:#fff;}
        .jig-toggle{color:#8b949e;font-size:18px;transition:.2s;} .jig-block.open .jig-toggle{transform:rotate(180deg);}
        .jig-detail{display:none;padding:14px 20px 18px;background:#0f141b;} .jig-block.open .jig-detail{display:block;}
        .unit-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #21262d;flex-wrap:wrap;} .unit-row:first-child{border-top:0;}
        .ur-name{font-size:16px;font-weight:700;color:#fff;min-width:80px;}
        .bdg{font-size:11px;font-weight:700;padding:3px 10px;border-radius:13px;}
        .bdg.out{background:rgba(88,166,255,.16);color:#58a6ff;}.bdg.no{background:rgba(240,183,47,.16);color:#f0b72f;}
        .bdg.fin{background:rgba(63,185,80,.18);color:#3fb950;}.bdg.ing{background:#21262d;color:#8b949e;}
        .item-chips{display:flex;flex-wrap:wrap;gap:7px;margin-left:auto;} .ic{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:5px 10px;font-size:12.5px;color:#c9d1d9;}
        .ic.done{border-color:rgba(63,185,80,.4);color:#3fb950;} .ic .k{font-size:11px;color:#58a6ff;margin-left:4px;}
        .foot-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px 18px;}
        .foot-strip .fl{font-size:13px;color:#8b949e;font-weight:700;margin-right:6px;} .foot-strip .c{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:7px 12px;font-size:13px;color:#c9d1d9;} .foot-strip .c b{color:#58a6ff;font-size:16px;} .foot-strip .c.scrap b{color:#f0b72f;}
    </style>
</head>
<th:block layout:fragment="content">
    <div id="dashWrap">
        <div class="dash-head"><h2 data-layout-toggle-anchor>생산 현황판 · 프로젝트</h2><span class="dash-clock" id="clock"></span></div>
        <div class="working-banner"><div class="wb-title"><span class="wb-dot"></span>현재 작업중</div><div class="wb-list" id="working"></div></div>

        <p class="sec-label">프로젝트</p>
        <div class="proj-grid" id="projGrid"></div>

        <p class="sec-label" id="jigLabel"></p>
        <div class="jig-wrap" id="jigList"></div>

        <div class="foot-strip" id="foot"></div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript" th:inline="none">
        const $=s=>document.querySelector(s);
        let stock={plate:{g:300,s:12},block:{g:120,s:5},shim:{g:60,s:0},brkt:{g:40,s:0}};
        let working=[{kind:'plate',worker:'홍길동'},{kind:'block',worker:'김철수'}];
        let PROJECTS=[
            {nm:'LW 호원', jigs:[
                    {no:'A9-760-FD10',nm:'FR DR 패널 지그',units:[
                            {nm:'U201',out:true,fin:true,items:[ ['JOINT PLATE','plate'],['LOC BLOCK','block'],['SHIM 3T','shim']]},
                            {nm:'U227',out:true,fin:false,items:[ ['UNIT PLATE','plate'],['PIN BRKT','brkt'],['PIN BLOCK','block']]},
                            {nm:'P228',out:false,fin:false,items:[ ['(미정) plate','plate'],['(미정) block','block']]},
                        ]},
                    {no:'A9-820',nm:'RR DR 패널 지그',units:[
                            {nm:'U301',out:false,fin:false,items:[ ['(미정) plate','plate']]},
                            {nm:'U302',out:true,fin:true,items:[ ['BASE PLATE','plate'],['GUIDE','block']]},
                        ]},
                ]},
            {nm:'대우 2차', jigs:[
                    {no:'B1-100',nm:'사이드 멤버 지그',units:[{nm:'U410',out:true,fin:false,items:[ ['SIDE PLATE','plate'],['ARM','arm']]}]},
                    {no:'B1-200',nm:'리어 멤버 지그',units:[{nm:'U420',out:false,fin:false,items:[ ['REAR PLATE','plate']]}]},
                ]},
        ];
        let selP=0, openJig=null;
        function clock(){$('#clock').textContent=new Date().toLocaleTimeString('ko-KR');}setInterval(clock,1000);clock();
        function renderWorking(){$('#working').innerHTML=working.length?working.map(w=>`<div class="wb-item"><span class="k">${w.kind}</span> <span class="w">👤 ${w.worker}</span></div>`).join(''):'<div class="wb-empty">작업중 없음</div>';}
        function jigStat(j){const n=j.units.length,fin=j.units.filter(u=>u.fin).length,out=j.units.filter(u=>u.out).length;return{n,fin,out,finPct:Math.round(fin/n*100),outPct:Math.round(out/n*100)};}
        function projStat(p){let n=0,fin=0,out=0;p.jigs.forEach(j=>j.units.forEach(u=>{n++;if(u.fin)fin++;if(u.out)out++;}));return{jigs:p.jigs.length,n,fin,out,finPct:n?Math.round(fin/n*100):0,outPct:n?Math.round(out/n*100):0};}
        function renderProjCards(){
            $('#projGrid').innerHTML=PROJECTS.map((p,i)=>{const s=projStat(p);
                return `<div class="proj-card ${selP===i?'active':''}" data-i="${i}">
      <div class="pc-top"><div class="pc-name">${p.nm}</div><div class="pc-jigs">지그 ${s.jigs}</div></div>
      <div class="jg"><div class="gl"><span>2D 출도율</span><b style="color:#58a6ff">${s.outPct}%</b></div><div class="gtrack"><div class="gfill out" style="width:${s.outPct}%"></div></div></div>
      <div class="jg"><div class="gl"><span>유니트 완료율</span><b style="color:#3fb950">${s.finPct}%</b></div><div class="gtrack"><div class="gfill fin" style="width:${s.finPct}%"></div></div></div>
      <div class="pc-stats"><span>완료 <b>${s.fin}</b>/${s.n}</span><span>출도 <b>${s.out}</b>/${s.n}</span></div></div>`;
            }).join('');
            $('#projGrid').querySelectorAll('.proj-card').forEach(c=>c.onclick=()=>{selP=+c.dataset.i;openJig=null;renderProjCards();renderJigs();});
        }
        function renderJigs(){
            const p=PROJECTS[selP];
            $('#jigLabel').textContent=`${p.nm} · 지그`;
            $('#jigList').innerHTML=p.jigs.map((j,i)=>{const s=jigStat(j);const open=openJig===i;
                return `<div class="jig-block ${open?'open':''}">
      <div class="jig-head" data-i="${i}">
        <div class="jig-name">${j.nm}<span class="jn-no">${j.no}</span></div>
        <div class="jig-gauges">
          <div class="jg" style="margin:0"><div class="gl"><span>출도율</span><b style="color:#58a6ff">${s.outPct}%</b></div><div class="gtrack"><div class="gfill out" style="width:${s.outPct}%"></div></div></div>
          <div class="jg" style="margin:0"><div class="gl"><span>완료율</span><b style="color:#3fb950">${s.finPct}%</b></div><div class="gtrack"><div class="gfill fin" style="width:${s.finPct}%"></div></div></div>
        </div>
        <div class="jig-stat">완료 <b>${s.fin}</b>/${s.n}</div><div class="jig-toggle">▾</div>
      </div>
      <div class="jig-detail">${j.units.map(u=>`<div class="unit-row">
        <span class="ur-name">${u.nm}</span>
        <span class="bdg ${u.out?'out':'no'}">${u.out?'2D 출도':'미출도'}</span>
        <span class="bdg ${u.fin?'fin':'ing'}">${u.fin?'공정완료':'진행'}</span>
        <span class="item-chips">${u.items.map(it=>`<span class="ic ${u.fin?'done':''}">${u.fin?'✓ ':''}${it[0]}<span class="k">${it[1]}</span></span>`).join('')}</span>
      </div>`).join('')}</div></div>`;
            }).join('');
            $('#jigList').querySelectorAll('.jig-head').forEach(h=>h.onclick=()=>{const i=+h.dataset.i;openJig=(openJig===i?null:i);renderJigs();});
        }
        function renderFoot(){const totS=Object.values(stock).reduce((s,x)=>s+x.s,0);
            $('#foot').innerHTML='<span class="fl">공통재고(가용)</span>'+Object.entries(stock).map(([k,v])=>`<span class="c">${k} <b>${v.g-v.s}</b></span>`).join('')+`<span class="c scrap" style="margin-left:auto">누적 파기 <b>${totS}</b></span>`;}
        renderWorking();renderProjCards();renderJigs();renderFoot();
    </script>
</th:block>
</html>
