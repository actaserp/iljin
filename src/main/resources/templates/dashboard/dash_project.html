<html layout:decorate="~{layout_page}">
<head>
    <style>
        #udWrap{background:#1b1f27;color:#f3f6f9;min-height:100vh;padding:1.6vw 1.8vw 4vw;font-family:'Pretendard','Malgun Gothic',sans-serif;font-size:clamp(14px,0.85vw,18px);}
        #udInner{max-width:1500px;margin:0 auto;}
        #udWrap *{box-sizing:border-box;}
        .ud-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
        .ud-head h2{font-size:clamp(22px,1.5vw,32px);font-weight:700;color:#f3f6f9;margin:0;}
        .ud-head .sub{font-size:12px;color:#aeb7c4;margin-top:3px;}
        .ud-clock{font-size:clamp(20px,1.4vw,32px);font-weight:600;color:#6c9fd1;font-variant-numeric:tabular-nums;}
        .view-only{font-size:11px;color:#7e8794;border:1px solid #2a2f38;border-radius:6px;padding:3px 9px;margin-left:10px;}
        @keyframes udblink{0%,100%{opacity:1}50%{opacity:.3}}

        .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
        .kpi{background:#272f3a;border:1px solid #404a59;border-radius:12px;padding:1vw 1.2vw;}
        .kpi .l{font-size:clamp(13px,0.95vw,20px);color:#aeb7c4;} .kpi .v{font-size:clamp(24px,1.8vw,36px);font-weight:700;color:#f3f6f9;margin-top:3px;}
        .kpi .v small{font-size:13px;color:#aeb7c4;font-weight:600;}
        .kpi.made .v{color:#6c9fd1;} .kpi.rate .v{color:#5cbf9b;} .kpi.risk .v{color:#d4685f;}

        .alert-bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;background:#1a1316;border:1px solid #3a2226;border-radius:12px;padding:11px 15px;margin-bottom:14px;}
        .alert-bar .at{font-size:13px;font-weight:700;color:#d4685f;display:flex;align-items:center;gap:7px;margin-right:4px;}
        .alert-bar .ad{width:9px;height:9px;border-radius:50%;background:#d4685f;animation:udblink 1.1s infinite;}
        .alert-chip{font-size:clamp(12px,0.9vw,18px);font-weight:600;border-radius:8px;padding:6px 11px;}
        .alert-chip.danger{background:rgba(248,81,73,.14);color:#d4685f;border:1px solid rgba(248,81,73,.4);}
        .alert-chip.warn{background:rgba(251,191,36,.14);color:#d3aa55;border:1px solid rgba(251,191,36,.4);}
        .alert-chip.out{background:rgba(96,165,250,.12);color:#6c9fd1;border:1px solid rgba(96,165,250,.35);}
        .alert-none{font-size:13px;color:#5cbf9b;font-weight:600;}

        .work-banner{background:#272f3a;border:1px solid #404a59;border-radius:12px;padding:11px 15px;margin-bottom:18px;}
        .wb-title{font-size:13px;color:#d3aa55;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
        .wb-dot{width:9px;height:9px;border-radius:50%;background:#d3aa55;animation:udblink 1.1s infinite;}
        .wb-list{display:flex;flex-wrap:wrap;gap:9px;}
        .wb-item{background:#2b333e;border-radius:9px;padding:0.5vw 0.9vw;border-left:3px solid #d3aa55;font-size:clamp(13px,0.95vw,20px);}
        .wb-item b{color:#f3f6f9;} .wb-item .w{color:#ccd3dc;margin-left:6px;} .wb-item .p{color:#aeb7c4;margin-left:6px;font-size:12px;}
        .wb-empty{color:#9099a7;font-size:13px;}

        .sec-label{font-size:clamp(14px,1vw,20px);color:#aeb7c4;font-weight:700;margin:2px 0 10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
        .sec-label .legend{font-weight:500;color:#7e8794;font-size:11px;}

        #projRows{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;align-items:start;}
        @media(min-width:1100px){#projRows{grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));}}
        .pcard{background:#272f3a;border:1px solid #404a59;border-radius:14px;padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:11px;transition:.15s;min-height:320px;}
        .pcard:hover{background:#262e39;border-color:#46505f;}
        .pcard.risk{border-color:rgba(248,81,73,.5);}
        .pcard.open{border-color:#5f8fc0;background:#262e39;}
        .pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
        .pc-head .nm{font-size:clamp(17px,1.2vw,24px);font-weight:800;color:#f3f6f9;}
        .pc-head .owner{font-size:clamp(12px,0.85vw,16px);color:#aeb7c4;margin-left:4px;}
        .pc-due{font-size:clamp(12px,0.9vw,17px);color:#aeb7c4;font-weight:700;white-space:nowrap;background:#1e242d;border:1px solid #404a59;border-radius:7px;padding:3px 9px;}
        .pc-due.soon{color:#d4685f;border-color:rgba(248,81,73,.4);}
        .pc-foot{display:flex;flex-direction:column;gap:6px;margin-top:auto;}
        .pc-work{font-size:clamp(12px,0.9vw,17px);color:#d49279;font-weight:600;min-height:1.4em;}
        .pc-prog{font-size:clamp(26px,2vw,40px);font-weight:800;line-height:1;}
        .pc-prog small{font-size:clamp(12px,0.85vw,16px);color:#aeb7c4;font-weight:600;}
        .pc-track{height:8px;background:#39424f;border-radius:999px;overflow:hidden;}
        .pc-track .f{height:100%;border-radius:999px;}
        .pc-sub{font-size:clamp(12px,0.9vw,17px);color:#aeb7c4;}
        .pc-sub .m{color:#6c9fd1;font-weight:700;}
        .pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:1px;}

        .stage-dots{display:flex;align-items:center;gap:4px;}
        .sd{flex:1;text-align:center;}
        .sd .dot{height:clamp(32px,2.2vw,46px);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,1vw,20px);font-weight:700;border:1px solid;}
        .sd .dot.done{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);color:#5cbf9b;}
        .sd .dot.cur{background:rgba(251,191,36,.18);border-color:#d3aa55;color:#d3aa55;animation:udblink 1.2s infinite;}
        .sd .dot.up{background:#1e242d;border-color:#404a59;color:#727a87;}
        .sd .nm{font-size:clamp(12px,0.85vw,17px);color:#9099a7;margin-top:4px;}
        .sd .pc{font-size:clamp(12px,0.85vw,17px);font-weight:700;color:#aeb7c4;margin-top:2px;font-variant-numeric:tabular-nums;}
        .sd.clickable .dot{cursor:pointer;}
        .sd.clickable .dot:hover{filter:brightness(1.25);}
        .dz-car{font-size:9px;margin-left:3px;opacity:.8;}
        .dz-panel{background:#20262f;border:1px solid #404a59;border-radius:9px;padding:0.9vw 1.1vw;margin-bottom:0.5vw;}
        .dz-lab{font-size:clamp(12px,0.95vw,18px);color:#7e8794;font-weight:600;display:block;margin-bottom:0.6vw;}
        .dz-row{display:flex;align-items:center;gap:0;flex-wrap:wrap;}
        .dz-step{font-size:clamp(13px,1vw,20px);font-weight:700;padding:0.5vw 1vw;border-radius:8px;border:1px solid;}
        .dz-step.done{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);color:#5cbf9b;}
        .dz-step.cur{background:rgba(251,191,36,.18);border-color:#d3aa55;color:#d3aa55;}
        .dz-step.up{background:#1e242d;border-color:#404a59;color:#727a87;}
        .dz-conn{width:14px;height:2px;background:#2a2f38;}
        .sd-conn{width:10px;height:2px;background:#404a59;flex:0 0 auto;}
        .tag{font-size:clamp(11px,0.85vw,16px);font-weight:700;padding:2px 8px;border-radius:6px;}
        .tag.danger{background:rgba(248,81,73,.14);color:#d4685f;} .tag.warn{background:rgba(251,191,36,.14);color:#d3aa55;}
        .tag.out{background:rgba(96,165,250,.12);color:#6c9fd1;} .tag.work{background:rgba(240,153,123,.14);color:#d49279;}

        .pdetail-full{grid-column:1/-1;background:#1e242d;border:1px solid #46505f;border-radius:12px;padding:1.2vw 1.6vw 1.4vw;margin:-4px 0 4px;}
        .pd-title{font-size:clamp(18px,1.4vw,28px);font-weight:800;color:#f3f6f9;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #46505f;}
        .pd-title .owner{font-size:clamp(12px,0.85vw,16px);color:#aeb7c4;font-weight:500;margin-left:6px;}
        .sub-h{font-size:clamp(14px,1.05vw,21px);color:#f3f6f9;font-weight:800;margin:0 0 0.7vw;padding-left:11px;border-left:4px solid #5f8fc0;line-height:1.2;}
        .make-split{display:grid;grid-template-columns:1fr 1fr;gap:1vw;margin-bottom:0.6vw;}
        .ms-card{background:#20262f;border:1px solid #404a59;border-radius:8px;padding:0.8vw 1vw;}
        .ms-card .mh{display:flex;justify-content:space-between;font-size:clamp(13px,1vw,20px);margin-bottom:0.5vw;color:#aeb7c4;}
        .ms-card .mh .in{color:#6c9fd1;font-weight:700;} .ms-card .mh .out{color:#d49279;font-weight:700;}
        .ms-card .mt{height:9px;background:#39424f;border-radius:999px;overflow:hidden;}
        .ms-card .mt .f{height:100%;border-radius:999px;}

        .lblock{margin-bottom:8px;}
        .lhead{display:grid;grid-template-columns:minmax(130px,auto) 1fr minmax(170px,auto);gap:1.4vw;align-items:center;background:#262e39;border:1px solid #46505f;border-radius:9px;padding:0.9vw 1.2vw;cursor:pointer;}
        .lhead:hover{border-color:#46505f;}
        .lname{font-size:clamp(15px,1.2vw,26px);font-weight:700;color:#ccd3dc;display:flex;align-items:center;gap:6px;}
        .lname .lchev{color:#727a87;font-size:12px;transition:.15s;}
        .lblock.open .lname .lchev{transform:rotate(90deg);}
        .lmini{height:6px;width:100%;background:#39424f;border-radius:999px;overflow:hidden;align-self:center;opacity:.85;}
        .lmini .f{height:100%;border-radius:999px;}
        .lright{text-align:left;font-size:clamp(14px,1.05vw,22px);color:#bcc4ce;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;}
        .lright b{font-weight:800;color:#f3f6f9;}
        .lpct{font-weight:700;font-size:clamp(15px,1.1vw,21px);margin-left:6px;}
        .ipct{font-weight:700;font-size:clamp(14px,1vw,19px);text-align:right;}
        .lright b{color:#e6ebf1;} .lright .r{font-weight:800;margin-left:6px;}
        .litems{display:none;padding:0.6vw 0 0.4vw 0.8vw;}
        .lblock.open .litems{display:block;}
        .irow{display:grid;grid-template-columns:minmax(90px,120px) minmax(120px,auto) 1fr auto minmax(120px,auto);gap:1.2vw;align-items:center;padding:0.9vw 0.4vw;border-top:1px solid #2a313c;font-size:clamp(14px,1.05vw,22px);}
        .irow:first-child{border-top:0;}
        .icode{font-weight:800;color:#f3f6f9;font-size:clamp(15px,1.1vw,23px);}
        .imini{height:5px;width:100%;background:#39424f;border-radius:999px;overflow:hidden;opacity:.8;}
        .imini .f{height:100%;border-radius:999px;}
        .inum{text-align:left;color:#bcc4ce;white-space:nowrap;display:flex;align-items:baseline;gap:2px;} .inum .m{color:#6c9fd1;font-weight:700;}
        .ibadges{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;}
        .ib{font-size:clamp(11px,0.85vw,17px);font-weight:700;padding:0.3vw 0.6vw;border-radius:6px;}
        .ib.in{background:rgba(96,165,250,.14);color:#6c9fd1;} .ib.out{background:rgba(240,153,123,.14);color:#d49279;}
        .ib.dok{background:rgba(52,211,153,.16);color:#5cbf9b;} .ib.dno{background:rgba(251,191,36,.16);color:#d3aa55;}
        .ib.work{background:rgba(240,153,123,.2);color:#d49279;}
        .ship-chips{display:flex;gap:7px;margin-top:10px;}
        .ship{font-size:clamp(13px,1vw,20px);color:#aeb7c4;background:#20262f;border:1px solid #404a59;border-radius:7px;padding:0.5vw 0.9vw;}
        .ship b{color:#ccd3dc;}
        .note{font-size:11px;color:#7e8794;margin-top:10px;line-height:1.5;}
        .stage-stat{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
        .stage-stat .ss{background:#272f3a;border:1px solid #46505f;border-radius:8px;padding:0.7vw 1vw;font-size:clamp(13px,1vw,20px);color:#bcc4ce;}
        .stage-stat .ss .l{color:#aeb7c4;margin-right:7px;}
        .stage-stat .ss b{color:#e6ebf1;font-size:14px;font-variant-numeric:tabular-nums;}
        .hide-done{font-size:12px;color:#ccd3dc;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
        .hide-done input{cursor:pointer;width:14px;height:14px;accent-color:#6c9fd1;}
        .vhead .lname{color:#d49279;}
        .vrow{display:grid;grid-template-columns:1.2fr 3fr 1.2fr 1fr 1.6fr;gap:1vw;align-items:center;padding:0.7vw 0.4vw;border-top:1px solid #2a313c;font-size:clamp(13px,1vw,20px);}
        .vrow:first-child{border-top:0;}
        .vrow .v{color:#aeb7c4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .vrow .inum{text-align:right;color:#6c9fd1;font-weight:700;}
        .vrow .vd{font-size:11px;color:#aeb7c4;text-align:right;} .vrow .vd.soon{color:#d4685f;font-weight:700;}
        .idetail2{padding:2px 0 8px 10px;margin-left:90px;}
        .idrow{display:flex;align-items:flex-start;gap:0.8vw;padding:0.6vw 0;font-size:clamp(13px,1vw,20px);}
        .idrow .idl{color:#aeb7c4;font-weight:600;min-width:clamp(78px,7vw,140px);flex:0 0 auto;padding-top:2px;font-size:clamp(12px,0.9vw,18px);}
        .idrow .idl .idn{color:#727a87;font-weight:500;}
        .idrow .idc{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
        .pchip{background:#272f3a;border:1px solid #46505f;border-radius:8px;padding:0.45vw 0.8vw;font-size:clamp(13px,1vw,20px);color:#bcc4ce;}
        .pchip .pn{color:#aeb7c4;} .pchip b{color:#6c9fd1;font-weight:700;margin-left:3px;} .pchip .pt{color:#727a87;font-size:clamp(12px,0.95vw,19px);}
        .kchip{background:#20262f;border:1px solid #404a59;border-radius:8px;padding:0.45vw 0.8vw;font-size:clamp(13px,1vw,20px);color:#ccd3dc;}
        .kchip .pn{color:#ccd3dc;} .kchip b{color:#a6a0d4;font-weight:700;margin-left:3px;} .kchip .pt{color:#727a87;font-size:clamp(12px,0.95vw,19px);}
        .kchip.etc .pn{color:#7e8794;} .kchip.etc b{color:#9099a7;}
        .iu{color:#7e8794;font-size:clamp(11px,0.8vw,15px);font-weight:600;}
        .idwork{color:#d49279;font-weight:700;margin-left:4px;}
    </style>
</head>
<th:block layout:fragment="content">
    <div id="udWrap">
        <div id="udInner">
            <div class="ud-head">
                <div>
                    <h2 data-layout-toggle-anchor>프로젝트 현황<span class="view-only">읽기 전용 · 모니터링</span></h2>
                    <div class="sub">일진테크 · 관리자 대시보드 — WBS 표준단계(설계·제작·조립·검사) 증빙 자동판정 + 조기경보</div>
                </div>
                <div style="display:flex;align-items:center;gap:16px">
                    <label class="hide-done"><input type="checkbox" id="hideDone" checked> 완료 프로젝트 숨기기</label>
                    <span class="ud-clock" id="udClock"></span>
                </div>
            </div>

            <div class="kpi-row" id="kpiRow"></div>
            <div class="alert-bar" id="alertBar"></div>
            <div class="work-banner">
                <div class="wb-title"><span class="wb-dot"></span>현재 작업중</div>
                <div class="wb-list" id="workList"></div>
            </div>

            <div class="sec-label">
                <span>프로젝트 (위험·진척 우선순위 순) — 행 클릭 시 라인 → 공정 펼침</span>
                <span class="legend">단계 설계(출도)·제작·조립·검사 &nbsp;|&nbsp; ●완료 ◐진행 ○대기</span>
            </div>
            <div id="projRows"></div>

            <p class="sec-label" style="margin-top:22px">
                <span>외주 현황 (외작) — 외주처별 입고, 행 클릭 시 공정 펼침</span>
                <span class="legend" id="vendorAlertLab"></span>
            </p>
            <div id="vendorRows"></div>
        </div>
    </div>
</th:block>

                    + '<span class="ss"><span class="l">제작</span><b>' + nf(ss.make.d) + '/' + nf(ss.make.t) + '</b> 유니트</span>'
                    + '<span class="ss"><span class="l">조립</span><b>' + ss.asm.d + '/' + ss.asm.t + '</b> 공정</span>'
                    + '<span class="ss"><span class="l">검사</span><b>' + ss.insp.d + '/' + ss.insp.t + '</b> 공정</span>'
                    + '</div>';
                const lines = p.lines.map((l, li) => lineBlock(p, li, i)).join('');
                const ship = '<div class="ship-chips">'
                    + '<span class="ship">시운전(출하): <b style="color:' + (p.ship ? '#5cbf9b' : '#7e8794') + '">' + (p.ship ? '완료' : '대기') + '</b></span>'
                    + '<span class="ship">출고(종료): <b style="color:' + (p.outd ? '#5cbf9b' : '#7e8794') + '">' + (p.outd ? '완료' : '대기') + '</b></span></div>';
                const detail = '<div class="pdetail-full">'
                    + '<div class="pd-title">' + p.name + ' — 상세</div>'
                    + dzPanel(p.dsteps)
                    + '<div class="sub-h" style="margin-top:22px">단계별 현황 (완료/대상)</div>' + stageStat
                    + '<div class="sub-h" style="margin-top:22px">제작 — 가공(내작 생산) / 구매(외작 입고)</div>' + makeSplit
                    + '<div class="sub-h" style="margin-top:22px">라인별 (라인 클릭 시 공정 펼침)</div>' + lines
                    + ship
                    + '<div class="note">※ 단계 증빙: 설계=도면출도(검도→출도, 수주) · 제작=가공+구매 유니트 · 조립=조립완료 공정 · 검사=검사완료 공정. 보기 전용 — 변경은 각 업무화면에서.</div>'
                    + '</div>';
                return card + detail;
            }).join('');

            $('#projRows').querySelectorAll('[data-dz]').forEach(el => el.onclick = (e) => {
                e.stopPropagation();
                openP = +el.dataset.dz; renderRows();
            });
            $('#projRows').querySelectorAll('[data-proj]').forEach(el => el.onclick = () => {
                const i = +el.dataset.proj; openP = (openP === i) ? -1 : i; renderRows();
                if (openP === i) requestAnimationFrame(() => {
                    const d = $('#projRows').querySelector('.pdetail-full');
                    if (d) d.scrollIntoView({behavior: 'smooth', block: 'center'});
                });
            });
            $('#projRows').querySelectorAll('[data-line]').forEach(el => el.onclick = (e) => {
                e.stopPropagation();
                const li = +el.dataset.line;
                openL[openP] = (openL[openP] === li) ? -1 : li; renderRows();
            });
        }

        // ── 외주 현황 (전사 외주처별) ──────────────────────────────
        function renderVendors() {
            const map = {};   // vendor → [{code, proj, need, rcv, due, d}]
            PROJECTS.forEach(p => {
                if (hideDone && isAllDone(p)) return;   // 완료 프로젝트 제외(목록·외주 정리)
                flat(p).forEach(x => {
                    if (x.type !== '외작') return;
                    const v = x.vendor || '(미지정)';
                    (map[v] = map[v] || []).push({code: x.code, proj: p.name, need: x.need, rcv: x.rcv, due: p.due, d: dday(p.due)});
                });
            });
            const vendors = Object.keys(map).sort();
            let nearMiss = 0;
            const html = vendors.map((v, vi) => {
                const its = map[v];
                const total = its.length, rcvN = its.filter(x => x.rcv).length, rate = Math.round(rcvN / total * 100);
                const miss = its.filter(x => !x.rcv);
                const missNear = miss.filter(x => x.d >= 0 && x.d <= NEAR || x.d < 0).length;
                nearMiss += missNear;
                const col = rate >= 100 ? '#5cbf9b' : rate >= 50 ? '#d3aa55' : '#d49279';
                const open = openV === vi;
                const warn = missNear > 0 ? '<span class="tag warn">⚠ 임박 미입고 ' + missNear + '</span>' : '';
                const rows = its.sort((a, b) => a.rcv - b.rcv || a.d - b.d).map(x => {
                    const near = !x.rcv && (x.d < 0 || x.d <= NEAR);
                    const st = x.rcv ? '<span class="ib dok">입고</span>' : ('<span class="ib ' + (near ? 'dno' : 'up') + '">미입고</span>');
                    return '<div class="vrow"><span class="icode">' + x.code + '</span>'
                        + '<span class="v">' + x.proj + '</span>'
                        + '<span class="inum">' + nf(x.need) + ' 유닛</span>'
                        + '<span class="vd ' + (near ? 'soon' : '') + '">' + (x.d < 0 ? '납기초과' : 'D-' + x.d) + '</span>'
                        + '<span class="ibadges">' + st + (near ? '<span class="tag warn">임박</span>' : '') + '</span></div>';
                }).join('');
                return '<div class="lblock ' + (open ? 'open' : '') + '">'
                    + '<div class="lhead vhead" data-vendor="' + vi + '" style="grid-template-columns:150px 1fr 170px">'
                    + '<span class="lname"><span class="lchev">▶</span>🏭 ' + v + '</span>'
                    + '<div class="lmini">' + fill(rate, col) + '</div>'
                    + '<span class="lright">입고 <b>' + rcvN + '</b>/' + total + ' 공정 <span class="r" style="color:' + col + '">' + rate + '%</span> ' + warn + '</span>'
                    + '</div><div class="litems">' + rows + '</div></div>';
            }).join('');
            $('#vendorRows').innerHTML = html || '<div style="padding:14px;color:#7e8794;font-size:13px">외작 공정이 없습니다</div>';
            $('#vendorAlertLab').innerHTML = nearMiss > 0 ? '<span style="color:#d3aa55;font-weight:700">⚠ 임박 미입고 ' + nearMiss + '건</span>' : '<span style="color:#5cbf9b">임박 미입고 없음</span>';
            $('#vendorRows').querySelectorAll('[data-vendor]').forEach(el => el.onclick = () => {
                const vi = +el.dataset.vendor; openV = (openV === vi) ? -1 : vi; renderVendors();
            });
        }

        $('#hideDone').onchange = e => { hideDone = e.target.checked; renderRows(); renderVendors(); };
        renderKpi(); renderAlert(); renderWorking(); renderRows(); renderVendors();
    </script>
</th:block>
</html>
