<html layout:decorate="~{layout_page}">
<head>
    <style>
        #udWrap{background:#1b1f27;color:#f3f6f9;min-height:100vh;padding:21px 23px 52px;font-family:'Pretendard','Malgun Gothic',sans-serif;font-size:16px;}
        #udInner{max-width:1500px;margin:0 auto;}
        #udWrap *{box-sizing:border-box;}
        .ud-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
        .ud-head h2{font-size:25px;font-weight:700;color:#f3f6f9;margin:0;}
        .ud-head .sub{font-size:14px;color:#aeb7c4;margin-top:3px;}
        .ud-clock{font-size:23px;font-weight:600;color:#6c9fd1;font-variant-numeric:tabular-nums;}
        .view-only{font-size:13px;color:#7e8794;border:1px solid #2a2f38;border-radius:6px;padding:3px 9px;margin-left:10px;}
        /* ★ 이 화면은 <b>관리자용</b>이다. 치수는 전부 고정 px 로 둔다.
           예전에는 clamp(13px, 1vw, 20px) 처럼 vw 를 썼는데,
           그건 멀리서 보는 벽걸이 화면을 전제한 것이었다.
           vw 는 폭이 바뀔 때마다 요소마다 글꼴을 다시 계산하고
           그때마다 레이아웃이 다시 잡히므로, 카드·표·칩이 수백 개인 이 화면에서는
           메뉴를 접을 때 프레임이 밀려 뚝뚝 끊긴다.
           벽걸이용은 dash_project_kind.html 로 따로 만든다. */
        @keyframes udblink{0%,100%{opacity:1}50%{opacity:.3}}

        .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
        .kpi .sub{font-size:.5em;color:#8f98a5;font-weight:600;}
        .kpi .kl{font-size:13px;color:#8f98a5;margin-top:2px;line-height:1.5;}
        .kpi .kl b{color:#6c9fd1;font-weight:700;margin-left:3px;}
        .kpi .kl.warn, .kpi .kl .warn{color:#d3aa55;}

        /* KPI 분해 — 프로젝트별 내역 */
        .ktab-wrap{background:#1a1f27;border:1px solid #333c48;border-radius:10px;
            overflow:hidden;margin-bottom:14px;contain:layout paint;}
        .ktab-wrap .kh{padding:7px 12px;color:#8f98a5;font-weight:700;
            font-size:15px;border-bottom:1px solid #2c343e;}
        .kbreak{font-size:15px;}
        .kbreak th{font-size:14px;padding:6px 10px;}
        .kbreak td{padding:7px 10px;}
        .kpi{background:#272f3a;border:1px solid #404a59;border-radius:12px;padding:13px 16px;}
        .kpi .l{font-size:15px;color:#aeb7c4;} .kpi .v{font-size:28px;font-weight:700;color:#f3f6f9;margin-top:3px;}
        .kpi .v small{font-size:15px;color:#aeb7c4;font-weight:600;}
        .kpi.made .v{color:#6c9fd1;} .kpi.rate .v{color:#5cbf9b;} .kpi.risk .v{color:#d4685f;}

        .alert-bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;background:#1a1316;border:1px solid #3a2226;border-radius:12px;padding:11px 15px;margin-bottom:14px;}
        .alert-bar .at{font-size:15px;font-weight:700;color:#d4685f;display:flex;align-items:center;gap:7px;margin-right:4px;}
        .alert-bar .ad{width:9px;height:9px;border-radius:50%;background:#d4685f;animation:udblink 1.1s infinite;}
        .alert-chip{font-size:14px;font-weight:600;border-radius:8px;padding:6px 11px;}
        .alert-chip.danger{background:rgba(248,81,73,.14);color:#d4685f;border:1px solid rgba(248,81,73,.4);}
        .alert-chip.warn{background:rgba(251,191,36,.14);color:#d3aa55;border:1px solid rgba(251,191,36,.4);}
        .alert-chip.out{background:rgba(96,165,250,.12);color:#6c9fd1;border:1px solid rgba(96,165,250,.35);}
        .alert-none{font-size:15px;color:#5cbf9b;font-weight:600;}

        .work-banner{background:#272f3a;border:1px solid #404a59;border-radius:12px;padding:11px 15px;margin-bottom:18px;}
        .wb-title{font-size:15px;color:#d3aa55;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
        .wb-dot{width:9px;height:9px;border-radius:50%;background:#d3aa55;animation:udblink 1.1s infinite;}
        .wb-list{display:flex;flex-wrap:wrap;gap:9px;}
        .wb-item{background:#2b333e;border-radius:9px;padding:6px 12px;border-left:3px solid #d3aa55;font-size:15px;}
        .wb-item b{color:#f3f6f9;} .wb-item .w{color:#ccd3dc;margin-left:6px;} .wb-item .p{color:#aeb7c4;margin-left:6px;font-size:14px;}
        .wb-empty{color:#9099a7;font-size:15px;}

        .sec-label{font-size:16px;color:#aeb7c4;font-weight:700;margin:2px 0 10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
        .sec-label .legend{font-weight:500;color:#7e8794;font-size:13px;}

        #projRows{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;align-items:start;}
        @media(min-width:1100px){#projRows{grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));}}
        .pcard{background:#272f3a;border:1px solid #404a59;border-radius:14px;padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:11px;transition:.15s;min-height:320px;}
        .pcard:hover{background:#262e39;border-color:#46505f;}
        .pcard.risk{border-color:rgba(248,81,73,.5);}
        .pcard.open{border-color:#5f8fc0;background:#262e39;}
        .pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
        .pc-head .nm{font-size:20px;font-weight:800;color:#f3f6f9;}
        .pc-head .owner{font-size:14px;color:#aeb7c4;margin-left:4px;}
        .pc-due{font-size:14px;color:#aeb7c4;font-weight:700;white-space:nowrap;background:#1e242d;border:1px solid #404a59;border-radius:7px;padding:3px 9px;}
        .pc-due.soon{color:#d4685f;border-color:rgba(248,81,73,.4);}
        .pc-foot{display:flex;flex-direction:column;gap:6px;margin-top:auto;}
        .pc-work{font-size:14px;color:#d49279;font-weight:600;min-height:1.4em;}
        .pc-prog{font-size:30px;font-weight:800;line-height:1;}
        .pc-prog small{font-size:14px;color:#aeb7c4;font-weight:600;}
        .pc-track{height:8px;background:#39424f;border-radius:999px;overflow:hidden;}
        .pc-track .f{height:100%;border-radius:999px;}
        .pc-sub{font-size:14px;color:#aeb7c4;}
        .pc-sub .m{color:#6c9fd1;font-weight:700;}
        .pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:1px;}
        .pc-ms{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:#8f98a5;}
        .pc-ms .d{color:#5cbf9b;font-weight:700;}
        .pc-ms .x{color:#d4685f;font-weight:700;}

        .stage-dots{display:flex;align-items:center;gap:4px;}
        .sd{flex:1;text-align:center;}
        .sd .dot{height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;border:1px solid;}
        .sd .dot.done{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);color:#5cbf9b;}
        .sd .dot.cur{background:rgba(251,191,36,.18);border-color:#d3aa55;color:#d3aa55;animation:udblink 1.2s infinite;}
        .sd .dot.up{background:#1e242d;border-color:#404a59;color:#727a87;}
        .sd .nm{font-size:14px;color:#9099a7;margin-top:4px;}
        .sd .pc{font-size:14px;font-weight:700;color:#aeb7c4;margin-top:2px;font-variant-numeric:tabular-nums;}
        .sd.clickable .dot{cursor:pointer;}
        .sd.clickable .dot:hover{filter:brightness(1.25);}
        .dz-car{font-size:9px;margin-left:3px;opacity:.8;}
        .dz-panel{background:#20262f;border:1px solid #404a59;border-radius:9px;padding:12px 14px;margin-bottom:6px;}
        .dz-lab{font-size:14px;color:#7e8794;font-weight:600;display:block;margin-bottom:8px;}
        .dz-row{display:flex;align-items:center;gap:0;flex-wrap:wrap;}
        .dz-step{font-size:15px;font-weight:700;padding:6px 13px;border-radius:8px;border:1px solid;}
        .dz-step.done{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);color:#5cbf9b;}
        .dz-step.cur{background:rgba(251,191,36,.18);border-color:#d3aa55;color:#d3aa55;}
        .dz-step.up{background:#1e242d;border-color:#404a59;color:#727a87;}
        .dz-conn{width:14px;height:2px;background:#2a2f38;}
        .sd-conn{width:10px;height:2px;background:#404a59;flex:0 0 auto;}
        .tag{font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px;}
        .tag.danger{background:rgba(248,81,73,.14);color:#d4685f;} .tag.warn{background:rgba(251,191,36,.14);color:#d3aa55;}
        .tag.out{background:rgba(96,165,250,.12);color:#6c9fd1;} .tag.work{background:rgba(240,153,123,.14);color:#d49279;}

        .pdetail-full{grid-column:1/-1;background:#1e242d;border:1px solid #46505f;border-radius:12px;padding:16px 21px 18px;margin:-4px 0 4px;}
        .pd-title{font-size:21px;font-weight:800;color:#f3f6f9;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #46505f;}
        .pd-title .owner{font-size:14px;color:#aeb7c4;font-weight:500;margin-left:6px;}
        .sub-h{font-size:16px;color:#f3f6f9;font-weight:800;margin:0 0 9px;padding-left:11px;border-left:4px solid #5f8fc0;line-height:1.2;}
        .make-split{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:8px;}
        .ms-card{background:#20262f;border:1px solid #404a59;border-radius:8px;padding:10px 13px;}
        .ms-card .mh{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px;color:#aeb7c4;}
        .ms-card .mh .in{color:#6c9fd1;font-weight:700;} .ms-card .mh .out{color:#d49279;font-weight:700;}
        .ms-card .mt{height:9px;background:#39424f;border-radius:999px;overflow:hidden;}
        .ms-card .mt .f{height:100%;border-radius:999px;}

        .lblock{margin-bottom:8px;}
        .lhead{display:grid;grid-template-columns:minmax(130px,auto) 1fr minmax(170px,auto);gap:18px;align-items:center;background:#262e39;border:1px solid #46505f;border-radius:9px;padding:12px 16px;cursor:pointer;}
        .lhead:hover{border-color:#46505f;}
        .lname{font-size:17px;font-weight:700;color:#ccd3dc;display:flex;align-items:center;gap:6px;}
        .lname .lchev{color:#727a87;font-size:14px;transition:.15s;}
        .lblock.open .lname .lchev{transform:rotate(90deg);}
        .lmini{height:6px;width:100%;background:#39424f;border-radius:999px;overflow:hidden;align-self:center;opacity:.85;}
        .lmini .f{height:100%;border-radius:999px;}
        .lright{text-align:left;font-size:16px;color:#bcc4ce;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;}
        .lright b{font-weight:800;color:#f3f6f9;}
        .lpct{font-weight:700;font-size:17px;margin-left:6px;}
        .ipct{font-weight:700;font-size:16px;text-align:right;}
        .lright b{color:#e6ebf1;} .lright .r{font-weight:800;margin-left:6px;}
        .litems{display:none;padding:8px 0 5px 10px;}
        .lblock.open .litems{display:block;}
        .irow{display:grid;grid-template-columns:minmax(90px,120px) minmax(120px,auto) 1fr auto minmax(120px,auto);gap:16px;align-items:center;padding:12px 5px;border-top:1px solid #2a313c;font-size:16px;}
        .irow:first-child{border-top:0;}
        .ietype{color:#8f98a5;font-weight:500;font-size:12px;margin-left:6px;}
        .icode{font-weight:800;color:#f3f6f9;font-size:17px;}
        .imini{height:5px;width:100%;background:#39424f;border-radius:999px;overflow:hidden;opacity:.8;}
        .imini .f{height:100%;border-radius:999px;}
        .inum{text-align:left;color:#bcc4ce;white-space:nowrap;display:flex;align-items:baseline;gap:2px;} .inum .m{color:#6c9fd1;font-weight:700;}
        .ibadges{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;}
        .ib{font-size:13px;font-weight:700;padding:4px 8px;border-radius:6px;}
        .ib.in{background:rgba(96,165,250,.14);color:#6c9fd1;} .ib.out{background:rgba(240,153,123,.14);color:#d49279;}
        .ib.dok{background:rgba(52,211,153,.16);color:#5cbf9b;} .ib.dno{background:rgba(251,191,36,.16);color:#d3aa55;}
        .ib.work{background:rgba(240,153,123,.2);color:#d49279;}
        .ship-chips{display:flex;gap:7px;margin-top:10px;}
        .ship{font-size:15px;color:#aeb7c4;background:#20262f;border:1px solid #404a59;border-radius:7px;padding:6px 12px;}
        .ship b{color:#ccd3dc;}
        .note{font-size:13px;color:#7e8794;margin-top:10px;line-height:1.5;}
        .stage-stat{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
        .stage-stat .ss{background:#272f3a;border:1px solid #46505f;border-radius:8px;padding:9px 13px;font-size:15px;color:#bcc4ce;}
        .stage-stat .ss .l{color:#aeb7c4;margin-right:7px;}
        .stage-stat .ss b{color:#e6ebf1;font-size:16px;font-variant-numeric:tabular-nums;}
        .hide-done{font-size:14px;color:#ccd3dc;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
        .hide-done input{cursor:pointer;width:14px;height:14px;accent-color:#6c9fd1;}
        .vhead .lname{color:#d49279;}
        .vrow{display:grid;grid-template-columns:1.2fr 3fr 1.2fr 1fr 1.6fr;gap:13px;align-items:center;padding:9px 5px;border-top:1px solid #2a313c;font-size:15px;}
        .vrow:first-child{border-top:0;}
        .vrow .v{color:#aeb7c4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .vrow .inum{text-align:right;color:#6c9fd1;font-weight:700;}
        .vrow .vd{font-size:13px;color:#aeb7c4;text-align:right;} .vrow .vd.soon{color:#d4685f;font-weight:700;}
        .idetail2{padding:2px 0 8px 10px;margin-left:90px;}
        .idrow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:15px;}
        .idrow .idl{color:#aeb7c4;font-weight:600;min-width:78px;flex:0 0 auto;padding-top:2px;font-size:14px;}
        .idrow .idl .idn{color:#727a87;font-weight:500;}
        .idrow .idc{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
        .pchip{background:#272f3a;border:1px solid #46505f;border-radius:8px;padding:6px 10px;font-size:15px;color:#bcc4ce;}
        .pchip .pn{color:#aeb7c4;} .pchip b{color:#6c9fd1;font-weight:700;margin-left:3px;} .pchip .pt{color:#727a87;font-size:14px;}
        .kchip{background:#20262f;border:1px solid #404a59;border-radius:8px;padding:6px 10px;font-size:15px;color:#ccd3dc;}
        .kchip .pn{color:#ccd3dc;} .kchip b{color:#a6a0d4;font-weight:700;margin-left:3px;} .kchip .pt{color:#727a87;font-size:14px;}
        .kchip.etc .pn{color:#7e8794;} .kchip.etc b{color:#9099a7;}
        /* ── 프로젝트 단위 표 (가공품 / WBS) ──────────────────────────
           layout 의 table 기본 스타일이 밝은 테마라 헤더가 하얗게 뜬다.
           대시보드는 벽걸이 다크 화면이므로 배경·글자색을 전부 명시한다.
           background 를 지정하지 않으면 상속이 아니라 브라우저 기본 흰색이 나온다. */
        .dtab{width:100%;border-collapse:separate;border-spacing:0;background:#1a1f27;
            border:1px solid #333c48;border-radius:8px;overflow:hidden;
            font-size:15px;}
        .dtab th{background:#232a34;color:#8f98a5;font-weight:600;
            font-size:14px;padding:6px 10px;
            border-bottom:1px solid #3a4450;text-align:left;white-space:nowrap;}
        .dtab td{background:transparent;color:#ccd3dc;padding:6px 10px;
            border-bottom:1px solid #2c343e;text-align:left;white-space:nowrap;}
        .dtab tr:last-child td{border-bottom:none;}
        .dtab .r,.dtab th.r{text-align:right;}
        .dtab .c,.dtab th.c{text-align:center;}
        .dtab .mut{color:#8f98a5;}

        /* 가공품 표 */
        .ktab td.kn{color:#ccd3dc;font-weight:700;}
        .ktab td.kn.etc{color:#8f98a5;}
        .ktab td.need{color:#aeb7c4;font-weight:600;}
        .ktab td.op{color:#6c9fd1;font-weight:600;}
        .ktab td.op.zero{color:#4d545e;font-weight:400;}
        .ktab tr.sum td{background:#232a34;color:#aeb7c4;font-weight:700;border-bottom:none;}

        /* WBS 표 */
        .wtab tr.delay td{background:#33232a;}
        .wtab td.nm{color:#ccd3dc;}
        .wtab tr.delay td.nm{color:#d4685f;font-weight:700;}
        /* 마일스톤 행. 17단계 중 몇 개가 관문인지 표에서 바로 보이게 한다 */
        .wtab tr.mrow > td{background:#232a34;}
        .wtab td.mile{color:#c8b978;font-weight:700;}
        .wst{display:inline-block;padding:2px 7px;border-radius:6px;
            font-size:13px;font-weight:700;}
        .wst.done{background:#223a31;color:#5cbf9b;} .wst.cur{background:#243447;color:#6c9fd1;}
        .wst.wait{background:#2a2f38;color:#7e8794;} .wst.delay{background:#3f2a2e;color:#d4685f;}

        /* 마일스톤 칩 */
        .ms-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
        .mschip{background:#20262f;border:1px solid #404a59;border-radius:8px;
            padding:6px 10px;font-size:15px;color:#ccd3dc;}
        .mschip.done{border-color:#3d6b5a;} .mschip.delay{border-color:#7d4a4a;background:#2e2226;}
        .mschip .msd{color:#7e8794;margin-left:6px;font-size:14px;}
        .mschip.done .msd{color:#5cbf9b;} .mschip.delay .msd{color:#d4685f;}

        .ib.undef{background:rgba(251,191,36,.16);color:#d3aa55;}
        .kempty{color:#7e8794;font-size:14px;padding:8px 0;}
        .iu{color:#7e8794;font-size:13px;font-weight:600;}
        .idwork{color:#d49279;font-weight:700;margin-left:4px;}
    </style>
</head>
<th:block layout:fragment="content">
    <div id="udWrap">
        <div id="udInner">
            <div class="ud-head">
                <div>
                    <h2 data-layout-toggle-anchor>프로젝트 현황<span class="view-only">읽기 전용 · 모니터링</span></h2>
                    <div class="sub"></div>
                </div>
                <div style="display:flex;align-items:center;gap:16px">
                    <label class="hide-done"><input type="checkbox" id="hideDone" checked> 완료 프로젝트 숨기기</label>
                    <span class="ud-clock" id="udClock"></span>
                </div>
            </div>

            <div class="kpi-row" id="kpiRow"></div>
            <!-- KPI 분해. 벽걸이 모니터라 클릭할 사람이 없어 항상 펼쳐 둔다 -->
            <div id="kpiBreak"></div>
            <div class="alert-bar" id="alertBar"></div>
            <div class="work-banner">
                <div class="wb-title"><span class="wb-dot"></span>현재 작업중</div>
                <div class="wb-list" id="workList"></div>
            </div>

            <div class="sec-label">
                <span>프로젝트 (위험·진척 우선순위 순) — 행 클릭 시 라인 → 공정 펼침</span>
                <span class="legend">단계 설계(출도)·제작·조립·검사 &nbsp;|&nbsp; ●완료 ◐진행 ○대기</span>
            </div>
            <div id="projRows"></div>

            <p class="sec-label" style="margin-top:22px">
                <span>외주 현황 (외작) — 외주처별 입고, 행 클릭 시 공정 펼침</span>
                <span class="legend" id="vendorAlertLab"></span>
            </p>
            <div id="vendorRows"></div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript" th:inline="none">
        /*
         * 주의: 전역 $ (jQuery) 를 덮으면 common.js 의 AjaxUtil 이 깨진다.
         * 최상위 const 는 전역 렉시컬 스코프를 점유해 window.$ 보다 우선한다.
         * 목업의 `const $ = ...` 를 el 로 바꿨다. 되돌리지 말 것.
         */
        const el = s => document.querySelector(s);
        const nf = n => (n || 0).toLocaleString();

        const API = '/api/production/dash_project';
        const SPJANGCD = sessionStorage.getItem('spjangcd') || 'ZZ';

        // AjaxUtil (common.js) 사용. CSRF / spjangcd / 공통 에러처리를 대신해준다.
        // 콜백 방식이라 await 로 쓰기 위해 Promise 로 감싼다.
        const getJSON = (url, data) => new Promise(resolve => {
            AjaxUtil.getAsyncData(url, data,
                res => resolve(res || {success: false, data: []}),
                () => resolve({success: false, data: []}));
        });

        // WBS 표준 단계 + 완료기준(증빙):
        //  설계=도면출도 100% / 제작=조립(내작)+입고(외작) 지그 100% / 조립=조립완료 / 검사=검사완료
        /*
         * 단계 셋. 축을 <b>공정(품목) 개수</b>로 통일한다.
         *
         * ★ 예전에는 넷이었는데 '제작' 과 '조립' 이 사실상 같은 것을 셌고,
         *   '제작' 만 지그 대수라 혼자 축이 달랐다 (91/155 옆에 3/268).
         *   내작·외작 구분은 아래 '제작' 섹션이 이미 나눠서 보여주므로
         *   여기서는 합쳐 하나로 둔다.
         */
        const STAGES = ['설계', '제작', '검사'];

        // 데이터(읽기 전용, 서버 집계). item: out(출도), need/made(지그 대수), unit(구성 유닛수), type(내작/외작),
        //  vendor, asm(조립완료), insp(검사완료), working. proj: due, ship(출하), outd(출고)
        /*
         * 데이터는 서버 집계다 (읽기 전용).
         *   item: out(출도) / need·made(지그 대수) / unit(구성 유닛수) / type / vendor
         *         asm(조립완료) / insp(검사완료) / working / parts{kinds, procs}
         *   proj: due(납기) / ship(출하) / outd(출고) / dsteps(설계단계)
         *
         * ★ made 는 조립 완료 지그 대수다 (참값). 가공 실적에서 환산하지 않는다.
         *   재고·귀속·파기를 기록하지 않으므로 원리상 참값을 낼 수 없고,
         *   못 쓸 부품이 섞여 있어도 시스템은 모르므로 실제보다 낙관적이다.
         *   정확한 숫자는 parts.kinds 의 t/d 를 볼 것 — 그쪽은 참값이다.
         */
        let PROJECTS = [];

        async function loadData() {
            const res = await getJSON(API + '/summary', {spjangcd: SPJANGCD});
            PROJECTS = res.data || [];
            if (!res.success) {
                console.warn('[dash_project] API 응답 실패. 컨트롤러 등록과 Network 탭을 확인하세요.');
            }
        }

        const flat = p => p.lines.reduce((a, l) => a.concat(l.items), []);
        /*
         * 제작 달성 수량 (지그 대수 축).
         *   내작·미지정 : x.made = 조립 완료 지그 대수 (참값)
         *   외작        : 입고 완료면 need 만큼 (공정 통째 입고, 수량 재고 없음)
         *
         * ★ 가공 실적은 여기 안 들어간다.
         *   필요량(BOM)은 부품 개수이고 가공 실적은 설비 처리 횟수라 단위가 다르며,
         *   어느 부품이 어느 공정을 거치는지 모른다(라우팅 없음 — SPEC 3-2).
         *   그 둘로 만든 비율은 진척률이 아니다.
         *   가공 구간은 WBS 계획일이 메우고, 가공 실적은 작업량으로만 본다.
         */
        const itemMade = x => x.type === '외작' ? (x.rcv ? x.need : 0) : (x.made || 0);

        function agg(items) {
            const need = items.reduce((s, x) => s + x.need, 0);
            // 수주에 등록된 양(need) 중 실제로 작업지시가 나간 양.
            // 차이가 곧 '아직 지시 안 한 물량' 이다.
            const ordered = items.reduce((s, x) => s + (x.ordered || 0), 0);
            // 구성 유닛 수. 실적이 없는 참고 값이라 진척률에는 안 쓴다
            const unit = items.reduce((s, x) => s + (x.unit || 0), 0);
            // 유닛 조립 실적 (참값). 지그 완료 비율 환산이 아니다
            const unitDone = items.reduce((s, x) => s + (x.unitDone || 0), 0);
            const made = items.reduce((s, x) => s + itemMade(x), 0);
            const asm = items.reduce((s, x) => s + (x.asm || 0), 0);
            const insp = items.reduce((s, x) => s + (x.insp || 0), 0);
            const inNeed = items.filter(x => x.type !== '외작').reduce((s, x) => s + x.need, 0);
            const inMade = items.filter(x => x.type !== '외작').reduce((s, x) => s + (x.made || 0), 0);
            const outNeed = items.filter(x => x.type === '외작').reduce((s, x) => s + x.need, 0);
            const outMade = items.filter(x => x.type === '외작').reduce((s, x) => s + itemMade(x), 0);
            /*
             * ★ 외작도 <b>대수</b>로 센다. 내작 조립(0/128 대)과 축을 맞춘다.
             *   예전에는 품목 수(행 수)라 '1/91 품목' 과 '0/128 대' 가 나란히 붙어
             *   같은 섹션에서 단위가 갈렸다.
             */
            const outAll = items.filter(x => x.type === '외작').reduce((s, x) => s + x.need, 0);
            const outRcv = items.filter(x => x.type === '외작' && x.rcv).reduce((s, x) => s + x.need, 0);
            // 미입고 건수는 행 수로 센다 (경보용)
            const outWaitCnt = items.filter(x => x.type === '외작' && !x.rcv).length;
            const outWait = items.filter(x => !x.out).length;
            const working = items.filter(x => x.working);
            return {
                need,
                ordered,
                unit,        // 구성 유닛 수 (참고)
                unitDone,    // 유닛 조립 실적 (참값)
                made,
                asm,
                insp,
                rem: Math.max(0, need - made),
                rate: need ? Math.round(made / need * 100) : 0,
                inNeed,
                inMade,
                outNeed,
                outMade,
                outAll,
                outRcv,
                outWaitCnt,
                outWait,
                working,
                cnt: items.length,
                prog: prodProg(items)
            };
        }

        // 생산 진척(%) = 조립 완료 지그(내작) + 입고 공정(외작) / 전체 필요 지그 대수.
        // 가공 실적은 안 섞는다 (itemMade 주석 참조). 설계·검사도 %에 안 섞는다.
        function prodProg(items) {
            const need = items.reduce((s, x) => s + x.need, 0);
            const made = items.reduce((s, x) => s + itemMade(x), 0);
            return need ? Math.round(made / need * 100) : 0;
        }

        /*
         * 단계별 완료수/대상수. 축은 <b>품목 수</b>다 (suju 행 수).
         *
         * ★ '공정' 이라는 말이 두 뜻으로 쓰여 헷갈렸다.
         *     공정 대수  지그를 몇 대 만드나        suju."SujuQty" 합계 → 268
         *     품목 수    공정(품목)이 몇 종인가      suju 행 수         → 155
         *   화면에서는 앞을 '대', 뒤를 '품목' 으로 적어 구분한다.
         */
        //  조립 공정 = 지그를 모두 조립완료(asm>=need)한 공정 / 검사 = insp>=need
        //  ※ 제작(make)은 조립 지그 대수 기준이다. anyMachining 이 가공 실적을 따로 보고
        //    '대기'로만 남지 않게 진행중 표시를 올려 준다.
        function stageStats(items) {
            const cnt = items.length;

            /*
             * 제작 완료 = 그 공정(품목)을 만들어 낸 것.
             *   내작 : 조립이 목표에 도달   asm >= need
             *   외작 : 업체에서 입고        rcv
             * 둘을 <b>품목 개수</b>로 센다. 지그 대수로 세면 설계·검사와 축이 달라진다.
             */
            const makeDone = items.filter(x =>
                x.type === '외작' ? x.rcv : (x.need > 0 && (x.asm || 0) >= x.need)).length;
            const inspDone = items.filter(x => x.need > 0 && (x.insp || 0) >= x.need).length;
            return {
                design: {d: items.filter(x => x.out).length, t: cnt, unit: '공정'},
                make: {d: makeDone, t: cnt, unit: '공정'},
                insp: {d: inspDone, t: cnt, unit: '공정'}
            };
        }

        // 단계 상태: done(d>=t) / cur(0<d<t) / up(0) — 순차 아님(중간검사 등 독립 진행 허용)
        function stageState(st) {
            if (st.t > 0 && st.d >= st.t) return 'done';
            if (st.d > 0) return 'cur';
            return 'up';
        }

        // 설계 상태: 검도 스텝 + 출도 종합 (1차검도만 시작돼도 설계 진행중)
        function designState(items, dsteps) {
            const ss = stageStats(items);
            const outDone = ss.design.t > 0 && ss.design.d >= ss.design.t;
            const dz = dsteps || [];
            const dzAllDone = dz.length > 0 && dz.every(x => x.s === 'done');
            const dzStarted = dz.some(x => x.s === 'done' || x.s === 'cur');
            if (outDone && (dz.length === 0 || dzAllDone)) return 'done';
            if (dzStarted || ss.design.d > 0) return 'cur';
            return 'up';
        }

        /*
         * 종료를 두 단계로 본다.
         *
         *   isShipped  포장·출하 완료 → <b>더 만들 것이 없다.</b> KPI 합계에서 뺀다
         *   isAllDone  납품 완료     → 인수까지 끝났다. 목록에서도 뺀다
         *
         *   그 사이(출하했지만 납품 확인 전)는 목록에 남는다.
         *   만들 게 없다고 프로젝트가 끝난 것은 아니다.
         *
         * ★ WBS 가 없으면 두 단계를 찾을 수 없다.
         *   그때는 검사 완료로 떨어뜨린다 — 예전 판정 그대로다.
         *   WBS 를 안 넣은 프로젝트가 영원히 안 끝나는 것을 막는다.
         */
        // 검사까지 다 끝났나 (WBS 가 없을 때의 대체 판정)
        function allInspected(p) {
            const ss = stageStats(flat(p));
            return ss.insp.t > 0 && ss.insp.d >= ss.insp.t && ss.make.d >= ss.make.t;
        }

        function isShipped(p) {
            return p.hasWbs ? !!p.shipped : allInspected(p);
        }

        function isAllDone(p) {
            return p.hasWbs ? !!p.closed : allInspected(p);
        }

        const NEAR = 7;   // 납기 임박 기준(일) — 지연위험·출도지연·외주미입고 공통
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const dday = due => {
            const d = new Date(due);
            d.setHours(0, 0, 0, 0);
            return Math.round((d - today) / 86400000);
        };

        function risk(p) {
            const items = flat(p), a = agg(items), d = dday(p.due), tags = [];
            const allDone = isAllDone(p);
            const near = d >= 0 && d <= NEAR;
            let danger = false;
            if (!allDone) {
                if (d < 0) {
                    tags.push(['danger', '납기초과']);
                    danger = true;
                } else if (near) {
                    tags.push(['danger', 'D-' + d + ' 지연위험']);
                    danger = true;
                }
            }
            // 출도지연 = 임박 + 미출도 공정 존재
            if (near && a.outWait > 0) tags.push(['out', 'D-' + d + ' 출도지연 ' + a.outWait + '품목']);
            // 외주 미입고 = 임박 + 미입고 외작 존재 (전체 미입고는 외주현황 섹션에서)
            const outLagNear = (near || d < 0) ? items.filter(x => x.type === '외작' && !x.rcv).length : 0;
            if (outLagNear > 0) tags.push(['warn', '외주 미입고 ' + outLagNear + '품목(임박)']);
            return {danger, tags, d, prog: a.prog, allDone};
        }

        function score(p) {
            const r = risk(p), a = agg(flat(p));
            let s = (100 - a.prog);
            if (!r.allDone) s += Math.max(0, 100 - r.d);
            r.tags.forEach(t => s += t[0] === 'danger' ? 60 : t[0] === 'warn' ? 25 : 10);
            return s;
        }

        function clock() {
            el('#udClock').textContent = new Date().toLocaleTimeString('ko-KR');
        }

        setInterval(clock, 1000);
        clock();

        /*
         * 최초 로드 + 주기 갱신.
         * 대시보드는 벽걸이 모니터에 띄워두는 화면이라 사람이 새로고침하지 않는다.
         * 30초마다 다시 읽는다.
         */
        async function refreshAll() {
            await loadData();
            renderAll();
        }

        const rateColor = r => r >= 100 ? '#5cbf9b' : '#5f8fc0';
        const fill = (pct, c) => '<div class="f" style="width:' + Math.min(100, pct) + '%;background:' + c + '"></div>';

        let openP = -1, openL = {}, openV = -1, hideDone = false;

        function renderKpi() {
            /*
             * ★ <b>출하 전</b> 프로젝트만 센다.
             *   총 가공품·총 유닛·공정 대수는 "지금 만들어야 할 양" 이다.
             *   이미 나간 프로젝트의 필요량이 섞이면 매년 커지기만 하는 숫자가 된다.
             *   '완료 숨기기' 체크와 무관하게 항상 이 기준이다 —
             *   체크는 목록을 접는 용도이고, KPI 는 지금 할 일을 보여준다.
             */
            const live = PROJECTS.filter(p => !isShipped(p));
            const all = live.reduce((a, p) => a.concat(flat(p)), []);
            const a = agg(all);
            const riskN = live.filter(p => risk(p).danger).length;
            // 수주 → 지시 → 생산 순으로 좁혀지는 깔때기.
            // 지시가 수주보다 적으면 아직 안 내린 물량이 있다는 뜻이라 따로 보여준다.
            const notOrdered = Math.max(0, a.need - a.ordered);

            /*
             * 총 가공품 = BOM 합계 (참값). 그 아래 <b>설비별 작업량</b>을 붙인다.
             *
             * ★ 두 줄은 단위가 다르다.
             *   필요량 = 부품 개수 / 설비 숫자 = 그 설비가 처리한 횟수.
             *   한 부품이 절단·가공을 거치면 공정마다 다시 세어지므로
             *   설비 숫자를 세로로 더하면 필요량보다 커질 수 있다. 정상이다.
             *   그래서 '필요 대비 몇 %' 를 만들지 않고 나란히만 놓는다.
             */
            let partNeed = 0;
            const opTotal = {};
            live.forEach(p => {
                const ks = p.kinds || {};
                Object.keys(ks).forEach(k => {
                    partNeed += (+ks[k].t || 0);
                    const ops = ks[k].ops || {};
                    Object.keys(ops).forEach(o => {
                        opTotal[o] = (opTotal[o] || 0) + (+ops[o] || 0);
                    });
                });
            });
            const opLines = Object.keys(opTotal).sort()
                .map(o => '<div class="kl">' + o + ' <b>' + nf(opTotal[o]) + '</b></div>').join('');

            // 유닛 조립 실적 (mat_produce PO=1). 환산이 아니라 참값이다
            const unitDone = a.unitDone || 0;

            /*
             * KPI 분해 — 프로젝트별 내역.
             *
             * 상단 KPI 는 전사 합계라 "어느 프로젝트가 밀리는지" 를 못 보여준다.
             * 카드 목록에도 같은 숫자가 있지만 하나씩 펼쳐야 비교가 되므로,
             * 한 줄씩 나란히 놓는 표를 둔다.
             *
             * ★ 열마다 축이 다르다. 가로로 더하지 않는다.
             *   지그(대) / 유닛(개) / 가공품(개) 은 서로 환산되지 않는다.
             */
            // 상단 KPI 는 항상 전체 기준이지만, 분해 표는 목록과 같은 범위여야
            // 카드와 대조가 된다. '완료 숨기기' 를 따라간다.
            const rows = live.filter(p => !(hideDone && isAllDone(p))).map(p => {
                const items = flat(p);
                const g = agg(items);
                const ks = p.kinds || {};
                const partNeedP = Object.keys(ks).reduce((n, k) => n + (+ks[k].t || 0), 0);
                const opP = {};
                Object.keys(ks).forEach(k => {
                    const ops = ks[k].ops || {};
                    Object.keys(ops).forEach(o => { opP[o] = (opP[o] || 0) + (+ops[o] || 0); });
                });
                const r = risk(p);
                return {p, g, partNeedP, opP, danger: r.danger};
            });

            const opCols = Object.keys(opTotal).sort();

            el('#kpiBreak').innerHTML = rows.length
                ? '<div class="ktab-wrap"><div class="kh">프로젝트별 내역 '
                + '<span style="font-weight:400">· 열마다 단위가 다릅니다. 가로로 더하지 마세요</span></div>'
                + '<table class="dtab ktab kbreak">'
                + '<tr><th>프로젝트</th><th>납기</th>'
                + '<th class="r">공정(대)</th><th class="r">유닛</th><th class="r">가공품</th>'
                + opCols.map(o => '<th class="r">' + o + '</th>').join('')
                + '<th class="c">지연</th></tr>'
                + rows.map(r => '<tr>'
                    + '<td class="kn">' + r.p.name + '</td>'
                    + '<td class="mut">' + (r.p.due || '-') + '</td>'
                    + '<td class="r need">' + nf(r.g.made) + '<span class="mut">/' + nf(r.g.need) + '</span></td>'
                    + '<td class="r need">' + nf(r.g.unitDone) + '<span class="mut">/' + nf(r.g.unit) + '</span></td>'
                    + '<td class="r need">' + nf(r.partNeedP) + '</td>'
                    + opCols.map(o => {
                        const v = r.opP[o] || 0;
                        return '<td class="op r ' + (v ? '' : 'zero') + '">' + (v ? nf(v) : '-') + '</td>';
                    }).join('')
                    + '<td class="c">' + (r.danger
                        ? '<span class="wst delay">위험</span>'
                        : '<span class="mut">-</span>') + '</td></tr>').join('')
                + '</table></div>'
                : '';

            el('#kpiRow').innerHTML =
                /*
                 * 카드 넷. 앞의 셋이 '얼마나 만들어야 하나', 마지막이 '위험'.
                 *
                 * ★ '지그' 와 '조립·입고 완료' 를 따로 두었더니 같은 숫자가
                 *   두 카드에 나와 차이를 알 수 없었다. 하나로 합친다.
                 *   지그 카드가 이미 '268대 / 3 완료' 를 담고 있으므로
                 *   남은 수량은 그 아래 줄로 내린다.
                 */
                '<div class="kpi made"><div class="l">공정 대수 (전사)</div><div class="v">' + nf(a.need)
                + '<small> 대</small> <span class="sub">/ ' + nf(a.made) + ' 완료</span></div>'
                + '<div class="kl">남은 ' + nf(a.rem) + '대'
                + (notOrdered ? ' · <span class="warn">미지시 ' + nf(notOrdered) + '대</span>' : '')
                + '</div></div>'

                + '<div class="kpi"><div class="l">총 유닛</div><div class="v">' + nf(a.unit)
                + '<small> 개</small> <span class="sub">/ ' + nf(unitDone) + ' 완료</span></div>'
                + '<div class="kl">유닛 조립 실적</div></div>'

                + '<div class="kpi"><div class="l">총 가공품</div><div class="v">' + nf(partNeed)
                + '<small> 개</small></div>'
                + (opLines || '<div class="kl">설비 실적 없음</div>') + '</div>'

                + '<div class="kpi risk"><div class="l">지연 위험</div><div class="v">' + riskN
                + '<small> 건</small></div></div>';
        }

        function renderAlert() {
            const dangers = [], warns = [], outs = [];
            PROJECTS.forEach(p => risk(p).tags.forEach(t => {
                const label = p.name + ' · ' + t[1];
                if (t[0] === 'danger') dangers.push(label);
                else if (t[0] === 'warn') warns.push(label);
                else outs.push(label);
            }));
            if (!dangers.length && !warns.length && !outs.length) {
                el('#alertBar').innerHTML = '<span class="alert-none">✓ 현재 지연 위험·출도 지연 없음</span>';
                return;
            }
            el('#alertBar').innerHTML = '<span class="at"><span class="ad"></span>조기경보</span>'
                + dangers.map(x => '<span class="alert-chip danger">🔴 ' + x + '</span>').join('')
                + warns.map(x => '<span class="alert-chip warn">🟡 ' + x + '</span>').join('')
                + outs.map(x => '<span class="alert-chip out">📐 ' + x + '</span>').join('');
        }

        /*
         * 현재 작업중.
         *
         * ★ 출처가 둘이다.
         *   item.working  조립·검사. 품목(suju)에 붙어 있다
         *   p.mwork       가공. Project_id 로만 묶인다 (품목 미지정이 흔하다)
         *
         *   예전에는 item.working 만 봐서, 설비가 돌고 있는데도 '작업중 없음' 이
         *   떴다. 아래 '가동 현황' 표는 p.mwork 를 써서 정상이었고,
         *   같은 화면에서 두 곳이 다르게 보였다.
         */
        function renderWorking() {
            const asm = PROJECTS.reduce((a, p) =>
                a.concat(flat(p).filter(x => x.working).map(x => ({
                    code: x.code, stage: x.working.stage || '',
                    machine: x.working.machine || '', worker: x.working.worker || '',
                    pname: p.name
                }))), []);

            const mac = PROJECTS.reduce((a, p) =>
                a.concat((p.mwork || []).map(w => ({
                    code: w.item_name || '품목 미지정',
                    stage: w.stage || '가공',
                    machine: w.machine || '', worker: w.worker || '',
                    pname: p.name
                }))), []);

            const all = mac.concat(asm);
            el('#workList').innerHTML = all.length
                ? all.map(o => '<div class="wb-item"><b>' + o.code + '</b>'
                    + ' <span style="color:#d3aa55">' + o.stage + '</span>'
                    + (o.machine ? ' <span style="color:#aeb7c4">' + o.machine + '</span>' : '')
                    + '<span class="w">👤 ' + o.worker + '</span>'
                    + '<span class="p">· ' + o.pname + '</span></div>').join('')
                : '<div class="wb-empty">작업중 없음</div>';
        }

        /*
         * 가공품 실적이 하나라도 있으면 제작은 '진행중'이다.
         *
         * ss.make.d 는 조립(지그) 실적이라, 가공만 돌고 있으면 0 이 된다.
         * (그 실적은 품목에 안 붙어 item.parts.kinds 로 내려오지 않는다)
         * 실제로는 절단·가공이 돌고 있는데 대시보드만 '대기'로 보이는 상태가 된다.
         * 프로젝트 단위 kinds 의 공정별 실적을 같이 본다.
         */
        /*
         * 날짜별 · 공정별 가공 실적 (최근 14일).
         * 세로가 날짜, 가로가 설비. 가로로 더하지 않는다 —
         * 한 부품이 공정마다 다시 세어지므로 합은 실물보다 크다.
         */
        function dailyTable(daily) {
            const rows = daily || [];
            if (!rows.length) return '<div class="kempty">최근 14일 가공 실적이 없습니다.</div>';

            const ops = [];
            rows.forEach(r => { if (r.operation && ops.indexOf(r.operation) < 0) ops.push(r.operation); });
            ops.sort();

            const byDate = {};
            rows.forEach(r => {
                const d = r.d || '-';
                (byDate[d] = byDate[d] || {})[r.operation] = (+r.qty || 0);
            });
            const dates = Object.keys(byDate).sort().reverse();

            const head = '<tr><th>일자</th>'
                + ops.map(o => '<th class="r">' + o + '</th>').join('')
                + '<th class="r">계</th></tr>';

            const body = dates.map(d => {
                const row = byDate[d];
                const sum = ops.reduce((n, o) => n + (row[o] || 0), 0);
                return '<tr><td class="mut">' + d + '</td>'
                    + ops.map(o => {
                        const v = row[o] || 0;
                        return '<td class="op r ' + (v ? '' : 'zero') + '">' + (v ? nf(v) : '-') + '</td>';
                    }).join('')
                    + '<td class="r need">' + nf(sum) + '</td></tr>';
            }).join('');

            return '<table class="dtab ktab">' + head + body + '</table>';
        }

        /* 가동 현황 — 어느 설비가 돌고 누가 하고 있나 */
        function runTable(p) {
            const mw = (p && p.mwork) || [];
            const asm = [];
            (p.lines || []).forEach(l => (l.items || []).forEach(it => {
                if (it.working) asm.push(it.working);
            }));
            if (!mw.length && !asm.length) {
                return '<div class="kempty">현재 진행중인 작업이 없습니다.</div>';
            }
            const head = '<tr><th>구분</th><th>설비</th><th>작업자</th><th>대상</th><th class="c">시작</th></tr>';
            const body = mw.map(w =>
                    '<tr><td class="mut">' + (w.stage || '가공') + '</td>'
                    + '<td class="nm">' + (w.machine || '') + '</td>'
                    + '<td>' + (w.worker || '') + '</td>'
                    + '<td class="mut">' + (w.item_name || '품목 미지정')
                    + (w.kind ? ' · ' + w.kind : '') + '</td>'
                    + '<td class="c mut">' + (w.start_time || '') + '</td></tr>').join('')
                + asm.map(w =>
                    '<tr><td class="mut">' + (w.stage || '조립') + '</td>'
                    + '<td class="nm">' + (w.machine || '-') + '</td>'
                    + '<td>' + (w.worker || '') + '</td>'
                    + '<td class="mut">-</td><td class="c mut">-</td></tr>').join('');
            return '<table class="dtab wtab">' + head + body + '</table>';
        }

        // 그 프로젝트의 총 가공품 필요량 (BOM 합계). 참값이다
        function kindNeedOf(p) {
            const ks = (p && p.kinds) || {};
            return Object.keys(ks).reduce((n, k) => n + (+ks[k].t || 0), 0);
        }

        function anyMachining(p) {
            const ks = (p && p.kinds) || {};
            return Object.keys(ks).some(k =>
                Object.values(ks[k].ops || {}).some(v => (+v || 0) > 0));
        }

        function stageDots(items, pi, dsteps, p) {
            const ss = stageStats(items);
            const keys = ['design', 'make', 'insp'];
            let html = '';
            STAGES.forEach((s, i) => {
                const stt = ss[keys[i]];
                let state = (i === 0) ? designState(items, dsteps) : stageState(stt);
                if (keys[i] === 'make' && state === 'up' && anyMachining(p)) state = 'cur';
                const mark = state === 'done' ? '●' : state === 'cur' ? '◐' : '○';
                const cnt = '<div class="pc">' + nf(stt.d) + '/' + nf(stt.t) + '</div>';
                const isDesign = (i === 0 && dsteps && dsteps.length);
                const exp = isDesign ? ' design-toggle" data-dz="' + pi : '';
                const car = isDesign ? '<span class="dz-car">▾</span>' : '';
                html += '<div class="sd' + (isDesign ? ' clickable' : '') + '"><div class="dot ' + state + (exp ? exp + '"' : '"') + '>' + mark + car + '</div><div class="nm">' + s + '</div>' + cnt + '</div>';
                if (i < STAGES.length - 1) html += '<div class="sd-conn"></div>';
            });
            return '<div class="stage-dots">' + html + '</div>';
        }

        /*
         * 프로젝트 단위 가공품 표 (proj.kinds).
         *
         * ★ 품목별 칩(item.parts.kinds)과 별개다.
         *   가공 실적은 품목 없이 프로젝트에만 귀속될 수 있다
         *   (2D 도면 전에 추정으로 만드는 물량 — 키오스크의 '품목 미지정').
         *   그런 실적은 품목별 집계에서 빠지므로 여기서만 보인다.
         *   따라서 이 표의 합계가 품목 칩의 합보다 클 수 있다. 정상이다.
         *
         * ★ 공정별로 칸을 나눈다. 합치지 않는다.
         *   한 부품이 절단 → 가공 → 와이어커팅을 거치며 공정마다 다시 세어지므로
         *   더하면 실물보다 큰 수가 된다 (절단 340 + 가공 120 = 460 > 실물 340).
         */
        function kindTable(kinds) {
            const ks = kinds || {};
            const names = Object.keys(ks);
            if (!names.length) {
                return '<div class="kempty">등록된 부품이 없습니다. 생산 지시 화면에서 부품을 먼저 등록하세요.</div>';
            }

            // 실적이 있는 공정만 열로 세운다 (안 쓴 설비는 빈 열이 되므로)
            const ops = [];
            names.forEach(k => Object.keys(ks[k].ops || {}).forEach(o => {
                if (o && ops.indexOf(o) < 0) ops.push(o);
            }));

            const head = '<tr><th>유형</th><th class="r">필요</th>'
                + ops.map(o => '<th class="r">' + o + '</th>').join('') + '</tr>';

            const body = names.map(k => {
                const e = ks[k], o2 = e.ops || {};
                return '<tr><td class="kn ' + (k === '기타' ? 'etc' : '') + '">' + k + '</td>'
                    + '<td class="need r">' + nf(e.t) + '</td>'
                    + ops.map(o => {
                        const v = o2[o] || 0;
                        return '<td class="op r ' + (v ? '' : 'zero') + '">' + nf(v) + '</td>';
                    }).join('') + '</tr>';
            }).join('');

            const totNeed = names.reduce((s2, k) => s2 + (ks[k].t || 0), 0);
            const foot = '<tr class="sum"><td>합계</td><td class="r">' + nf(totNeed) + '</td>'
                + ops.map(o => '<td class="r">'
                    + nf(names.reduce((s2, k) => s2 + ((ks[k].ops || {})[o] || 0), 0))
                    + '</td>').join('') + '</tr>';

            return '<table class="dtab ktab">' + head + body + foot + '</table>';
        }

        // yyyymmdd → MM/DD. 빈 값은 '-'
        function ymd(v) {
            const t = (v == null ? '' : String(v)).trim();
            return /^\d{8}$/.test(t) ? (t.slice(4, 6) + '/' + t.slice(6, 8)) : t;
        }

        /*
         * 기간 표기. 한쪽만 있으면 '~' 를 붙이지 않는다.
         * 실적은 시작일 없이 완료일만 찍히는 경우가 흔한데,
         * '-~08/20' 은 오류처럼 보인다.
         */
        function range(a, b) {
            const x = ymd(a), y = ymd(b);
            if (x && y) return x + '~' + y;
            if (y) return y;
            if (x) return x + '~';
            return '-';
        }

        /*
         * 마일스톤 칩.
         * 게이트 판정은 진척률이 아니라 완료 여부(ac_eddate)다.
         * 가공 진척률은 낙관 편향이 있어 임계값으로 쓰면 경보가 늦게 울린다.
         */
        function msRow(ms) {
            if (!ms || !ms.length) return '';
            return '<div class="ms-row">' + ms.map(m => {
                const cls = m.delay ? 'delay' : (m.s === 'done' ? 'done' : '');
                const dt = m.s === 'done' ? ('완료 ' + (ymd(m.ac) || '-'))
                    : (m.delay ? ('지연 · 예정 ' + (ymd(m.pl) || '-'))
                        : ('예정 ' + (ymd(m.pl) || '-')));
                return '<span class="mschip ' + cls + '">' + m.n
                    + '<span class="msd">' + dt + '</span></span>';
            }).join('') + '</div>';
        }

        /*
         * WBS 표. 프로젝트 레벨 계획(wbs_plan.suju_head_id IS NULL)만 내려온다.
         * 지연은 서버가 조회 시 판정한다 (pl_eddate < 오늘 AND ac_eddate 없음).
         */
        function wbsTable(wbs) {
            if (!wbs || !wbs.length) {
                return '<div class="kempty">WBS 계획이 없습니다. 프로젝트 등록에서 템플릿을 적용하세요.</div>';
            }
            const head = '<tr><th>단계</th><th>세부</th><th>담당</th>'
                + '<th class="c">계획</th><th class="c">실적</th>'
                + '<th class="r">진척</th><th class="c">상태</th></tr>';

            const body = wbs.map(w => {
                const dly = w.delay_yn === 'Y';
                const done = w.state === 'done';
                const st = dly ? 'delay' : (w.state || 'wait');
                const lab = dly ? '지연' : (done ? '완료' : (w.state === 'cur' ? '진행' : '대기'));

                // 완료인데 진척 0% 로 보이면 틀린 값처럼 읽힌다.
                // progress 는 담당자가 채우는 값이라 비어 있는 경우가 흔하므로,
                // 완료 실적이 찍힌 행은 100% 로 본다.
                const pg = done ? 100 : Math.round(w.progress || 0);

                return '<tr class="' + (dly ? 'delay' : '')
                    + (w.milestone_yn === 'Y' ? ' mrow' : '') + '">'
                    + '<td class="mut">' + (w.step_name || '') + '</td>'
                    + '<td class="nm' + (w.milestone_yn === 'Y' ? ' mile' : '') + '">'
                    + (w.milestone_yn === 'Y' ? '◆ ' : '') + (w.task_name || '') + '</td>'
                    + '<td class="mut">' + (w.charge_name || '-') + '</td>'
                    + '<td class="c mut">' + range(w.pl_stdate, w.pl_eddate) + '</td>'
                    + '<td class="c">' + range(w.ac_stdate, w.ac_eddate) + '</td>'
                    + '<td class="r">' + (pg ? pg + '%' : '<span class="mut">-</span>') + '</td>'
                    + '<td class="c"><span class="wst ' + st + '">' + lab + '</span></td></tr>';
            }).join('');

            return '<table class="dtab wtab">' + head + body + '</table>';
        }

        function dzPanel(dsteps) {
            if (!dsteps || !dsteps.length) return '';
            const steps = dsteps.map((s, i) => {
                const mark = s.s === 'done' ? '●' : s.s === 'cur' ? '◐' : '○';
                const cls = s.s === 'done' ? 'done' : s.s === 'cur' ? 'cur' : 'up';
                return '<div class="dz-step ' + cls + '">' + mark + ' ' + s.n + '</div>'
                    + (i < dsteps.length - 1 ? '<div class="dz-conn"></div>' : '');
            }).join('');
            return '<div class="dz-panel"><span class="dz-lab">설계 검도 (수주 등록)</span><div class="dz-row">' + steps + '</div></div>';
        }

        function lineBlock(p, li, pi) {
            const l = p.lines[li], a = agg(l.items), col = rateColor(a.prog);
            const open = openL[pi] === li;
            const items = l.items.map(it => {
                const ia = agg([it]), im = itemMade(it);

                /*
                 * ★ 막대와 % 는 <b>유닛 기준</b>이다.
                 *   지그는 1~2대뿐이라 막대가 0/50/100 으로만 튀어 의미가 없다.
                 *   유닛은 매일 움직이므로 진행 상황이 실제로 보인다.
                 *   지그는 숫자(0/2 대)로만 남긴다.
                 *
                 *   유닛이 없는 경우(외작, unit_qty 미등록)는 지그 기준으로 떨어뜨린다.
                 *   외작은 입고 여부라 0% 아니면 100% 이고, 그게 사실이다.
                 *
                 *   ※ 라인·프로젝트 진척률은 <b>완료된 품목 수</b> 기준이라 축이 다르다.
                 *     품목 행은 '그 품목 안의 진척', 상위는 '몇 개나 끝났나' 를 뜻한다.
                 */
                const iProg = (it.type !== '외작' && it.unit > 0)
                    ? Math.round((it.unitDone || 0) / it.unit * 100)
                    : ia.prog;
                const ic = rateColor(iProg);
                // 라벨을 '가공/구매'로 줄여 두니 자재 구매로 읽혔다.
                // 이 배지는 <b>이 공정(지그)을 우리가 만드는지 업체가 만드는지</b>를 뜻한다.
                // 내작 / 외작 / 미지정. 미지정을 내작으로 뭉개면 누가 정한 것처럼 보인다.
                // 집계는 내작으로 잡되(서버 typeOf 주석 참조) 표기는 구분한다.
                const tcls = it.type === '외작' ? 'out' : (it.type === '미지정' ? 'undef' : 'in');
                const ttip = it.type === '외작' ? '외작 — 업체 제작 후 입고'
                    : (it.type === '미지정' ? '수주에 내작/외작 구분이 없습니다. 집계는 내작으로 처리합니다'
                        : '내작 — 우리가 가공·조립');
                const io = '<span class="ib ' + tcls + '" title="' + ttip + '">' + it.type + '</span>';
                const ob = '<span class="ib ' + (it.out ? 'dok' : 'dno') + '">' + (it.out ? '출도' : '미출도') + '</span>';
                // 자재 입고가 아니라 <b>외주 공정이 업체에서 들어왔는지</b>다. 외작에만 붙는다.
                const rc = it.type === '외작' ? ('<span class="ib ' + (it.rcv ? 'dok' : 'dno')
                    + '" title="외주 제작품이 업체에서 입고되었는지">'
                    + (it.rcv ? '외주입고' : '외주 미입고') + '</span>') : '';
                const wk = it.working ? '<span class="ib work">▶' + (it.working.stage || '') + '·' + it.working.worker + '</span>' : '';
                // 가공품 단위 상세 (지그·유닛과 별개 축) — 내작만
                let detail = '';
                // 미지정도 집계상 내작이므로 가공품 상세를 보여준다.
                // (외작만 제외 — 업체가 만들어 오므로 우리 가공 실적이 없다)
                if (it.type !== '외작' && it.parts) {
                    const ks = it.parts.kinds || {}, ps = it.parts.procs || {};
                    const procChips = Object.entries(ps).map(p2 => {
                        return '<span class="pchip"><span class="pn">' + p2[0] + '</span> <b>' + nf(p2[1]) + '</b></span>';
                    }).join('');
                    /*
                     * ★ 목표(/100)를 붙이지 않는다.
                     *   분자는 <b>공정별 처리 횟수의 최댓값</b>(kindDone)이고
                     *   분모는 부품 개수(BOM)라 단위가 다르다.
                     *   나란히 놓으면 100/100 이 '목표 달성' 으로 읽히는데,
                     *   실제로는 "선반을 100번 거쳤다" 는 뜻일 뿐이다.
                     *
                     *   모든 설비가 50씩이면 실물이 몇 개인지 알 방법이 없다.
                     *   라우팅이 없어 생기는 한계라 필요량은 위 표에서 따로 본다.
                     */
                    const kindChips = Object.entries(ks).map(k =>
                        '<span class="kchip ' + (k[0] === '기타' ? 'etc' : '') + '">'
                        + '<span class="pn">' + k[0] + '</span> <b>' + nf(k[1].d) + '</b></span>').join('');
                    detail = '<div class="idetail2">'
                        + '<div class="idrow"><span class="idl">가공품 공정별 <span class="idn">(처리 실적)</span></span><span class="idc">' + procChips
                        + (it.working && it.working.stage === '가공' ? ' <span class="idwork">▶' + it.working.machine + '·' + it.working.worker + '</span>' : '') + '</span></div>'
                        + '<div class="idrow"><span class="idl">가공품 유형별 <span class="idn">(공정 최대 처리량)</span></span><span class="idc">' + kindChips + '</span></div>'
                        + '</div>';
                }
                return '<div class="irow"><span class="icode">' + it.code
                    // 품목명(A12)만으로는 뭘 만드는지 모른다. 설비타입을 옆에 붙인다
                    + (it.etype ? '<span class="ietype">' + it.etype + '</span>' : '') + '</span>'
                    /*
                     * 공정(지그)을 앞에, 유닛을 뒤에 둔다.
                     * 막대는 유닛 기준이지만 <b>공정이 끝나야 완료</b>이므로
                     * 유닛 100% 여도 공정 0/2 면 아직 남은 것이다.
                     * 현장 용어가 '공정' 이라 지그라는 말은 쓰지 않는다.
                     */
                    + (it.unit
                        ? '<span class="inum">공정 <span class="m">' + nf(im) + '</span>/'
                        + nf(it.need) + '대'
                        + '<span class="iu"> · 유닛 ' + nf(it.unitDone || 0) + '/' + nf(it.unit)
                        + '</span></span>'
                        : '<span class="inum">공정 <span class="m">' + nf(im) + '</span>/'
                        + nf(it.need) + '<span class="iu">대</span></span>')
                    + '<div class="imini">' + fill(iProg, ic) + '</div>'
                    + '<span class="ipct" style="color:' + ic + '">' + iProg + '%</span>'
                    + '<span class="ibadges">' + io + ob + rc + wk + '</span></div>' + detail;
            }).join('');
            return '<div class="lblock ' + (open ? 'open' : '') + '">'
                + '<div class="lhead" data-line="' + li + '">'
                + '<span class="lname"><span class="lchev">▶</span>' + l.name + ' 라인</span>'
                + '<div class="lmini">' + fill(a.prog, col) + '</div>'
                + '<span class="lright">생산 <b>' + nf(a.made) + '</b>/' + nf(a.need) + ' <span class="lpct" style="color:' + col + '">' + a.prog + '%</span></span>'
                + '</div><div class="litems">' + items + '</div></div>';
        }

        function renderRows() {
            let list = PROJECTS.map((p, i) => ({p, i, s: score(p)}));
            if (hideDone) list = list.filter(o => !isAllDone(o.p));
            const ordered = list.sort((a, b) => b.s - a.s);
            if (!ordered.length) {
                el('#projRows').innerHTML = '<div style="padding:18px;text-align:center;color:#7e8794;font-size:13px">표시할 프로젝트가 없습니다 (완료건 숨김)</div>';
                return;
            }
            el('#projRows').innerHTML = ordered.map(o => {
                const p = o.p, i = o.i, a = agg(flat(p)), col = rateColor(a.prog), r = risk(p);
                const d = r.d, dueSoon = d <= 7 && !r.allDone;
                const dueTxt = d < 0 ? ('납기 ' + (-d) + '일 초과') : ('D-' + d);
                const tags = r.tags.map(t => '<span class="tag ' + t[0] + '">' + t[1] + '</span>').join('')
                    + ((a.working.length + (p.mwork || []).length)
                        ? '<span class="tag work">작업중 ' + (a.working.length + (p.mwork || []).length) + '</span>' : '')
                    + (p.delayCnt ? '<span class="tag danger">WBS 지연 ' + p.delayCnt + '</span>' : '')
                    // 출하했지만 납품 확인 전. 만들 건 없고 인수만 남았다
                    + (isShipped(p) && !isAllDone(p) ? '<span class="tag out">출하완료 · 납품대기</span>' : '');

                /*
                 * 마일스톤 요약. 카드를 펼치지 않아도 어느 관문에서 막혔는지 보인다.
                 * 완료된 것은 접고 <b>아직 안 끝난 앞쪽 3개</b>만 보여준다 —
                 * 전부 늘어놓으면 그냥 WBS 목록이 되어 관문 구실을 못 한다.
                 */
                const msNext = (p.milestones || []).filter(m => m.s !== 'done').slice(0, 3);
                const msDone = (p.milestones || []).filter(m => m.s === 'done').length;
                const msLine = (p.milestones || []).length
                    ? '<div class="pc-ms">' + (msDone ? '<span class="d">✓' + msDone + '</span>' : '')
                    + msNext.map(m => '<span class="' + (m.delay ? 'x' : '') + '">◆'
                        + m.n + (m.delay ? ' 지연' : '') + '</span>').join('') + '</div>'
                    : '';
                const ss = stageStats(flat(p));
                const inR = a.inNeed ? Math.round(a.inMade / a.inNeed * 100) : 0;
                const outR = a.outAll ? Math.round(a.outRcv / a.outAll * 100) : 0;
                // 조립·검사(품목에 붙은 것) + 가공(프로젝트에만 붙은 것)을 함께 보여준다.
                // 가공은 품목 미지정이 많아 item.working 으로 내려오지 않는다.
                const wkAsm = a.working.map(w => (w.working.stage || '') + '·' + w.working.worker);
                const wkMac = (p.mwork || []).map(w =>
                    (w.machine || '') + '·' + (w.worker || '')
                    + (w.item_name ? ' (' + w.item_name + ')' : ''));
                const wkAll = wkAsm.concat(wkMac);
                const workLine = '<div class="pc-work">'
                    + (wkAll.length ? '▶ ' + wkAll.join(', ') : '') + '</div>';
                // ── 컴팩트 카드 ──
                const card = '<div class="pcard ' + (r.danger ? 'risk' : '') + ' ' + (openP === i ? 'open' : '') + '" data-proj="' + i + '">'
                    + '<div class="pc-head"><div><span class="nm">' + p.name + '</span></div>'
                    + '<span class="pc-due ' + (dueSoon ? 'soon' : '') + '">' + dueTxt + '</span></div>'
                    + stageDots(flat(p), i, p.dsteps, p)
                    + '<div class="pc-foot">'
                    + '<div class="pc-prog" style="color:' + col + '">' + a.prog + '<small>% 생산진척</small></div>'
                    + '<div class="pc-track">' + fill(a.prog, col) + '</div>'
                    + '<div class="pc-sub">공정 <span class="m">' + nf(a.made) + '</span>/' + nf(a.need) + '대 · 남음 ' + nf(a.rem)
                    // 유닛·가공품은 실적이 아니라 <b>필요량</b>이다. 규모를 가늠하는 값.
                    + (a.unit ? ' · 유닛 ' + nf(a.unitDone || 0) + '/' + nf(a.unit) : '')
                    + (kindNeedOf(p) ? ' · 가공품 ' + nf(kindNeedOf(p)) : '')
                    + (a.ordered < a.need ? ' · <span style="color:#d3aa55">미지시 ' + nf(a.need - a.ordered) + '</span>' : '')
                    + '</div>'
                    + workLine
                    + '<div class="pc-tags">' + tags + '</div>' + msLine
                    + '</div></div>';
                if (openP !== i) return card;
                // ── 펼침: 전체폭 상세 ──
                const makeSplit = '<div class="make-split">'
                    + '<div class="ms-card"><div class="mh"><span class="in">내작 조립</span><span>' + nf(a.inMade) + '/' + nf(a.inNeed) + ' · ' + inR + '%</span></div><div class="mt">' + fill(inR, '#6c9fd1') + '</div></div>'
                    + '<div class="ms-card"><div class="mh"><span class="out">외작 입고</span><span>' + a.outRcv + '/' + a.outAll + ' 품목 · ' + outR + '%</span></div><div class="mt">' + fill(outR, '#d49279') + '</div></div>'
                    + '</div>';
                const stageStat = '<div class="stage-stat">'
                    + '<span class="ss"><span class="l">설계(출도)</span><b>' + ss.design.d + '/' + ss.design.t + '</b> 품목</span>'
                    + '<span class="ss"><span class="l">제작(내작+외작)</span><b>'
                    + ss.make.d + '/' + ss.make.t + '</b> 품목</span>'
                    + '<span class="ss"><span class="l">검사</span><b>' + ss.insp.d + '/' + ss.insp.t + '</b> 품목</span>'
                    + '</div>';
                const lines = p.lines.map((l, li) => lineBlock(p, li, i)).join('');
                const ship = '<div class="ship-chips">'
                    + '<span class="ship">시운전(출하): <b style="color:' + (p.ship ? '#5cbf9b' : '#7e8794') + '">' + (p.ship ? '완료' : '대기') + '</b></span>'
                    + '<span class="ship">출고(종료): <b style="color:' + (p.outd ? '#5cbf9b' : '#7e8794') + '">' + (p.outd ? '완료' : '대기') + '</b></span></div>';
                const detail = '<div class="pdetail-full">'
                    + '<div class="pd-title">' + p.name + ' — 상세</div>'
                    + dzPanel(p.dsteps)
                    + '<div class="sub-h" style="margin-top:22px">WBS — 마일스톤 / 계획 대비 실적'
                    + (p.delayCnt ? ' <span class="wst delay">지연 ' + p.delayCnt + '</span>' : '') + '</div>'
                    + msRow(p.milestones)
                    + wbsTable(p.wbs)
                    + '<div class="sub-h" style="margin-top:22px">단계별 현황 (완료/대상 · 품목 수)</div>' + stageStat
                    + '<div class="sub-h" style="margin-top:22px">제작 — 내작 조립 / 외작 입고 <span style="font-size:.72em;font-weight:400;color:#8f98a5">공정 대수 기준</span></div>' + makeSplit
                    + '<div class="sub-h" style="margin-top:22px">가공품 — 유형별 필요량 / 설비 작업량'
                    + ' <span style="font-size:.72em;font-weight:400;color:#8f98a5">참고 · 진척률에는 포함하지 않음</span></div>'
                    + kindTable(p.kinds)
                    + '<div class="sub-h" style="margin-top:22px">가동 현황 — 진행중인 설비 / 작업자</div>'
                    + runTable(p)
                    + '<div class="sub-h" style="margin-top:22px">일자별 가공 실적 <span style="font-size:.72em;font-weight:400;color:#8f98a5">최근 14일 · 설비 작업량</span></div>'
                    + dailyTable(p.daily)
                    + '<div class="sub-h" style="margin-top:22px">라인별 (라인 클릭 시 공정 펼침)</div>' + lines
                    + ship
                    + '<div class="note">※ 단계 증빙: 설계=도면출도(검도→출도, 수주) · 제작=조립완료+외작입고 품목 · 검사=검사완료 품목. 보기 전용 — 변경은 각 업무화면에서.<br>※ 가공품 표의 <b>필요</b>는 부품 개수(BOM 합계)이고, 공정별 숫자는 <b>그 설비가 처리한 횟수</b>입니다. 한 부품이 절단·가공을 거치며 공정마다 다시 세어지므로 <b>가로로 더하지 마세요</b>. 어느 부품이 어느 공정을 거치는지 시스템은 모르므로 필요량과 직접 비교할 수 없고, 진척률에도 넣지 않습니다. 진척은 위 단계(설계·제작·검사)와 WBS로 봅니다. 품목 미지정 실적이 포함되어 품목별 칩의 합보다 클 수 있습니다.</div>'
                    + '</div>';
                return card + detail;
            }).join('');

            el('#projRows').querySelectorAll('[data-dz]').forEach(node => node.onclick = (e) => {
                e.stopPropagation();
                openP = +node.dataset.dz;
                renderRows();
            });
            el('#projRows').querySelectorAll('[data-proj]').forEach(node => node.onclick = () => {
                const i = +node.dataset.proj;
                openP = (openP === i) ? -1 : i;
                renderRows();
                if (openP === i) requestAnimationFrame(() => {
                    const d = el('#projRows').querySelector('.pdetail-full');
                    if (d) d.scrollIntoView({behavior: 'smooth', block: 'center'});
                });
            });
            el('#projRows').querySelectorAll('[data-line]').forEach(node => node.onclick = (e) => {
                e.stopPropagation();
                const li = +node.dataset.line;
                openL[openP] = (openL[openP] === li) ? -1 : li;
                renderRows();
            });
        }

        // ── 외주 현황 (전사 외주처별) ──────────────────────────────
        function renderVendors() {
            const map = {};   // vendor → [{code, proj, need, rcv, due, d}]
            PROJECTS.forEach(p => {
                if (hideDone && isAllDone(p)) return;   // 완료 프로젝트 제외(목록·외주 정리)
                flat(p).forEach(x => {
                    if (x.type !== '외작') return;
                    const v = x.vendor || '(미지정)';
                    (map[v] = map[v] || []).push({
                        code: x.code,
                        proj: p.name,
                        need: x.need,
                        rcv: x.rcv,
                        due: p.due,
                        d: dday(p.due)
                    });
                });
            });
            const vendors = Object.keys(map).sort();
            let nearMiss = 0;
            const html = vendors.map((v, vi) => {
                const its = map[v];
                // 대수 기준으로 센다 (제작 섹션·품목 행과 축을 맞춘다)
                const total = its.reduce((s2, x) => s2 + (x.need || 0), 0);
                const rcvN = its.filter(x => x.rcv).reduce((s2, x) => s2 + (x.need || 0), 0);
                const rate = total ? Math.round(rcvN / total * 100) : 0;
                const miss = its.filter(x => !x.rcv);
                const missNear = miss.filter(x => x.d >= 0 && x.d <= NEAR || x.d < 0).length;
                nearMiss += missNear;
                const col = rate >= 100 ? '#5cbf9b' : rate >= 50 ? '#d3aa55' : '#d49279';
                const open = openV === vi;
                const warn = missNear > 0 ? '<span class="tag warn">⚠ 임박 미입고 ' + missNear + '</span>' : '';
                const rows = its.sort((a, b) => a.rcv - b.rcv || a.d - b.d).map(x => {
                    const near = !x.rcv && (x.d < 0 || x.d <= NEAR);
                    const st = x.rcv ? '<span class="ib dok">입고</span>' : ('<span class="ib ' + (near ? 'dno' : 'up') + '">미입고</span>');
                    return '<div class="vrow"><span class="icode">' + x.code + '</span>'
                        + '<span class="v">' + x.proj + '</span>'
                        // 외작은 입고 여부라 0 또는 전량이다. 대수로 적는다
                        + '<span class="inum">' + nf(x.rcv ? x.need : 0) + '/' + nf(x.need)
                        + ' <span class="iu">공정(대)</span></span>'
                        + '<span class="vd ' + (near ? 'soon' : '') + '">' + (x.d < 0 ? '납기초과' : 'D-' + x.d) + '</span>'
                        + '<span class="ibadges">' + st + (near ? '<span class="tag warn">임박</span>' : '') + '</span></div>';
                }).join('');
                return '<div class="lblock ' + (open ? 'open' : '') + '">'
                    + '<div class="lhead vhead" data-vendor="' + vi + '" style="grid-template-columns:150px 1fr 170px">'
                    + '<span class="lname"><span class="lchev">▶</span>🏭 ' + v + '</span>'
                    + '<div class="lmini">' + fill(rate, col) + '</div>'
                    + '<span class="lright">입고 <b>' + nf(rcvN) + '</b>/' + nf(total) + ' 대 <span class="r" style="color:' + col + '">' + rate + '%</span> ' + warn + '</span>'
                    + '</div><div class="litems">' + rows + '</div></div>';
            }).join('');
            el('#vendorRows').innerHTML = html || '<div style="padding:14px;color:#7e8794;font-size:13px">외작 공정이 없습니다</div>';
            el('#vendorAlertLab').innerHTML = nearMiss > 0 ? '<span style="color:#d3aa55;font-weight:700">⚠ 임박 미입고 ' + nearMiss + '건</span>' : '<span style="color:#5cbf9b">임박 미입고 없음</span>';
            el('#vendorRows').querySelectorAll('[data-vendor]').forEach(node => node.onclick = () => {
                const vi = +node.dataset.vendor;
                openV = (openV === vi) ? -1 : vi;
                renderVendors();
            });
        }

        el('#hideDone').onchange = e => {
            hideDone = e.target.checked;
            renderRows();
            renderVendors();
        };

        function renderAll() {
            renderKpi();
            renderAlert();
            renderWorking();
            renderRows();
            renderVendors();
        }

        // 최초 1회 로드 후 30초마다 갱신 (벽걸이 모니터용 — 사람이 새로고침하지 않는다)
        refreshAll();
        setInterval(refreshAll, 30000);
    </script>
</th:block>
</html>
