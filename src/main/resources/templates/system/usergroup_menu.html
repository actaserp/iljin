<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">
        <!-- Page Title -->
        <div class="page-title-wrap">
            <div class="left">
                <h2>메뉴 권한</h2>
                <a title="북마크" class="bookmark toggle">
                    내메뉴
                </a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>시스템관리</li>
                <li>메뉴권한</li>
            </ul>
        </div>
        <section class="section">
            <div class="section-top">
                <form id="searchForm" autocomplete="off">
                    <div class="search-wrap">
                        <dl>
                            <dt>
                                <label for="cboUserGroup2">
                                    사용자그룹<span class="eq"></span>
                                </label>
                            </dt>
                            <dd>
                                <select class="form-control2" id="cboUserGroup2" name="cboUserGroup"></select>
                            </dd>
                        </dl>
                        <dl>
                            <dt>
                                <label for="cboMenuFolder">
                                    메뉴폴더<span class="eq"></span>
                                </label>
                            </dt>
                            <dd>
                                <select class="form-control2" id="cboMenuFolder" name="cboMenuFolder"></select>
                            </dd>
                        </dl>

                        </br>
                        <dl>
                            <dd>
                                <div class="srch-box" style="margin-top: 20px">
                                    읽기<input type="checkbox" id="AllcheckRead">
                                </div>
                            </dd>
                        </dl>
                        <dl>
                            <dd>
                                <div class="srch-box" style="margin-top: 20px;">
                                    쓰기<input type="checkbox" id="AllcheckWrite">
                                </div>
                            </dd>
                        </dl>
                        <dl>
                            <dd>
                                <div class="srch-box" style="margin-top: 20px;">
                                    알람<input type="checkbox" id="AllcheckAlarm">
                                </div>
                            </dd>
                        </dl>
                    </div>
                </form>
                <div class="button-wrap">
                    <ul>
                        <li>
                            <a class="btn btn-edit" id="btnSave2" title="저장">
                                <img th:src="@{/images/icon/ico-save.svg}" alt="엑셀 아이콘">
                                저장
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="container-fluid">
                <p id="selectedItem"></p>
                <div id="theGrid" style="max-height: 690px;"></div>
            </div>
            <div class="btn-wrap"></div>
        </section>
    </div> <!--//layout-contents end -->

    <footer style="margin-top: 24px;">
        <p>Copyrightⓒ 0000 corp. All rights reserved.</p>
    </footer>


</th:block>
<th:block layout:fragment="scripts">
    <th:block th:replace="/common/approve_box :: approve_box"></th:block>
    <th:block th:replace="/common/ax5_uploader :: ax5_uploader"></th:block>
    <th:block th:replace="/common/upload_one_image_box :: upload_one_image_box"></th:block>
    <th:block th:replace="/common/popup_select_user_code :: popup_select_user_code"></th:block>

    <script type="text/javascript">

        var theGrid;
        var viewdata;
        let selectedFiles = [];
        let SelectItem;
        let csrfToken = $("[name=_csrf]").val();

        document.readyState === 'complete' ? init() : window.onload = init;

        let columns = [
            {key: 'id', header: 'id', width: '1*', align: 'center', visible: false},
            {key: 'code', header: '코드', width: '1*', align: 'center'},
            {key: 'name', header: '그룹명', width: '1*', align: 'center'},
            {key: 'description', header: '설명', width: '1*', align: 'center'},
            {key: 'gmenu', header: 'Dashboard', width: '1*', align: 'center', visible: false},
            {key: 'gmenuname', header: 'Dashboard', width: '1*', align: 'center'},
            {key: 'flag', header: 'flag', width: '1*', align: 'center', visible: false},
        ]

        function init() {
            let data2 = [];
            let group_id = $('#cboUserGroup2').val();
            let folder_id = $('#cboMenuFolder').val();

            $.ajax({
                url: '/api/system/usergroupmenu/read',
                type: 'GET',
                data: {
                    'group_id': group_id,
                    'folder_id': folder_id
                },
                async: false,
                success: function (data) {
                    data2 = data.data;

                    // 중분류 메뉴를 제외한 데이터 필터링
                    data2 = data.data.filter(item => item.r !== null || item.w !== null|| item.a !== null);
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    console.error('Error fetching log_list data:', textStatus, errorThrown);
                }
            });


            viewdata = data2;


            theGrid = new EditTable('#theGrid', {
                groupBy: 'gpname',   // 메뉴명으로 묶기 (위즈모 PropertyGroupDescription 대신)
                columns: [
                    {
                        key: 'name',
                        header: '코드명',
                        width: 250,
                        align: 'center',
                        readOnly: true,
                    },
                    {
                        key: 'r',
                        header: '읽기',
                        width: 200,
                        align: 'center',
                        type: 'check', on: true, off: false,
                        readOnly: false,
                    },
                    {
                        key: 'w',
                        header: '쓰기',
                        width: 200,
                        align: 'center',
                        type: 'check', on: true, off: false,
                        readOnly: false,
                    },
                    {
                        key: 'a',
                        header: '알람',
                        width: 200,
                        align: 'center',
                        type: 'check', on: true, off: false,
                        readOnly: false,
                    },

                ],
            });
            theGrid.setData(viewdata);


        }

        // "읽기" 체크박스 클릭 이벤트 핸들러
        document.getElementById('AllcheckRead').addEventListener('change', function () {
            var checked = this.checked;
            theGrid.getView().forEach(row => theGrid.setValue(row, 'r', checked));   // 보이는 행 모두
        });

        // "쓰기" 체크박스 클릭 이벤트 핸들러
        document.getElementById('AllcheckWrite').addEventListener('change', function () {
            var checked = this.checked;
            theGrid.getView().forEach(row => theGrid.setValue(row, 'w', checked));   // 보이는 행 모두
        });

        document.getElementById('AllcheckAlarm').addEventListener('change', function () {
            var checked = this.checked;
            theGrid.getView().forEach(row => theGrid.setValue(row, 'a', checked));   // 보이는 행 모두
        });


        $('#btnSave2').click(saveUserGroupMenu);

        function searchData2() {
            let group_id = $('#cboUserGroup2').val();
            let folder_id = $('#cboMenuFolder').val();

            $.ajax({
                url: '/api/system/usergroupmenu/read',
                type: 'GET',
                data: {
                    'group_id': group_id,
                    'folder_id': folder_id
                },
                async: false,
                success: function (data) {
                    /* console.log("서버 응답 데이터:", data); //서버에서 반환된 데이터 로그 출력*/

                    if (data && data.success && Array.isArray(data.data) && data.data.length > 0) {
                        let filteredData = filterDataByFolder(data.data, data.folder_id);
                        grid_binding2(filteredData);    // 서버에서 반환된 데이터
                    } else {
                        console.warn('서버에서 반환된 데이터가 없습니다.');
                        console.log("응답 데이터 형식 확인:", data);

                    }

                },
                error: function (jqXHR, textStatus, errorThrown) {
                    console.error('Error fetching log_list data:', textStatus, errorThrown);
                }
            });
        }

        function filterDataByFolder(data, folderId) {
            // folderId에 해당하는 데이터만 필터링
            return data.filter(item => item.folder_id === folderId);

        }

        let menuGroupName = 'gpname';   // 메뉴명으로 묶기


        function grid_binding2(data) {
            // 중분류 메뉴가 아닌 데이터만 필터링
            let UserMenuData = data
                .filter(item => item.r !== null || item.w !== null|| item.a !== null) // 읽기(r) 또는 쓰기(w)가 null이 아닌 항목만 선택
                .map(item => ({
                    name: item.name,
                    r: item.r,
                    w: item.w,
                    a: item.a,
                    gpname: item.gpname,  // 그룹화를 위한 속성 추가
                    menu_code: item.menu_code, // 추가: menu_code 필드 포함
                    ugm_id: item.ugm_id // 추가: ugm_id 필드 포함
                }));


            var columns = [
                {key: 'name', header: '코드명', width: 250, align: 'left'},
                {
                    key: 'r',
                    header: '읽기',
                    width: 200,
                    align: 'center',
                    type: 'check', on: true, off: false,
                    readOnly: false
                },
                {
                    key: 'w',
                    header: '쓰기',
                    width: 200,
                    align: 'center',
                    type: 'check', on: true, off: false,
                    readOnly: false
                },
                {
                    key: 'a',
                    header: '알람',
                    width: 200,
                    align: 'center',
                    type: 'check', on: true, off: false,
                    readOnly: false
                },
                
            ];


            // **클릭 이벤트 처리**
            // 체크 칸은 누르면 값이 바로 바뀜 (위즈모 때의 cellEditEnded 토글은 s.itemsSource[e.row] 가 없어 늘 오류로 끝나 실제로는 안 돌았음)

            viewdata = UserMenuData;
            theGrid.setGroup(menuGroupName);
            theGrid.setData(viewdata);
        }

        function saveUserGroupMenu() {
            let group_id = $('#cboUserGroup2').val();
            let folder_id = $('#cboMenuFolder').val();

            let url = '/api/system/usergroupmenu/save';
            let data = {group_id: group_id, Q: ''};
            let items = [];

            // itemsSource의 sourceCollection을 사용하여 데이터 순회
            let sourceCollection = theGrid.getData() || [];
            /*console.log("Source Collection Length:", sourceCollection.length);*/

            sourceCollection.forEach(item => {
                items.push({
                    menu_code: item.menu_code,
                    ugm_id: item.ugm_id,
                    r: !!item.r, // 읽기 상태
                    w: !!item.w, // 쓰기 상태
                    a: !!item.a, // 알람 상태
                });
            });

            /*  console.log("Items to be sent:", JSON.stringify(items, null, 2));*/
            data.Q = JSON.stringify(items);

            Alert.confirm('', '저장하시겠습니까?', function () {
                let fnSuccess = function (result) {
                    /* console.log("Server response:", JSON.stringify(result, null, 2));*/
                    if (result.success) {
                        Alert.alert('', '저장되었습니다');
                        searchData2(); // 저장 후 데이터 갱신
                    } else {
                        console.error('저장 실패:', result.message);
                    }
                };
                AjaxUtil.postAsyncData(url, data, fnSuccess);
            });
        }


        $('#cboUserGroup2, #cboMenuFolder').change(function () {
            // 값이 변경되었을 때 searchData 함수를 호출
            searchData2();
        });

        // 체크박스 초기화
        function clearForm2() {
            ['AllcheckRead', 'AllcheckWrite'].forEach(id => {
                document.getElementById(id).checked = false;
            });
        }

        $(document).ready(function (e) {

            // 초기 콤보박스 채우기
            AjaxUtil.fillSelectOptions($('#cboUserGroup2'), 'user_group', '', '');
            AjaxUtil.fillSelectOptions($('#cboMenuFolder'), 'menu_folder', 'all', '');
        });

    </script>
</th:block>
</html>
