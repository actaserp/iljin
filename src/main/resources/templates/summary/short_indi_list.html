            <li>납기 단축 지표</li>
        </ul>
    </div>

                    <dt>
                        <label>

                    <dd>

                        </div>
                    </dd>
                </dl>

                <dl>
                    <dt>&nbsp;</dt>
                    <dd>
                        <li>
                            <a class="btn btn-delete" title="검색" id="btnSearch">

                                <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">

                </dl>
                <dl>
                    <dt>&nbsp;</dt>
                    <dd>
                        <span>* 일수 계산은 수주일을 1일로 포함하여 계산됩니다. </span>
                    </dd>

                </dl>

            </div>
        </div>
        <div class="container-fluid">
            <div id="theGrid" style="height: 730px;"></div>
        </div>
    </section>
</div>
</th:block>
<th:block layout:fragment="scripts">
<script type="text/javascript">
    class ProductionMonthPage {
        constructor() {
            this.grid = null;
            this.viewData = [];
            this.init();
        }

        init() {
            let _this = this;

            this.grid = new EditTable('#theGrid', {
                readOnly: true,
                frozenColumns: 4,

                rowClass: r => r.is_footer ? 'et-bold et-blue et-gray' : '',   // 월 합계 행 굵게 · 회색 바탕 (위즈모 formatItem 대신)

                columns: [
                    { key: 'jumundate', header: '수주일자', width: 120, align: 'center' },
                    { key: 'jumun_number', header: '수주번호', width: 150, align: 'center'},
                    { key: 'company_name', header: '거래처명', width: '1*', align: 'left' },
                    { key: 'material_summary', header: '제품명', width: '1*', align: 'left' },
                    { key: 'total_suju_qty', header: '수주수량', width: 100, align: 'right', format: 'n0' },
                    { key: 'total_shipped_qty', header: '출하수량', width: 100, align: 'right', format: 'n0' },
                    { key: 'shipdate', header: '출하일자', width: 130, align: 'center' },
                    { key: 'avg_wday', header: '평균납기일수', width: 100, align: 'center', format: 'n1' },
                ]
            });

            this.grid.opts.fileName = '납기 단축 지표';
        }




        searchMainData() {
            let url = '/api/summary/indicator/short_read'
            let data = {
				//'cboYear' : $("#cboYear").val(),
                'date_from' : $('#srchStartDt').val(),
                'date_to' : $('#srchEndDt').val(),
                'spjangcd' : sessionStorage.getItem('spjangcd')
			}
            const result = AjaxUtil.getSyncData(url, data);
            console.log("result data : ", result.data);
            if (result) {
                this.grid.setData(result.data);
            }
        }

    }

    let page = null;

    $(document.body).ready(function (e) {

        $('#srchStartDt').val(CommonUtil.getYYYYMMDD(-7));
        $('#srchEndDt').val(CommonUtil.getYYYYMMDD());


        page = new ProductionMonthPage();

        AjaxUtil.fillSelectOptions($('#cboYear'), 'data_year', '', false);

        page.searchMainData();

        // 검색
        $('#btnSearch').click(function (e) {
            page.searchMainData();
        });


    });
