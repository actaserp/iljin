        init() {
            let _this = this;

            // 월 합계 : 매출액 · 평균재고금액은 더하고, 재고회전율은 (매출 합 / 평균재고 합)
            const total = k => rows => rows.reduce((s, r) => s + (parseFloat(r[k]) || 0), 0);
            const turn = m => rows => { const money = total(`mon_${m}_money`)(rows), inv = total(`mon_${m}_avginv`)(rows); return inv ? Math.round(money / inv * 100) / 100 : 0; };

            // 위즈모 2단 머리글(위 줄 'n월') 대신 머리글에 달을 붙임 : '1월 매출액' · '1월 평균재고금액' · '1월 재고회전율(횟수)'
            this.grid = new EditTable('#theGrid', {
                sortable: false,
                readOnly: true,
                frozenColumns: 4,
                footerLabel: '합계',
                columns: [
                    { key: 'mat_grp_name', header: '제품그룹', width: 120, align: 'center', merge: true },
                    { key: 'mat_code', header: '제품코드', width: 140, align: 'center', merge: true },
                    { key: 'mat_name', header: '제품명', width: 240, align: 'center', merge: true },
                    { key: 'unit_name', header: '단위', width: 80, align: 'center', merge: true },
                    ...Array.from({ length: 12 }, (_, i) => ([ // 월별 1~12월
                        { key: `mon_${i + 1}_money`, header: `${i + 1}월 매출액`, width: 120, align: 'center', format: 'n0', sum: total(`mon_${i + 1}_money`) },
                        { key: `mon_${i + 1}_avginv`, header: `${i + 1}월 평균재고금액`, width: 120, align: 'center', format: 'n0', sum: total(`mon_${i + 1}_avginv`) },
                        { key: `mon_${i + 1}_turnover`, header: `${i + 1}월 재고회전율(횟수)`, width: 140, align: 'center', format: 'n2', sum: turn(i + 1) }
                    ])).flat(),
                    { key: 'year_turnover', header: '연간 재고회전율', width: 140, align: 'center', format: 'n2' } // ✅ 맨 마지막
                ]
            });
            this.grid.setData(_this.viewData);

            this.grid.opts.fileName = '월별_재고회전율';
        }
