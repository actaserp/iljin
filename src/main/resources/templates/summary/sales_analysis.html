<th:block layout:fragment="scripts">
<th:block th:replace="/common/columns_setting :: columns_setting"></th:block>
    <th:block th:replace="/common/popup_company :: popup_company"></th:block>
<script type="text/javascript">
    class SujuMonthWijmoPage {
        constructor() {
            this.url = '/api/summary/suju_month_summary';
            this.grid = null;
            this.$btnEdit = $('#btnEdit');
            this.$btnAddNew = $('#btnAddNew');
            this.viewData = [];
            this.init();
        }

        init() {
            let _this = this;
            this.grid = new EditTable('#theGrid', {
            footerLabel: '총합',
                  //셀 병합
                readOnly: true,
                frozenColumns: 7,

                columns: [
                    { key: 'mat_grp_name', header: '제품그룹', width: 100 ,merge: true, align: 'center'},
                    { key: 'mat_code', header: '제품코드', width: 150 ,merge: true, align: 'center'},
                    { key: 'mat_name', header: '제품명', width: 150 ,merge: true, align: 'center'},
                    { key: 'unit_name', header: '단위', width: 70 , sortable: false, align: 'center'},
                    { key: 'year_qty_sum', header: '연수주량', width: 100, format: 'n0', align: 'right', sum: true},
                    { key: 'year_money_sum', header: '연수주액', width: 150, format: 'n0', align: 'right', sum: true},
                    { key: 'company_name', header: '업체', width: 200, sortable: false, cellClass: r => typeof r.company_name === 'string' && r.company_name.trim() === '소계' ? 'et-bold et-blue' : ''},
                    ...Array.from({ length: 12 }, (_, i) => ({
                        key: `mon_${i + 1}`,
                        header: `${i + 1}월`,
                        width: 80,
                        format: 'n0',
                        align: 'right',
                        sortable: false
                    }))
                ],
                 // 데이터를 설정할 배열
            });
            this.grid.setData(this.viewData);
            // (위즈모 itemFormatter : '소계' 줄 강조 → company_name 칸 cellClass, 가운데 정렬 → 칸 align)



            this.grid.opts.fileName = '월별수주량';
        }


        searchMainData() {
            const url = this.url + '/read';
            const data = {
                'cboYear': $('#cboYear').val(),
                'cboCompany': $('#cboCompany').val(),
                'cboMatGrp': $('#cboMatGrp').val(),
                'cboDataDiv': $('#cboDataDiv').val(),
            };
            const result = AjaxUtil.getSyncData(url, data);
            console.log("result data : ", result.data);
            if (result) {
                this.grid.setData(result.data);
            }
        }

        exportExcel() {
            this.grid.exportXlsx('월수주량');
        }
    }

    let page = null;

    $(document.body).ready(function (e) {
        const currentYear = new Date().getFullYear();
        const yearSelect = $('#cboYear');
        // 옵션 추가
        for (let y = currentYear; y >= 2010; y--) {
            yearSelect.append(new Option(y, y));
        }
        // 기본값 설정
        yearSelect.val(currentYear);

        page = new SujuMonthWijmoPage();

        AjaxUtil.fillSelectOptions($('#cboMatGrp'), 'material_group', 'all', '', 'product,semi');

        $('#btnSearch').click(() => {
            if ($('#cboCompanyHidden').val() === '' && $('#cboCompany').val() !== '') {
                Alert.alert('', '업체명은 업체검색 버튼을 통해서 \n 검색해주세요');
                return;
            }

            page.searchMainData();
        });

        $('#btnCompanySearch').click(function () {

            let poppage = new PopCompComponent();
            let $poppage = $(poppage);
            let searchcallback = function (items) {
                // $content.find('#cboCompany').val(items.id);
                // $content.find('#CompanyName').val(items.compname);
                console.log('items : ',items);
                document.getElementById('cboCompany').value = items.compname;
                document.getElementById('cboCompanyHidden').value = items.id;
            };

            poppage.show(searchcallback);
        });

        page.searchMainData();
    });
    $('#cboCompany').on('input', function () {
        const val = $(this).val();
        if (val === '') {
            $('#cboCompanyHidden').val('');
        }
    });
    // .btn-clear 클릭 후 input 이벤트 강제 발생
    $(document).on('click', '.btn-clear', function () {
        const $input = $(this).siblings('input[type="text"]');
        $input.val('');
        $input.trigger('input'); // 🔥 input 이벤트 강제 발생
    });



</script>
</th:block>
