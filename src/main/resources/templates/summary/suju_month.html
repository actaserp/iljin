<th:block layout:fragment="scripts">
    <th:block th:replace="/common/columns_setting :: columns_setting"></th:block>
    <th:block th:replace="/common/popup_company :: popup_company"></th:block>
    <script type="text/javascript">

        // ── 업체 자동완성 ─────────────────────────────────────────────
        // ※ 확인 필요: popup_company 가 실제로 호출하는 조회 URL / 파라미터명으로 맞출 것
        const COMPANY_SEARCH_URL   = '/api/popup/company/read';
        const COMPANY_SEARCH_PARAM = 'searchText';

        let companyResolvedName = '';   // 마지막으로 id 까지 확정된 업체명
        let companyLastQuery    = '';   // 마지막으로 조회를 던진 검색어 (중복 조회/팝업 방지)
        let companyResolving    = false;

        function setCompany(item) {
            document.getElementById('cboCompany').value       = item.compname;
            document.getElementById('cboCompanyHidden').value = item.id;
            companyResolvedName = item.compname;
        }

        function clearCompany(keepText) {
            document.getElementById('cboCompanyHidden').value = '';
            if (!keepText) document.getElementById('cboCompany').value = '';
            companyResolvedName = '';
        }

        function searchCompany(keyword) {
            return new Promise((resolve) => {
                const param = {};
                param[COMPANY_SEARCH_PARAM] = keyword;
                AjaxUtil.getAsyncData(COMPANY_SEARCH_URL, param,
                    (res) => resolve((res && res.data) ? res.data : []),
                    ()    => resolve([]));
            });
        }

        function openCompanyPopup(keyword) {
            const poppage = new PopCompComponent();
            // ※ 확인 필요: show(callback, keyword) 로 초기 검색어 전달이 되는지.
            //   지원하지 않으면 두 번째 인자는 무시되고 빈 팝업이 열린다.
            poppage.show(function (items) {
                if (!items) return;
                setCompany(items);
            }, keyword);
        }

        /**
         * 입력한 업체명으로 조회 →  1건: 자동 바인딩 / 여러건: 팝업 / 0건: 안내
         * @returns {Promise<boolean>} id 까지 확정됐으면 true
         */
        async function bindCompanyByKeyword(keyword) {
            const kw = (keyword || '').trim();

            if (kw === '') { clearCompany(); return false; }
            if (kw === companyResolvedName && $('#cboCompanyHidden').val() !== '') return true;
            if (companyResolving) return false;

            companyResolving = true;
            companyLastQuery = kw;
            let list;
            try {
                list = await searchCompany(kw);
            } finally {
                companyResolving = false;
            }

            if (list.length === 0) {
                clearCompany(true);
                Alert.alert('', '검색된 업체가 없습니다.');
                $('#cboCompany').focus().select();
                return false;
            }

            if (list.length === 1) { setCompany(list[0]); return true; }

            // 이름이 정확히 일치하는 건이 하나뿐이면 그걸로 확정
            const exact = list.filter(v => (v.compname || '').trim() === kw);
            if (exact.length === 1) { setCompany(exact[0]); return true; }

            clearCompany(true);
            openCompanyPopup(kw);
            return false;
        }
        // ─────────────────────────────────────────────────────────────

        class SujuMonthWijmoPage {
            constructor() {
                this.url = '/api/summary/suju_month_summary';
                this.grid = null;
                this.$btnEdit = $('#btnEdit');
                this.$btnAddNew = $('#btnAddNew');
                this.viewData = [];
                this.init();
            }

            init() {
                let _this = this;
                this.grid = new EditTable('#theGrid', {
            footerLabel: '총합',
                      //셀 병합
                    readOnly: true,
                    frozenColumns: 8,

                    columns: [
                        { key: 'mat_grp_name', header: '제품그룹', width: 100 ,merge: true, align: 'center'},
                        { key: 'mat_code', header: '제품코드', width: 80 ,merge: true, align: 'center'},
                        { key: 'mat_name', header: '제품명', width: 150 ,merge: true, align: 'center'},
                        { key: 'standard', header: '규격', width: 70 , sortable: false },
                        { key: 'unit_name', header: '단위', width: 70 , sortable: false, align: 'center'},
                        { key: 'year_qty_sum', header: '연수주량', width: 100, format: 'n0', align: 'right', sum: true},
                        { key: 'year_money_sum', header: '연수주액', width: 150, format: 'n0', align: 'right', sum: true},
                        { key: 'company_name', header: '업체', width: 200, sortable: false, cellClass: r => typeof r.company_name === 'string' && r.company_name.trim() === '소계' ? 'et-bold et-blue' : ''},
                        ...Array.from({ length: 12 }, (_, i) => ({
                            key: `mon_${i + 1}`,
                            header: `${i + 1}월`,
                            width: 80,
                            format: 'n0',
                            align: 'right',
                            sortable: false
                        }))
                    ],
                     // 데이터를 설정할 배열
                });
                this.grid.setData(this.viewData);
                // (위즈모 itemFormatter : '소계' 줄 강조 → company_name 칸 cellClass, 가운데 정렬 → 칸 align)



                this.grid.opts.fileName = '월별수주량';
            }


            searchMainData() {
                const url = this.url + '/read';
                const data = {
                    'cboYear': $('#cboYear').val(),
                    'cboCompany': $('#cboCompanyHidden').val(),
                    'cboMatGrp': $('#cboMatGrp').val(),
                    'cboDataDiv': $('#cboDataDiv').val(),
                };
                const result = AjaxUtil.getSyncData(url, data);
                console.log("result data : ", result.data);
                if (result) {
                    this.grid.setData(result.data);
                }
            }

            exportExcel() {
                this.grid.exportXlsx('월수주량');
            }
        }

        let page = null;

        $(document.body).ready(function (e) {
            const currentYear = new Date().getFullYear();
            const yearSelect = $('#cboYear');
            // 옵션 추가
            for (let y = currentYear; y >= 2010; y--) {
                yearSelect.append(new Option(y, y));
            }
            // 기본값 설정
            yearSelect.val(currentYear);

            page = new SujuMonthWijmoPage();

            AjaxUtil.fillSelectOptions($('#cboMatGrp'), 'material_group', 'all', '', 'product,semi');

            $('#btnSearch').click(async () => {
                const name = $('#cboCompany').val().trim();
                if (name !== '' && $('#cboCompanyHidden').val() === '') {
                    const ok = await bindCompanyByKeyword(name);
                    if (!ok) return;   // 업체가 확정되지 않으면(0건·팝업) 조회하지 않음
                }

                page.searchMainData();
            });

            // 입력 중에는 확정 id 를 비워 둔다 (이름만 바뀐 채로 옛 id 가 남는 것 방지)
            $('#cboCompany').on('input', function () {
                const val = $(this).val();
                if (val.trim() !== companyResolvedName) {
                    $('#cboCompanyHidden').val('');
                    companyResolvedName = '';
                }
                if (val.trim() !== companyLastQuery) companyLastQuery = '';
                if (val === '') clearCompany();
            });

            // Enter: 입력값이 있으면 조회(1건 자동완성 / 여러건 팝업), 비어 있으면 바로 팝업
            $('#cboCompany').on('keydown', function (e) {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    e.preventDefault();
                    const kw = $(this).val().trim();
                    if (kw === '') {
                        clearCompany();
                        companyLastQuery = '';
                        openCompanyPopup('');
                        return;
                    }
                    bindCompanyByKeyword(kw);
                }
            });

            $('#cboCompany').on('change', function () {
                // Enter 로 이미 조회한 검색어면 blur 때 또 던지지 않는다 (팝업 중복 방지)
                if ($(this).val().trim() === companyLastQuery) return;
                bindCompanyByKeyword($(this).val());
            });

            page.searchMainData();
        });
        // .btn-clear 클릭 후 input 이벤트 강제 발생
        $(document).on('click', '.btn-clear', function () {
            const $input = $(this).siblings('input[type="text"]');
            $input.val('');
            $input.trigger('input'); // 🔥 input 이벤트 강제 발생
        });



    </script>
</th:block>
