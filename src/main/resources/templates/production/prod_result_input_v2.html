<html layout:decorate="~{layout_page}">
<head>
    <style>
        /* ===== 미리보기용 공통 (layout_page에 있으면 이 블록 삭제) ===== */
        body{margin:0;font-family:'Malgun Gothic','Pretendard',sans-serif;background:#e9edf3;color:#1d2330;font-size:14px;}
        *{box-sizing:border-box;}
        html,body{height:100%;}

        /* ===== 키오스크 전용 ===== */
        /* 외부(layout_page) CSS의 button{height:30px} 무력화 */
        .kiosk button{height:auto !important;min-height:0;min-width: 50px;}
        .kiosk{display:flex;flex-direction:column;height:100vh;padding:12px;gap:10px;}

        /* --- 상단 컨텍스트 바 (세션: 작업자·설비·작업중) --- */
        .ctx-bar{display:flex;align-items:stretch;gap:10px;background:#1f2a44;border-radius:12px;padding:10px 12px;color:#fff;flex:0 0 auto;}
        .ctx-title{display:flex;flex-direction:column;justify-content:center;padding-right:14px;border-right:1px solid #3c4d77;}
        .ctx-title h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px;}
        .ctx-title span{font-size:11.5px;color:#9fb0d4;margin-top:2px;}
        .ctx-slots{display:flex;gap:10px;flex:1 1 auto;}
        .ctx-slot{flex:1;background:#2c3a5e;border:1px solid #3c4d77;border-radius:10px;padding:8px 11px;display:flex;flex-direction:column;justify-content:center;min-width:0;}
        .ctx-slot .lab{font-size:11px;color:#9fb0d4;font-weight:700;letter-spacing:.3px;}
        .ctx-slot .val{font-size:16px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .ctx-slot .val.empty{color:#6f80a8;font-weight:600;font-size:14px;}
        .ctx-slot .sub{font-size:11.5px;color:#b9c6e4;margin-top:1px;}
        .ctx-right{display:flex;align-items:center;gap:12px;padding-left:4px;}
        .ctx-date{display:flex;flex-direction:column;justify-content:center;}
        .ctx-date label{font-size:11px;color:#9fb0d4;font-weight:700;}
        .clock{font-size:17px;font-weight:800;color:#ffd98a;letter-spacing:.5px;margin-bottom:2px;font-variant-numeric:tabular-nums;}
        .area-sel{margin-top:3px;border:1px solid #3c4d77;background:#2c3a5e;color:#fff;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;}
        /* 생산일 터치 스테퍼 */
        .date-pick{display:flex;align-items:center;gap:6px;margin-top:4px;}
        .date-nav{border:1px solid #3c4d77;background:#2c3a5e;color:#fff;border-radius:8px;width:36px;height:38px;font-size:15px;font-weight:800;cursor:pointer;}
        .date-nav:hover{background:#36456c;}
        /* 외부 input[type=date] 규칙(달력 배경아이콘 + min-width:160px) 무력화 */
        input[type=date].date-input{height:38px;border:1px solid #3c4d77;background:#2c3a5e !important;color:#fff;border-radius:8px;padding:0 10px;font-size:15px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums;min-width:0 !important;width:140px;z-index:auto;}
        input[type=date].date-input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.85;cursor:pointer;}
        .work-area{display:flex;align-items:stretch;min-width:160px;height: 100%}
        .work-btns{display:flex;gap:6px;flex:1;}
        .wbtn{flex:1;border:none;border-radius:10px;padding:0 14px;font-size:18px;font-weight:800;cursor:pointer;color:#fff;white-space:nowrap;}
        .wbtn.start{background:#2e9e5b;} .wbtn.start:hover{background:#34b366;}
        .wbtn.pause{background:#d9a23a;} .wbtn.pause:hover{background:#e6b04a;}
        .wbtn.done{background:#3565c4;} .wbtn.done:hover{background:#3f74d8;}
        .work-area.disabled{opacity:.4;pointer-events:none;}

        /* --- 본문: 좌(선택+로그) / 우(수량·등록 패드) --- */
        .kiosk-main{display:flex;gap:10px;flex:1 1 auto;min-height:0;}
        .left-col{flex:1.3;display:flex;flex-direction:column;gap:10px;min-height:0;}
        .pick-col{flex:1 1 auto;display:flex;flex-direction:column;background:#fff;border:1px solid #d4dae5;border-radius:12px;min-height:0;overflow:hidden;}
        .entry-col{flex:1;display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid #d4dae5;border-radius:12px;padding:16px;min-height:0;}

        /* 단계 탭 */
        .steps{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid #e6eaf1;background:#f6f8fb;flex:0 0 auto;}
        .step-tab{flex:1;border:1.5px solid #d4dae5;background:#fff;border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left;min-width:0;}
        .step-tab .n{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:#cfd6e2;color:#fff;font-size:11px;font-weight:800;margin-right:6px;}
        .step-tab .t{font-size:12.5px;font-weight:700;color:#52607a;}
        .step-tab .sv{display:block;margin-top:4px;font-size:14px;font-weight:800;color:#1d2330;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .step-tab .sv.none{color:#aab2c2;font-weight:600;font-size:12.5px;}
        .step-tab.active{border-color:#2f57d6;box-shadow:0 0 0 2px rgba(47,87,214,.12);}
        .step-tab.active .n{background:#2f57d6;}
        .step-tab.done .n{background:#1ca36b;}

        /* 타일 영역 */
        .pick-body{flex:1 1 auto;min-height:0;overflow:auto;padding:14px;}
        .pick-head{font-size:13px;font-weight:700;color:#5a6680;margin:0 0 10px;}
        .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
        .tiles.mach{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
        .tile{position:relative;border:1.5px solid #d4dae5;background:#fff;border-radius:12px;padding:16px 14px;cursor:pointer;text-align:left;transition:.1s;min-height:70px;display:flex;flex-direction:column;justify-content:center;}
        .tile:hover{border-color:#9fb1d8;background:#fafbfe;}
        .tile .tt{font-size:17px;font-weight:800;color:#1d2330;}
        .tile .ts{font-size:12px;color:#7a8499;margin-top:3px;}
        .tile.on{border-color:#2f57d6;background:#eef3ff;box-shadow:0 0 0 2px rgba(47,87,214,.15);}
        .tile.on::after{content:'✓';position:absolute;top:9px;right:11px;color:#2f57d6;font-weight:900;font-size:15px;}
        .tile .proc-chip{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;color:#1b5e9b;background:#e7f1fb;border-radius:8px;padding:2px 9px;width:fit-content;}
        .tile .busy{position:absolute;top:9px;right:11px;font-size:11px;font-weight:800;color:#a6791b;background:#fff5dd;border:1px solid #f0dca0;border-radius:8px;padding:1px 7px;}
        .group-lab{grid-column:1/-1;font-size:12px;font-weight:800;color:#8893a8;margin:6px 0 -2px;letter-spacing:.3px;}
        .pick-empty{color:#99a;text-align:center;padding:30px 0;font-size:14px;}

        /* 설비·공정 select */
        .sel-wrap{max-width:420px;}
        .kiosk-select{width:100%;font-size:20px;font-weight:800;color:#1d2330;border:1.5px solid #c7cfdd;border-radius:12px;padding:16px 14px;background:#fff;cursor:pointer;}
        .kiosk-select:focus{outline:none;border-color:#2f57d6;box-shadow:0 0 0 2px rgba(47,87,214,.15);}
        .sel-note{margin-top:10px;font-size:14px;color:#5a6680;}
        .sel-note b{color:#1b5e9b;}

        /* 우측 등록 패널 */
        /* 우측 등록 패드 (섹션 전체 사용) */
        .pad-search,.pad-qty{flex:1 1 auto;display:flex;flex-direction:column;gap:12px;min-height:0;}
        .search-hint{font-size:13px;font-weight:800;color:#5a6680;flex:0 0 auto;}
        .qwerty{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;min-height:0;}
        .qrow{flex:1;display:flex;gap:8px;}
        .qkey{flex:1;border:1.5px solid #d4dae5;background:#fff;border-radius:12px;font-size:22px;font-weight:800;cursor:pointer;color:#1d2330;display:flex;align-items:center;justify-content:center;padding:0;}
        .qkey:hover{background:#f2f5fb;}
        .qkey:active{transform:translateY(1px);}
        .qkey.grp{font-size:22px;letter-spacing:1px;color:#244a8a;}
        .qkey.spec{font-size:15px;color:#3d5a99;background:#f0f3f9;}
        /* 공정 검색칸 (좌측 목록 상단) */
        .srch{display:flex;align-items:center;gap:9px;border:1.5px solid #c7cfdd;border-radius:10px;padding:10px 13px;margin-bottom:12px;background:#fff;position:sticky;top:0;z-index:2;}
        .srch-ico{font-size:15px;}
        .srch-chips{flex:1;display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:28px;}
        .qchip{font-size:14px;font-weight:800;color:#1b3a6b;background:#e7f1fb;border:1px solid #cfe0f2;border-radius:7px;padding:3px 9px;letter-spacing:.5px;}
        .srch-txt.ph{color:#aab2c2;font-weight:600;font-size:13px;}
        .srch-clr{border:1px solid #d4dae5;background:#fff;border-radius:7px;width:28px;height:28px;cursor:pointer;color:#888;font-weight:800;}
        .srch-cnt{font-size:12px;font-weight:800;color:#8893a8;}
        .qty-row{display:flex;gap:12px;flex:0 0 auto;}
        .qty-box{flex:1;border:1.5px solid #d4dae5;border-radius:12px;padding:14px 16px;cursor:pointer;background:#fff;}
        .qty-box .ql{font-size:14px;font-weight:800;color:#5a6680;}
        .qty-box .qv{font-size:40px;font-weight:900;text-align:right;line-height:1.05;margin-top:4px;}
        .qty-box.good.active{border-color:#0b69a3;background:#ecf7fc;}
        .qty-box.good .qv{color:#0b69a3;}
        .qty-box.scrap.active{border-color:#a4478f;background:#fbeef7;}
        .qty-box.scrap .qv{color:#a4478f;}

        .keypad{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:10px;}
        .key{border:1.5px solid #d4dae5;background:#fff;border-radius:12px;font-size:30px;font-weight:800;cursor:pointer;color:#1d2330;display:flex;align-items:center;justify-content:center;}
        .key:hover{background:#f2f5fb;}
        .key.act{background:#f0f3f9;color:#3d5a99;}
        .key:active{transform:translateY(1px);}

        .btn-reg{flex:0 0 auto;width:100%;border:none;border-radius:12px;padding:22px;font-size:24px;font-weight:900;color:#fff;background:#2f57d6;cursor:pointer;letter-spacing:2px;}
        .btn-reg:disabled{background:#c2c9d4;cursor:not-allowed;}
        .btn-reg:not(:disabled):hover{background:#274ec2;}

        /* 최근 등록 (좌측 하단) */
        .log-card{flex:0 0 220px;display:flex;flex-direction:column;background:#fff;border:1px solid #d4dae5;border-radius:12px;min-height:0;overflow:hidden;}
        .log-head{padding:9px 14px;border-bottom:1px solid #e6eaf1;background:#f6f8fb;font-weight:800;font-size:13.5px;color:#39435a;flex:0 0 auto;}
        .log-scroll{flex:1 1 auto;min-height:0;overflow:auto;}
        table.log-table{width:100%;border-collapse:collapse;}
        table.log-table th,table.log-table td{border-bottom:1px solid #eef1f6;padding:8px 10px;font-size:12.5px;text-align:center;}
        table.log-table th{position:sticky;top:0;background:#eef2f8;color:#445;font-weight:800;}
        table.log-table td.k{font-weight:800;}
        .g-cell{color:#0b69a3;font-weight:800;}
        .s-cell{color:#a4478f;font-weight:800;}
        .x-btn{border:1px solid #e2b8c8;background:#fff;color:#c0466a;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;}
        .work-row{cursor:pointer;background:#fffbe8;}
        .work-row:hover{background:#fff3c4;}
        .work-row td.k{color:#7a5d12;}
        .badge-work{display:inline-block;font-size:11px;font-weight:800;color:#8a6d1b;background:#ffeebc;border:1px solid #f0dca0;border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums;}
        .x-btn.stop{border-color:#f0c98a;color:#a6791b;}
        .work-acts{white-space:nowrap;}
        .x-btn.pause{border-color:#f0c98a;color:#a6791b;margin-right:5px;}
        .x-btn.done{border-color:#9ab8e6;color:#2f5fb0;}
        .log-empty{color:#99a;text-align:center;padding:22px 0;font-size:13.5px;}

        .flash{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#1ca36b;color:#fff;font-weight:800;padding:11px 22px;border-radius:30px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s;z-index:50;}
        .flash.show{opacity:1;}
    </style>
</head>
<th:block layout:fragment="content">
    <div class="kiosk">
        <!-- 상단: 세션 컨텍스트 (작업자 → 설비/공정 → 작업중) -->
        <div class="ctx-bar">
            <div class="ctx-title">
                <h1>생산 실적</h1>
                <select id="areaSel" class="area-sel"></select>
            </div>
            <div class="ctx-slots">
                <div class="ctx-slot">
                    <span class="lab">작업자</span>
                    <span class="val empty" id="cxWorker">선택하세요</span>
                </div>
                <div class="ctx-slot">
                    <span class="lab">설비 · 공정</span>
                    <span class="val empty" id="cxMachine">선택하세요</span>
                    <span class="sub" id="cxProc"></span>
                </div>
                <div class="ctx-slot">
                    <span class="lab">프로젝트 · 공정</span>
                    <span class="val empty" id="cxProj">선택하세요</span>
                    <span class="sub" id="cxItem"></span>
                </div>
            </div>
            <div class="ctx-right">
                <div class="work-area disabled" id="workArea">
                    <div class="work-btns" id="workBtns"></div>
                </div>
                <div class="ctx-date">
                    <div class="clock" id="clock">--:--:--</div>
                    <label>생산일</label>
                    <div class="date-pick">
                        <button class="date-nav" id="dPrev">◀</button>
                        <input type="date" id="pdate" class="date-input">
                        <button class="date-nav" id="dNext">▶</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="kiosk-main">
            <!-- 좌: 단계별 선택 (위) + 최근 등록 (아래) -->
            <div class="left-col">
                <div class="pick-col">
                    <div class="steps" id="steps"></div>
                    <div class="pick-body" id="pickBody"></div>
                </div>

                <div class="log-card">
                    <div class="log-head" id="logHead">최근 등록</div>
                    <div class="log-scroll">
                        <table class="log-table">
                            <thead><tr><th>공정</th><th>유형</th><th>설비</th><th>작업자</th><th>부품수</th><th>취소</th></tr></thead>
                            <tbody id="logBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 우: 공정 선택 단계엔 검색 키패드, 그 외엔 수량 키패드 -->
            <div class="entry-col">
                <!-- 검색 패드 (공정 선택 단계) -->
                <div class="pad-search" id="padSearch">
                    <div class="search-hint">공정 검색 — 기억나는 글자·숫자를 누르면 포함된 코드만 (위치 무관)</div>
                    <div class="qwerty" id="qwerty"></div>
                </div>
                <!-- 수량 패드 -->
                <div class="pad-qty" id="padQty">
                    <div class="qty-row">
                        <div class="qty-box good active" id="qbGood" data-f="good">
                            <div class="ql">유니트</div>
                            <div class="qv" id="qvGood">0</div>
                        </div>
                    </div>
                    <div class="keypad" id="keypad"></div>
                    <button class="btn-reg" id="btnReg" disabled>등 록</button>
                </div>
            </div>
        </div>
    </div>
    <div class="flash" id="flash"></div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript" th:inline="none">
        const $ = s => document.querySelector(s);
        // 로컬 시간 기준 YYYY-MM-DD (toISOString은 UTC라 KST에서 하루 밀림 → 사용 금지)
        const toYMD = d => {
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        };

        /* ===== 마스터 데이터 ===== */
        // 머시닝센터(PLC) 제거 / 공정순서: 레이저절단 → 선반/밀링 → 와이어커팅
        const PROCESSES = [
            {code: 'laser', name: '레이저절단', machines: ['LC-01', 'LC-02']},
            {code: 'lathe', name: '선반/밀링', machines: ['LM-01', 'LM-02']},
            {code: 'wire', name: '와이어커팅', machines: ['WC-01', 'WC-02']}
        ];
        const PROC_ORDER = PROCESSES.map(p => p.code);
        const procName = c => (PROCESSES.find(p => p.code === c) || {}).name || c;
        const procMachines = c => (PROCESSES.find(p => p.code === c) || {machines: []}).machines;
        const machineProc = m => {
            const p = PROCESSES.find(p => p.machines.includes(m));
            return p ? p.code : null;
        };

        // 라우팅 제거 → 어떤 유형이든 어떤 공정이든 입력 가능
        const KINDS = ['plate', 'block', 'shim', 'brkt', 'pin', 'arm'];

        // ───────────────────────────────────────────────────────────
        // 키오스크 구역(설치 위치) 설정
        //  - 설비 옆에 설치된 키오스크별로 기본 공정/담당팀을 다르게 띄움.
        //  - 배포 시 CURRENT_AREA 값만 바꾸거나, URL 에 ?area=wire 로 덮어쓰기.
        //  - 조립/측정팀은 별도 화면이므로 여기엔 없음.
        // ───────────────────────────────────────────────────────────
        const TEAM_MACHINING = ['채완병', '우병철', '유현민', '휘황', '시하우', '낙흥'];
        const TEAM_WIRE = ['이종길', '반흥'];
        const AREAS = {
            laser: {label: '레이저절단', procs: ['laser'], team: TEAM_MACHINING},
            lathe: {label: '선반/밀링', procs: ['lathe'], team: TEAM_MACHINING},
            wire:  {label: '와이어커팅', procs: ['wire'], team: TEAM_WIRE}
        };
        let CURRENT_AREA = new URLSearchParams(location.search).get('area') || 'wire';
        if (!AREAS[CURRENT_AREA]) CURRENT_AREA = 'wire';

        // 이 키오스크에서 선택 가능한 전체 작업자(구역 무관, "혹시 모르니까" 폴백용)
        const ALL_WORKERS = [...new Set(Object.values(AREAS).flatMap(a => a.team))];
        const procArea = c => Object.keys(AREAS).find(a => AREAS[a].procs.includes(c));
        const procTeam = c => {
            const a = procArea(c);
            return a ? AREAS[a].team : [];
        };
        const areaDefaultMachine = a => procMachines(AREAS[a].procs[0])[0];
        // 구역 공정을 앞으로 정렬 (설비 선택 화면용)
        const orderedProcs = () => {
            const ap = AREAS[CURRENT_AREA].procs;
            return [...PROCESSES].sort((x, y) => (ap.includes(x.code) ? 0 : 1) - (ap.includes(y.code) ? 0 : 1));
        };

        const PROJECTS = [
            {
                code: 'PRJ-A', name: '', items: [
                    {
                        code: 'RS01', units: [
                            {nm: 'U201', need: {plate: 3, block: 4, shim: 6}},
                            {nm: 'U227', need: {plate: 2, block: 1, brkt: 1}},
                            {nm: 'U240', need: {plate: 1, pin: 2}}
                        ]
                    },
                    {
                        code: 'RS02', units: [
                            {nm: 'U201', need: {plate: 3, block: 4, shim: 6}},
                            {nm: 'U227', need: {plate: 2, block: 1, brkt: 1}}
                        ]
                    }
                ]
            },
            {
                code: 'PRJ-B', name: 'A9 센터필러', items: [
                    {
                        code: 'RS10', units: [
                            {nm: 'U301', need: {plate: 12, arm: 2}},
                            {nm: 'U305', need: {block: 3, shim: 4}}
                        ]
                    }
                ]
            },
            {
                code: 'PRJ-C', name: '', items: [
                    {
                        code: 'RS20', units: [
                            {nm: 'U410', need: {plate: 4, block: 1, pin: 1, arm: 1}},
                            {nm: 'U411', need: {plate: 2, brkt: 2}}
                        ]
                    }
                ]
            }
        ];

        // 데모: PRJ-A 품목을 100개로 채움 (실제로는 프로젝트별 최대 100개 가정 → 검색 필요)
        (function padItems() {
            const proj = PROJECTS[0];
            const prefixes = ['RS', 'A9-8', 'LH-', 'RH-', 'CTR', 'FLR', 'BRK', 'SUS'];
            let c = 0;
            while (proj.items.length < 100) {
                const pf = prefixes[c % prefixes.length];
                const code = pf + String(1 + Math.floor(c / prefixes.length)).padStart(2, '0');
                c++;
                if (proj.items.some(it => it.code === code)) continue;
                const ucnt = 1 + (c % 4);
                const units = [];
                for (let u = 0; u < ucnt; u++) {
                    const k1 = KINDS[(c + u) % KINDS.length], k2 = KINDS[(c + u + 2) % KINDS.length];
                    units.push({nm: `U${100 + u}`, need: {[k1]: 1 + (u % 5), [k2]: 1 + ((u + 1) % 4)}});
                }
                proj.items.push({code, units});
            }
        })();
        // 등록 내역(log)이 곧 실적 기록.

        // 작업중: (설비 × 프로젝트 × 공정) 단위. key = `${machine}|${proj}|${item}`
        //  → 현재 키오스크에서 진행 중인 작업 목록. 최근 등록 영역 상단에 표시하고,
        //    행을 누르면 컨텍스트를 복원해 유니트 수량만 입력하면 바로 등록 가능.
        const wKey = (m, p, it) => `${m}|${p}|${it}`;
        const nowHM = () => {
            const d = new Date(), z = n => String(n).padStart(2, '0');
            return `${z(d.getHours())}:${z(d.getMinutes())}`;
        };
        let working = {};
        // (예시 작업중 없음 — 시작은 작업현황 비어있는 상태)

        /* ===== 상태 ===== */
        const st = {
            worker: null,
            machine: null,
            proj: -1,
            item: -1,
            kind: null,
            good: 0,
            step: 0
        };
        let log = [];
        let curDate = toYMD(new Date());
        let qTokens = [];            // 멀티탭 검색 패턴: 위치별 허용문자 토큰 [{face, chars[]}]
        let recentItems = [];        // 최근 사용 공정 키 `${proj}|${item}` (최신순)

        // 부분일치 AND: 누른 각 키(글자그룹/숫자)의 문자 중 하나라도 코드에 포함되어야 함.
        //  - 키 하나 안에서는 OR (ABC → A·B·C 중 아무거나)
        //  - 키들끼리는 AND (ABC 누르고 1 → A/B/C 포함 그리고 1 포함). 위치·순서 무시.
        function matchTokens(code) {
            const c = code.toUpperCase();
            return qTokens.every(t => t.chars.some(ch => c.includes(ch)));
        }

        const STEPS = [
            {key: 'worker', t: '작업자'},
            {key: 'machine', t: '설비'},
            {key: 'proj', t: '프로젝트'},
            {key: 'item', t: '공정'},
            {key: 'kind', t: '유형'}
        ];

        function stepValue(k) {
            if (k === 'worker') return st.worker;
            if (k === 'machine') return st.machine ? `${st.machine} · ${procName(machineProc(st.machine))}` : null;
            if (k === 'proj') return st.proj >= 0 ? `${PROJECTS[st.proj].code} ${PROJECTS[st.proj].name}` : null;
            if (k === 'item') return (st.proj >= 0 && st.item >= 0) ? PROJECTS[st.proj].items[st.item].code : null;
            if (k === 'kind') return st.kind;
            return null;
        }

        function stepDone(k) {
            return stepValue(k) != null;
        }

        /* ===== 렌더 ===== */
        function renderSteps() {
            $('#steps').innerHTML = STEPS.map((s, i) => {
                const v = stepValue(s.key), done = v != null, active = st.step === i;
                return `<div class="step-tab ${active ? 'active' : ''} ${done ? 'done' : ''}" data-i="${i}">
                    <div><span class="n">${done ? '✓' : i + 1}</span><span class="t">${s.t}</span></div>
                    <span class="sv ${v ? '' : 'none'}">${v || '미선택'}</span></div>`;
            }).join('');
            $('#steps').querySelectorAll('.step-tab').forEach(t => t.onclick = () => {
                st.step = +t.dataset.i;
                renderAll();
            });
        }

        function curNeed() {
            if (st.proj < 0) return {};
            const units = st.item >= 0 ? PROJECTS[st.proj].items[st.item].units
                : PROJECTS[st.proj].items.flatMap(it => it.units);
            const need = {};
            units.forEach(u => {
                for (const k in u.need) need[k] = (need[k] || 0) + u.need[k];
            });
            return need;
        }

        function visKinds() {
            const need = curNeed();
            const v = KINDS.filter(k => need[k] > 0);
            return v.length ? v : KINDS.slice();
        }

        // 공정 선택 상단에 올릴 '최근·작업중' 공정 인덱스 (현재 프로젝트 기준)
        function priorityItemIdx() {
            if (st.proj < 0) return [];
            const p = st.proj, areaProcs = AREAS[CURRENT_AREA].procs;
            const workingIdx = Object.values(working)
                .filter(w => w.proj === p && areaProcs.includes(machineProc(w.machine)))
                .map(w => w.item);
            const recentIdx = recentItems.filter(k => k.startsWith(p + '|')).map(k => +k.split('|')[1]);
            const seen = new Set(), out = [];
            [...workingIdx, ...recentIdx].forEach(i => { if (!seen.has(i)) { seen.add(i); out.push(i); } });
            return out;
        }

        function renderPick() {
            const step = STEPS[st.step].key;
            let html = '';
            if (step === 'worker') {
                const proc = st.machine ? machineProc(st.machine) : null;
                const team = proc ? procTeam(proc) : [];
                const rest = ALL_WORKERS.filter(w => !team.includes(w));
                const tile = w => `<button class="tile ${st.worker === w ? 'on' : ''}" data-w="${w}">
                        <span class="tt">${w}</span></button>`;
                html = `<p class="pick-head">작업자를 선택하세요${proc ? ` — ${procName(proc)} 담당팀 우선` : ''}</p><div class="tiles">`;
                if (team.length) {
                    html += `<div class="group-lab">${procArea(proc) ? AREAS[procArea(proc)].label : '담당팀'}</div>` + team.map(tile).join('');
                }
                if (rest.length) {
                    html += `<div class="group-lab">그 외 작업자</div>` + rest.map(tile).join('');
                }
                html += `</div>`;
            } else if (step === 'machine') {
                const areaProcs = AREAS[CURRENT_AREA].procs;
                html = `<p class="pick-head">설비를 선택하세요 — 공정은 이 키오스크(${AREAS[CURRENT_AREA].label})로 고정됩니다</p><div class="tiles mach">`;
                PROCESSES.filter(p => areaProcs.includes(p.code)).forEach(p => {
                    html += `<div class="group-lab">${p.name}</div>`;
                    html += p.machines.map(m => {
                        return `<button class="tile ${st.machine === m ? 'on' : ''}" data-m="${m}">
                            <span class="tt">${m}</span>
                            <span class="proc-chip">${p.name}</span></button>`;
                    }).join('');
                });
                html += `</div>`;
            } else if (step === 'proj') {
                html = `<p class="pick-head">프로젝트를 선택하세요</p><div class="tiles">` +
                    PROJECTS.map((p, i) => `<button class="tile ${st.proj === i ? 'on' : ''}" data-p="${i}">
                        <span class="tt">${p.code}</span><span class="ts">${p.name}</span></button>`).join('') + `</div>`;
            } else if (step === 'item') {
                if (st.proj < 0) {
                    html = `<p class="pick-empty">먼저 프로젝트를 선택하세요.</p>`;
                } else {
                    const items = PROJECTS[st.proj].items;
                    const active = qTokens.length > 0;
                    const tile = (it, i) => `<button class="tile ${st.item === i ? 'on' : ''}" data-it="${i}">
                            <span class="tt">${it.code}</span><span class="ts">유니트 ${it.units.length}개${it.name ? ' · ' + it.name : ''}</span></button>`;
                    const chips = active
                        ? qTokens.map(t => `<span class="qchip">${t.face}</span>`).join('')
                        : `<span class="srch-txt ph">코드 앞부분을 오른쪽 키패드로 눌러 좁히세요</span>`;
                    html = `<div class="srch">
                            <span class="srch-ico">🔎</span>
                            <span class="srch-chips">${chips}</span>
                            ${active ? `<button class="srch-clr" id="srchClr">✕</button>` : ''}
                            <span class="srch-cnt">${items.length}개</span>
                        </div><div class="tiles">`;
                    if (active) {
                        const matched = items.map((it, i) => ({it, i})).filter(x => matchTokens(x.it.code));
                        html += `<div class="group-lab">검색 결과 ${matched.length}</div>`;
                        html += matched.length ? matched.map(x => tile(x.it, x.i)).join('')
                            : `<div class="pick-empty" style="grid-column:1/-1">일치하는 공정이 없습니다.</div>`;
                    } else {
                        const pri = priorityItemIdx();
                        if (pri.length) {
                            html += `<div class="group-lab">최근·작업중</div>` + pri.map(i => tile(items[i], i)).join('');
                        }
                        html += `<div class="group-lab">전체 ${items.length}</div>` + items.map((it, i) => tile(it, i)).join('');
                    }
                    html += `</div>`;
                }
            } else if (step === 'kind') {
                if (st.item < 0) {
                    html = `<p class="pick-empty">먼저 공정(품목)을 선택하세요.</p>`;
                } else {
                    const ks = visKinds(), need = curNeed();
                    html = `<p class="pick-head">유형 — <b>선택하지 않아도 등록됩니다</b></p><div class="tiles">` +
                        ks.map(k => `<button class="tile ${st.kind === k ? 'on' : ''}" data-k="${k}">
                            <span class="tt">${k}</span><span class="ts">소요 ${need[k] || 0}</span></button>`).join('') + `</div>`;
                }
            }
            $('#pickBody').innerHTML = html;
            // 바인딩
            $('#pickBody').querySelectorAll('[data-w]').forEach(b => b.onclick = () => pickWorker(b.dataset.w));
            $('#pickBody').querySelectorAll('[data-m]').forEach(b => b.onclick = () => pickMachine(b.dataset.m));
            $('#pickBody').querySelectorAll('[data-p]').forEach(b => b.onclick = () => pickProj(+b.dataset.p));
            $('#pickBody').querySelectorAll('[data-it]').forEach(b => b.onclick = () => pickItem(+b.dataset.it));
            $('#pickBody').querySelectorAll('[data-k]').forEach(b => b.onclick = () => pickKind(b.dataset.k));
            const sc = $('#srchClr');
            if (sc) sc.onclick = () => { qTokens = []; renderPick(); };
        }

        /* ===== 선택 핸들러 (선택 시 비어있는 다음 단계로 자동 이동) ===== */
        function pickWorker(w) {
            st.worker = w;
            advanceFrom('worker');
        }

        function pickMachine(m) {
            st.machine = m;
            advanceFrom('machine');
            renderCtx();
        }

        function pickProj(i) {
            st.proj = i;
            st.item = -1;
            st.kind = null;
            qTokens = [];
            advanceFrom('proj');
        }

        function pickItem(i) {
            st.item = i;
            if (st.kind && !visKinds().includes(st.kind)) st.kind = null;
            advanceFrom('item');
        }

        function pickKind(k) {
            st.kind = (st.kind === k ? null : k);
            renderAll();
        }  // 유형은 선택사항(다시 누르면 해제)

        function advanceFrom(key) {
            const i = STEPS.findIndex(s => s.key === key);
            let next = i + 1;
            while (next < STEPS.length && stepDone(STEPS[next].key)) next++;
            st.step = next < STEPS.length ? next : i;
            renderAll();
        }

        /* ===== 컨텍스트 바 ===== */
        function renderCtx() {
            const w = $('#cxWorker');
            w.textContent = st.worker || '선택하세요';
            w.classList.toggle('empty', !st.worker);
            const m = $('#cxMachine');
            m.textContent = st.machine || '선택하세요';
            m.classList.toggle('empty', !st.machine);
            $('#cxProc').textContent = st.machine ? procName(machineProc(st.machine)) : '';
            // 프로젝트 · 공정(품목)
            const pj = $('#cxProj');
            pj.textContent = st.proj >= 0 ? `${PROJECTS[st.proj].code}${PROJECTS[st.proj].name ? ' ' + PROJECTS[st.proj].name : ''}` : '선택하세요';
            pj.classList.toggle('empty', st.proj < 0);
            $('#cxItem').textContent = (st.proj >= 0 && st.item >= 0) ? PROJECTS[st.proj].items[st.item].code : '';
            // 작업 버튼 (작업자+설비+프로젝트+공정 선택 시 활성)
            const wa = $('#workArea');
            const can = !!(st.worker && st.machine && st.proj >= 0 && st.item >= 0);
            wa.classList.toggle('disabled', !can);
            const isWorking = can && !!working[wKey(st.machine, st.proj, st.item)];
            $('#workBtns').innerHTML = isWorking
                ? '<button class="wbtn pause" data-act="pause">일시정지</button><button class="wbtn done" data-act="done">완료</button>'
                : '<button class="wbtn start" data-act="start">작업 시작</button>';
            $('#workBtns').querySelectorAll('[data-act]').forEach(b => b.onclick = () => workAct(b.dataset.act));
        }

        function workAct(act) {
            if (!(st.worker && st.machine && st.proj >= 0 && st.item >= 0)) return;
            const key = wKey(st.machine, st.proj, st.item);
            if (act === 'start') {
                working[key] = {machine: st.machine, proj: st.proj, item: st.item,
                    kind: st.kind || '', worker: st.worker || '미지정', t: nowHM()};
                flash('작업 시작');
            } else if (act === 'pause') {
                delete working[key];
                flash('일시정지');
            } else if (act === 'done') {
                delete working[key];
                flash('작업 완료');
            }
            renderCtx();
            renderLog();
        }

        /* ===== 우측 등록 패널 ===== */
        function renderQty() {
            $('#qvGood').textContent = st.good;
        }

        function canReg() {
            return !!(st.worker && st.machine && st.item >= 0 && st.good > 0);
        }

        function renderRegBtn() {
            $('#btnReg').disabled = !canReg();
        }

        // 키패드 (양품 수량만 입력)
        const KEYS = ['7', '8', '9', '4', '5', '6', '1', '2', '3', 'C', '0', '⌫'];
        $('#keypad').innerHTML = KEYS.map(k => `<button class="key ${k === 'C' || k === '⌫' ? 'act' : ''}" data-key="${k}">${k}</button>`).join('');
        $('#keypad').querySelectorAll('[data-key]').forEach(b => b.onclick = () => press(b.dataset.key));

        function press(k) {
            let cur = String(st.good);
            if (k === 'C') cur = '0';
            else if (k === '⌫') cur = cur.length > 1 ? cur.slice(0, -1) : '0';
            else {
                cur = (cur === '0' ? '' : cur) + k;
                if (cur.length > 6) cur = cur.slice(0, 6);
            }
            st.good = parseInt(cur || '0', 10);
            renderQty();
            renderRegBtn();
        }

        $('#btnReg').onclick = () => {
            if (!canReg()) return;
            const proc = machineProc(st.machine);
            const item = PROJECTS[st.proj].items[st.item];
            log.unshift({
                date: curDate,
                item: item.code,
                proc: procName(proc),
                machine: st.machine,
                worker: st.worker,
                kind: st.kind || '',
                good: st.good
            });
            flash(`등록됨 · ${item.code} 양품 ${st.good}`);
            const rk = `${st.proj}|${st.item}`;
            recentItems = [rk, ...recentItems.filter(k => k !== rk)].slice(0, 8);
            st.good = 0;
            renderQty();
            renderRegBtn();
            renderLog();
        };

        function renderLog() {
            $('#logHead').textContent = `작업 현황 · ${curDate}`;
            // 현재 키오스크(구역) 설비에서 진행 중인 작업 (날짜 무관, 항상 표시)
            const areaProcs = AREAS[CURRENT_AREA].procs;
            const wRows = Object.entries(working).filter(([k, w]) => areaProcs.includes(machineProc(w.machine)));
            // 선택 생산일의 완료 등록
            const logRows = log.map((l, idx) => ({l, idx})).filter(x => x.l.date === curDate);

            if (!wRows.length && !logRows.length) {
                $('#logBody').innerHTML = '<tr><td colspan="6" class="log-empty">작업중·등록 내역이 없습니다.</td></tr>';
                return;
            }

            let html = wRows.map(([key, w]) => {
                const code = PROJECTS[w.proj].items[w.item].code;
                return `<tr class="work-row" data-wkey="${key}" title="클릭하면 이 작업을 불러와 유니트 수량을 입력합니다">
                    <td class="k">${code}</td><td>${w.kind || '-'}</td><td>${w.machine}</td><td>${w.worker}</td>
                    <td><span class="badge-work">작업중 ${w.t}</span></td>
                    <td><button class="x-btn stop" data-wstop="${key}">취소</button></td></tr>`;
            }).join('');

            html += logRows.map(({l, idx}) => `<tr>
                <td class="k">${l.item}</td><td>${l.kind || '-'}</td><td>${l.machine}</td><td>${l.worker}</td>
                <td class="g-cell">${l.good || 0}</td>
                <td><button class="x-btn" data-i="${idx}">취소</button></td></tr>`).join('');

            $('#logBody').innerHTML = html;

            // 작업중 행 클릭 → 컨텍스트 복원해서 바로 수량 입력
            $('#logBody').querySelectorAll('.work-row').forEach(r => r.onclick = e => {
                if (e.target.closest('[data-wstop]')) return;   // '해제' 버튼은 제외
                resumeWork(r.dataset.wkey);
            });
            $('#logBody').querySelectorAll('[data-wstop]').forEach(b => b.onclick = () => {
                delete working[b.dataset.wstop];
                renderCtx();
                renderLog();
            });
            $('#logBody').querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
                log.splice(+b.dataset.i, 1);
                renderLog();
            });
        }

        // 작업중 행을 눌러 컨텍스트 복원 (유형 단계로 이동 → 우측 패드에서 수량만 입력)
        function resumeWork(key) {
            const w = working[key];
            if (!w) return;
            st.machine = w.machine;
            st.proj = w.proj;
            st.item = w.item;
            st.kind = w.kind || null;
            st.worker = w.worker;
            st.good = 0;
            st.step = STEPS.findIndex(s => s.key === 'kind');
            renderAll();
            flash(`작업중 불러옴 · ${PROJECTS[w.proj].items[w.item].code} (유니트 입력 후 등록)`);
        }

        let flashT;

        function flash(msg) {
            const f = $('#flash');
            f.textContent = msg;
            f.classList.add('show');
            clearTimeout(flashT);
            flashT = setTimeout(() => f.classList.remove('show'), 1600);
        }

        function renderAll() {
            renderSteps();
            renderPick();
            renderCtx();
            renderQty();
            renderRegBtn();
            renderEntry();
        }

        /* ===== 우측 패드 전환 (공정선택=검색 / 그 외=수량) ===== */
        function renderEntry() {
            const onItem = STEPS[st.step].key === 'item';
            $('#padSearch').style.display = onItem ? 'flex' : 'none';
            $('#padQty').style.display = onItem ? 'none' : 'flex';
        }

        // 멀티탭 검색 키패드 (큰 버튼 / 누를수록 후보가 좁혀짐)
        const TAPS = [
            ['ABC', 'DEF', 'GHI'],
            ['JKL', 'MNO', 'PQRS'],
            ['TUV', 'WXYZ', '-'],
            ['1', '2', '3', '4', '5'],
            ['6', '7', '8', '9', '0'],
            ['⌫', '전체지우기']
        ];
        $('#qwerty').innerHTML = TAPS.map(row => `<div class="qrow">` +
            row.map(k => {
                const spec = (k === '⌫' || k === '전체지우기');
                const grp = /^[A-Z]{2,4}$/.test(k);
                return `<button class="qkey ${spec ? 'spec' : ''} ${grp ? 'grp' : ''}" data-tap="${k}">${k}</button>`;
            }).join('') + `</div>`).join('');
        $('#qwerty').querySelectorAll('[data-tap]').forEach(b => b.onclick = () => tap(b.dataset.tap));
        function tap(v) {
            if (v === '전체지우기') qTokens = [];
            else if (v === '⌫') qTokens.pop();
            else if (/^[A-Z]{2,4}$/.test(v)) qTokens.push({face: v, chars: v.split('')});  // 글자 그룹
            else qTokens.push({face: v, chars: [v]});                                       // 숫자/'-' 정확
            renderPick();   // 실시간 필터
        }

        /* ===== 생산일 (◀ 날짜 ▶) ===== */
        function setDate(s) {
            curDate = s;
            $('#pdate').value = s;
            renderLog();
        }

        function shiftDate(n) {
            const d = new Date(curDate + 'T00:00:00');
            d.setDate(d.getDate() + n);
            setDate(toYMD(d));
        }

        $('#dPrev').onclick = () => shiftDate(-1);
        $('#dNext').onclick = () => shiftDate(1);
        $('#pdate').onchange = () => setDate($('#pdate').value || curDate);

        /* ===== 현재 시간 ===== */
        function tick() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            $('#clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }

        tick();
        setInterval(tick, 1000);

        /* ===== 키오스크(구역) 전환 ===== */
        function buildAreaSelect() {
            $('#areaSel').innerHTML = Object.keys(AREAS).map(k =>
                `<option value="${k}" ${CURRENT_AREA === k ? 'selected' : ''}>${AREAS[k].label} 키오스크</option>`).join('');
        }

        $('#areaSel').onchange = () => {
            CURRENT_AREA = $('#areaSel').value;
            st.machine = null;                               // 설비 자동선택 안 함 (작업자부터 직접 선택)
            st.worker = null;
            st.step = 0;                                     // 작업자 단계부터
            renderAll();
            renderLog();
        };

        // init
        const ymd = n => {
            const d = new Date();
            d.setDate(d.getDate() + n);
            return toYMD(d);
        };
        // 예시 내역(생산일별 필터 확인용): 오늘 1건 + 어제 1건
        log = [
            {date: ymd(0), item: 'RS01', proc: '와이어커팅', machine: 'WC-01', worker: '이종길', kind: 'plate', good: 12},
            {date: ymd(-1), item: 'RS02', proc: '와이어커팅', machine: 'WC-02', worker: '반흥', kind: '', good: 8}
        ];

        buildAreaSelect();
        st.machine = null;                 // 설비 자동선택 안 함
        st.step = 0;                       // 작업자 단계부터
        setDate(ymd(0));
        renderAll();
    </script>
</th:block>
</html>
