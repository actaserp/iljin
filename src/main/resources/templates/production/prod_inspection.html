<html layout:decorate="~{layout_page}">
<head>
    <style>
        /* ===== 미리보기용 공통 (layout_page에 있으면 이 블록 삭제) ===== */
        body{margin:0;font-family:'Malgun Gothic','Pretendard',sans-serif;background:#eef1f6;color:#222;font-size:13px;}
        .layout-contents{padding:14px 18px;}
        .page-title-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
        .page-title-wrap .left{display:flex;align-items:center;gap:10px;}
        .page-title-wrap h2{font-size:19px;font-weight:700;margin:0;}
        .bookmark{font-size:12px;color:#5b6b86;border:1px solid #cfd6e2;background:#fff;border-radius:16px;padding:4px 11px;cursor:pointer;}
        .page-navi{list-style:none;display:flex;gap:8px;margin:0;padding:0;color:#8b95a7;font-size:12px;}
        .page-navi li::after{content:'›';margin-left:8px;color:#c2c9d4;}.page-navi li:last-child::after{content:'';}
        .section{background:#fff;border:1px solid #d7dde7;border-radius:6px;}
        .section-top{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-bottom:1px solid #e9edf3;background:#f7f9fc;gap:12px;flex-wrap:wrap;}
        .search-wrap{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
        .search-wrap dl{margin:0;}.search-wrap dt{font-size:12px;color:#445;font-weight:600;margin-bottom:5px;}.search-wrap dd{margin:0;}
        .search-wrap .eq{color:#e0533d;margin-left:2px;}
        .search-wrap input,.search-wrap select{border:1px solid #cfd6e2;border-radius:5px;font-size:13px;}
        .date-box{list-style:none;display:flex;gap:6px;margin:0;padding:0;}
        .button-wrap ul{list-style:none;display:flex;gap:6px;margin:0;padding:0;}
        .btn{border:1px solid #cfd6e2;background:#fff;border-radius:5px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:#333;}
        .btn:disabled{background:#eef0f4;color:#aab;cursor:not-allowed;}
        .btn-start{background:#1ca36b;border-color:#1ca36b;color:#fff;}
        .btn-start:hover:not(:disabled){background:#178a5b;}
        .btn-end{background:#2f57d6;border-color:#2f57d6;color:#fff;}
        .btn-end:hover:not(:disabled){background:#274ec2;}
        .container-fluid{padding:12px 13px;}
        table.work-table{width:100%;border-collapse:collapse;}
        table.work-table th,table.work-table td{border:1px solid #d7dde7;padding:7px;font-size:12.5px;text-align:center;}
        table.work-table th{background:#eef2f8;color:#445;font-weight:700;}
        .table-wrap{padding:12px 13px;}
        /* ===== 이 페이지 전용 ===== */
        .aname{text-align:left;font-weight:700;padding-left:6px;}
        tr.asy-row{cursor:pointer;} tr.asy-row:hover{background:#f4f8ff;} tr.asy-row.on{background:#e6efff;} tr.asy-row.on td:nth-child(1){box-shadow:inset 3px 0 0 #0026ff;}
        tr.asy-row.run{background:#fffbe8;} tr.asy-row.run.on{background:#fff3c4;}
        .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:11px;display:inline-block;}
        .badge.wait{background:#eef0f4;color:#777;}        /* 대기 */
        .badge.run{background:#f3e6c0;color:#8a6d1b;}      /* 진행중 */
        .num{text-align:right;font-weight:700;}
        .empty{color:#99a;text-align:center;padding:18px 0;}
        .hint{font-size:11.5px;color:#667;line-height:1.6;margin:10px 0 0;}

        /* 우측 선택/상태 카드 */
        .pick-card{display:flex;flex-direction:column;gap:12px;align-items:flex-start;}
        .pick-name{font-size:20px;font-weight:800;color:#1d2330;}
        .pick-status{font-size:13px;font-weight:700;}
        .pick-status .lab{color:#7a8499;font-weight:600;margin-right:6px;}
        .big-actions{display:flex;gap:10px;width:100%;}
        .big-actions .btn{flex:1;padding:16px;font-size:16px;font-weight:800;border-radius:9px;}

        /* 풀하이트 */
        html,body{height:100%;}
        .layout-contents{display:flex;flex-direction:column;min-height:100vh;box-sizing:border-box;}
        .main-row{display:flex;gap:5px;align-items:stretch;flex:1 1 auto;min-height:0;}
        .main-row > .section{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
        .main-row > .section > .container-fluid{flex:1 1 auto;min-height:0;overflow:auto;}
        .section-top{flex:0 0 auto;}
        .right-col{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;min-height:0;}
        .right-col > .reg-sec{flex:0 0 auto;display:flex;flex-direction:column;overflow:hidden;}
        .right-col > .log-sec{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
        .right-col > .log-sec > .table-wrap{flex:1 1 auto;min-height:0;overflow:auto;}
    </style>
</head>
<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>검사 공정</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>생산 관리</li>
                <li>검사 공정</li>
            </ul>
        </div>

        <div class="main-row">
            <!-- 좌: 검사 대상(공정/품목) 목록 -->
            <section class="section" style="flex:1;">
                <div class="section-top" style="justify-content:left; gap:15px;">
                    <div class="search-wrap">
                        <dl><dt>생산일<span class="eq">*</span></dt>
                            <dd><ul class="date-box"><li><input type="date" id="pdate"></li></ul></dd></dl>
                        <dl><dt>프로젝트</dt>
                            <dd><select id="fProject" style="min-width:170px"></select></dd></dl>
                    </div>
                    <div class="search-wrap"><dl><dd><li><a class="btn btn-search" id="btnSearch">검색</a></li></dd></dl></div>
                </div>
                <div class="container-fluid">
                    <table class="work-table">
                        <thead><tr>
                            <th>검사 대상 (공정/품목)</th>
                            <th style="width:110px">상태</th>
                            <th style="width:100px">검사완료</th>
                        </tr></thead>
                        <tbody id="asyBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- 우: 검사 시작/종료(위) + 검사 이력(아래) -->
            <div class="right-col">
                <section class="section reg-sec">
                    <div class="section-top">
                        <span id="selLab" style="font-weight:700;">검사 대상을 선택하세요</span>
                    </div>
                    <div class="table-wrap">
                        <div class="pick-card" id="pickCard">
                            <div class="empty" style="width:100%">왼쪽에서 검사 대상을 선택하세요</div>
                        </div>
                    </div>
                </section>

                <section class="section log-sec">
                    <div class="section-top"><span style="font-weight:700;">검사 이력</span></div>
                    <div class="table-wrap">
                        <table class="work-table">
                            <thead><tr><th style="width:90px">프로젝트</th><th>검사 대상</th><th style="width:78px">시작</th><th style="width:78px">종료</th><th style="width:96px">생산일</th><th style="width:60px">취소</th></tr></thead>
                            <tbody id="logBody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript" th:inline="none">
        const $ = s => document.querySelector(s);
        const toYMD = d => { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
        const nowHM = () => { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${z(d.getHours())}:${z(d.getMinutes())}`; };

        // 프로젝트 → 검사 대상(공정/품목). 프로젝트로 거른 뒤 그 대상만 목록에 표시.
        //  st: 'wait'(대기) | 'run'(진행중)   /   stock: 검사 완료 누적 건수
        //  종료(완료) 시 stock+1 (검사 완료 1건 기록).
        const PROJECTS = [
            {code: 'PRJ-A', name: 'A9 FR도어', items: [
                    {code: 'RS01', st: 'wait', stock: 0, start: ''},
                    {code: 'RS02', st: 'run',  stock: 0, start: '09:20'},
                    {code: 'A9-801', st: 'wait', stock: 0, start: ''},
                    {code: 'LH-03', st: 'wait', stock: 1, start: ''}
                ]},
            {code: 'PRJ-B', name: 'A9 센터필러', items: [
                    {code: 'RS10', st: 'wait', stock: 2, start: ''},
                    {code: 'RS11', st: 'wait', stock: 0, start: ''}
                ]},
            {code: 'PRJ-C', name: '리어플로어', items: [
                    {code: 'RS20', st: 'wait', stock: 0, start: ''},
                    {code: 'RS21', st: 'run', stock: 0, start: '10:05'}
                ]}
        ];

        let selProj = 0;                       // 선택된 프로젝트
        const ASSY = () => PROJECTS[selProj].items;   // 현재 프로젝트의 대상 목록

        let sel = null, log = [];
        let curDate = toYMD(new Date());
        $('#pdate').value = curDate;
        $('#pdate').onchange = () => { curDate = $('#pdate').value || curDate; };

        // 프로젝트 선택 박스
        $('#fProject').innerHTML = PROJECTS.map((p, i) => `<option value="${i}">${p.code} ${p.name}</option>`).join('');
        $('#fProject').onchange = () => { selProj = +$('#fProject').value; sel = null; renderList(); renderDetail(); };

        const statusBadge = a => a.st === 'run'
            ? '<span class="badge run">진행중</span>'
            : '<span class="badge wait">대기</span>';

        function renderList() {
            $('#asyBody').innerHTML = ASSY().map((a, i) => `
                <tr class="asy-row ${sel === i ? 'on' : ''} ${a.st === 'run' ? 'run' : ''}" data-i="${i}">
                    <td class="aname">${a.code}</td>
                    <td>${statusBadge(a)}</td>
                    <td >${a.stock}</td></tr>`).join('');
            $('#asyBody').querySelectorAll('.asy-row').forEach(r => r.onclick = () => { sel = +r.dataset.i; renderList(); renderDetail(); });
        }

        function renderDetail() {
            if (sel === null) {
                $('#selLab').textContent = '검사 대상을 선택하세요';
                $('#pickCard').innerHTML = '<div class="empty" style="width:100%">왼쪽에서 검사 대상을 선택하세요</div>';
                return;
            }
            const a = ASSY()[sel];
            $('#selLab').textContent = `선택: ${a.code}`;
            const running = a.st === 'run';
            $('#pickCard').innerHTML = `
                <div class="pick-name">${a.code}</div>
                <div class="pick-status"><span class="lab">상태</span>${statusBadge(a)}${running ? ` <span style="color:#8a6d1b">· ${a.start} 시작</span>` : ''}</div>
                <div class="pick-status"><span class="lab">검사완료</span>${a.stock}</div>
                <div class="big-actions">
                    <button class="btn btn-start" id="btnStart" ${running ? 'disabled' : ''}>시작</button>
                    <button class="btn btn-end" id="btnEnd" ${running ? '' : 'disabled'}>종료(완료)</button>
                </div>
                <p class="hint">${running
                ? '진행중 — <b>종료(완료)</b> 시 검사 완료로 기록됩니다.'
                : '대기 — <b>시작</b>을 누르면 검사를 시작합니다. (한 대상을 여러 번 검사할 수 있습니다)'}</p>`;
            $('#btnStart').onclick = () => start(sel);
            $('#btnEnd').onclick = () => end(sel);
        }

        function start(i) {
            const a = ASSY()[i];
            if (a.st === 'run') return;
            a.st = 'run';
            a.start = nowHM();
            renderList(); renderDetail();
        }

        function end(i) {
            const a = ASSY()[i];
            if (a.st !== 'run') return;
            a.stock += 1;                 // 검사 완료 1건 기록
            log.unshift({proj: PROJECTS[selProj].code, code: a.code, start: a.start, end: nowHM(), date: curDate});
            a.st = 'wait';
            a.start = '';
            renderList(); renderDetail(); renderLog();
        }

        function renderLog() {
            if (!log.length) { $('#logBody').innerHTML = '<tr><td colspan="6" class="empty">검사 내역 없음</td></tr>'; return; }
            $('#logBody').innerHTML = log.map((l, i) => `
                <tr>
                    <td>${l.proj}</td>
                    <td style="text-align:left;font-weight:700;padding-left:6px">${l.code}</td>
                    <td>${l.start}</td><td>${l.end}</td><td>${l.date}</td>
                    <td><a class="btn" style="padding:3px 8px" data-i="${i}">취소</a></td></tr>`).join('');
            $('#logBody').querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
                const l = log[+b.dataset.i];
                const p = PROJECTS.find(x => x.code === l.proj);
                const a = p && p.items.find(x => x.code === l.code);
                if (a && a.stock > 0) a.stock -= 1;   // 검사 완료 취소 → 건수 1 감소
                log.splice(+b.dataset.i, 1);
                renderList(); renderDetail(); renderLog();
            });
        }

        renderList(); renderDetail(); renderLog();
    </script>
</th:block>
</html>
