<html layout:decorate="~{layout_page}">
<head>
    <style>
        /* 페이지 전용 스타일만. 공통 레이아웃은 layout_page 가 제공한다. */

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .filter-bar select { min-width: 240px; }

        .seg { display: inline-flex; border: 1px solid #d7dde7; border-radius: 6px; overflow: hidden; }
        .seg button {
            border: 0;
            background: #fff;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 13px;
        }
        .seg button.on { background: #1c62c9; color: #fff; }

        .row2 { display: flex; gap: 12px; align-items: flex-start; }

        table.work-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.work-table th, table.work-table td {
            border: 1px solid #e2e7ef;
            padding: 5px 6px;
            text-align: center;
            vertical-align: middle;
        }
        table.work-table thead th { background: #f5f7fa; font-weight: 600; white-space: nowrap; }
        table.work-table tbody tr.pointer { cursor: pointer; }
        table.work-table tbody tr.on { background: #eef4ff; }
        table.work-table td.left { text-align: left; }

        .badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            line-height: 17px;
        }
        .badge.wait { background: #fff2e0; color: #b06a00; }
        .badge.done { background: #e6f6ec; color: #1e7a45; }
        .badge.out  { background: #f0edfa; color: #5b46a8; }
        .badge.exempt { background: #eaf0f6; color: #4a6a8a; }
        .badge.in   { background: #eef2f7; color: #55647c; }

        .form-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 8px 10px;
            align-items: center;
            padding: 12px 14px;
        }
        .form-grid input, .form-grid select, .form-grid textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d7dde7;
            border-radius: 4px;
            font-size: 13px;
        }
        .form-grid .full { grid-column: 1 / -1; min-width: 0; }
        /* 업로더 위젯이 폼 폭을 넘지 않게 한다 */
        #fileBox, #fileBox * { max-width: 100%; box-sizing: border-box; }
        #fileBox table { table-layout: fixed; width: 100%; }
        /* 업로더 위젯이 모달 벽에 붙지 않게 여백을 준다 */
        #inspectUpload span.fileuploadTitle { display:block; margin-bottom:10px; }
        #inspectUpload [data-uploaded-box] { min-height:150px; padding:10px; }
        #fileBox td, #fileBox a { overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; word-break: break-all; }

        .hint { color: #7b8698; font-size: 12px; margin: 0 0 8px; }
        .hint.warn { color: #b06a00; }
        .muted{color:#8b95a7;}
    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>검사</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>생산관리</li>
                <li>검사</li>
            </ul>
        </div>

        <div class="filter-bar">
            <label>프로젝트</label>
            <select id="projSel"></select>
            <div class="seg" id="stateSeg">
                <button type="button" data-state="wait" class="on">미검사</button>
                <button type="button" data-state="done">검사완료</button>
                <button type="button" data-state="exempt">검사면제</button>
                <button type="button" data-state="">전체</button>
            </div>
            <span style="flex:1 1 auto;"></span>
            <span id="cntBadge"></span>
        </div>

        <div class="row2">
            <!-- ===== 검사 대상 ===== -->
            <section class="section" style="flex:1 1 auto; min-width:0;">
                <div class="section-top">
                    <div class="search-wrap" style="margin-bottom:0">
                        <h3>검사 대상</h3>
                        <dl style="margin-left:14px;display:flex;align-items:center;gap:8px">
                            <dt style="margin:0">품목</dt>
                            <dd style="margin:0"><input type="text" id="fKeyword"
                                                        placeholder="품목명 · 라인" style="min-width:180px"></dd>
                        </dl>
                    </div>

                </div>
                <div class="container-fluid">
                    <p class="hint">
                        검사는 유닛이 아니라 <b>공정(품목) 단위</b>이며,
                        내작·외작 구분 없이 <b>모든 공정이 검사 대상</b>입니다.
                        외작 중 업체가 검사를 마치고 보낸 품목만 <b>검사면제</b>로 빠집니다.
                    </p>
                    <table class="work-table">
                        <colgroup>
                            <col style="width:4%">   <!-- 선택 -->
                            <col style="width:7%">   <!-- 라인 -->
                            <col style="width:16%">  <!-- 품목 -->
                            <col style="width:14%">  <!-- 수주 -->
                            <col style="width:7%">   <!-- 구분 -->
                            <col style="width:12%">  <!-- 제작업체 -->
                            <col style="width:10%">  <!-- 공정조립 -->
                            <col style="width:10%">  <!-- 유닛조립 -->
                            <col style="width:8%">   <!-- 검사수량 -->
                            <col style="width:7%">   <!-- 상태 -->
                            <col style="width:7%">   <!-- 최근검사 -->
                        </colgroup>
                        <thead>
                        <tr>
                            <th><input type="checkbox" id="chkAll" title="전체 선택"></th>
                            <th>라인</th>
                            <th>품목</th>
                            <th>수주</th>
                            <th>구분</th>
                            <th>제작업체</th>
                            <th>공정조립</th>
                            <th>유닛조립</th>
                            <th>검사수량</th>
                            <th>상태</th>
                            <th>최근검사</th>
                        </tr>
                        </thead>
                        <tbody id="targetBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- ===== 검사 등록 ===== -->
            <!-- ★ 스크롤을 내려도 따라오게 sticky 로 둔다.
                 대상 목록이 길어 아래로 내려가면 등록 폼이 화면 밖으로 나갔다. -->
            <section class="section" style="flex:0 0 340px; position:sticky; top:10px;
                     align-self:flex-start; max-height:calc(100vh - 40px); overflow:auto;">
                <div class="section-top">
                    <div class="search-wrap" style="margin-bottom:0"><h3 id="formTitle">검사 등록</h3></div>
                </div>
                <div class="form-grid">
                    <label>검사일</label>
                    <input type="date" id="inspectDate">

                    <label>검사자</label>
                    <select id="workerSel"></select>

                    <label>설비</label>
                    <select id="equSel"></select>

                    <label>판정</label>
                    <!-- ★ 판정. 합격/불합격만으로는 부적합 조치 이력이 남지 않는다.
                         재가공·재측정은 '아직 끝나지 않은' 상태라 불합격과 구분해야
                         나중에 무엇을 조치했는지 추적할 수 있다. -->
                    <select id="resultSel">
                        <option value="pass">합격</option>
                        <option value="fail">불합격</option>
                        <option value="rework">재가공</option>
                        <option value="remeasure">재측정</option>
                        <option value="accept">특채(조건부 합격)</option>
                    </select>

                    <label>합격</label>
                    <input type="number" id="goodQty" step="0.01" value="0">

                    <label>불합격</label>
                    <input type="number" id="defectQty" step="0.01" value="0">

                    <label>비고</label>
                    <input type="text" id="remark" placeholder="특이사항">

                    <!-- ★ 성적서·측정 결과 첨부.
                         ax5FileUploadClass 를 쓴다 (notice_board.html 과 같은 방식).
                         table_name='mat_produce' + 검사 실적 id 로 매단다 —
                         검사 <b>건마다</b> 성적서가 따로 붙어야 하기 때문이다.
                         품목에 매달면 재검사했을 때 어느 성적서가 어느 검사 건인지 알 수 없다.
                         등록 전에는 id 가 없으므로 이력에서 건을 고른 뒤에 열린다. -->
                    <label class="full" style="margin-top:4px">첨부 (성적서 · 측정결과)</label>
                    <div class="full" style="display:flex;gap:8px;align-items:center;min-width:0">
                        <a class="btn" id="btnFile">첨부 관리</a>
                        <span class="hint" id="fileHint" style="min-width:0;overflow:hidden;
                            text-overflow:ellipsis;white-space:nowrap">
                            검사 이력에서 건을 선택하세요.</span>
                    </div>

                    <div class="full" style="display:flex;gap:6px;justify-content:flex-end;">
                        <!-- 일괄 검사도 여기 둔다. 검사자·판정을 이 폼에서 받으므로
                             버튼이 목록 쪽에 있으면 어느 값이 쓰이는지 알 수 없다. -->
                        <a class="btn" id="btnBulk">선택 <b id="bulkCnt">0</b>건 일괄</a>
                        <a class="btn btn-delete" id="saveBtn">검사 등록</a>
                    </div>
                </div>

                <div class="section-top" style="border-top:1px solid #e9edf3;">
                    <div class="search-wrap" style="margin-bottom:0"><h3>검사 이력</h3></div>
                </div>
                <div class="container-fluid" style="padding:0;">
                    <table class="work-table">
                        <colgroup>
                            <col style="width:20%"><col style="width:18%">
                            <col style="width:17%"><col style="width:15%">
                            <col style="width:16%"><col style="width:14%">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>일자</th>
                            <th>품목</th>
                            <th>판정</th>
                            <th>수량</th>
                            <th>검사자</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody id="logBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <!-- ★ 첨부는 모달에서 다룬다.
         오른쪽 폼이 340px 이라 파일명·진행바가 들어갈 자리가 없었다. -->
    <div id="fileModal"
         style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;
                align-items:center;justify-content:center;">
        <div style="background:#fff;border-radius:10px;width:760px;max-width:94vw;max-height:86vh;
                    display:flex;flex-direction:column;box-shadow:0 12px 36px rgba(0,0,0,.22);">
            <div class="section-top" style="border-radius:10px 10px 0 0;padding:16px 24px;">
                <div class="search-wrap" style="margin-bottom:0"><h3 id="fileModalTitle">첨부</h3></div>
            </div>
            <div style="flex:1 1 auto;overflow:auto;padding:22px 24px;min-width:0;">
                <input type="hidden" id="srchFileId">
                <div class="grid_box" id="inspectUpload"></div>
            </div>
            <div style="padding:14px 24px;border-top:1px solid #e9edf3;text-align:right;">
                <a class="btn" id="btnFileClose">닫기</a>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <!-- 첨부 업로더. 공통 프래그먼트가 스크립트·스타일을 모두 넣어 준다
         (notice_board.html 과 같은 방식) -->
    <th:block th:replace="/common/ax5_uploader :: ax5_uploader"></th:block>
    <script type="text/javascript">

        /*
         * 검사
         *
         * [주의] 최상위에 const $ 같은 선언 금지 (jQuery 를 가려 AjaxUtil 이 깨진다).
         * [통신] AjaxUtil 만 사용. $.ajax 직접 호출은 CSRF 누락으로 403.
         *
         * [단위] 검사는 공정(품목) 단위다. 대상의 키는 suju.id.
         *   내작은 공정 조립 완료, 외작은 입고가 대상이 되며 둘 다 suju.id 로 수렴한다.
         */

        function el(sel) { return document.querySelector(sel); }
        function els(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

        /* 판정 표시. 합격 외에는 아직 끝나지 않았거나 조치가 필요한 상태다 */
        var RESULTS = {
            pass: '합격', fail: '불합격',
            rework: '재가공', remeasure: '재측정', accept: '특채'
        };
        function resultName(v) { return RESULTS[v] || v || '-'; }
        function resultCls(v) { return v === 'pass' ? 'done' : 'wait'; }
        function headText(t) {
            if (!t || !(t.suju_name || t.jumun_date)) return '<span class="muted">-</span>';
            var plan = t.suju_type === 'plan' ? ' (계획)' : '';
            return '<span style="font-size:11.5px">' + esc(t.suju_name || t.jumun_date) + plan + '</span>';
        }

        function esc(v) {
            return (v === null || v === undefined) ? ''
                : String(v).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
        }
        function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

        var API = '/api/production/prod_inspect';

        var page = {

            spjangcd: sessionStorage.getItem('spjangcd') || '',
            projNo: '',
            state: 'wait',
            sujuId: null,
            fileId: null,      // 첨부 대상 검사 실적 id
            /* ★ 체크한 품목을 따로 들고 있는다.
               renderTargets 가 표를 새로 그리므로 DOM 에만 두면
               검색어를 바꿀 때마다 선택이 풀린다. */
            checked: [],
            uploader: null,
            view: [],          // 검색으로 걸러진 대상
            target: null,
            targets: [],

            init: function () {
                el('#inspectDate').value = new Date().toISOString().slice(0, 10);
                this.bind();
                this.loadProjects();
                this.loadWorkers();
                this.loadEquipments();
                this.loadTargets();
            },

            bind: function () {
                var _t = this;

                // 품목 검색. 화면에서 거르므로 서버를 다시 부르지 않는다
                var kwEl = el('#fKeyword');
                if (kwEl) kwEl.addEventListener('input', function () {
                    _t.renderTargets();
                });

                var allEl = el('#chkAll');
                if (allEl) allEl.addEventListener('change', function () {
                    // 전체 선택은 <b>지금 보이는 것</b>만 대상으로 한다
                    var on = this.checked;
                    els('#targetBody .chk').forEach(function (c) {
                        c.checked = on;
                        var id = parseInt(c.getAttribute('data-c'), 10);
                        var at = _t.checked.indexOf(id);
                        if (on && at < 0) _t.checked.push(id);
                        if (!on && at >= 0) _t.checked.splice(at, 1);
                    });
                    _t.renderBulkCnt();
                });

                this.guardSize();   // 업로드 크기 가드는 한 번만 설치한다

                var fEl = el('#btnFile');
                if (fEl) fEl.addEventListener('click', function () {
                    _t.openFileModal();
                });
                var fcEl = el('#btnFileClose');
                if (fcEl) fcEl.addEventListener('click', function () {
                    _t.closeFileModal();
                });
                var fmEl = el('#fileModal');
                if (fmEl) fmEl.addEventListener('click', function (e) {
                    if (e.target === fmEl) _t.closeFileModal();
                });

                var bulkEl = el('#btnBulk');
                if (bulkEl) bulkEl.addEventListener('click', function () {
                    _t.bulkSave();
                });

                el('#projSel').addEventListener('change', function () {
                    _t.projNo = this.value;
                    _t.sujuId = null;
                    _t.target = null;
                    _t.loadTargets();
                    _t.loadLog();
                });

                els('#stateSeg button').forEach(function (b) {
                    b.addEventListener('click', function () {
                        els('#stateSeg button').forEach(function (x) {
                            x.classList.remove('on');
                        });
                        b.classList.add('on');
                        _t.state = b.getAttribute('data-state');
                        _t.loadTargets();
                    });
                });

                el('#saveBtn').addEventListener('click', function () {
                    _t.save();
                });

                // 판정을 바꾸면 수량 칸을 그에 맞게 밀어준다 (입력 실수 방지)
                el('#resultSel').addEventListener('change', function () {
                    _t.applyResultDefault();
                });
            },

            loadProjects: function () {
                AjaxUtil.getAsyncData(API + '/project_list', {spjangcd: this.spjangcd},
                    function (res) {
                        var rows = (res && res.data) || [];
                        var html = '<option value="">전체</option>';
                        rows.forEach(function (r) {
                            html += '<option value="' + esc(r.proj_no) + '">'
                                + esc(r.proj_no) + ' · ' + esc(r.proj_name) + '</option>';
                        });
                        el('#projSel').innerHTML = html;
                    },
                    function () {
                        Alert.alert('', '프로젝트를 불러오지 못했습니다.');
                    });
            },

            loadEquipments: function () {
                AjaxUtil.getAsyncData(API + '/equipment_list', {spjangcd: this.spjangcd},
                    function (res) {
                        var rows = (res && res.data) || [];
                        // 검사 설비가 없어도 등록은 된다
                        var html = '<option value="">없음</option>';
                        rows.forEach(function (r) {
                            html += '<option value="' + r.equipment_id + '">'
                                + esc(r.equipment_name) + '</option>';
                        });
                        el('#equSel').innerHTML = html;
                        if (rows.length === 1) el('#equSel').value = rows[0].equipment_id;
                    },
                    function () {
                    });
            },

            loadWorkers: function () {
                AjaxUtil.getAsyncData(API + '/worker_list', {spjangcd: this.spjangcd},
                    function (res) {
                        var rows = (res && res.data) || [];
                        var html = '<option value="">선택</option>';
                        rows.forEach(function (r) {
                            html += '<option value="' + r.id + '">' + esc(r.name)
                                + (r.own_area === 'Y' ? '' : ' (' + esc(r.workcenter_name || '타부서') + ')')
                                + '</option>';
                        });
                        el('#workerSel').innerHTML = html;
                    },
                    function () {
                    });
            },

            // =========================================================
            // 검사 대상
            // =========================================================
            loadTargets: function () {
                var _t = this;
                var param = {spjangcd: this.spjangcd};
                if (this.projNo) param.projNo = this.projNo;
                if (this.state) param.state = this.state;

                AjaxUtil.getAsyncData(API + '/target_list', param,
                    function (res) {
                        _t.targets = (res && res.data) || [];
                        _t.renderTargets();
                    },
                    function () {
                        Alert.alert('', '검사 대상을 불러오지 못했습니다.');
                    });

                AjaxUtil.getAsyncData(API + '/state_count',
                    {spjangcd: this.spjangcd, projNo: this.projNo},
                    function (res) {
                        var d = (res && res.data) || {};
                        el('#cntBadge').innerHTML =
                            '<span class="badge wait">미검사 ' + (d.wait_cnt || 0) + '</span> '
                            + '<span class="badge done">완료 ' + (d.done_cnt || 0) + '</span> '
                            + '<span class="badge exempt">면제 ' + (d.exempt_cnt || 0) + '</span>';
                    },
                    function () {
                    });
            },

            renderTargets: function () {
                var _t = this;
                var body = el('#targetBody');

                /* 품목·라인 검색. 서버를 다시 부르지 않고 화면에서 거른다 —
                   대상이 수백 건 수준이라 왕복할 이유가 없다. */
                var kw = (el('#fKeyword') ? el('#fKeyword').value : '').trim().toLowerCase();
                this.view = kw
                    ? this.targets.filter(function (t) {
                        return (t.item_name || '').toLowerCase().indexOf(kw) >= 0
                            || (t.line_name || '').toLowerCase().indexOf(kw) >= 0;
                    })
                    : this.targets;

                if (!this.view.length) {
                    body.innerHTML = '<tr><td colspan="11">'
                        + (kw ? '검색 결과가 없습니다.'
                            : this.state === 'wait' ? '미검사 항목이 없습니다.'
                                : this.state === 'exempt' ? '검사 면제 항목이 없습니다.'
                                    : '검사 대상이 없습니다. 작업 지시된 품목이 있어야 대상이 됩니다.')
                        + '</td></tr>';
                    return;
                }

                var html = '';
                this.view.forEach(function (t) {
                    var isOut = t.make_type === 'outsource';
                    var st = t.insp_state;   // wait / done / exempt
                    var stTxt = st === 'exempt' ? '검사면제' : (st === 'done' ? '완료' : '미검사');

                    html += '<tr class="pointer' + (t.suju_id === _t.sujuId ? ' on' : '')
                        + '" data-id="' + t.suju_id + '">'
                        // 이미 검사했거나 면제된 건 일괄 대상이 아니다
                        + '<td>' + (st === 'wait'
                            ? '<input type="checkbox" class="chk" data-c="' + t.suju_id + '"'
                            + (_t.checked.indexOf(t.suju_id) >= 0 ? ' checked' : '') + '>'
                            : '') + '</td>'
                        + '<td>' + esc(t.line_name) + '</td>'
                        + '<td class="left">' + esc(t.item_name) + '</td>'
                        // 프로젝트당 수주가 여러 건이라 같은 품목명이 여러 줄 나온다.
                        // 수주에는 번호가 없으므로 수주명(없으면 주문일)으로 구분한다.
                        + '<td class="left">' + headText(t) + '</td>'
                        + '<td><span class="badge ' + (isOut ? 'out' : 'in') + '">'
                        + (isOut ? '외작' : '내작') + '</span></td>'
                        + '<td class="left">' + esc(t.make_comp || '') + '</td>'
                        // 공정 조립(지그)과 검사는 같은 축이라 나란히 비교할 수 있다
                        + '<td>' + num(t.ready_qty) + ' / ' + num(t.set_target) + '</td>'
                        // 유닛은 축이 달라 <b>따로</b> 보여준다.
                        // 예전에 유닛 실적을 지그 대수와 나란히 놓아 A12(지그 2·유닛 24)가
                        // '2/2 완료'로 보이는 일이 있었다.
                        + '<td class="muted">' + num(t.unit_done) + ' / ' + num(t.unit_qty) + '</td>'
                        + '<td>' + num(t.insp_qty)
                        + (num(t.insp_defect_qty) > 0
                            ? ' <span class="badge wait">불 ' + num(t.insp_defect_qty) + '</span>' : '')
                        + '</td>'
                        + '<td><span class="badge ' + st + '">' + stTxt + '</span></td>'
                        + '<td>' + esc(t.last_inspect_date || '-') + '</td>'
                        + '</tr>';
                });
                body.innerHTML = html;

                els('#targetBody tr[data-id]').forEach(function (tr) {
                    tr.addEventListener('click', function (e) {
                        // 체크박스를 누른 건 선택이 아니라 일괄 대상 지정이다
                        if (e.target && e.target.classList.contains('chk')) return;
                        _t.selectTarget(parseInt(tr.getAttribute('data-id'), 10));
                    });
                });

                // 체크 상태를 배열에 반영한다 (검색으로 안 보이는 것도 유지된다)
                els('#targetBody .chk').forEach(function (c) {
                    c.addEventListener('change', function () {
                        var id = parseInt(c.getAttribute('data-c'), 10);
                        var at = _t.checked.indexOf(id);
                        if (c.checked && at < 0) _t.checked.push(id);
                        if (!c.checked && at >= 0) _t.checked.splice(at, 1);
                        _t.renderBulkCnt();
                    });
                });
                this.renderBulkCnt();

                var all = el('#chkAll');
                if (all) all.checked = false;
            },

            selectTarget: function (sujuId) {
                this.sujuId = sujuId;
                this.target = this.targets.filter(function (t) {
                    return t.suju_id === sujuId;
                })[0] || null;

                this.renderTargets();

                if (this.target) {
                    var exempt = this.target.insp_state === 'exempt';
                    var hn = this.target.suju_name || this.target.jumun_date;
                    el('#formTitle').textContent = this.target.item_name + (hn ? ' [' + hn + ']' : '')
                        + (exempt ? ' — 검사면제' : ' 검사');

                    // 검사 가능 수량을 합격 칸에 밀어 넣어 준다. 필요하면 고치면 된다.
                    // 외작은 조립 실적이 없어 0 일 수 있으므로 목표 수량으로 대신한다.
                    var base = num(this.target.ready_qty) || num(this.target.set_target) || 1;
                    el('#goodQty').value = base;
                    el('#defectQty').value = 0;
                    el('#resultSel').value = 'pass';

                    // 면제 품목도 필요하면 검사할 수 있게 막지는 않는다 (재검사)
                    el('#saveBtn').textContent = exempt ? '재검사 등록' : '검사 등록';

                    /* ★ 이미 검사한 품목이면 <b>가장 최근 검사 건</b>에 바로 첨부할 수 있게 연다.
                       이력에서 행을 눌러야만 열리면, 성적서를 붙이러 두 번 클릭해야 한다.
                       여러 번 검사한 품목은 이력에서 다른 건을 골라 바꿀 수 있다. */
                    this.fileId = null;
                    el('#fileHint').innerHTML = '검사 등록 후 첨부할 수 있습니다.';
                }
                this.loadLog();
            },

            applyResultDefault: function () {
                var ready = this.target
                    ? (num(this.target.ready_qty) || num(this.target.set_target) || 1) : 0;
                if (el('#resultSel').value === 'fail') {
                    el('#goodQty').value = 0;
                    el('#defectQty').value = ready;
                } else {
                    el('#goodQty').value = ready;
                    el('#defectQty').value = 0;
                }
            },

            // =========================================================
            // 등록 / 이력
            // =========================================================
            /*
             * 선택 일괄 검사.
             *
             * 한 건씩 등록하면 검사자·판정을 매번 고르게 되는데,
             * 실제로는 같은 사람이 같은 판정으로 여러 공정을 한 번에 마친다.
             *
             * ★ 수량은 각 품목의 <b>목표(지그 대수)</b>를 쓴다.
             *   일괄로 수량을 받으면 대수가 다른 품목이 섞였을 때 전부 틀린 값이 된다.
             *   불합격이 있으면 그 건만 따로 등록해야 한다.
             */
            /*
             * 첨부 대상(검사 건) 선택.
             *
             * ★ 검사 <b>건마다</b> 성적서가 따로 붙는다.
             *   품목에 매달면 재검사했을 때 어느 성적서가 어느 검사 건인지 알 수 없다.
             *   그래서 tableName='mat_produce' + DataPk=검사 실적 id 로 매단다.
             */
            pickFileTarget: function (id) {
                this.fileId = id;
                el('#srchFileId').value = '';
                this.showFileCount(id);
                this.loadLog();
            },

            /*
             * 업로더. 검사 건이 바뀔 때마다 새로 만든다 —
             * ax5FileUploadClass 는 생성 시점의 DataPk 에 묶이기 때문이다.
             */
            setUploader: function (dataPk) {
                var accept_files = 'jpg,jpeg,png,pdf,xlsx,xls,doc,docx,hwp,zip';
                this.uploader = new ax5FileUploadClass('inspectUpload', dataPk, {
                    table_name: 'mat_produce',
                    attach_name: 'inspect',
                    accept_files: accept_files,
                    multiple: true,
                    /*
                     * ★ file_size × max_count 가 서버 제한(50MB)을 넘지 않게 잡는다.
                     *   ax5 는 파일을 <b>하나씩</b> 검사하지만 Tomcat 은
                     *   한 번에 보낸 <b>요청 전체</b>를 본다.
                     *   50MB×5 로 두면 각각은 통과해도 합계에서 잘리고,
                     *   그때는 컨트롤러에 닿기 전이라 안내 없이 막대만 남는다.
                     *   15×3 = 45MB. 성적서·측정결과는 보통 몇 MB 라 넉넉하다.
                     */
                    max_count: 3,
                    file_size: 15,
                    upload_callback: function () {
                        return;
                    },
                    delete_callback: function () {
                        return;
                    },
                    file_click_callback: function () {
                        return;
                    },
                    can_write: (typeof userinfo !== 'undefined') ? userinfo.can_write() : true
                });
            },

            /*
             * ★ 업로드 요청을 보내기 직전에 크기를 막는다.
             *
             *   파일 선택(change)만 감시했더니 안 걸렸다. ax5 는 자체 목록을 들고 있다가
             *   업로드 시점에 보내고, 드래그드롭은 input 을 거치지도 않는다.
             *   그래서 XHR 을 감싸 <b>실제로 나가는 본문</b>을 잰다.
             *
             *   막지 않으면 Tomcat 이 요청 단계에서 자르는데, 컨트롤러에 닿기 전이라
             *   응답이 없고 진행 막대만 남는다. 취소 버튼도 없어 새로고침뿐이다.
             */
            guardSize: function () {
                if (window._inspectUploadGuard) return;
                window._inspectUploadGuard = true;

                var MAX = 45 * 1024 * 1024;   // 서버 50MB 보다 낮게

                // send 에서는 URL 을 알 수 없어 open 에서 기억해 둔다
                var origOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function (m, url) {
                    this._url = url;
                    return origOpen.apply(this, arguments);
                };

                var origSend = XMLHttpRequest.prototype.send;
                XMLHttpRequest.prototype.send = function (body) {
                    try {
                        if (body instanceof FormData && this._url
                            && this._url.indexOf('/api/files/upload') >= 0) {
                            var total = 0, over = null;
                            body.forEach(function (v) {
                                if (v && typeof v.size === 'number') {
                                    total += v.size;
                                    if (!over || v.size > over.size) over = v;
                                }
                            });
                            if (total > MAX) {
                                var mb = (total / 1024 / 1024).toFixed(1);
                                Alert.alert('첨부 불가',
                                    (over && over.name ? over.name + '<br>' : '')
                                    + '합계 ' + mb + 'MB — 한 번에 45MB 까지만 올릴 수 있습니다.<br>'
                                    + '파일을 줄이거나 나눠서 올려 주세요.');
                                this.abort();
                                return;
                            }
                        }
                    } catch (e) { /* 검사 실패가 업로드를 막지 않게 한다 */
                    }
                    return origSend.apply(this, arguments);
                };
            },

            /*
             * 붙어 있는 첨부 개수를 폼에 보여준다.
             * 모달을 열어야만 알 수 있으면 성적서가 붙었는지 확인하러 매번 들어가야 한다.
             */
            showFileCount: function (id) {
                var hint = el('#fileHint');
                if (!id) {
                    hint.innerHTML = '검사 등록 후 첨부할 수 있습니다.';
                    return;
                }

                AjaxUtil.getAsyncData('/api/common/attach_file/detailFiles',
                    {TableName: 'mat_produce', DataPk: id, attachName: 'inspect'},
                    function (res) {
                        var n = ((res && res.data) || []).length;
                        hint.innerHTML = '검사 #' + id + ' · '
                            + (n ? '<b style="color:#1b6b3a">첨부 ' + n + '건</b>'
                                : '<span style="color:#b06414">첨부 없음</span>');
                    },
                    function () {
                        hint.innerHTML = '검사 #' + id + ' 선택됨';
                    });
            },

            /* 첨부 모달. 오른쪽 폼이 340px 이라 파일명·진행바가 들어갈 자리가 없다 */
            openFileModal: function () {
                if (!this.fileId) {
                    Alert.alert('', '검사 이력에서 건을 먼저 선택하세요.');
                    return;
                }
                el('#fileModalTitle').textContent =
                    (this.target ? this.target.item_name + ' · ' : '') + '검사 #' + this.fileId + ' 첨부';
                el('#fileModal').style.display = 'flex';
                this.setUploader(this.fileId);
            },

            closeFileModal: function () {
                el('#fileModal').style.display = 'none';
                // 닫는 김에 개수를 다시 읽는다. 모달 안에서 붙이거나 지웠을 수 있다
                this.showFileCount(this.fileId);
                this.loadLog();
            },

            /* 선택 건수 표시. 체크는 checked 배열이 들고 있다 */
            renderBulkCnt: function () {
                var n = el('#bulkCnt');
                if (n) n.textContent = this.checked.length;
            },

            bulkSave: function () {
                var _t = this;
                // 화면이 아니라 배열을 쓴다. 검색으로 가려진 선택도 포함된다
                var ids = this.checked.slice();

                if (!ids.length) {
                    Alert.alert('', '검사할 품목을 선택하세요.');
                    return;
                }
                if (!el('#workerSel').value) {
                    Alert.alert('', '검사자를 선택하세요.');
                    return;
                }

                Alert.confirmAsync('', ids.length + '건을 <b>합격</b>으로 일괄 등록할까요?'
                    + '<br>수량은 각 품목의 목표 대수로 들어갑니다.').then(function (ok) {
                    if (!ok) return;

                    var payload = {
                        spjangcd: _t.spjangcd,
                        sujuIds: ids,
                        inspectDate: el('#inspectDate').value,
                        workerId: el('#workerSel').value,
                        equipmentId: el('#equSel').value,
                        result: el('#resultSel').value,
                        remark: el('#remark').value
                    };
                    AjaxUtil.postJsonData(API + '/bulk_save', payload,
                        function (res) {
                            if (!res || !res.success) {
                                Alert.alert('', (res && res.message) || '등록에 실패했습니다.');
                                return;
                            }
                            Alert.alert('', res.message || '등록되었습니다.');
                            /* ★ 선택을 풀고 <b>전체 이력</b>을 본다.
                               이력은 sujuId 기준이라 한 품목만 골라 두면
                               방금 일괄 검사한 나머지가 안 보인다. */
                            _t.checked = [];
                            _t.sujuId = null;
                            _t.target = null;
                            _t.loadTargets();
                            _t.loadLog();
                        },
                        function () {
                            Alert.alert('', '등록에 실패했습니다.');
                        });
                });
            },

            save: function () {
                var _t = this;

                if (!this.sujuId) {
                    Alert.alert('', '검사 대상을 선택하세요.');
                    return;
                }
                if (!el('#workerSel').value) {
                    Alert.alert('', '검사자를 선택하세요.');
                    return;
                }

                var good = num(el('#goodQty').value);
                var defect = num(el('#defectQty').value);
                if (good <= 0 && defect <= 0) {
                    Alert.alert('', '합격 또는 불합격 수량을 입력하세요.');
                    return;
                }

                AjaxUtil.postJsonData(API + '/save', {
                        spjangcd: this.spjangcd,
                        sujuId: this.sujuId,
                        inspectDate: el('#inspectDate').value,
                        workerId: el('#workerSel').value,
                        equipmentId: el('#equSel').value,
                        result: el('#resultSel').value,
                        goodQty: good,
                        defectQty: defect,
                        remark: el('#remark').value
                    },
                    function (res) {
                        if (res && res.success === false) {
                            Alert.alert('', res.message);
                            return;
                        }
                        Alert.alert('', (res && res.message) || '등록되었습니다.');
                        el('#remark').value = '';
                        _t.loadTargets();
                        _t.loadLog();
                    },
                    function () {
                        Alert.alert('', '등록하지 못했습니다.');
                    });
            },

            loadLog: function () {
                var _t = this;
                /* 품목을 고르면 그 품목만, 아니면 프로젝트 전체를 본다.
                   일괄 검사 뒤에는 선택이 풀리므로 방금 넣은 것들이 전부 보인다. */
                AjaxUtil.getAsyncData(API + '/log',
                    {spjangcd: this.spjangcd, projNo: this.projNo, sujuId: this.sujuId},
                    function (res) {
                        var rows = (res && res.data) || [];
                        if (!rows.length) {
                            el('#logBody').innerHTML = '<tr><td colspan="6">검사 이력이 없습니다.</td></tr>';
                            return;
                        }
                        var html = '';
                        rows.forEach(function (r) {
                            // 행을 누르면 그 검사 건에 성적서를 첨부한다
                            html += '<tr class="pointer' + (_t.fileId === r.id ? ' on' : '')
                                + '" data-log="' + r.id + '">'
                                + '<td>' + esc(r.inspect_date) + '</td>'
                                // 프로젝트 전체를 보여줄 수 있어 품목을 함께 적는다
                                + '<td class="left">' + esc(r.item_name || '') + '</td>'
                                + '<td><span class="badge ' + resultCls(r.result) + '">'
                                + resultName(r.result) + '</span></td>'
                                + '<td>' + num(r.good_qty) + ' / ' + num(r.defect_qty) + '</td>'
                                + '<td>' + esc(r.worker)
                                // 성적서가 붙었는지 이력에서 바로 보이게 한다
                                + (num(r.attach_cnt) > 0
                                    ? ' <span class="badge done" title="첨부 '
                                    + num(r.attach_cnt) + '건">📎' + num(r.attach_cnt) + '</span>'
                                    : '') + '</td>'
                                + '<td><a class="btn" data-del="' + r.id + '">취소</a></td>'
                                + '</tr>';
                        });
                        el('#logBody').innerHTML = html;

                        /* 품목을 골랐는데 아직 첨부 대상이 없으면 <b>가장 최근 검사</b>를 잡는다.
                           성적서를 붙이러 이력을 한 번 더 누르지 않아도 된다.
                           여러 번 검사한 품목은 이력에서 다른 건을 골라 바꾼다. */
                        if (_t.sujuId && !_t.fileId && rows.length) {
                            _t.pickFileTarget(rows[0].id);
                            return;   // pickFileTarget 이 loadLog 를 다시 부른다
                        }

                        els('#logBody tr[data-log]').forEach(function (tr) {
                            tr.addEventListener('click', function (e) {
                                if (e.target && e.target.hasAttribute('data-del')) return;
                                _t.pickFileTarget(parseInt(tr.getAttribute('data-log'), 10));
                            });
                        });

                        els('#logBody a[data-del]').forEach(function (a) {
                            a.addEventListener('click', async function () {
                                var ok = await Alert.confirmAsync('', '이 검사 기록을 취소하시겠습니까?');
                                if (!ok) return;
                                AjaxUtil.postJsonData(API + '/delete',
                                    {id: a.getAttribute('data-del')},
                                    function (r2) {
                                        if (r2 && r2.success === false) {
                                            Alert.alert('', r2.message);
                                            return;
                                        }
                                        _t.loadTargets();
                                        _t.loadLog();
                                    },
                                    function () {
                                        Alert.alert('', '취소하지 못했습니다.');
                                    });
                            });
                        });
                    },
                    function () {
                    });
            }
        };

        document.addEventListener('DOMContentLoaded', function () {
            page.init();
        });
    </script>
</th:block>
</html>
