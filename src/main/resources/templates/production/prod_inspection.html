<html layout:decorate="~{layout_page}">
<head>
    <style>
        /* 페이지 전용 스타일만. 공통 레이아웃은 layout_page 가 제공한다. */

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .filter-bar select { min-width: 240px; }

        .seg { display: inline-flex; border: 1px solid #d7dde7; border-radius: 6px; overflow: hidden; }
        .seg button {
            border: 0;
            background: #fff;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 13px;
        }
        .seg button.on { background: #1c62c9; color: #fff; }

        .row2 { display: flex; gap: 12px; align-items: flex-start; }

        table.work-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.work-table th, table.work-table td {
            border: 1px solid #e2e7ef;
            padding: 5px 6px;
            text-align: center;
            vertical-align: middle;
        }
        table.work-table thead th { background: #f5f7fa; font-weight: 600; white-space: nowrap; }
        table.work-table tbody tr.pointer { cursor: pointer; }
        table.work-table tbody tr.on { background: #eef4ff; }
        table.work-table td.left { text-align: left; }

        .badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            line-height: 17px;
        }
        .badge.wait { background: #fff2e0; color: #b06a00; }
        .badge.done { background: #e6f6ec; color: #1e7a45; }
        .badge.out  { background: #f0edfa; color: #5b46a8; }
        .badge.exempt { background: #eaf0f6; color: #4a6a8a; }
        .badge.in   { background: #eef2f7; color: #55647c; }

        .form-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 8px 10px;
            align-items: center;
            padding: 12px 14px;
        }
        .form-grid input, .form-grid select, .form-grid textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d7dde7;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 13px;
        }
        .form-grid .full { grid-column: 1 / -1; }

        .hint { color: #7b8698; font-size: 12px; margin: 0 0 8px; }
        .hint.warn { color: #b06a00; }
        .muted{color:#8b95a7;}
    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>검사</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>생산관리</li>
                <li>검사</li>
            </ul>
        </div>

        <div class="filter-bar">
            <label>프로젝트</label>
            <select id="projSel"></select>
            <div class="seg" id="stateSeg">
                <button type="button" data-state="wait" class="on">미검사</button>
                <button type="button" data-state="done">검사완료</button>
                <button type="button" data-state="exempt">검사면제</button>
                <button type="button" data-state="">전체</button>
            </div>
            <span style="flex:1 1 auto;"></span>
            <span id="cntBadge"></span>
        </div>

        <div class="row2">
            <!-- ===== 검사 대상 ===== -->
            <section class="section" style="flex:1 1 auto; min-width:0;">
                <div class="section-top">
                    <div class="search-wrap" style="margin-bottom:0"><h3>검사 대상</h3></div>
                </div>
                <div class="container-fluid">
                    <p class="hint">
                        검사는 유닛이 아니라 <b>공정(품목) 단위</b>이며,
                        내작·외작 구분 없이 <b>모든 공정이 검사 대상</b>입니다.
                        외작 중 업체가 검사를 마치고 보낸 품목만 <b>검사면제</b>로 빠집니다.
                    </p>
                    <table class="work-table">
                        <colgroup>
                            <col style="width:8%">   <!-- 라인 -->
                            <col style="width:17%">  <!-- 품목 -->
                            <col style="width:14%">  <!-- 수주 -->
                            <col style="width:7%">   <!-- 구분 -->
                            <col style="width:12%">  <!-- 제작업체 -->
                            <col style="width:10%">  <!-- 공정조립 -->
                            <col style="width:10%">  <!-- 유닛조립 -->
                            <col style="width:8%">   <!-- 검사수량 -->
                            <col style="width:7%">   <!-- 상태 -->
                            <col style="width:7%">   <!-- 최근검사 -->
                        </colgroup>
                        <thead>
                        <tr>
                            <th>라인</th>
                            <th>품목</th>
                            <th>수주</th>
                            <th>구분</th>
                            <th>제작업체</th>
                            <th>공정조립</th>
                            <th>유닛조립</th>
                            <th>검사수량</th>
                            <th>상태</th>
                            <th>최근검사</th>
                        </tr>
                        </thead>
                        <tbody id="targetBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- ===== 검사 등록 ===== -->
            <section class="section" style="flex:0 0 340px;">
                <div class="section-top">
                    <div class="search-wrap" style="margin-bottom:0"><h3 id="formTitle">검사 등록</h3></div>
                </div>
                <div class="form-grid">
                    <label>검사일</label>
                    <input type="date" id="inspectDate">

                    <label>검사자</label>
                    <select id="workerSel"></select>

                    <label>설비</label>
                    <select id="equSel"></select>

                    <label>판정</label>
                    <select id="resultSel">
                        <option value="pass">합격</option>
                        <option value="fail">불합격</option>
                    </select>

                    <label>합격</label>
                    <input type="number" id="goodQty" step="0.01" value="0">

                    <label>불합격</label>
                    <input type="number" id="defectQty" step="0.01" value="0">

                    <label>비고</label>
                    <input type="text" id="remark" placeholder="특이사항">

                    <div class="full" style="display:flex;gap:6px;justify-content:flex-end;">
                        <a class="btn btn-delete" id="saveBtn">검사 등록</a>
                    </div>
                </div>

                <div class="section-top" style="border-top:1px solid #e9edf3;">
                    <div class="search-wrap" style="margin-bottom:0"><h3>검사 이력</h3></div>
                </div>
                <div class="container-fluid" style="padding:0;">
                    <table class="work-table">
                        <colgroup>
                            <col style="width:26%">
                            <col style="width:20%">
                            <col style="width:18%">
                            <col style="width:20%">
                            <col style="width:16%">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>일자</th>
                            <th>판정</th>
                            <th>수량</th>
                            <th>검사자</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody id="logBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript">

        /*
         * 검사
         *
         * [주의] 최상위에 const $ 같은 선언 금지 (jQuery 를 가려 AjaxUtil 이 깨진다).
         * [통신] AjaxUtil 만 사용. $.ajax 직접 호출은 CSRF 누락으로 403.
         *
         * [단위] 검사는 공정(품목) 단위다. 대상의 키는 suju.id.
         *   내작은 공정 조립 완료, 외작은 입고가 대상이 되며 둘 다 suju.id 로 수렴한다.
         */

        function el(sel) { return document.querySelector(sel); }
        function els(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
        function headText(t) {
            if (!t || !(t.suju_name || t.jumun_date)) return '<span class="muted">-</span>';
            var plan = t.suju_type === 'plan' ? ' (계획)' : '';
            return '<span style="font-size:11.5px">' + esc(t.suju_name || t.jumun_date) + plan + '</span>';
        }

        function esc(v) {
            return (v === null || v === undefined) ? ''
                : String(v).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
        }
        function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

        var API = '/api/production/prod_inspect';

        var page = {

            spjangcd: sessionStorage.getItem('spjangcd') || '',
            projNo: '',
            state: 'wait',
            sujuId: null,
            target: null,
            targets: [],

            init: function () {
                el('#inspectDate').value = new Date().toISOString().slice(0, 10);
                this.bind();
                this.loadProjects();
                this.loadWorkers();
                this.loadEquipments();
                this.loadTargets();
            },

            bind: function () {
                var _t = this;

                el('#projSel').addEventListener('change', function () {
                    _t.projNo = this.value;
                    _t.sujuId = null;
                    _t.target = null;
                    _t.loadTargets();
                    _t.loadLog();
                });

                els('#stateSeg button').forEach(function (b) {
                    b.addEventListener('click', function () {
                        els('#stateSeg button').forEach(function (x) {
                            x.classList.remove('on');
                        });
                        b.classList.add('on');
                        _t.state = b.getAttribute('data-state');
                        _t.loadTargets();
                    });
                });

                el('#saveBtn').addEventListener('click', function () {
                    _t.save();
                });

                // 판정을 바꾸면 수량 칸을 그에 맞게 밀어준다 (입력 실수 방지)
                el('#resultSel').addEventListener('change', function () {
                    _t.applyResultDefault();
                });
            },

            loadProjects: function () {
                AjaxUtil.getAsyncData(API + '/project_list', {spjangcd: this.spjangcd},
                    function (res) {
                        var rows = (res && res.data) || [];
                        var html = '<option value="">전체</option>';
                        rows.forEach(function (r) {
                            html += '<option value="' + esc(r.proj_no) + '">'
                                + esc(r.proj_no) + ' · ' + esc(r.proj_name) + '</option>';
                        });
                        el('#projSel').innerHTML = html;
                    },
                    function () {
                        Alert.alert('', '프로젝트를 불러오지 못했습니다.');
                    });
            },

            loadEquipments: function () {
                AjaxUtil.getAsyncData(API + '/equipment_list', {spjangcd: this.spjangcd},
                    function (res) {
                        var rows = (res && res.data) || [];
                        // 검사 설비가 없어도 등록은 된다
                        var html = '<option value="">없음</option>';
                        rows.forEach(function (r) {
                            html += '<option value="' + r.equipment_id + '">'
                                + esc(r.equipment_name) + '</option>';
                        });
                        el('#equSel').innerHTML = html;
                        if (rows.length === 1) el('#equSel').value = rows[0].equipment_id;
                    },
                    function () {
                    });
            },

            loadWorkers: function () {
                AjaxUtil.getAsyncData(API + '/worker_list', {spjangcd: this.spjangcd},
                    function (res) {
                        var rows = (res && res.data) || [];
                        var html = '<option value="">선택</option>';
                        rows.forEach(function (r) {
                            html += '<option value="' + r.id + '">' + esc(r.name)
                                + (r.own_area === 'Y' ? '' : ' (' + esc(r.workcenter_name || '타부서') + ')')
                                + '</option>';
                        });
                        el('#workerSel').innerHTML = html;
                    },
                    function () {
                    });
            },

            // =========================================================
            // 검사 대상
            // =========================================================
            loadTargets: function () {
                var _t = this;
                var param = {spjangcd: this.spjangcd};
                if (this.projNo) param.projNo = this.projNo;
                if (this.state) param.state = this.state;

                AjaxUtil.getAsyncData(API + '/target_list', param,
                    function (res) {
                        _t.targets = (res && res.data) || [];
                        _t.renderTargets();
                    },
                    function () {
                        Alert.alert('', '검사 대상을 불러오지 못했습니다.');
                    });

                AjaxUtil.getAsyncData(API + '/state_count',
                    {spjangcd: this.spjangcd, projNo: this.projNo},
                    function (res) {
                        var d = (res && res.data) || {};
                        el('#cntBadge').innerHTML =
                            '<span class="badge wait">미검사 ' + (d.wait_cnt || 0) + '</span> '
                            + '<span class="badge done">완료 ' + (d.done_cnt || 0) + '</span> '
                            + '<span class="badge exempt">면제 ' + (d.exempt_cnt || 0) + '</span>';
                    },
                    function () {
                    });
            },

            renderTargets: function () {
                var _t = this;
                var body = el('#targetBody');

                if (!this.targets.length) {
                    body.innerHTML = '<tr><td colspan="10">'
                        + (this.state === 'wait' ? '미검사 항목이 없습니다.'
                            : this.state === 'exempt' ? '검사 면제 항목이 없습니다.'
                                : '검사 대상이 없습니다. 작업 지시된 품목이 있어야 대상이 됩니다.')
                        + '</td></tr>';
                    return;
                }

                var html = '';
                this.targets.forEach(function (t) {
                    var isOut = t.make_type === 'outsource';
                    var st = t.insp_state;   // wait / done / exempt
                    var stTxt = st === 'exempt' ? '검사면제' : (st === 'done' ? '완료' : '미검사');

                    html += '<tr class="pointer' + (t.suju_id === _t.sujuId ? ' on' : '')
                        + '" data-id="' + t.suju_id + '">'
                        + '<td>' + esc(t.line_name) + '</td>'
                        + '<td class="left">' + esc(t.item_name) + '</td>'
                        // 프로젝트당 수주가 여러 건이라 같은 품목명이 여러 줄 나온다.
                        // 수주에는 번호가 없으므로 수주명(없으면 주문일)으로 구분한다.
                        + '<td class="left">' + headText(t) + '</td>'
                        + '<td><span class="badge ' + (isOut ? 'out' : 'in') + '">'
                        + (isOut ? '외작' : '내작') + '</span></td>'
                        + '<td class="left">' + esc(t.make_comp || '') + '</td>'
                        // 공정 조립(지그)과 검사는 같은 축이라 나란히 비교할 수 있다
                        + '<td>' + num(t.ready_qty) + ' / ' + num(t.set_target) + '</td>'
                        // 유닛은 축이 달라 <b>따로</b> 보여준다.
                        // 예전에 유닛 실적을 지그 대수와 나란히 놓아 A12(지그 2·유닛 24)가
                        // '2/2 완료'로 보이는 일이 있었다.
                        + '<td class="muted">' + num(t.unit_done) + ' / ' + num(t.unit_qty) + '</td>'
                        + '<td>' + num(t.insp_qty)
                        + (num(t.insp_defect_qty) > 0
                            ? ' <span class="badge wait">불 ' + num(t.insp_defect_qty) + '</span>' : '')
                        + '</td>'
                        + '<td><span class="badge ' + st + '">' + stTxt + '</span></td>'
                        + '<td>' + esc(t.last_inspect_date || '-') + '</td>'
                        + '</tr>';
                });
                body.innerHTML = html;

                els('#targetBody tr[data-id]').forEach(function (tr) {
                    tr.addEventListener('click', function () {
                        _t.selectTarget(parseInt(tr.getAttribute('data-id'), 10));
                    });
                });
            },

            selectTarget: function (sujuId) {
                this.sujuId = sujuId;
                this.target = this.targets.filter(function (t) {
                    return t.suju_id === sujuId;
                })[0] || null;

                this.renderTargets();

                if (this.target) {
                    var exempt = this.target.insp_state === 'exempt';
                    var hn = this.target.suju_name || this.target.jumun_date;
                    el('#formTitle').textContent = this.target.item_name + (hn ? ' [' + hn + ']' : '')
                        + (exempt ? ' — 검사면제' : ' 검사');

                    // 검사 가능 수량을 합격 칸에 밀어 넣어 준다. 필요하면 고치면 된다.
                    // 외작은 조립 실적이 없어 0 일 수 있으므로 목표 수량으로 대신한다.
                    var base = num(this.target.ready_qty) || num(this.target.set_target) || 1;
                    el('#goodQty').value = base;
                    el('#defectQty').value = 0;
                    el('#resultSel').value = 'pass';

                    // 면제 품목도 필요하면 검사할 수 있게 막지는 않는다 (재검사)
                    el('#saveBtn').textContent = exempt ? '재검사 등록' : '검사 등록';
                }
                this.loadLog();
            },

            applyResultDefault: function () {
                var ready = this.target
                    ? (num(this.target.ready_qty) || num(this.target.set_target) || 1) : 0;
                if (el('#resultSel').value === 'fail') {
                    el('#goodQty').value = 0;
                    el('#defectQty').value = ready;
                } else {
                    el('#goodQty').value = ready;
                    el('#defectQty').value = 0;
                }
            },

            // =========================================================
            // 등록 / 이력
            // =========================================================
            save: function () {
                var _t = this;

                if (!this.sujuId) {
                    Alert.alert('', '검사 대상을 선택하세요.');
                    return;
                }
                if (!el('#workerSel').value) {
                    Alert.alert('', '검사자를 선택하세요.');
                    return;
                }

                var good = num(el('#goodQty').value);
                var defect = num(el('#defectQty').value);
                if (good <= 0 && defect <= 0) {
                    Alert.alert('', '합격 또는 불합격 수량을 입력하세요.');
                    return;
                }

                AjaxUtil.postJsonData(API + '/save', {
                        spjangcd: this.spjangcd,
                        sujuId: this.sujuId,
                        inspectDate: el('#inspectDate').value,
                        workerId: el('#workerSel').value,
                        equipmentId: el('#equSel').value,
                        result: el('#resultSel').value,
                        goodQty: good,
                        defectQty: defect,
                        remark: el('#remark').value
                    },
                    function (res) {
                        if (res && res.success === false) {
                            Alert.alert('', res.message);
                            return;
                        }
                        Alert.alert('', (res && res.message) || '등록되었습니다.');
                        el('#remark').value = '';
                        _t.loadTargets();
                        _t.loadLog();
                    },
                    function () {
                        Alert.alert('', '등록하지 못했습니다.');
                    });
            },

            loadLog: function () {
                var _t = this;
                if (!this.sujuId) {
                    el('#logBody').innerHTML = '';
                    return;
                }

                AjaxUtil.getAsyncData(API + '/log',
                    {spjangcd: this.spjangcd, sujuId: this.sujuId},
                    function (res) {
                        var rows = (res && res.data) || [];
                        if (!rows.length) {
                            el('#logBody').innerHTML = '<tr><td colspan="5">검사 이력이 없습니다.</td></tr>';
                            return;
                        }
                        var html = '';
                        rows.forEach(function (r) {
                            html += '<tr>'
                                + '<td>' + esc(r.inspect_date) + '</td>'
                                + '<td><span class="badge ' + (r.result === 'fail' ? 'wait' : 'done') + '">'
                                + (r.result === 'fail' ? '불합격' : '합격') + '</span></td>'
                                + '<td>' + num(r.good_qty) + ' / ' + num(r.defect_qty) + '</td>'
                                + '<td>' + esc(r.worker) + '</td>'
                                + '<td><a class="btn" data-del="' + r.id + '">취소</a></td>'
                                + '</tr>';
                        });
                        el('#logBody').innerHTML = html;

                        els('#logBody a[data-del]').forEach(function (a) {
                            a.addEventListener('click', async function () {
                                var ok = await Alert.confirmAsync('', '이 검사 기록을 취소하시겠습니까?');
                                if (!ok) return;
                                AjaxUtil.postJsonData(API + '/delete',
                                    {id: a.getAttribute('data-del')},
                                    function (r2) {
                                        if (r2 && r2.success === false) {
                                            Alert.alert('', r2.message);
                                            return;
                                        }
                                        _t.loadTargets();
                                        _t.loadLog();
                                    },
                                    function () {
                                        Alert.alert('', '취소하지 못했습니다.');
                                    });
                            });
                        });
                    },
                    function () {
                    });
            }
        };

        document.addEventListener('DOMContentLoaded', function () {
            page.init();
        });
    </script>
</th:block>
</html>
