<html layout:decorate="~{layout_page}">
<head>
    <style>
        /* 이 페이지 전용 스타일만 정의한다.
           .layout-contents / .section / .section-top / .container-fluid / .btn /
           .page-title-wrap 등은 layout_page 가 제공하므로 재정의하지 않는다. */

        /* ★ min-height 가 아니라 height 로 잡아야 안쪽만 스크롤된다.
           min-height 면 내용이 길 때 페이지 전체가 늘어나 바깥 스크롤이 생기고,
           그러면 검색줄과 요약 카드까지 같이 밀려 올라간다. */
        .layout-contents { display:flex; flex-direction:column; height:100vh;
            overflow:hidden; box-sizing:border-box; }
        .main-row { display:flex; flex-direction:column; gap:5px; flex:1 1 auto; min-height:0; }
        .main-row > .section { display:flex; flex-direction:column; min-height:0; overflow:hidden; }

        /* 본문만 스크롤.
           ★ 스크롤 컨테이너에 padding-top 을 주면 안 된다.
             sticky 헤더는 스크롤포트 기준으로 붙는데 패딩 영역은 그 위에 남아,
             스크롤할 때 헤더 위 틈으로 다음 행이 잘려 보인다.
             여백은 스크롤 밖(.section-top)에서 준다. */
        .main-row > .section > .container-fluid { flex:1 1 auto; min-height:0; overflow:auto; padding-top:0; }
        .main-row > .section > .section-top { flex:0 0 auto; margin-bottom:10px; }
        .sum-sec { flex:0 0 auto; }

        table.work-table { width:100%; border-collapse:collapse; }
        table.work-table th, table.work-table td {
            border:1px solid #d7dde7; padding:5px 7px; font-size:12.5px;
            text-align:center; white-space:nowrap; }
        /* border-collapse 는 sticky 셀의 테두리를 떼어 간다. inset 그림자로 그린다 */
        table.work-table th {
            background:#eef2f8; color:#445; font-weight:700;
            position:sticky; top:0; z-index:2;
            box-shadow: inset 0 1px 0 #d7dde7, inset 0 -1px 0 #d7dde7;
        }
        table.work-table td.l { text-align:left; }
        table.work-table td.r { text-align:right; }
        table.work-table tr:hover td { background:#f4f8ff; }

        .qty { font-weight:700; color:#1f4e8c; }
        /* layout_page 의 .search-wrap ul li { flex:1 1 0; min-width:100px } 때문에
           날짜·버튼이 각각 100px 을 차지해 검색줄이 과하게 넓어진다.
           이 페이지는 항목이 많아 내용 크기대로 두는 게 낫다. */
        .search-wrap ul li { flex:0 0 auto; min-width:0; }

        /* 인라인 style 은 layout_page 의 input 규칙에 밀릴 수 있어 클래스로 준다.
           숫자 입력의 스피너가 값과 겹쳐 보여 오른쪽 여백을 넉넉히 잡는다. */
        .qty-in { width:100%; box-sizing:border-box; margin-top:8px;
            padding:10px 14px !important; height:auto !important;
            border:1px solid #cfd6e2; border-radius:6px;
            font-size:18px; font-weight:700; text-align:right; }

        .mut { color:#8b95a7; }
        /* 수정·삭제를 한 줄에 둔다. 세로로 쌓이면 행 높이가 두 배가 된다 */
        td.act { white-space:nowrap; }
        td.act .btn { padding:2px 8px; font-size:11.5px; margin:0 1px; }
        .empty { color:#99a; text-align:center; padding:22px 0; }
        .kchip { display:inline-block; background:#eef2f8; border:1px solid #d7dde7; border-radius:10px;
            padding:1px 8px; font-size:11.5px; color:#445; }
        .kchip.etc { color:#8b95a7; }

        /* 공정별 소계. ★ 가로로 더하지 않는다 — 한 부품이 공정마다 다시 세어진다 */
        .sum-row { display:flex; gap:8px; flex-wrap:wrap; padding:8px 13px 10px; }
        .sum-card { border:1px solid #d7dde7; border-radius:8px; padding:6px 12px;
            min-width:130px; background:#fff; }
        .sum-card .op { font-size:12px; color:#5b6b86; font-weight:700; }
        .sum-card .v { font-size:18px; font-weight:800; color:#1f4e8c; margin-top:1px; }
        .sum-card .kk { font-size:11px; color:#8b95a7; margin-top:3px; line-height:1.5; }
        .sum-note { font-size:11.5px; color:#8b95a7; padding:0 13px 10px; line-height:1.6; }
    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>가공 실적 조회</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>생산관리</li>
                <li>가공 실적 조회</li>
            </ul>
        </div>

        <div class="main-row">
            <!-- 공정별 소계 -->
            <section class="section sum-sec">
                <div class="section-top">
                    <div class="search-wrap">
                        <dl><dt>생산일</dt>
                            <dd><ul class="date-box">
                                <li><input type="date" id="dateFrom"></li>
                                <li style="align-self:center">~</li>
                                <li><input type="date" id="dateTo"></li>
                            </ul></dd></dl>
                        <dl><dt>프로젝트</dt>
                            <dd><select id="fProject" style="min-width:190px"></select></dd></dl>
                        <dl><dt>공정</dt>
                            <dd><select id="fOperation" style="min-width:140px"></select></dd></dl>
                        <dl><dt>설비</dt>
                            <dd><select id="fEquipment" style="min-width:140px"></select></dd></dl>
                        <dl><dt>유형</dt>
                            <dd><select id="fKind" style="min-width:110px"></select></dd></dl>
                        <!-- 검색 버튼은 필터 바로 옆에 둔다.
                             오른쪽 끝에 떨어져 있으면 필터를 다 채운 뒤 시선이 멀리 이동한다. -->
                        <dl><dt>&nbsp;</dt>
                            <dd><a class="btn btn-search"
                                   onclick="prodResultKioskList.search()">검색</a></dd></dl>
                    </div>
                </div>
                <div class="sum-row" id="sumRow"></div>

            </section>

            <!-- 실적 목록 -->
            <section class="section" style="flex:1;">
                <div class="section-top">
                    <span style="font-weight:700">실적 내역 <span class="mut" id="cntLab"></span></span>
                </div>
                <div class="container-fluid">
                    <table class="work-table">
                        <colgroup>
                            <col style="width:9%">   <!-- 생산일 -->
                            <col style="width:13%">  <!-- 공정 -->
                            <col style="width:9%">   <!-- 설비 -->
                            <col style="width:7%">   <!-- 작업자 -->
                            <col style="width:14%">  <!-- 프로젝트 -->
                            <col style="width:10%">  <!-- 수주 -->
                            <col style="width:8%">   <!-- 품목 -->
                            <col style="width:8%">   <!-- 유형 -->
                            <col style="width:7%">   <!-- 수량 -->
                            <col style="width:7%">   <!-- 불량 -->
                            <col style="width:8%">   <!-- 관리 -->
                        </colgroup>
                        <thead>
                        <tr>
                            <th>생산일</th><th>공정</th><th>설비</th><th>작업자</th>
                            <th>프로젝트</th><th>수주</th><th>품목</th><th>유형</th>
                            <th>수량</th><th>불량</th><th>관리</th>
                        </tr>
                        </thead>
                        <tbody id="listBody"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- 수량 수정. 브라우저 prompt() 는 화면 톤과 어긋나 모달로 바꿨다 -->
        <div id="qtyModal"
             style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;
                    align-items:center;justify-content:center;">
            <div style="background:#fff;border-radius:8px;width:380px;max-width:92vw;
                        box-shadow:0 10px 30px rgba(0,0,0,.2);">
                <!-- layout_page 의 .section-top 은 패딩이 없어 제목이 벽에 붙는다 -->
                <div class="section-top" style="border-radius:8px 8px 0 0;padding:16px 22px;">
                    <div class="search-wrap" style="margin-bottom:0"><h3>수량 수정</h3></div>
                </div>
                <div style="padding:20px 22px;">
                    <p class="mut" id="qtyDesc" style="margin:0 0 12px;font-size:12.5px"></p>
                    <label id="qtyLabel" style="font-size:12.5px;font-weight:700;color:#445"></label>
                    <input type="number" id="qtyInput" min="1" class="qty-in">
                </div>
                <div style="padding:14px 22px;border-top:1px solid #e9edf3;text-align:right;">
                    <a class="btn btn-search" id="qtyOk">저장</a>
                    <a class="btn" id="qtyCancel">취소</a>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript">
        /*
         * 가공 실적 조회 (PC)
         *
         * 키오스크는 그날 그 설비 것만 50건 보여 준다. 잘못 찍은 실적을
         * 다음 날 고치거나 관리자가 전체를 훑을 데가 없어서 만들었다.
         *
         * [조회 전용 + 취소]
         *   수정은 두지 않는다. 수량을 고치게 하면 "원래 얼마였나" 가 사라진다.
         *   취소하고 키오스크에서 다시 넣는 편이 이력이 남는다.
         *
         * [숫자의 성격]
         *   여기 수량은 <b>그 설비가 처리한 횟수</b>다. 완성 개수가 아니다.
         *   한 부품이 절단 → 가공 → 와이어커팅을 거치면 공정마다 다시 세어지므로
         *   공정을 합치면 실물보다 커진다 (SPEC 3-2: 라우팅 없음).
         *   그래서 소계를 공정별로 갈라 놓고 총합은 만들지 않는다.
         *
         * [통신] AjaxUtil 만 쓴다. $.ajax 직접 호출은 CSRF 가 빠져 403 이 난다.
         */
        class ProdResultKioskListPage {
            constructor() {
                this.API = '/api/production/prod_result_kiosk';
                this.spjangcd = $('#spjangcd').val() || 'ZZ';
                this.rows = [];
                this.equipments = [];
                this.init();
            }

            async init() {
                this.week();                     // 기본은 최근 7일
                this.bindQtyModal();
                await this.loadFilters();
                await this.search();
            }

            /* 수량 수정 모달. 브라우저 prompt() 는 화면 톤과 어긋나 직접 만든다 */
            bindQtyModal() {
                this.el('qtyOk').onclick = () => this.saveQty();
                this.el('qtyCancel').onclick = () => this.closeQty();
                this.el('qtyModal').onclick = e => {
                    if (e.target === this.el('qtyModal')) this.closeQty();
                };
                this.el('qtyInput').onkeyup = e => {
                    if (e.key === 'Enter') this.saveQty();
                    if (e.key === 'Escape') this.closeQty();
                };
            }

            // ===== 마스터 =====

            async loadFilters() {
                const [pj, op, eq, kd] = await Promise.all([
                    this.get(`${this.API}/project_list`, {spjangcd: this.spjangcd}),
                    this.get(`${this.API}/operation_list`, {spjangcd: this.spjangcd}),
                    this.get(`${this.API}/equipment_list`, {spjangcd: this.spjangcd}),
                    this.get('/api/production/prod_design/kind_list', {spjangcd: this.spjangcd})
                ]);

                this.fill('fProject', (pj.data || []).map(p => ({
                    v: p.proj_no, t: `${p.proj_no} ${p.proj_name || ''}`.trim()
                })));
                this.fill('fOperation', (op.data || []).map(o => ({v: o.operation, t: o.operation})));

                this.equipments = eq.data || [];
                this.fillEquipments(null);

                this.fill('fKind', (kd.data || []).map(k => ({v: k.canon, t: k.canon}))
                    .concat([{v: 'etc', t: '기타'}]));

                // 공정을 고르면 그 공정 설비만 남긴다
                this.el('fOperation').onchange = () => {
                    this.fillEquipments(this.el('fOperation').value);
                    this.search();
                };
                ['fProject', 'fEquipment', 'fKind'].forEach(id => {
                    this.el(id).onchange = () => this.search();
                });
            }

            fillEquipments(operation) {
                const list = operation
                    ? this.equipments.filter(e => e.operation === operation)
                    : this.equipments;
                this.fill('fEquipment', list.map(e => ({
                    v: e.code, t: `${e.code} ${e.name || ''}`.trim()
                })));
            }

            fill(id, opts) {
                const sel = this.el(id);
                const keep = sel.value;
                sel.innerHTML = '<option value="">전체</option>'
                    + opts.map(o => `<option value="${this.esc(o.v)}">${this.escHtml(o.t)}</option>`).join('');
                if (keep && opts.some(o => String(o.v) === keep)) sel.value = keep;
            }

            // ===== 조회 =====

            /* 기본 조회 기간. 날짜만 채우고 조회는 부르지 않는다 —
               init 에서 곧바로 search() 를 부르므로 두 번 나가게 된다. */
            week() {
                const to = new Date(), from = new Date();
                from.setDate(from.getDate() - 6);
                this.el('dateFrom').value = this.ymd(from);
                this.el('dateTo').value = this.ymd(to);
            }

            // 로컬 시간 기준 YYYY-MM-DD (toISOString 은 UTC 라 KST 에서 하루 밀린다)
            ymd(d) {
                const p = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
            }

            params() {
                return {
                    spjangcd: this.spjangcd,
                    dateFrom: this.el('dateFrom').value,
                    dateTo: this.el('dateTo').value,
                    projNo: this.el('fProject').value,
                    operation: this.el('fOperation').value,
                    equipment: this.el('fEquipment').value,
                    kind: this.el('fKind').value
                };
            }

            async search() {
                const res = await this.get(`${this.API}/search`, this.params());
                const d = res.data || {};
                this.rows = d.rows || [];
                this.renderSummary(d.summary || []);
                this.renderList();
            }

            // ===== 렌더 =====

            /*
             * 공정별 소계. 카드 하나가 공정 하나다.
             * 총합 카드를 두지 않는 이유는 공정을 더하면 실물보다 커지기 때문이다.
             */
            renderSummary(sum) {
                const box = this.el('sumRow');
                if (!sum.length) {
                    box.innerHTML = '<span class="mut" style="padding:4px 0">조회 결과가 없습니다.</span>';
                    return;
                }
                const byOp = {};
                sum.forEach(s => {
                    const o = s.operation || '(미지정)';
                    (byOp[o] = byOp[o] || {qty: 0, kinds: []});
                    byOp[o].qty += (+s.qty || 0);
                    byOp[o].kinds.push(`${s.kind} ${this.nf(s.qty)}`);
                });
                box.innerHTML = Object.keys(byOp).sort().map(o => `
                    <div class="sum-card">
                        <div class="op">${this.escHtml(o)}</div>
                        <div class="v">${this.nf(byOp[o].qty)}</div>
                        <div class="kk">${byOp[o].kinds.map(k => this.escHtml(k)).join(' · ')}</div>
                    </div>`).join('');
            }

            renderList() {
                this.el('cntLab').textContent = this.rows.length
                    ? `${this.nf(this.rows.length)}건` : '';

                const body = this.el('listBody');
                if (!this.rows.length) {
                    body.innerHTML = '<tr><td colspan="11" class="empty">조회 결과가 없습니다.</td></tr>';
                    return;
                }

                body.innerHTML = this.rows.map((r, i) => `
                    <tr>
                        <td>${r.prod_date || ''}</td>
                        <td class="l">${this.escHtml(r.operation || '')}</td>
                        <td>${this.escHtml(r.equipment || '')}</td>
                        <td>${this.escHtml(r.worker || '')}</td>
                        <td class="l">${this.escHtml(r.proj_no || '')}
                            <span class="mut">${this.escHtml(r.proj_name || '')}</span></td>
                        <td class="l mut">${this.escHtml(r.suju_name || '-')}</td>
                        <td>${r.item_name
                    ? this.escHtml(r.item_name)
                    : '<span class="mut">품목 미지정</span>'}</td>
                        <td><span class="kchip ${r.kind === 'etc' ? 'etc' : ''}">${this.escHtml(r.kind)}</span></td>
                        <td class="r qty">${this.nf(r.good_qty)}</td>
                        <td class="r" style="color:#c2410c;font-weight:700">${
                    r.defect_qty ? this.nf(r.defect_qty) : '<span class="mut">-</span>'}</td>
                        <td class="act"><a class="btn" data-u="${i}">수정</a><a class="btn" data-i="${i}">삭제</a></td>
                    </tr>`).join('');

                body.querySelectorAll('[data-i]').forEach(b =>
                    b.onclick = () => this.remove(this.rows[+b.dataset.i]));
                body.querySelectorAll('[data-u]').forEach(b =>
                    b.onclick = () => this.editQty(this.rows[+b.dataset.u]));
            }

            /*
             * 실적 취소.
             * 수정을 두지 않는 이유: 수량을 고치면 원래 값이 사라진다.
             * 취소하고 다시 넣으면 이력이 남는다.
             */

            /*
             * 수량 수정. 양품 행이면 GoodQty, 불량 행이면 DefectQty 를 서버가 골라 고친다.
             * 품목·유형·설비·작업자는 못 고친다 — 그건 삭제하고 다시 넣어야 이력이 남는다.
             */
            editQty(r) {
                if (!r) return;
                this.editRow = r;
                const isNg = !!(+r.defect_qty);
                this.el('qtyDesc').textContent =
                    `${r.prod_date} · ${r.operation} · ${r.kind}`
                    + (r.item_name ? ` · ${r.item_name}` : '');
                this.el('qtyLabel').textContent = isNg ? '불량 수량' : '수량';
                this.el('qtyInput').value = isNg ? r.defect_qty : r.good_qty;
                this.el('qtyModal').style.display = 'flex';
                this.el('qtyInput').focus();
                this.el('qtyInput').select();
            }

            closeQty() {
                this.el('qtyModal').style.display = 'none';
                this.editRow = null;
            }

            async saveQty() {
                const r = this.editRow;
                if (!r) return;
                const qty = parseFloat(this.el('qtyInput').value);
                if (!(qty > 0)) {
                    Alert.alert('', '0보다 큰 수를 입력하세요.');
                    return;
                }

                const res = await this.post(`${this.API}/update_qty`, {id: r.id, qty: qty});
                if (!res.success) {
                    Alert.alert('', res.message || '수정에 실패했습니다.');
                    return;
                }
                this.closeQty();
                await this.search();
            }

            async remove(r) {
                if (!r) return;
                /* 불량 행은 GoodQty 가 0 이다. 그대로 찍으면 '50개 삭제' 인데
                   '0' 이라고 물어보게 되어 무엇을 지우는지 알 수 없다. */
                const isNg = !!(+r.defect_qty);
                const qty = isNg
                    ? `불량 ${this.nf(r.defect_qty)}`
                    : `${this.nf(r.good_qty)}`;
                const ok = await Alert.confirmAsync('',
                    `${r.prod_date} · ${r.operation} · ${r.kind} · ${qty}`
                    + `${r.item_name ? ' · ' + r.item_name : ''}`
                    + `\n이 실적을 삭제하시겠습니까?`);
                if (!ok) return;

                const res = await this.post(`${this.API}/delete`, {id: r.id});
                if (!res.success) {
                    Alert.alert('', res.message || '삭제에 실패했습니다.');
                    return;
                }
                await this.search();
            }

            // ===== helper =====

            el(id) {
                return document.getElementById(id);
            }

            nf(n) {
                return Number(n || 0).toLocaleString();
            }

            // AjaxUtil 이 CSRF / spjangcd / 로딩바를 처리한다. 콜백이라 Promise 로 감싼다
            get(url, data) {
                return new Promise(resolve => {
                    AjaxUtil.getAsyncData(url, data,
                        res => resolve(res || {success: false, data: null}),
                        () => resolve({success: false, data: null}));
                });
            }

            post(url, data) {
                return new Promise(resolve => {
                    AjaxUtil.postJsonData(url, data,
                        res => resolve(res || {success: false}),
                        () => resolve({success: false, message: ''}));
                });
            }

            escHtml(s) {
                return (s == null ? '' : String(s))
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            esc(s) {
                return (s == null ? '' : String(s)).replace(/"/g, '&quot;');
            }
        }

        $(document).ready(function () {
            window.prodResultKioskList = new ProdResultKioskListPage();
        });
    </script>
</th:block>
