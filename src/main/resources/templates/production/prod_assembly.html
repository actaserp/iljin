<html layout:decorate="~{layout_page}">
<head>
    <style>
        /* 이 페이지 전용 스타일만 정의한다.
           .layout-contents / .section / .section-top / .container-fluid / .btn /
           .page-title-wrap 등은 layout_page 가 제공하므로 재정의하지 않는다. */

        .layout-contents { display:flex; flex-direction:column; min-height:100vh; box-sizing:border-box; }
        .main-row { display:flex; gap:5px; align-items:stretch; flex:1 1 auto; min-height:0; }
        .main-row > .section { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
        .main-row > .section > .container-fluid { flex:1 1 auto; min-height:0; overflow:auto; padding-top:10px; }
        .section-top { flex:0 0 auto; }

        .right-col { display:flex; flex-direction:column; gap:5px; flex:1; min-width:0; min-height:0; }
        .right-col > .reg-sec { flex:0 0 auto; display:flex; flex-direction:column; overflow:hidden; }
        .right-col > .log-sec { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
        .right-col > .log-sec > .container-fluid { flex:1 1 auto; min-height:0; overflow:auto; }

        table.work-table { width:100%; border-collapse:collapse; }
        table.work-table th, table.work-table td { border:1px solid #d7dde7; padding:7px; font-size:12.5px; text-align:center; }
        table.work-table th { background:#eef2f8; color:#445; font-weight:700; position:sticky; top:0; z-index:1; }
        table.work-table td.l { text-align:left; font-weight:700; padding-left:6px; }
        table.work-table input, table.work-table select { width:100%; min-width:0; }

        tr.asy-row { cursor:pointer; }
        tr.asy-row:hover { background:#f4f8ff; }
        tr.asy-row.on { background:#e6efff; }
        tr.asy-row.on td:nth-child(1) { box-shadow:inset 3px 0 0 #0026ff; }
        tr.asy-row.run { background:#fffbe8; }
        tr.asy-row.run.on { background:#fff3c4; }

        .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:11px; display:inline-block; }
        .badge.wait { background:#eef0f4; color:#777; }
        .badge.run { background:#f3e6c0; color:#8a6d1b; }
        .badge.done { background:#dff0e5; color:#1b6b3a; }
        .empty { color:#99a; text-align:center; padding:18px 0; }
        .hint { font-size:11.5px; color:#667; line-height:1.6; margin:10px 0 0; }

        /* 등록 값(생산일·작업자) 줄 — 조회 조건이 아니라 여기 속한다 */
        .reg-input { display:flex; align-items:flex-end; gap:16px; padding-bottom:12px;
            border-bottom:1px solid #eef1f6; margin-bottom:14px; }
        .reg-input dl { margin:0; }
        .reg-input dt { font-size:12px; color:#445; font-weight:600; margin-bottom:5px; }
        .reg-input dd { margin:0; }
        .reg-input .eq { color:#e0533d; margin-left:2px; }

        .pick-card { display:flex; flex-direction:column; gap:14px; align-items:stretch; }
        .pick-name { font-size:19px; font-weight:800; color:#1d2330; }

        .stage-tabs{display:flex;gap:6px;}
        .stage-tabs button{border:1px solid #cfd6e2;background:#fff;color:#5b6b86;
            border-radius:7px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;line-height:1.3;}
        .stage-tabs button span{display:block;font-size:10.5px;font-weight:500;color:#98a2b3;}
        .stage-tabs button.on{background:#1f4e8c;border-color:#1f4e8c;color:#fff;}
        .stage-tabs button.on span{color:#c3d6ef;}

        /* 목표 / 조립완료 / 남음 — 나란히 놓는 세 숫자 */
        .stat-row { display:flex; gap:8px; align-items:stretch; }
        .stat.name { flex:0 0 auto; min-width:120px; display:flex; flex-direction:column;
            justify-content:center; gap:5px; background:#fff; border-color:#d4dae5; }
        .stat { flex:1; background:#f7f9fc; border:1px solid #e5eaf2; border-radius:8px; padding:10px 12px; }
        .stat .lab { display:block; font-size:11.5px; color:#7a8499; font-weight:700; }
        .stat .v { display:block; font-size:22px; font-weight:800; color:#1d2330; margin-top:2px; }
        .stat.wip .v { color:#8a6d1b; }

        .qty-line { display:flex; align-items:center; gap:10px; }
        .qty-line .lab { font-size:12.5px; color:#7a8499; font-weight:700; }
        /* 현장에서 누르는 자리라 크게 잡는다 */
        .qty-input { width:150px; height:52px; text-align:right; font-size:24px; font-weight:800; padding:8px 14px;
            border:1px solid #cfd6e2; border-radius:7px; }
        .qty-input:disabled { background:#f2f4f7; color:#aab; }

        /* 투입 자재 */
        .consume-bar { display:flex; align-items:center; gap:10px; margin-top:10px;
            padding-top:10px; border-top:1px solid #e6eaf1; font-size:12.5px; }
        .lack { color:#c2410c; font-weight:700; }
        #consumeBody table { font-size:12.5px; }
        #consumeBody td, #consumeBody th { padding:6px 8px; }

        .act-row { display:flex; gap:10px; align-items:stretch; }
        .act-row .qty-line { flex:0 0 auto; }
        .act-row .btn { flex:1; padding:20px; font-size:18px; font-weight:800;
            border-radius:10px; text-align:center; display:flex;
            align-items:center; justify-content:center; }
        .btn-start { background:#1ca36b; border-color:#1ca36b; color:#fff; }
        .btn-end { background:#2f57d6; border-color:#2f57d6; color:#fff; }
        .btn-off { background:#eef0f4; border-color:#e2e5ea; color:#aab; cursor:not-allowed; }
    </style>
</head>
<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>조립 공정</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>생산관리</li>
                <li>조립 공정</li>
            </ul>
        </div>

        <div class="main-row">
            <!-- 좌: 조립 대상 품목 -->
            <!-- 좌: 조립 대상 목록. 6열뿐이라 넓을 필요가 없다 -->
            <section class="section" style="flex:0 0 42%;">
                <div class="section-top">
                    <div class="search-wrap" style="margin-bottom:0">
                        <dl>
                            <dt>프로젝트</dt>
                            <dd><select id="fProject" style="min-width:220px"
                                        onchange="prodAssembly.search()"></select></dd>
                        </dl>
                    </div>
                    <!-- 조립 2단계. 키오스크의 탭과 같은 stage 값을 쓴다 -->
                    <div class="stage-tabs">
                        <button data-st="unit" class="on">유닛 조립<span>가공품 → 유닛</span></button>
                        <button data-st="set">공정 조립<span>유닛 → 지그</span></button>
                    </div>
                </div>
                <div class="container-fluid">
                    <table class="work-table">
                        <colgroup>
                            <col style="width:12%"><col><col style="width:12%">
                            <col style="width:12%"><col style="width:12%"><col style="width:14%">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>라인</th>
                            <th>품목</th>
                            <th id="thTarget">목표</th>
                            <th>조립완료</th>
                            <th>남음</th>
                            <th>상태</th>
                        </tr>
                        </thead>
                        <tbody id="asyBody"></tbody>
                    </table>
                </div>
            </section>

            <!-- 우: 시작/완료 + 조립 이력 -->
            <div class="right-col">
                <section class="section reg-sec">
                    <div class="section-top">
                        <span id="selLab" style="font-weight:700;">품목을 선택하세요</span>
                    </div>
                    <div class="container-fluid">
                        <!-- 생산일·작업자는 조회 조건이 아니라 등록 값이므로 이 영역에 둔다 -->
                        <div class="reg-input">
                            <dl>
                                <dt>생산일<span class="eq">*</span></dt>
                                <dd><input type="date" id="pdate"></dd>
                            </dl>
                            <dl>
                                <dt>작업자<span class="eq">*</span></dt>
                                <dd><select id="fWorker" style="min-width:150px"></select></dd>
                            </dl>
                        </div>
                        <div class="pick-card" id="pickCard">
                            <div class="empty" style="width:100%">왼쪽에서 품목을 선택하세요</div>
                        </div>
                    </div>
                </section>

                <section class="section log-sec">
                    <div class="section-top">
                        <span style="font-weight:700;">조립 이력</span>
                        <div class="button-wrap">
                            <ul>
                                <li><input type="date" id="logFrom" style="height:30px"></li>
                                <li style="align-self:center">~</li>
                                <li><input type="date" id="logTo" style="height:30px"></li>
                                <li><a class="btn" onclick="prodAssembly.logRange(6)">7일</a></li>
                                <li><a class="btn" onclick="prodAssembly.clearLogDate()">전체</a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="container-fluid">
                        <table class="work-table">
                            <colgroup>
                                <col style="width:11%"><col style="width:14%"><col>
                                <col style="width:9%"><col style="width:12%">
                                <col style="width:14%"><col style="width:10%">
                            </colgroup>
                            <thead>
                            <tr>
                                <th>생산일</th><th>프로젝트</th><th>품목</th><th>수량</th>
                                <th>작업자</th><th>시작~종료</th><th>취소</th>
                            </tr>
                            </thead>
                            <tbody id="logBody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- 투입 자재. 상세가 좁아 목록을 펼치면 시작·완료 버튼이 밀린다 -->
    <div id="consumeModal"
         style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;
                align-items:center;justify-content:center;">
        <div style="background:#fff;border-radius:10px;width:640px;max-width:94vw;max-height:82vh;
                    display:flex;flex-direction:column;box-shadow:0 12px 36px rgba(0,0,0,.22);">
            <div class="section-top" style="border-radius:10px 10px 0 0;padding:16px 22px;">
                <div class="search-wrap" style="margin-bottom:0"><h3>투입 자재</h3></div>
            </div>
            <div style="flex:1 1 auto;overflow:auto;padding:18px 22px;" id="consumeBody"></div>
            <div style="padding:14px 22px;border-top:1px solid #e9edf3;text-align:right;">
                <a class="btn" onclick="prodAssembly.closeConsume()">닫기</a>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript">

        /**
         * 조립 공정 (PC)
         *
         * [조립 2단계]  탭으로 고른다. 키오스크와 같은 API·같은 stage 값을 쓴다.
         *   'unit' 유닛 조립 (가공품 → 유닛)  목표 suju.unit_qty
         *   'set'  공정 조립 (유닛 → 지그)    목표 suju."SujuQty"
         *
         *   도면 구조가 그대로다.
         *     FD10-00-00 지그 > FD10-01-00 유닛 01 > FD10-01-01~16 가공품 16종
         *
         * [현장과 같은 화면, 다른 역할]
         *        현장 키오스크가 찍고, 여기서 <b>확인·수정</b>한다.
         *        지그 완성 선언은 현장에서도 여기서도 할 수 있다.
         *
         * [공정 완료는 검사가 판정한다]
         *        지그를 다 조립해도 끝이 아니다.
         *        검사 수량이 지그 대수(set_target)에 도달해야 끝이다.
         *        done_yn 이 그 결과이고, 여기서는 표시만 한다.
         */
        class ProdAssemblyPage {

            constructor() {
                this.API = '/api/production/prod_assembly';

                // 조립 단계. 화면 탭으로 바뀌며 서버가 화이트리스트로 검증한다
                this.stage = 'unit';
                this.spjangcd = $('#spjangcd').val() || 'ZZ';

                this.projects = [];
                this.workers = [];
                this.items = [];
                this.log = [];

                this.selProj = '';
                this.sel = -1;

                this.init();
            }

            el(id) {
                return document.getElementById(id);
            }

            async init() {
                if (!this.el('fProject')) {
                    console.error('[prod_assembly] 화면 요소를 찾을 수 없습니다. layout_page 구조를 확인하세요.');
                    return;
                }
                this.el('pdate').value = this.today();
                await this.loadWorkers();
                await this.loadProjects();
            }

            today() {
                const d = new Date(), z = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
            }

            // ===== 마스터 =====
            async loadWorkers() {
                const res = await this.get(`${this.API}/worker_list`, {spjangcd: this.spjangcd});
                this.workers = res.data || [];

                const own = this.workers.filter(w => w.own_area === 'Y');
                const etc = this.workers.filter(w => w.own_area !== 'Y');

                // 조립 담당을 위로 올리되 막지는 않는다 (교대·대체 인력)
                this.el('fWorker').innerHTML =
                    '<option value="">선택</option>'
                    + own.map(w => `<option value="${w.id}">${w.name}</option>`).join('')
                    + (etc.length ? `<optgroup label="타 부서">`
                        + etc.map(w => `<option value="${w.id}">${w.name}</option>`).join('')
                        + `</optgroup>` : '');
            }

            async loadProjects() {
                const res = await this.get(`${this.API}/project_list`, {spjangcd: this.spjangcd});
                this.projects = res.data || [];

                this.el('fProject').innerHTML = '<option value="">전체</option>'
                    + this.projects.map(p =>
                        `<option value="${p.proj_no}">${p.proj_no} ${p.proj_name || ''}</option>`).join('');

                await this.search();
            }

            worker() {
                const id = this.el('fWorker').value;
                return this.workers.find(w => String(w.id) === String(id)) || null;
            }

            // ===== 조회 =====
            async search() {
                this.selProj = this.el('fProject').value;
                this.sel = -1;
                await this.loadItems();
                await this.loadLog();
                this.renderDetail();
            }

            /* 단계 전환. 목표 축이 바뀌므로 선택과 목록을 다시 잡는다 */
            async setStage(st) {
                if (this.stage === st) return;
                this.stage = st;
                this.sel = -1;
                document.querySelectorAll('.stage-tabs button').forEach(b =>
                    b.classList.toggle('on', b.dataset.st === st));
                this.el('thTarget').textContent = st === 'set' ? '지그 대수' : '유닛 수';
                await this.loadItems();
                await this.loadLog();
                this.renderForm();
            }

            async loadItems() {
                const res = await this.get(`${this.API}/item_list`,
                    {spjangcd: this.spjangcd, projNo: this.selProj, stage: this.stage});
                this.items = res.data || [];
                this.renderList();
            }

            /*
             * 이력 기간 필터. 기본은 오늘~오늘이다.
             * 어제 완료분이 안 보여 중복 등록이 생기는 걸 막으려고
             * [7일]·[전체] 버튼을 옆에 둔다.
             */
            logRange(days) {
                const to = new Date(), from = new Date();
                from.setDate(from.getDate() - days);
                this.el('logFrom').value = this.ymd(from);
                this.el('logTo').value = this.ymd(to);
                this.loadLog();
            }

            clearLogDate() {
                this.el('logFrom').value = '';
                this.el('logTo').value = '';
                this.loadLog();
            }

            // 로컬 시간 기준 YYYY-MM-DD (toISOString 은 UTC라 KST에서 하루 밀린다)
            ymd(d) {
                const p = n => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
            }

            /*
             * 투입 예정 자재.
             * 완료를 누른 뒤에야 재고가 모자랐다는 걸 알면 이미 늦다.
             * 부족분은 붉게 표시해 미리 보이게 한다.
             */
            async loadConsume(sujuId) {
                const bar = this.el('consumeBar');
                if (!bar || !sujuId) return;

                const res = await this.get(`${this.API}/consume_plan`, {sujuId: sujuId});
                const rows = this.consumeRows = res.data || [];
                if (!rows.length) {
                    bar.innerHTML = '<p class="hint">투입 예정 자재 — 부품표에 등록된 부품이 없습니다.</p>';
                    return;
                }

                // 미연결은 재고를 볼 대상이 아니라 부족 건수에서 뺀다
                const lack = rows.filter(r => r.material_id
                    && (+r.stock || 0) < (+r.need_qty || 0)).length;
                const noMat = rows.filter(r => !r.material_id).length;
                /* 상세에는 버튼만 둔다. 부족·미연결이 있으면 그것만 배지로 알린다 —
                   목록 전체를 늘어놓으면 시작·완료 버튼이 화면 밖으로 밀린다. */
                bar.innerHTML = `
                    <div class="consume-bar">
                        <a class="btn" id="btnConsume">투입 자재 ${rows.length}건 보기</a>
                        ${lack ? `<b class="lack">부족 ${lack}건</b>` : ''}
                        ${noMat ? `<b class="lack">미연결 ${noMat}건</b>` : ''}
                    </div>`;
                this.el('btnConsume').onclick = () => this.openConsume();
            }

            openConsume() {
                const rows = this.consumeRows || [];
                this.el('consumeBody').innerHTML = `
                    <p class="hint" style="margin:0 0 10px">
                        지그를 <b>전량 완성</b>하면 아래 수량이 한 번에 재고에서 빠집니다.</p>
                    <table class="work-table">
                        <thead><tr><th>부품</th><th>구분</th><th>품목</th><th>필요</th><th>재고</th></tr></thead>
                        <tbody>${rows.map(r => {
                    const short = r.material_id && (+r.stock || 0) < (+r.need_qty || 0);
                    return `<tr>
                                <td class="l">${this.esc(r.part_name)}</td>
                                <td>${this.esc(r.gubun)}</td>
                                <td class="l">${r.material_id
                        ? this.esc(r.material_name || r.material_code || '')
                        : '<span class="lack">미연결 · 차감 안 됨</span>'}</td>
                                <td class="r">${r.need_qty}</td>
                                <td class="r ${short ? 'lack' : ''}">${
                        r.material_id ? r.stock : '-'}</td>
                            </tr>`;
                }).join('')}</tbody>
                    </table>`;
                this.el('consumeModal').style.display = 'flex';
            }

            closeConsume() {
                this.el('consumeModal').style.display = 'none';
            }

            async loadLog() {
                /*
                 * 날짜는 <b>비워 두는 것이 기본</b>이다.
                 * 자동으로 오늘만 보여주면 어제 완료분이 안 보여 중복 등록이 생긴다.
                 * 필요할 때만 사용자가 직접 골라 좁힌다.
                 */
                const res = await this.get(`${this.API}/log`, {
                    spjangcd: this.spjangcd,
                    projNo: this.selProj,
                    stage: this.stage,
                    dateFrom: this.el('logFrom') ? this.el('logFrom').value : '',
                    dateTo: this.el('logTo') ? this.el('logTo').value : ''
                });
                this.log = res.data || [];
                this.renderLog();
            }

            item() {
                return this.sel >= 0 ? this.items[this.sel] : null;
            }

            // ===== 렌더 =====
            renderList() {
                const body = this.el('asyBody');
                if (!this.items.length) {
                    body.innerHTML = '<tr><td colspan="6" class="empty">작업 지시된 품목이 없습니다</td></tr>';
                    return;
                }

                body.innerHTML = this.items.map((it, i) => {
                    const run = !!it.working_id;
                    return `<tr class="asy-row ${this.sel === i ? 'on' : ''} ${run ? 'run' : ''}" data-i="${i}">
                        <td>${it.line_name || ''}</td>
                        <td class="l">${this.esc(it.item_name)}</td>
                        <td>${(+it.target_qty > 0) ? it.target_qty
                        : `<span style="color:#b3261e" title="수주에 ${
                            this.stage === 'set' ? '지그 대수(SujuQty)' : '유닛 수(unit_qty)'}가 없습니다">미등록</span>`}</td>
                        <td>${it.done_qty ?? 0}</td>
                        <td>${it.wip_qty ?? 0}</td>
                        <td>${this.badge(it)}</td>
                    </tr>`;
                }).join('');

                body.querySelectorAll('.asy-row').forEach(r => r.onclick = () => {
                    this.sel = +r.dataset.i;
                    this.renderList();
                    this.renderDetail();
                });
            }

            badge(it) {
                // 공정 완료 판정은 검사가 갖는다 (검사 누적 >= 지그 대수).
                // 지그를 다 조립했어도 검사 전이면 완료가 아니다.
                if (it.done_yn === 'Y') return '<span class="badge done">완료</span>';
                return it.working_id
                    ? `<span class="badge run">진행중 ${it.start_time || ''}</span>`
                    : '<span class="badge wait">대기</span>';
            }

            renderDetail() {
                const it = this.item();
                if (!it) {
                    this.el('selLab').textContent = '품목을 선택하세요';
                    this.el('pickCard').innerHTML =
                        '<div class="empty" style="width:100%">왼쪽에서 품목을 선택하세요</div>';
                    return;
                }

                this.el('selLab').textContent = `선택: ${it.item_name || ''}`;
                const run = !!it.working_id;

                this.el('pickCard').innerHTML = `
                    <!-- 품목명·상태를 통계와 같은 줄에 둔다. 위아래로 나누면
                         세로 공간만 먹고 이력 표가 눌린다. -->
                    <div class="stat-row">
                        <div class="stat name">
                            <span class="pick-name">${this.esc(it.item_name)}</span>
                            <span>${this.badge(it)}${run && it.working_worker
                    ? `<span style="color:#8a6d1b;font-size:12px;font-weight:700"> · ${this.esc(it.working_worker)}</span>`
                    : ''}</span>
                        </div>
                        <div class="stat"><span class="lab">${this.stage === 'set' ? '지그 대수' : '유닛 수'}</span>
                            <span class="v">${it.target_qty ?? 0}</span></div>
                        <div class="stat"><span class="lab">유닛 조립</span>
                            <span class="v">${it.unit_done ?? 0}/${it.unit_target ?? 0}</span></div>
                        <div class="stat"><span class="lab">공정 조립</span>
                            <span class="v">${it.set_done ?? 0}/${it.set_target ?? 0}</span></div>
                        <!-- 조립완료·검사 박스는 두지 않는다.
                             '유닛 조립'·'공정 조립' 이 같은 값을 이미 담고 있어
                             같은 숫자가 두 번 나오면 어느 쪽을 봐야 할지 헷갈린다. -->
                        <div class="stat wip"><span class="lab">남음</span><span class="v">${it.wip_qty ?? 0}</span></div>
                    </div>
                    <!-- 수량과 버튼을 한 줄에. 세로 공간을 이력 표에 넘긴다 -->
                    <div class="act-row">
                        <div class="qty-line">
                            <span class="lab">완료 수량</span>
                            <input type="number" class="qty-input" id="qty" value="1" min="1" ${run ? '' : 'disabled'}>
                            <span style="font-size:12px;color:#8a93a3">대</span>
                        </div>
                        <a class="btn ${run ? 'btn-off' : 'btn-start'}" id="btnStart">시작</a>
                        <a class="btn ${run ? 'btn-end' : 'btn-off'}" id="btnEnd">완료</a>
                    </div>
                    <p class="hint">${run
                    ? '진행중 — <b>완료</b>를 누르면 입력한 수량만큼 완제품이 생성됩니다.'
                    : '대기 — <b>시작</b>을 누르면 조립을 시작합니다.'}</p>
                    <div id="consumeBar"></div>`;

                // 투입 예정 자재는 공정 조립에서만 뺀다
                if (this.stage === 'set') this.loadConsume(it.suju_id);
                else this.el('consumeBar').innerHTML = '';

                this.el('btnStart').onclick = () => {
                    if (!run) this.start();
                };
                this.el('btnEnd').onclick = () => {
                    if (run) this.complete();
                };
            }

            renderLog() {
                const body = this.el('logBody');
                if (!this.log.length) {
                    body.innerHTML = '<tr><td colspan="7" class="empty">조립 내역이 없습니다</td></tr>';
                    return;
                }

                body.innerHTML = this.log.map(l => `
                    <tr>
                        <td>${l.prod_date || '-'}</td>
                        <td>${this.esc(l.proj_no)}</td>
                        <td class="l">${this.esc(l.item_name)}</td>
                        <td>${l.qty ?? 0}</td>
                        <td>${this.esc(l.worker)}</td>
                        <td>${l.start_time || '-'} ~ ${l.end_time || '-'}</td>
                        <td><a class="btn" style="padding:3px 8px" data-i="${l.id}">취소</a></td>
                    </tr>`).join('');

                body.querySelectorAll('[data-i]').forEach(b => b.onclick = async () => {
                    if (!await Alert.confirmAsync('', '이 조립 실적을 취소하시겠습니까?')) return;
                    const res = await this.post(`${this.API}/delete`, {id: +b.dataset.i});
                    if (!res.success) {
                        Alert.alert('', res.message);
                        return;
                    }
                    await this.loadItems();
                    await this.loadLog();
                    this.renderDetail();
                });
            }

            // ===== 동작 =====
            async start() {
                const it = this.item(), w = this.worker();
                if (!w) {
                    Alert.alert('', '작업자를 선택하세요.');
                    return;
                }

                const res = await this.post(`${this.API}/working_start`, {
                    spjangcd: this.spjangcd,
                    projNo: it.proj_no,
                    sujuId: it.suju_id,
                    stage: this.stage,
                    worker: w.name,
                    workerId: w.id
                });
                if (!res.success) {
                    Alert.alert('', res.message);
                    return;
                }

                await this.refresh();
            }

            async complete() {
                const it = this.item(), w = this.worker();
                if (!w) {
                    Alert.alert('', '작업자를 선택하세요.');
                    return;
                }

                const qty = Number(this.el('qty').value);
                if (!(qty > 0)) {
                    Alert.alert('', '완료 수량을 입력하세요.');
                    return;
                }

                const res = await this.post(`${this.API}/complete`, {
                    spjangcd: this.spjangcd,
                    prodDate: this.el('pdate').value,
                    projNo: it.proj_no,
                    sujuId: it.suju_id,
                    stage: this.stage,
                    qty: qty,
                    worker: w.name,
                    workerId: w.id
                });
                if (!res.success) {
                    Alert.alert('', res.message);
                    return;
                }

                await this.refresh();
            }

            async refresh() {
                const id = this.item() ? this.item().suju_id : null;
                await this.loadItems();
                await this.loadLog();
                this.sel = this.items.findIndex(x => x.suju_id === id);
                this.renderList();
                this.renderDetail();
            }

            // ===== 통신 =====
            // AjaxUtil (common.js) 사용. $.ajax 직접 호출 금지 (CSRF 누락으로 403)
            get(url, data) {
                return new Promise(resolve => {
                    AjaxUtil.getAsyncData(url, data,
                        res => resolve(res || {success: false, data: []}),
                        () => resolve({success: false, data: []}));
                });
            }

            post(url, data) {
                return new Promise(resolve => {
                    AjaxUtil.postJsonData(url, data,
                        res => resolve(res || {success: false}),
                        () => resolve({success: false, message: ''}));
                });
            }

            esc(s) {
                return (s == null ? '' : String(s))
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
        }

        $(document).ready(function () {
            window.prodAssembly = new ProdAssemblyPage();
            ['logFrom', 'logTo'].forEach(id => {
                const n = document.getElementById(id);
                if (n) n.onchange = () => window.prodAssembly.loadLog();
            });
            // 기본은 오늘~오늘
            window.prodAssembly.logRange(0);
            // 단계 탭. 인라인 onclick 대신 여기서 묶는다
            document.querySelectorAll('.stage-tabs button').forEach(b =>
                b.onclick = () => window.prodAssembly.setStage(b.dataset.st));
        });

    </script>
</th:block>
</html>
