<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>출하 지시 조회(시운전)</h2>
                <a title="북마크" class="bookmark toggle">
                    내 메뉴
                </a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>영업 관리</li>
                <li>출하 지시 조회</li>
            </ul>
        </div>
        <div style="display: flex; gap: 5px;">
            <section class="section" style="flex: 1;">
                <form id="searchForm">
                    <div class="section-top">
                        <div class="search-wrap">
                            <dl>
                                <dt>
                                    <label>
                                        출하일
                                    </label>
                                </dt>
                                <dd style="display: flex;">
                                    <input type="date" id="srchStartDt" name="srchStartDt"/>
                                    &nbsp;~&nbsp;
                                    <input type="date" id="srchEndDt" name="srchEndDt"/>
                                </dd>
                            </dl>

                            <!--<dl>
                                <dt>
                                    <label>
                                        업체<span class="eq"></span>
                                    </label>
                                </dt>
                                <dd>
                                    <select class="" id="cboCompany" name="cboCompany">
                                    </select>
                                </dd>
                            </dl>-->

                            <dl id="searchComArea">
                                <dt>
                                    판매처
                                </dt>
                                <dd>
                                    <input type="text" id="CompanySearch" name="CompanySearch" placeholder="판매처">
                                </dd>
                            </dl>

                            <dl>
                                <dt>
                                    <label>
                                        품목그룹
                                    </label>
                                </dt>
                                <dd>
                                    <select class="" id="cboMatGroup" name="cboMatGroup">
                                    </select>
                                </dd>
                            </dl>
                        </div>
                        <div class="search-wrap">
                            <dl>
                                <dt>
                                    <label>
                                        품목<span class="eq"></span>
                                    </label>
                                </dt>
                                <dd>
                                    <select class="" id="cboMaterial" name="cboMaterial">
                                    </select>
                                </dd>
                            </dl>
                            <dl>
                                <dt>
                                    <label>
                                        품목명<span class="eq"></span>
                                    </label>
                                </dt>
                                <dd>
                                    <input type="text" class="" id="keyword" name="keyword">
                                </dd>
                            </dl>
                            <dl>
                                <dt>
                                    <label>
                                        미출하<span class="eq"></span>
                                    </label>
                                </dt>
                                <dd>
                                    <input type="checkbox" id="chkNotShipped" name="chkNotShipped" value="Y" checked/>
                                </dd>
                            </dl>
                            <dl>
                                <dt>&nbsp;</dt>
                                <dd>
                                    <li>
                                        <a class="btn btn-delete" title="검색" id="btnSearch">
                                            <!--                                        class 쓰이는 곳 찾고 없으면 클래스명 수정하기-->
                                            <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                                            검색
                                        </a>
                                    </li>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </form>
                <div class="container-fluid" id="divList">
                    <div class="title_box">
                        <span class="right_align rpt" data-labelCd="출하지시 목록">출하지시 목록</span>
                        <button type="button" class="btn-default y_write_auth" id="btnSaveShipDate" data-labelCd="출하일 변경">
                            출하일 변경
                        </button>
                        <button type="button" class="btn-danger y_write_auth" id="btnCancelOrder" data-labelCd="출하지시 취소">
                            출하지시 취소
                        </button>
                    </div>
                    <div class="container-fluid">
                        <div id="theGrid"></div>
                    </div>
                </div>
            </section>

            <section style="flex: 1; min-width: 0">
                <div class="container-fluid" id="divList2">
                    <div class="title_box">
                        <span class="right_align rpt" data-labelCd="출하 품목">출하 품목</span>
                    </div>
                    <div class="container-fluid">
                        <div id="theGrid2"></div>
                    </div>
                </div>
            </section>
        </div>

    </div>

</th:block>

<th:block layout:fragment="scripts">
    <th:block th:replace="/common/columns_setting :: columns_setting"></th:block>

    <script type="text/javascript">

        let $content;
        let isInitialLoad = false;   // EditTable 은 자료를 넣을 때 선택 이벤트가 없어서 첫 클릭을 버리지 않게 false // 초기 상태 플래그

        class ShipmentOrderPage {
            constructor() {
                this.grid1 = null;
                this.grid2 = null;
                this.head_pk = 0;
                this.ship_state = '';
                this.gUrl = '/api/shipment/shipment_order';
                this.viewData = [];
                this.viewData2 = [];


                this.init();
            }

            init() {
                let _this = this;
                this.grid1 = new EditTable('#theGrid', {
                    selectFirst: false,
                    readOnly: false,
                    columns: [
                        {key: 'company_name', header: '판매처', width: '1*', align: 'center', readOnly: true},
                        {key: 'order_date', header: '지시일', width: '1*', align: 'center', readOnly: true},
                        {
                            key: 'ship_date',
                            header: '출하일',
                            width: '1*',
                            align: 'center',
                            readOnly: false, // 수정 가능
                            type: 'date'   // 위즈모 InputDate 대신 날짜 칸 (YYYY-MM-DD)
                        },
                        {key: 'total_qty', header: '총수량', width: 80, align: 'right', readOnly: true},
                        {key: 'state_name', header: '상태', width: 80, align: 'center', readOnly: true},
                        {key: 'DeliveryName', header: '납품처', width: '1*', align: 'center', readOnly: true},
                    ]

                });
                this.grid1.setData(this.viewData);
                this.grid1.opts.onEditEnd = (_item, _key, _v, s) => {
                    const e = {row: s.getPageRows().indexOf(_item), col: s.columns.findIndex(c => c.key === _key)};   // 위즈모 cellEditEnded 의 e
                    (() => {
                    let col = s.columns[e.col]; // 현재 편집된 컬럼
                    let editedRow = s.getPageRows()[e.row]; // 현재 편집된 행 데이터

                    if (col.key === 'ship_date') {
                        _this.ship_date = editedRow.ship_date;
                        // 변경된 데이터를 기반으로 추가 작업 수행
                    }
                    })();
                    s.refreshRow(_item);   // 고친 뒤 계산한 값이 보이게 (위즈모는 편집 끝에 그 행을 다시 그렸음)
                };


                this.grid1.selectionChanged.addHandler((s, e) => {
                    if (isInitialLoad) {
                        isInitialLoad = false; // 초기 로드 이후 플래그 해제
                        return;
                    }

                    let selectedRowIndex = s.getPageRows().indexOf(s.current()); // 선택된 행의 인덱스
                    if (selectedRowIndex >= 0) { // 유효한 행이 선택되었는지 확인
                        let selectedRowData = s.getPageRows()[selectedRowIndex]; // 선택된 행의 데이터

                        _this.head_pk = selectedRowData.id;
                        _this.ship_state = selectedRowData.state;
                        _this.ship_date = selectedRowData.ship_date;
                        _this.searchDetail();

                        console.log(`선택된 행 인덱스: ${selectedRowIndex}`);
                        console.log('선택된 행 데이터:', selectedRowData);

                    }
                });
                this.grid1.opts.fileName = '출하지시 목록';

                this.grid2 = new EditTable('#theGrid2', {
                    readOnly: true,
                    columns: [
                        {key: 'mat_grp_name', header: '제품그룹', width: '1*', align: 'left'},
                        {key: 'mat_code', header: '제품코드', width: '1*', align: 'center'},
                        {key: 'mat_name', header: '제품명', width: '1*', align: 'left'},
                        {key: 'unit_name', header: '단위', width: '1*', align: 'center'},
                        {key: 'order_qty', header: '지시량', width: '1*', align: 'right'},
                        {key: 'ship_qty', header: '출하량', width: '1*', align: 'right'},  //, editor: { type: 'money' }
                        {key: 'description', header: '비고', width: '1*', align: 'left'},
                    ]
                });
                this.grid2.setData(this.viewData2);
                this.grid2.opts.fileName = '출하품목';

            }

            searchDetail() {

                this.grid2.setData([]);

                let data = {};
                data['head_id'] = page.head_pk;

                let result = AjaxUtil.getSyncData(this.gUrl + '/shipment_item_list', data);

                console.log('data22', result.data);
                if (result != null) {
                    this.addNewRow(result.data);
                }
            }

            addNewRow(data) {
                let rows = [];
                for (let i = 0; i < data.length; i++) {
                    let newRow = {
                        mat_grp_name: data[i].mat_grp_name,
                        mat_code: data[i].mat_code,
                        mat_name: data[i].mat_name,
                        unit_name: data[i].unit_name,
                        order_qty: data[i].order_qty,
                        ship_qty: data[i].ship_qty,
                        description: data[i].description
                    };
                    rows.push(newRow);
                }
                this.grid2.setData(rows);   // 조회 자료는 setData 로 한 번에 (addRow 는 "새 행" 표시 · 기울임 + 이전 자료에 이어 붙음)

            }

            searchMain() {

                let data = FormUtil.extractForm($('#searchForm'));

                let result = AjaxUtil.getSyncData(this.gUrl + '/order_list', data);
                this.grid2.setData([]);


                if (result != null) {
                    // isInitialLoad = true;   EditTable 은 자료를 넣을 때 선택 이벤트가 없음 (켜 두면 첫 클릭이 버려짐) // 초기 상태 플래그

                    this.grid1.setData(result.data);
                }

                return;

            }

            cancelOrder() {

                let data = {};
                let data2 = {};
                let ids = [];
                let errflag = false;
                let Q = {};

                $.each(this.grid1.selectedItems, function (index, item) {
                    data["shipmenthead_id"] = item.id;

                    if (item.state == 'shipped')
                        errflag = true;
                });


                if (errflag) {
                    Alert.alert('', '출하 상태인 출하지시는 취소할 수 없습니다.');
                    return;
                }

                let fnSuccess = (res) => {
                    if (res.success) {
                        Alert.alert('', '출하 지시 취소 완료');

                        this.searchMain();
                        this.grid2.setData([]);


                    } else {
                        Alert.alert('', res.message);
                    }
                }

                let result = AjaxUtil.postAsyncData(this.gUrl + "/cancel_order", data, fnSuccess);


            }

            saveShipDate() {
                if (page.ship_state == 'shipped') {
                    Alert.alert('', '출하상태의 출하일은 변경할 수 없습니다.');
                    return;
                }

                let data = {};

                data['head_id'] = page.head_pk;
                data['ship_date'] = page.ship_date;

                let fnSuccess = function (res) {
                    if (res.success == true) {

                        Alert.alert('', '출하일을 수정했습니다.');
                        page.searchDetail();
                    } else {
                        Alert.alert('', '출하일 수정 실패.');
                        return;
                    }
                }

                AjaxUtil.postAsyncData(this.gUrl + '/update_ship_date', data, fnSuccess);
            }


        }


        let page = null;

        $(document).ready(function (e) {
            page = new ShipmentOrderPage();

            // AjaxUtil.fillSelectOptions($('#cboCompany'), 'company', 'all', '', 'sale');
            AjaxUtil.fillSelectOptions($('#cboMatGroup'), 'material_group', 'all', '', 'product,semi');
            AjaxUtil.fillSelectOptions($('#cboMaterial'), 'material', 'all', '', null);
            $('#cboMatGroup').change(function (e) {
                let mat_grp_pk = $('#cboMatGroup').val();
                AjaxUtil.fillSelectOptions($('#cboMaterial'), 'material', 'all', '', mat_grp_pk);
            });

            // 검색
            $('#btnSearch').click(function (e) {
                e.preventDefault();
                page.searchMain();
            });

            $('#searchForm').on('keydown', function(e){
               if(e.key === 'Enter'){
                   e.preventDefault();
                   page.searchMain();
               }
            });

            $('#btnSaveShipDate').click(function (e) {
                if ((page.grid1.selectedItems.length == 0)) {
                    Alert.alert('', '출하 지시를 선택해 주세요.');
                    return;
                }

                Alert.confirm('', "출하일을 변경하시겠습니까?",
                    function () {
                        page.saveShipDate();
                    },
                    function () {
                    }
                );
            });

            $("#btnCancelOrder").click(function (e) {

                if ((page.grid1.selectedItems.length == 0)) {
                    Alert.alert('', '출하 지시를 선택해 주세요.');
                    return;
                }
                page.cancelOrder();
            });

            const now = new Date();

            // ✅ 시작일: 오늘 기준 1년 전
            const oneYearAgo = new Date(now);
            oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);

            // ✅ 종료일: 오늘 기준 한 달 뒤 (같은 일자)
            const oneMonthLater = new Date(now);
            oneMonthLater.setMonth(oneMonthLater.getMonth() + 1);

            $('#srchStartDt').val(CommonUtil.formatYYYYMMDD(oneYearAgo));
            $('#srchEndDt').val(CommonUtil.formatYYYYMMDD(oneMonthLater));

            page.searchMain();


        })
    </script>

</th:block>
</html>
