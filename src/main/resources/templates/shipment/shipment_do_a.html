    <script type="text/javascript">

        let gUrl = '/api/shipment/shipment_do_a';
        let $content;
        let SelectItem = [];
        let SelectItem_sujuGrid = [];
        let deleteData = [];

        let updateIndex;


        class ShipmentProcessPage {
            constructor() {
                this.grid1 = null;
                this.grid2 = null;
                this.suju_grid = null;
                this.tempShipmentList = [];

                this.head_id = 0;
                this.ship_state = '';
                this.viewData = [];
                this.viewData2 = [];
                this.viewData3 = [];


                this.$LoadSujuList = $('#LoadSujuList');

                this.init();
            }

            init() {
                let _this = this;
                this.grid1 = new EditTable('#theGrid', {
                    selectFirst: false,
                    rowCheck: true,
                    onCheck: (e, ctx) => {
                        SelectItem = this.grid1.getChecked().map(d => ({dataItem: d, _data: d, isSelected: true}));

                    },
                     // 행 단위 선택
                    readOnly: false,
                    columns: [
                        {key: 'company_id', header: '판매처번호', width: '1*', align: 'right', visible: false},
                        {key: 'company_name', header: '판매처', width: '1*', align: 'left', readOnly: true},
                        {key: 'ship_date', header: '출고일', width: '1*', align: 'center', readOnly: true},
                        {key: 'tot_order_qty', header: '총지시량', width: '1*', align: 'right', readOnly: true},
                        {key: 'tot_ship_qty', header: '총출고량', width: '1*', align: 'right', readOnly: true},
                        {key: 'state_name', header: '상태', width: '1*', align: 'center', readOnly: true},
                        {key: 'description', header: '비고', width: '1*', align: 'left', readOnly: true},
                    ]

                });
                this.grid1.setData(this.viewData);
                let isInitialLoad = false;   // EditTable 은 자료를 넣을 때 선택 이벤트가 없어서 첫 클릭을 버리지 않게 false // 초기 상태 플래그

                this.grid1.selectionChanged.addHandler((s, e) => {
                    if (isInitialLoad) {
                        isInitialLoad = false; // 초기 로드 이후 플래그 해제
                        this.grid1.select(null); // 선택 상태 해제
                        return;
                    }

                    let selectedRowIndex = s.getPageRows().indexOf(s.current()); // 선택된 행의 인덱스
                    if (selectedRowIndex >= 0) { // 유효한 행이 선택되었는지 확인
                        let selectedRowData = s.getPageRows()[selectedRowIndex]; // 선택된 행의 데이터


                        _this.head_id = selectedRowData.id;
                        _this.ship_state = selectedRowData.state;
                        _this.showShipMatList(_this.head_id);

                    }
                });
                this.grid1.opts.fileName = '출고지시';


                this.grid2 = new EditTable('#theGrid2', {
                    selectFirst: false,
                    readOnly: true,
                    columns: [
                        {key: 'ship_pk', header: 'pk', width: '1*', align: 'left', visible: false},
                        {key: 'mat_grp_name', header: '제품그룹', width: '1*', align: 'left'},
                        {key: 'mat_code', header: '제품코드', width: '1*', align: 'center', readOnly: true},
                        {key: 'mat_name', header: '제품명', width: '1*', align: 'left', readOnly: true},
                        {key: 'unit_name', header: '단위', width: '1*', align: 'center', readOnly: true},
                        {key: 'order_qty', header: '지시량', width: '1*', align: 'right', readOnly: true},
                        {key: 'ship_qty', header: '출고량', width: '1*', align: 'right', readOnly: true},
                        {key: 'description', header: '비고', width: '1*', align: 'left', readOnly: true},
                        {
                            key: 'src_table_name',
                            header: '소스',
                            width: '1*',
                            align: 'left',
                            readOnly: true,
                            visible: false
                        },
                        {
                            key: 'src_data_pk',
                            header: '소스pk',
                            width: '1*',
                            align: 'left',
                            readOnly: true,
                            visible: false
                        },

                    ]

                });
                this.grid2.setData(this.viewData2);
                let isInitialLoad2 = false;   // EditTable 은 자료를 넣을 때 선택 이벤트가 없어서 첫 클릭을 버리지 않게 false // 초기 상태 플래그

                this.grid2.selectionChanged.addHandler((s, e) => {
                    if (isInitialLoad2) {
                        isInitialLoad2 = false; // 초기 로드 이후 플래그 해제
                        return;
                    }

                    let selectedRowIndex = s.getPageRows().indexOf(s.current()); // 선택된 행의 인덱스
                    if (selectedRowIndex >= 0) { // 유효한 행이 선택되었는지 확인
                        let selectedRowData = s.getPageRows()[selectedRowIndex]; // 선택된 행의 데이터

//                        page.updateIndex = this.dindex;

                    }
                });
                this.grid2.opts.fileName = '출고';


                this.$LoadSujuList.click(function () {
                    let defaultData = {};
                    _this.showSujuForm(defaultData);
                })
            }

            showSujuForm(data) {

                SelectItem_sujuGrid = [];

                let _this = this;
                let content = tmpl('sujuTemplate', data);
                let $content = $(content);

                let modalContainer = new PopupDraggable('수주리스트');
                modalContainer.open({width: 1400, height: 600, $content});

                let $btnPopSujuSave = $('#btnPopSujuSave');

                $('#srchStartDt2').val(getNowDateMinus7());
                $('#srchEndDt2').val(getNowDate());

                $btnPopSujuSave.click(function (e) {

                });


                new CompanySelector('condCompanySelect', 'combobox', 'cboCompany2', 'sale', {
                    null_option: 'all',
                    selected_value: '',
                    data_fill: true,
                    condition1: ''
                });

                AjaxUtil.fillSelectOptions($('#cboMatGroup2'), 'material_group', 'all', '', 'product,semi,sangpum');
                //AjaxUtil.fillSelectOptions($('#cboMaterial2'), 'material', 'all', '', null);
                $('#cboMatGroup2').change(function (e) {
                    let mat_grp_pk = $('#cboMatGroup2').val();
                    //AjaxUtil.fillSelectOptions($('#cboMaterial2'), 'material', 'all', '', mat_grp_pk);
                });

                this.suju_grid = new EditTable('#suju_grid', {
                    selectFirst: false,   // 자료를 넣어도 첫 행을 고르지 않음 (위즈모 loadedRows 의 선택 해제 대신)
                    rowCheck: true,
                    onCheck: (e, ctx) => {
                        SelectItem_sujuGrid = this.suju_grid.getChecked().map(d => ({dataItem: d, _data: d, isSelected: true}));

                    },
                     // 행 단위 선택
                    readOnly: false,
                    columns: [
                        {
                            key: 'suju_pk',
                            header: '수주번호',
                            width: '1*',
                            align: 'center',
                            readOnly: true,
                            visible: false
                        },
                        {key: 'JumunNumber', header: '수주번호', width: '1*', align: 'center', readOnly: true},
                        {key: 'JumunDate', header: '수주일', width: '1*', align: 'center', readOnly: true},
                        {key: 'DueDate', header: '납기일', width: '1*', align: 'center', readOnly: true},
                        {key: 'CompanyName', header: '판매처', width: '1*', align: 'left', readOnly: true},
                        {key: 'mat_grp', header: '제품그룹', width: '1*', align: 'left', readOnly: true},
                        {key: 'mat_code', header: '제품코드', width: '1*', align: 'center', readOnly: true},
                        {key: 'mat_name', header: '제품명', width: '1*', align: 'left', readOnly: true},
                        {key: 'unit_name', header: '단위', width: '1*', align: 'center', readOnly: true},
                        {key: 'suju_qty', header: '수주량', width: '1*', align: 'right', readOnly: true},
                        {key: 'cur_stock', header: '현재고', width: '1*', align: 'right', readOnly: true},
                        {key: 'order_qty', header: '지시량', width: '1*', align: 'right', readOnly: true},
                        //{ key: 'order_input_qty', header: '추가지시량', width: '1*', align: 'right', readOnly: false},
                        {
                            key: 'order_input_qty',
                            header: '추가지시량',
                            width: '1*',
                            align: 'right',
                            readOnly: false, // 편집 가능
                            type: 'number', cellClass: 'et-hl'},
                        {key: 'shipment_qty', header: '출고량', width: '1*', align: 'right', readOnly: true},
                        {key: 'remark', header: '비고', width: '1*', align: 'left', readOnly: true}
                    ],

                });
                this.suju_grid.setData(this.viewData3);
                // 데이터 로드 후 초기 선택 상태 해제
                this.suju_grid.opts.onBeginEdit = (_item, _key, s) => {
                    const e = {row: s.getPageRows().indexOf(_item), col: s.columns.findIndex(c => c.key === _key)};   // 위즈모 beginningEdit 의 e
                    let col = s.columns[e.col]; // 현재 편집 중인 컬럼
                    let row = e.row;            // 현재 편집 중인 행

                    // 편집 중인 컬럼이 'order_input_qty'인 경우
                    if (col.key === 'order_input_qty') {
                        // suju_qty 열의 값을 가져옴
                        let sujuQtyValue = s.getPageRows()[row]['suju_qty'];

                        // 현재 편집 중인 셀에 suju_qty 값을 설정
                        s.setValue(s.getPageRows()[row], col.key, sujuQtyValue);
                    }
                };


                this.suju_grid.opts.fileName = '수주리스트';

                _this.searchMain_SujuList();

                $('#btnSujuSearch').click(function (e) {
                    _this.searchMain_SujuList();
                })

                const keyword = document.getElementById('keyword2');
                keyword.addEventListener('keydown', function (event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        _this.searchMain_SujuList();
                    }
                });

                $('#btnCompSelect').click(function (e) {
                    let selectedItems = SelectItem_sujuGrid;
                    if (selectedItems.length === 0 || selectedItems === undefined) {
                        Alert.alert('', '제품을 선택해 주세요.');
                        return;
                    }
                    let comp_a = "";
                    let return_a = 0;

                    $.each(selectedItems, function (index, item) {
                        if (comp_a && (comp_a !== item._data.Company_id)) {
                            return_a = 1;
                        } else {
                            comp_a = item._data.Company_id;
                        }
                    });

                    if (return_a == 1) {
                        Alert.alert('', '하나 이상의 판매처가 있습니다.');
                        return;
                    }

                    page.addShipMat();
                });


                //모달 닫기
                $('#btn-search-close').click(function (e) {
                    modalContainer.close();
                })

            }

            addShipMat() {
                let _this = this;
                let comp_pk = null;
                let comp_name = null;

                let selectedItems = SelectItem_sujuGrid;
                let bucket = [];
                let DeliveryName = $('#DeliveryName').val();

                if(DeliveryName === '' || DeliveryName === undefined){
                    Alert.alert('', '납품처를 입력해주세요.');
                    return;
                }
                $.each(selectedItems, function (index, item) {
                    comp_pk = item._data.Company_id;
                    comp_name = item._data.CompanyName;

                    //let row_idx = _this.getShipMatRow(item.mat_id);


                    let order_input_qty = Number(item._data.order_input_qty);


                    if (!order_input_qty) {
                        Alert.alert('', '추가지시량을 입력해주세요.');
                        return;
                    }
                    if (order_input_qty < 0) {
                        Alert.alert('', '추가지시량을 확인해주세요.');
                        return;
                    }
                    if (isNaN(order_input_qty))
                        order_input_qty = 0;
                    //return true;
                    if (order_input_qty <= 0) {
                        order_input_qty = 0;
                        //return true;    // continue
                    }

                    let new_data = {};
                    new_data['mat_id'] = item._data.mat_id;
                    new_data['suju_pk'] = item._data.suju_pk;
                    new_data['mat_grp'] = item._data.mat_grp;
                    new_data['mat_code'] = item._data.mat_code;
                    new_data['mat_name'] = item._data.mat_name;
                    new_data['unit_name'] = item._data.unit_name;
                    new_data['Company_id'] = item._data.Company_id;
                    //let qty = item.suju_qty;
                    //if (item.order_qty > 0)
                    //    qty -= item.order_qty;
                    new_data['order_qty'] = order_input_qty;
                    bucket.push(new_data);


                })
                let data = {};
                data['Company_id'] = bucket[0].Company_id.toString();
                data['ShipDate'] = getNowDate();
                data['Description'] = '';
                data['TableName'] = 'suju';
                data['DeliveryName'] = DeliveryName
                data['Q'] = JSON.stringify(bucket);

                let fnSuccess = function (res) {
                    if (res.success) {
                        Alert.alertAuto('', '반영되었습니다.');

                        document.getElementById('btn-search-close').click();
                        document.getElementById('btnSearch').click();

                    } else {
                        const message = res.message ?? '출고지시실패';
                        Alert.alert('', message);
                    }
                }
                AjaxUtil.postAsyncData('/api/shipment/shipment_order/save_shipment_order', data, fnSuccess);

            }


            //TODO: 기능체크
            getShipMatRow(mat_pk) {
                let _this = this;

                for (let i = 0; i < _this.tempShipmentList.length; i++) {
                    if (mat_pk == _this.tempShipmentList[i].mat_id)
                        return i;
                }

                /*for(let i = 0; i < this.suju_grid.getView().length; i++){
                    if(mat_pk == this.suju_grid.getView()[i].mat_id)
                        return i;
                }
                */

                return -1;
            }

            searchMain() {

                let not_ship = $('#chkNotShipped').is(':checked') ? 'Y' : 'N';

                let data = FormUtil.extractForm($('#searchForm'));
                data['action'] = 'order_list';
                data['not_ship'] = not_ship;

                let result = AjaxUtil.getSyncData(gUrl + "/order_list", data);
                if (result.data != null) {
                    this.grid1.setData(result.data);
                }

                this.grid2.setData([]);
                return;

            }

            showShipMatList(head_id) {

                if (page.grid1.selectedItems.length == 0) {
                    Alert.alert('', '항목을 선택해 주세요.');
                    return;
                }

                this.grid2.setData([]);

                let data = {};
                data['action'] = 'shipment_item_list';
                data['head_id'] = head_id;
                let result = AjaxUtil.getSyncData(gUrl + "/shipment_item_list", data);

                if (result.data != null) {
                    this.addNewRow(result.data);
                }
            }

            addNewRow(new_data) {
                let rows = [];
                new_data.forEach(item => {
                    let newRow = {
                        ship_pk: item['ship_pk'],
                        mat_grp_name: item['mat_grp_name'],
                        mat_code: item['mat_code'],
                        mat_name: item['mat_name'],
                        unit_name: item['unit_name'],
                        order_qty: item['order_qty'],
                        ship_qty: item['ship_qty'],
                        description: item['description'],
                        src_table_name: item['src_table_name'],
                        src_data_pk: item['src_data_pk']
                    };
                    rows.push(newRow);
                });
                this.grid2.setData(rows);   // 조회 자료는 setData 로 한 번에 (addRow 는 "새 행" 표시 · 기울임 + 이전 자료에 이어 붙음)

            }

            beforeSave() {
                if (page.grid2.selectedItems.length == 0) {
                    Alert.alert('', '출고 처리할 내용이 없습니다.');
                    return;
                }
                return true;
            }

            saveShipData() {
                let data = {};
                let head_id = page.head_id;
                data = {
                    'head_id': head_id,
                    'Q': JSON.stringify(page.grid2.getPlain(page.grid2.getView()))
                }

                let fnSuccess = function (res) {
                    if (res.success) {
                        page.searchMain();
                        Notify.success("출고 처리 완료.");
                    } else {
                        Notify.success("출고 처리 실패.");
                    }
                }
                AjaxUtil.postAsyncData(gUrl + "/save_shipdata_a", data, fnSuccess);

            }

            searchMain_SujuList() {
                let not_ship = $('#chkNotShipped2').is(':checked') ? 'Y' : 'N';
                let data = FormUtil.extractForm($('#searchForm2'));

                data['action'] = 'suju_list';
                data['not_ship'] = not_ship;
                data['cboMaterial'] = '';
                let result = AjaxUtil.getSyncData("/api/shipment/shipment_order/suju_list", data);

                if (result.data != null) {
                    this.suju_grid.setData(result.data);
                }

                return;
            }


            saveBatchShipData() {
                let _this = this;

                let headList = [];

                SelectItem.forEach(item => {
                    headList.push(item._data);
                })


                if (headList.length === 0 || headList === undefined || headList === null) {
                    Alert.alert('', '일괄 출고 처리할 항목을 선택해주세요.');
                    return;
                }

                let data = {'shiphead_list': JSON.stringify(headList)};

                let fnSuccess = function (res) {
                    if (res.success) {
                        page.searchMain();
                        Alert.alertAuto('', '출고 처리 완료');
                        //Notify.success("출고 처리 완료.");
                    } else {
                        Alert.alert('', res.message);
                        //Notify.success("출고 처리 실패.");
                    }
                }

                Alert.confirm('', '일괄 출고 처리 하시겠습니까?',
                    function () {
                        AjaxUtil.postAsyncData(gUrl + "/batch_save", data, fnSuccess);
                    },
                    function () {
                    }
                );
            }

        }

        document.addEventListener("DOMContentLoaded", function () {
            const keywordInput = document.getElementById("keyword");

            keywordInput?.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault(); // 기본 동작 방지
                    page.searchMain();
                }
            });
        });


        let page = null;

        $(document).ready(function (e) {
            page = new ShipmentProcessPage();

            AjaxUtil.fillSelectOptions($('#cboCompany'), 'company', 'all', '', 'sale');
            AjaxUtil.fillSelectOptions($('#cboMatGroup'), 'material_group', 'all', '', 'product,semi,sangpum');
            AjaxUtil.fillSelectOptions($('#cboMaterial'), 'material', 'all', '', null);
            $('#cboMatGroup').change(function (e) {
                let mat_grp_pk = $('#cboMatGroup').val();
                AjaxUtil.fillSelectOptions($('#cboMaterial'), 'material', 'all', '', mat_grp_pk);
            });

            const now = new Date();

            // ✅ 시작일: 오늘 기준 1년 전
            const oneYearAgo = new Date(now);
            oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);

            // ✅ 종료일: 오늘 기준 한 달 뒤 (같은 일자)
            const oneMonthLater = new Date(now);
            oneMonthLater.setMonth(oneMonthLater.getMonth() + 1);

            $('#srchStartDt').val(CommonUtil.formatYYYYMMDD(oneYearAgo));
            $('#srchEndDt').val(CommonUtil.formatYYYYMMDD(oneMonthLater));

            $('#btnListCollapse').click(function (e) {
                $('#divList').toggle(300);
            });

            // 검색
            $('#btnSearch').click(function (e) {
                page.searchMain();
            });


            $('#btnBatchSave').click(function (e) {
                page.saveBatchShipData();
            });


            $('#btnSaveShip').click(function (e) {
                if (page.beforeSave()) {
                    Alert.confirm('', "출고 처리하시겠습니까?",
                        function () {
                            page.saveShipData();
                        },
                        function () {
                        }
                    );
                }
            });

            $('#cboCompany').change(function () {
                // 판매처 타이틀
                $('#cboCompany').attr('title', $('#cboCompany option:checked').text());
            });


            page.searchMain();
        })
    </script>

</th:block>
</html>
