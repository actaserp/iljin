<html layout:decorate="~{layout_page}">

<head>
  <style>
      /* 발송 실패 행 표시 */
      .grid-cell-red {
          background: rgb(248, 210, 203) !important;
      }

      /* 상세 팝업 레이아웃 */
      .mail-detail-wrap.popup {
          display: flex;
          flex-direction: column;
          height: 100%;
      }

      .mail-detail-wrap .table-wrap {
          flex: 1;
          overflow-y: auto;
          padding-right: 5px;
      }

      .mail-detail-wrap .popup-button {
          flex-shrink: 0;
          padding: 10px;
          background: #fff;
          border-top: 1px solid #ddd;
      }

      /* 읽기전용 필드 - 입력창처럼 보이지 않게 */
      .read-value {
          display: block;
          width: 100%;
          padding: 4px 2px;
          word-break: break-all;
      }

      .read-content {
          width: 100%;
          height: 220px;
          padding: 8px;
          border: 1px solid #ddd;
          background: #fafafa;
          overflow-y: auto;
          white-space: pre-wrap;
          word-break: break-all;
          line-height: 1.6;
      }

      .recipient-list span {
          display: inline-block;
          margin: 2px 4px 2px 0;
          padding: 2px 8px;
          background: #EDEFF5;
          border-radius: 3px;
      }

      .send-fail {
          color: #d9534f;
          font-weight: bold;
      }
  </style>
</head>

<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>e메일 발주서</h2>
        <a title="북마크" class="bookmark toggle">
          내 메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>발주/수불관리</li>
        <li>e메일 발주서</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <input type="hidden" id="spjangcdHidden" name="spjangcd"/>
          <dl>
            <dt>
              <label for="cboDateKind">
                검색 구분<span class="eq"></span>
              </label>
            </dt>
            <dd>
              <div class="srch-box">
                <select id="cboDateKind" name="cboDateKind">
                  <option value="send">발송일</option>
                  <option value="sales">발주일</option>
                  <option value="delivery">납기일</option>
                </select>
              </div>
            </dd>
          </dl>
          <dl>
            <dt>
              조회기간<span class="eq">*</span>
            </dt>
            <dd>
              <ul class="date-box">
                <li>
                  <input type="date" id="srchStartDt" name="srchStartDt">
                  <label for="srchStartDt" class="hide">시작일</label>
                </li>
                ~
                <li>
                  <input type="date" id="srchEndDt" name="srchEndDt">
                  <label for="srchEndDt" class="hide">종료일</label>
                </li>
              </ul>
            </dd>
          </dl>
          <dl>
            <dt>
              <label for="CompanySearch">구매처</label>
            </dt>
            <dd>
              <input type="text" id="CompanySearch" name="CompanySearch" placeholder="구매처">
            </dd>
          </dl>
          <dl>
            <dt>
              <label for="txtKeyword">발주번호/제목/받는사람</label>
            </dt>
            <dd>
              <input type="text" id="txtKeyword" name="txtKeyword" placeholder="발주번호, 제목, 받는사람">
            </dd>
          </dl>
          <dl>
            <dt>
              <label for="cboSendState">발송상태</label>
            </dt>
            <dd>
              <div class="srch-box">
                <select id="cboSendState" name="cboSendState">
                  <option value="">전체</option>
                  <option value="success">성공</option>
                  <option value="fail">실패</option>
                </select>
              </div>
            </dd>
          </dl>

          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>
        <div class="button-wrap">
          <ul>
            <li>
              <a class="btn btn-excell" title="상세보기" id="btnDetail">
                <img th:src="@{/images/icon/ico-mail.svg}" alt="메일 아이콘">
                발송내용 보기
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="container-fluid">
        <div id="theGrid" style="height: 730px;"></div>
      </div>
    </section>
  </div>

  <!-- 발송내용 상세 (읽기전용) -->
  <script type="text/x-tmpl" id="BalJuMailDetailTemplate">
    <div class="mail-detail-wrap popup">
      <div class="table-wrap">
        <table class="write-table">
          <caption>e메일 발주서 발송내용</caption>
          <tbody>
          <tr>
            <th style="text-align: center; width: 110px;">발송일시</th>
            <td><span class="read-value" id="dtlSendDate"></span></td>
            <th style="text-align: center; width: 110px;">발송자</th>
            <td><span class="read-value" id="dtlSendUserName"></span></td>
          </tr>
          <tr>
            <th style="text-align: center;">발송상태</th>
            <td colspan="3"><span class="read-value" id="dtlSendStateName"></span></td>
          </tr>
          <tr>
            <th style="text-align: center;">발주번호</th>
            <td><span class="read-value" id="dtlJumunNumber"></span></td>
            <th style="text-align: center;">구매처</th>
            <td><span class="read-value" id="dtlCompanyName"></span></td>
          </tr>
          <tr>
            <th style="text-align: center;">발주일</th>
            <td><span class="read-value" id="dtlJumunDate"></span></td>
            <th style="text-align: center;">납기예정일</th>
            <td><span class="read-value" id="dtlDueDate"></span></td>
          </tr>
          <tr>
            <th style="text-align: center;">회신 주소</th>
            <td colspan="3"><span class="read-value" id="dtlReplyTo"></span></td>
          </tr>
          <tr>
            <th style="text-align: center;">받는사람</th>
            <td colspan="3"><span class="read-value recipient-list" id="dtlRecipients"></span></td>
          </tr>
          <tr>
            <th style="text-align: center;">제목</th>
            <td colspan="3"><span class="read-value" id="dtlMailTitle"></span></td>
          </tr>
          <tr>
            <th style="text-align: center;">내용</th>
            <td colspan="3">
              <div class="read-content" id="dtlMailContent"></div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="popup-button">
        <button type="button" class="btn-popup" id="modal-close-button">닫기</button>
      </div>
    </div>
  </script>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
   /*
    * e메일 발주서 : 조회 전용 화면
    * - 메일 작성/전송은 [발주 등록(개별)] 화면에서만 수행한다.
    * - 이 화면은 발송 당시 저장된 이력(스냅샷)을 조회만 한다.
    *
    * [필요 API]
    *  GET  /api/balju/balju_mail/read
    *       param : date_kind, start, end, company, keyword, send_state, spjangcd
    *       return: data[] - mail_id, bh_id, SendDate, CompanyName, MailTitle,
    *                        Recipients, ReplyTo, JumunDate, DueDate,
    *                        BaljuTotalPrice, SendUserName, SendState, SendStateName, ErrorMessage
    *  GET  /api/balju/balju_mail/detail
    *       param : mail_id, spjangcd
    *       return: data - 위 항목 + MailContent(발송 당시 본문)
    *
    * ※ 본문은 반드시 발송 시점에 저장된 값을 그대로 내려줄 것.
    *    bh_id 로 발주 마스터를 조인해 재구성하면 발주가 수정됐을 때
    *    실제 발송 내용과 화면이 달라진다.
    */
   class BaljuMailListPage {
    constructor() {
     this.url = '/api/balju/balju_mail';
     this.grid = null;
     this.$btnDetail = $('#btnDetail');
     this.spjangcd = $('#spjangcdHidden');
     this.viewData = new wijmo.collections.CollectionView();
     this.init();
    }

    init() {
     let _this = this;

     this.grid = new wijmo.grid.FlexGrid('#theGrid', {
      selectionMode: wijmo.grid.SelectionMode.Row,
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      isReadOnly: true,
      allowSorting: true,
      formatItem: (sender, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
        e.cell.style.textAlign = 'center';
       }
      },
      columns: [
       {binding: 'mail_id', header: 'mail_id', width: 100, visible: false},
       {binding: 'bh_id', header: 'bh_id', width: 100, visible: false},
       {binding: 'SendDate', header: '발송일시', width: 150, align: 'center'},
       {binding: 'JumunNumber', header: '발주번호', width: 140, align: 'center'},
       {binding: 'CompanyName', header: '구매처', width: 200},
       {binding: 'MailTitle', header: '제목', width: 280},
       {binding: 'Recipients', header: '받는사람', width: 220},
       {binding: 'ReplyTo', header: '회신주소', width: 180},
       {binding: 'JumunDate', header: '발주일', width: 110, align: 'center'},
       {binding: 'DueDate', header: '납기예정일', width: 110, align: 'center'},
       {binding: 'BaljuTotalPrice', header: '발주액', width: 110, align: 'right', format: 'n0'},
       {binding: 'SendUserName', header: '발송자', width: 90, align: 'center'},
       {binding: 'SendStateName', header: '발송상태', width: 90, align: 'center'},
       {binding: 'ErrorMessage', header: '실패사유', width: 220}
      ],
      itemsSource: this.viewData,
      itemFormatter: (panel, row, col, cell) => {
       if (panel.cellType === wijmo.grid.CellType.Cell) {
        const item = panel.rows[row].dataItem;
        const column = panel.columns[col];
        if (!item) return;

        // 발송 실패 건 강조
        if ((column.binding === 'SendStateName' || column.binding === 'ErrorMessage')
         && item.SendState === 'fail') {
         cell.classList.add('grid-cell-red');
        }
       }
      }
     });

     new FlexGridContextMenu(this.grid);
     this.grid.downloadFileName = 'e메일 발주서 발송내역';

     // 더블클릭 시 상세 열기
     this.grid.hostElement.addEventListener('dblclick', function (e) {
      if (_this.grid.selectedItems.length === 0) {
       return false;
      }
      _this.$btnDetail.trigger('click');
     });

     // 발송내용 보기
     this.$btnDetail.click(function (e) {
      let items = _this.grid.selectedItems;

      if (items.length === 1) {
       _this.showMailDetail(items[0].mail_id);
      } else if (items.length > 1) {
       Alert.alert('', '데이터를 하나만 선택하세요.');
      } else {
       Alert.alert('', '선택된 데이터가 없습니다.');
      }
     });

     // 엔터키 검색
     $('#CompanySearch, #txtKeyword').on('keypress', function (e) {
      if (e.keyCode === 13) {
       _this.searchMainData();
      }
     });
    }//init

    searchMainData() {
     let _this = this;
     let url = this.url + '/read';

     let start = $('#srchStartDt').val();
     let end = $('#srchEndDt').val();

     if (!start || !end) {
      Alert.alert('', '조회기간을 입력해주세요.');
      return;
     }
     if (start > end) {
      Alert.alert('', '조회 시작일이 종료일보다 늦을 수 없습니다.');
      return;
     }

     let data = {
      'date_kind': $('#cboDateKind').val(),
      'start': start,
      'end': end,
      'company': $('#CompanySearch').val(),
      'keyword': $('#txtKeyword').val(),
      'send_state': $('#cboSendState').val(),
      'action': 'read',
      'spjangcd': this.spjangcd.val()
     };

     let fnsuccess = function (result) {
      if (result != null) {
       _this.viewData.sourceCollection = result.data;
      }
     };

     AjaxUtil.getAsyncData(url, data, fnsuccess);
    }

    showMailDetail(mailId) {
     let _this = this;
     let url = this.url + '/detail';

     let param = {
      'mail_id': mailId,
      'action': 'detail',
      'spjangcd': this.spjangcd.val()
     };

     let fnsuccess = function (result) {
      if (!result || !result.data) {
       Alert.alert('오류', '발송내용을 불러올 수 없습니다.');
       return;
      }
      _this.renderMailDetail(result.data);
     };

     AjaxUtil.getAsyncData(url, param, fnsuccess);
    }

    renderMailDetail(data) {
     let content = tmpl('BalJuMailDetailTemplate', data);
     let $content = $(content);

     let modalContainer = new PopupDraggable('e메일 발주서 발송내용');
     modalContainer.open({width: 800, height: 620, $content});

     // 텍스트 세팅 (.text() 사용 - HTML 인젝션 방지)
     $content.find('#dtlSendDate').text(data.SendDate || '');
     $content.find('#dtlSendUserName').text(data.SendUserName || '');
     $content.find('#dtlJumunNumber').text(data.JumunNumber || '');
     $content.find('#dtlCompanyName').text(data.CompanyName || '');
     $content.find('#dtlJumunDate').text(data.JumunDate || '');
     $content.find('#dtlDueDate').text(data.DueDate || '');
     $content.find('#dtlReplyTo').text(data.ReplyTo || '');
     $content.find('#dtlMailTitle').text(data.MailTitle || '');
     $content.find('#dtlMailContent').text(data.MailContent || '');

     // 발송상태 (실패 시 사유 함께 표기)
     let $state = $content.find('#dtlSendStateName');
     $state.text(data.SendStateName || '');
     if (data.SendState === 'fail') {
      $state.addClass('send-fail');
      if (data.ErrorMessage) {
       $state.append(document.createTextNode(' (' + data.ErrorMessage + ')'));
      }
     }

     // 받는사람 - 배열/문자열 모두 대응
     let recipients = data.Recipients;
     if (!Array.isArray(recipients)) {
      recipients = (recipients || '').split(',');
     }
     let $recipients = $content.find('#dtlRecipients').empty();
     recipients
     .map(email => (email || '').trim())
     .filter(email => email)
     .forEach(email => {
      $recipients.append($('<span></span>').text(email));
     });
    }
   }

   let page = null;

   $(document).ready(function (e) {

    const spjangcd = sessionStorage.getItem('spjangcd');
    if (spjangcd) {
     $('#spjangcdHidden').val(spjangcd);
    }

    page = new BaljuMailListPage();

    // 기본 조회기간 : 최근 1개월
    const now = new Date();
    const oneMonthAgo = new Date(now);
    oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);

    $('#srchStartDt').val(CommonUtil.formatYYYYMMDD(oneMonthAgo));
    $('#srchEndDt').val(CommonUtil.formatYYYYMMDD(now));

    page.searchMainData();

    // 검색
    $('#btnSearch').click(function (e) {
     page.searchMainData();
    });

   });
  </script>
</th:block>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
